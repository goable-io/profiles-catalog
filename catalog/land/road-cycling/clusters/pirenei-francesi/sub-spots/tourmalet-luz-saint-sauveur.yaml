tier_rationale:
  en: |
    The Col du Tourmalet from Luz-Saint-Sauveur is 19 km at an
    average 7.4% gradient to a 2115m summit, and is the most-crossed
    Pyrenean climb in Tour de France history with more than 80 race
    visits since 1910. The long, sustained ascent finishes above
    treeline on an exposed ridge where weather can change rapidly
    even in summer, and the descent's length and unguarded hairpins
    raise real consequence for any mistake at speed. Its unrivalled
    historical stature combined with genuine high-altitude and
    weather exposure firmly places it at tier 3.

