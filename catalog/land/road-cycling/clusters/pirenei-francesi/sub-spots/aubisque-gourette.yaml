tier_rationale:
  en: |
    The Col d'Aubisque climbed via the Gourette ski-station approach
    is 17.4 km at a moderate average 4.8% gradient but has featured
    in the Tour de France since 1910, making it one of the race's
    oldest continuously used Pyrenean passes. Its upper stretches run
    along an exposed, cliff-cut corniche road with limited barriers
    above steep drops, so while the average gradient is forgiving the
    consequence of a weather- or fatigue-driven error on the exposed
    corniche section is high. Century-plus Tour heritage combined
    with genuine cliff-edge exposure on the final kilometres justifies
    tier 3 despite the moderate average gradient.

