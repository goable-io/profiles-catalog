description:
  en: |
    The two founding climbs of Tour de France Pyrenean mountain
    racing, first crossed by the race in 1910: the Col du Tourmalet,
    the most-visited Pyrenean summit in Tour history at over 80
    crossings, climbed here from Luz-Saint-Sauveur; and the Col
    d'Aubisque, reached via the ski-station approach from Gourette.
    Both roads sit above treeline with long, exposed, unguarded
    hairpin descents and are prone to sudden Atlantic-front weather
    changes despite their Pyrenean rather than true-alpine setting.

