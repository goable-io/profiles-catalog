  equipment_dependency: high
  typical_season_weeks: 24
  carrying_capacity_sensitivity: high
  notes: |
    Both cols typically open May through October depending on
    snowpack. The Tourmalet in particular carries heavy cyclotourism
    traffic through summer given its Tour de France centenary status,
    and hosts the annual La Pyrénéenne cyclosportive alongside regular
    Tour visits.

