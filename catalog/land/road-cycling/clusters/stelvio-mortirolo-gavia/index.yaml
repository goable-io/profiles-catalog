sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 18
  carrying_capacity_sensitivity: high
  notes: |
    Season is short given passes above 2000m typically only open
    (snow-cleared) from late May/early June through October. All
    three climbs see very heavy peak-summer cyclist and cyclosportive
    traffic (Stelvio in particular can exceed 2000 riders on a single
    weekend day), creating congestion on narrow hairpin sections that
    is itself a safety consideration independent of weather.

