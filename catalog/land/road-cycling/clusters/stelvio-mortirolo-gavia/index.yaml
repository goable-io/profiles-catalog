description:
  en: |
    The three defining high-mountain climbs of Lombardia's Alta
    Valtellina, clustered around Bormio: Passo dello Stelvio, the
    Giro d'Italia's traditional Cima Coppi and one of the highest
    paved passes in the Alps; the Mortirolo, a short brutal wall out
    of Mazzo di Valtellina often cited as the hardest sustained climb
    in European racing; and the Passo di Gavia, the atmospheric 1988
    Giro snow-stage venue linking Bormio to the Valfurva valley. All
    three combine thin high-altitude air, rapidly changing alpine
    weather, and narrow unguarded roads, making them a natural
    single cluster for scoring purposes.

