description:
  en: |
    The classic ascent of Passo dello Stelvio from Bormio: 23 km at
    an average 7% gradient, climbing through 48 numbered hairpins to
    the 2758m summit. This is the Giro d'Italia's traditional Cima
    Coppi, awarded to the highest point reached in each edition of
    the race, and one of the most photographed roads in cycling.

