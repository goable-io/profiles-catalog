tier_rationale:
  en: |
    Passo dello Stelvio's Bormio side is the iconic Giro d'Italia
    Cima Coppi climb: 23 km averaging 7% gradient through 48
    numbered hairpins to a 2758m summit, the second-highest paved
    pass in the Alps. The sheer length combined with high altitude
    means riders face thinning air, sharp temperature drops, and
    frequently unstable weather on the upper switchbacks even in
    midsummer. Its status as one of cycling's most photographed and
    revered climbs, paired with genuinely demanding sustained
    effort and consequential exposed hairpins, places it firmly at
    tier 3.

