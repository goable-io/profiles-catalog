tier_rationale:
  en: |
    The Mortirolo from Mazzo di Valtellina is 12.4 km at an average
    10.5% gradient with sustained ramps up to 18%, a profile so
    severe that Marco Pantani's Giro d'Italia attacks here made it
    synonymous with "the hardest climb in Europe." Unlike the high-
    altitude Stelvio or Gavia, its difficulty comes purely from
    relentless steep gradient on a narrow forest road rather than
    altitude, so sustained-power output and heat management under
    tree cover dominate the risk profile. The combination of extreme
    average gradient, narrow unguarded surface, and its iconic status
    in Grand Tour history justifies tier 3.

