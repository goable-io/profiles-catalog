tier_rationale:
  en: |
    The Passo di Gavia from Santa Caterina Valfurva is 16.5 km at an
    average 8% gradient, historically famous as the venue of the
    1988 Giro d'Italia's snow-stage epic where riders descended
    through a blizzard in freezing conditions. Its high 2618m summit
    sits well above treeline on a narrow, partly unguarded road,
    making it acutely sensitive to sudden alpine weather deterioration
    even outside of that historic extreme. The combination of
    sustained high-altitude effort, real cold-weather and whiteout
    risk, and its status as a defining Giro mountain summit places
    this climb at tier 3.

