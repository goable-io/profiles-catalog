tier: 2
tier_rationale:
  en: |
    The Saddle Road approach to the Mauna Kea Visitor Information
    Station reaches roughly 2800m entirely on paved road, avoiding
    the unpaved summit-avoidance section that makes the full Summit
    Road effectively unrideable on a road bike. It still involves
    significant sustained altitude gain and thinning air by the
    visitor centre, but without the extreme tropical-to-alpine full
    transition or unpaved surface risk of the complete summit route.
    This more moderate, fully-paved profile with real but lesser
    altitude exposure places it at tier 2 rather than tier 3.

