tier_rationale:
  en: |
    The Mauna Kea Summit Road from Hilo climbs roughly 68 km from
    sea level to the 4207m summit, the longest continuous climb by
    vertical gain in the world, though the paved section ends near
    the 2800m visitor centre with the final ~12 km to the true
    summit unpaved and generally impassable to road bikes. Riders
    transition from tropical sea-level heat and humidity to near-
    freezing, oxygen-thin, high-UV conditions over a single ride,
    creating acute altitude and thermoregulation risk unmatched by
    any European climb in this catalog. This extreme combination of
    sustained vertical gain, severe environmental transition, and
    partially unpaved/high-altitude terrain justifies tier 3.

