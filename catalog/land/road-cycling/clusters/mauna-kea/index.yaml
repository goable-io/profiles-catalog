description:
  en: |
    A singular high-altitude challenge on Hawai'i Island: the Mauna
    Kea Summit Road climbs from sea level in Hilo to the 4207m
    summit over roughly 68 km, the longest continuous climb by
    vertical gain on Earth, though its final ~12 km above the
    visitor centre are unpaved and effectively off-limits to road
    bikes. The Saddle Road approach reaches the paved Visitor
    Information Station at ~2800m, the practical paved ceiling for
    road cyclists. Conditions here are unlike any European climb:
    tropical heat and humidity at sea level transition to near-
    freezing, oxygen-thin, UV-intense high-altitude exposure within a
    few hours' ride.

