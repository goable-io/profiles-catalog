sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: medium
  notes: |
    Year-round rideable given Hawai'i's tropical climate, though the
    summit road above the visitor centre is snow-affected in winter
    and access is periodically restricted around the observatory
    complex out of respect for the mountain's cultural significance
    to Native Hawaiians. Traffic is light — this is a niche endurance
    objective rather than a mass cyclotourism destination.

