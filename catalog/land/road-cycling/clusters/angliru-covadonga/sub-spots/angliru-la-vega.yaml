tier_rationale:
  en: |
    The Alto de l'Angliru from La Vega is 12.5 km at an average 10.1%
    gradient, including the Cueña les Cabres ramp that touches 23.5%,
    making it the hardest climb regularly used by the Vuelta a
    España. The narrow, poorly surfaced road offers no recovery
    section and combines with Asturias' frequently wet Atlantic
    climate to create genuinely treacherous traction conditions on
    the steepest pitches. This extreme sustained gradient, minimal
    margin for mechanical or traction error, and its reputation as
    the Vuelta's single hardest summit finish place it unambiguously
    at tier 3.

