tier_rationale:
  en: |
    Lagos de Covadonga is 12.5 km at an average 7.2% gradient but
    includes sustained double-digit-percent ramps into the Picos de
    Europa, and has been one of the Vuelta a España's most iconic
    summit finishes since its 1983 debut. The narrow mountain road
    climbs through frequently wet, cloud-wrapped Asturian terrain
    with limited overtaking room and long sections without barriers
    above steep drops. This sustained steep climbing on a narrow,
    weather-exposed road with a decades-long Grand Tour pedigree
    warrants tier 3.

