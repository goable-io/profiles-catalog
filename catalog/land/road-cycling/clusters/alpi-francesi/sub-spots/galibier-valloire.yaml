tier_rationale:
  en: |
    The Col du Galibier from Valloire is 18.1 km at an average 6.9%
    gradient to a 2645m summit, one of the Tour de France's oldest
    and most iconic high-mountain crossings, first climbed by the
    race in 1911. The long sustained effort at increasing altitude
    combines with a summit plateau notorious for sudden wind and
    temperature drops even in July, and the descent's length and
    exposure raise real consequence for any mechanical or weather-
    driven mistake. Its unbroken Tour de France pedigree across more
    than a century, paired with genuine high-altitude and weather
    exposure, earns tier 3.

