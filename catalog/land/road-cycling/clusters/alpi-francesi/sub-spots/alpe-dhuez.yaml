tier_rationale:
  en: |
    Alpe d'Huez from Bourg d'Oisans is 13.8 km at an average 8.1%
    gradient across 21 numbered hairpins, and is the single most-
    visited mountain-top finish in Tour de France history. Its lower
    hairpins are among the steepest sections of any Tour climb, and
    the huge cyclotourism crowds that pack the road on peak summer
    weekends add a real congestion and line-choice hazard on top of
    the physical difficulty. The combination of sustained high
    gradient, unmatched cycling-culture significance, and genuinely
    heavy on-road traffic density places this climb at tier 3.

