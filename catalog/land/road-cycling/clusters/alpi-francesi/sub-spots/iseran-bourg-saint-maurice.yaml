tier_rationale:
  en: |
    The Col de l'Iseran (2764m) is the highest paved through-road pass
    in the Alps, and the long approach from Bourg-Saint-Maurice via
    Val d'Isère gains sustained altitude over an extended distance
    before finishing on an exposed, treeless upper plateau. The Tour
    de France has occasionally crowned it Cima Coppi-calibre highest
    point of the race, reflecting both its extreme elevation and its
    rarity as a full crossing. Thin air, an unusually long exposed
    summit approach, and genuine risk of sudden snow even in summer
    at this altitude make tier 3 the appropriate classification.

