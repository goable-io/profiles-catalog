sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 18
  carrying_capacity_sensitivity: high
  notes: |
    Passes above 2000m (Galibier, Iseran) typically open early-to-mid
    June through late September; Alpe d'Huez's lower finish is rideable
    a few weeks longer either side. All three see very heavy summer
    cyclotourism traffic tracing Tour de France history, with Alpe
    d'Huez's 21 hairpins seeing especially dense weekend congestion.

