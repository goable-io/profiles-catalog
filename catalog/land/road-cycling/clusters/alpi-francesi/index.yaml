description:
  en: |
    Three of the Tour de France's most storied high-mountain climbs
    in the Savoie/Isère Alps: the Col du Galibier, ridden since 1911
    and one of the race's highest recurring passes; Alpe d'Huez, the
    21-hairpin amphitheatre finish and the most-visited Tour summit
    of all time; and the Col de l'Iseran, the highest paved through-
    road in the Alps and an occasional Cima Coppi-calibre Tour
    crossing. All three sit above 2000m with rapid alpine weather
    swings and long exposed descents.

