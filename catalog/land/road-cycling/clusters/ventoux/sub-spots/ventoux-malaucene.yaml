tier_rationale:
  en: |
    Mont Ventoux from Malaucène is 21 km at an average 7.2% gradient,
    a north-facing route that climbs through forested shade for most
    of its length before emerging onto the same exposed summit zone
    as the Bédoin side. The wooded lower and middle sections offer
    real heat relief compared to Bédoin, but the shared final
    kilometres above the tree line still expose riders to the
    Vaucluse's characteristic violent Mistral gusts and rapid weather
    changes. Given the identical extreme summit exposure and
    comparable sustained length and gradient to the Bédoin approach,
    this route also merits tier 3.

