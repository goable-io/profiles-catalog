tier_rationale:
  en: |
    Mont Ventoux from Sault is 26 km at a gentle average 4.4%
    gradient, joining the Bédoin route only in its final few
    kilometres and offering the mildest and most scenic of the three
    approaches through lavender fields and open farmland. The much
    lower average gradient and longer, gentler lower section make
    this accessible to a broader range of fitness levels than the
    other two sides, even though the shared exposed summit finish
    still carries wind risk. Given the substantially easier overall
    profile relative to Bédoin and Malaucène, tier 2 rather than
    tier 3 is appropriate.

