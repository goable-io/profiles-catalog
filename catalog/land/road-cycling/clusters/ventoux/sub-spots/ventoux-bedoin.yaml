tier_rationale:
  en: |
    Mont Ventoux from Bédoin is 21.4 km at an average 7.5% gradient,
    the iconic Tour de France approach whose final 6 km cross the
    bare limestone "lunar" summit zone with zero shade and full
    exposure to the Vaucluse's violent Mistral winds. This is the
    site of the Tom Simpson memorial, a stark reminder that heat and
    exhaustion on the exposed upper slopes carry real medical
    consequence, and sustained tailwind or crosswind gusts here can
    make the final kilometres genuinely hazardous. The combination of
    a long, physically demanding ascent, extreme upper-slope wind
    exposure, and documented historical tragedy places this climb
    firmly at tier 3.

