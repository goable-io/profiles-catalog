tier_rationale:
  en: |
    Monte Zoncolan from Ovaro is 10.1 km at an average 11.9%
    gradient with ramps reaching 22%, nicknamed "the Kaiser" and
    arguably the hardest paved climb regularly used in professional
    road racing anywhere in the world. The narrow single-lane road
    offers essentially no recovery section from base to summit, so
    sustained anaerobic effort and precise pacing are mandatory, and
    a mechanical or crash on the steepest ramps carries serious
    consequence given the confined width. This combination of extreme
    sustained gradient, minimal margin for error, and its status as a
    Giro d'Italia signature summit finish firmly places it at tier 3.

