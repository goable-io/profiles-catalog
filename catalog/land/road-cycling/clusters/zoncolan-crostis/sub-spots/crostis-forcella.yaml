tier_rationale:
  en: |
    Monte Crostis (Forcella Crostis) is roughly 15 km at an average
    9.5% gradient on a rough, narrow road with sections barely wide
    enough for two vehicles and unguarded drops. The Giro d'Italia
    planned to use it in 2011 but cancelled the descent portion after
    a course inspection flagged the surface and width as unsafe for
    a fast-moving peloton, a rare instance of a Grand Tour vetoing its
    own parcours on safety grounds. That documented safety history,
    combined with the genuinely poor surface quality and sustained
    steep gradient, makes this an unambiguous tier 3 climb best
    attempted only in stable, dry, clear conditions.

