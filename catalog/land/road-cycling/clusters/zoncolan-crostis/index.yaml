sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: medium
  notes: |
    Season runs roughly April through October at these mid-altitude
    (1200-1700m) Carnic Alps summits. Traffic volumes are far lower
    than the Dolomiti icons given the narrow single-lane surface, but
    the Giro d'Italia's occasional use of Zoncolan as a summit finish
    draws concentrated crowds in race years.

