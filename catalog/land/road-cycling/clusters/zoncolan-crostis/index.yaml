description:
  en: |
    Two of the Carnic Alps' most punishing climbs above the Friuli
    hinterland: Monte Zoncolan, nicknamed "the Kaiser" and widely
    rated the hardest paved climb regularly used in professional
    racing; and Monte Crostis, an even narrower, rougher-surfaced
    neighbouring climb the Giro d'Italia planned to use in 2011 before
    cancelling the descent for safety reasons. Both roads are single-
    lane in places with sheer drops and minimal barriers, making
    surface and visibility conditions unusually consequential here.

