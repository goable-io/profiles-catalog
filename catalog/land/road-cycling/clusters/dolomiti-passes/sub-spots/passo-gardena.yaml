tier_rationale:
  en: |
    Passo Gardena (2137m) from the Alta Badia side is 5.5 km at a
    moderate average 4.3% gradient, the gentlest of the Sella Ronda's
    four passes and well within reach of intermediate cyclosportive
    riders. It still sits above 2100m on an exposed alpine road, so
    afternoon storm risk and rapid temperature swings remain a real
    consideration despite the easy gradient. Its accessible but
    genuinely high-altitude profile, plus its role as a linking climb
    in the historic Sella Ronda loop, places it at tier 2 rather than
    tier 1.

