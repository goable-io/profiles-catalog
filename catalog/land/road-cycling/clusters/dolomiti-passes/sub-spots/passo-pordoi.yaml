description:
  en: |
    Passo Pordoi (2239m) from Arabba: 9.2 km at an average 6.9%
    gradient on wide, historic switchbacks. The most-used high-alpine
    Giro d'Italia summit of all time — over 33 stage crossings — and
    the centrepiece of the Sella Ronda circuit.

