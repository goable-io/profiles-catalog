tier_rationale:
  en: |
    Passo Pordoi (2239m) has been crossed at the summit of a Giro
    d'Italia stage more than 33 times, making it the single most-used
    high-altitude Giro pass in the race's history and the traditional
    home of the Cima Coppi commemorative marker. The Arabba-side
    ascent used here is 9.2 km at an average 6.9% gradient with wide,
    well-engineered switchbacks, but the exposed alpine plateau it sits
    on is prone to fast-moving afternoon thunderstorms typical of high
    Dolomiti terrain. Its unmatched historical significance combined
    with genuine high-altitude exposure earns tier 3 despite the
    relatively moderate gradient.

