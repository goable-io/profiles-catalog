tier_rationale:
  en: |
    Passo Sella (2244m) from the Val Gardena side is a shorter,
    steeper Sella Ronda climb at 5.5 km averaging 7%, ridden beneath
    the sheer vertical walls of the Sella massif. It is a well-
    established, well-surfaced cyclosportive road rather than a
    Grand Tour rarity, so while the gradient and altitude demand real
    fitness, the consequence and technical exposure sit below the
    Stelvio/Zoncolan tier. Its established Cat 1-calibre profile,
    heavy but manageable cyclotourism traffic, and dramatic but non-
    extreme exposure place it at tier 2.

