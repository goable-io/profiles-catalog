  excellent: [86, 100]

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 20
  carrying_capacity_sensitivity: high
  notes: |
    Passes typically open late May through mid-October, snow-dependent.
    The Sella Ronda loop is one of Europe's most popular cyclosportive
    circuits (Maratona dles Dolomites draws ~9000 riders annually),
    so peak summer weekends see heavy congestion on all three climbs
    independent of weather conditions.

