description:
  en: |
    Three interlinked high passes of the Sella Ronda circuit in the
    heart of the Dolomiti: Passo Pordoi, the most-crossed Giro
    d'Italia summit in race history; Passo Sella, the dramatic
    Val Gardena-side climb beneath the Sella massif's vertical walls;
    and Passo Gardena, the gentler Alta Badia approach. All three are
    UNESCO World Heritage terrain, typically ridden together as a
    single loop by cyclosportive riders and are exposed to fast-
    changing high-alpine convective weather in summer.

