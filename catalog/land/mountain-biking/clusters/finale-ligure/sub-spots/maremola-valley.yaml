tier_rationale:
  en: |
    The Maremola Valley cluster around Cerisola and Rocchetta covers a
    dense set of red-graded flow-enduro trails cut through the valley's
    forest and limestone outcrops. Technical sections are shorter and
    less consequential than at Madonna della Guardia, but exposed
    limestone slabs and loose-over-hard sections still demand solid
    braking and line choice. Popular with intermediate-to-advanced
    riders using it as a warm-up or lower-commitment alternative to the
    flagship descents.

