tier_rationale:
  en: |
    The NATO Base trail network occupies the plateau of a disused
    military installation in the Finale hinterland, and is one of the
    area's original enduro zones. Trails mix red-graded flow with
    technical rocky and root sections, generally at a moderate,
    intermediate-friendly consequence level compared to the steeper
    ridge descents. Access is via a well-established shuttle and fire-
    road network, making it the mid-mountain workhorse zone riders
    session repeatedly through a day.

