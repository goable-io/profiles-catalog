tier_rationale:
  en: |
    Finale Ligure's enduro flagship: a long, technical descent linking
    the Madonna della Guardia ridge above the hinterland down to the sea,
    through sustained rocky steps, exposed limestone slabs, and root-
    laced singletrack. It is the annual Enduro World Series stage venue,
    demanding sustained concentration, strong braking technique, and
    full-suspension enduro or DH-capable geometry. Consequence is high
    on the exposed rocky sections — off-line mistakes at speed carry
    real injury risk, so this is expert-only terrain.

