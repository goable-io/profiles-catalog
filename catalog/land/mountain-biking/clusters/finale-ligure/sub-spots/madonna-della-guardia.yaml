description:
  en: |
    The signature enduro descent of Finale Ligure, running from the
    hinterland ridge above Madonna della Guardia down toward the coast
    through technical rocky and rooty singletrack. Hosts an annual
    Enduro World Series round and draws expert riders from across Europe.

