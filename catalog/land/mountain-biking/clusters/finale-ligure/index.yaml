description:
  en: |
    Finale Ligure (Savona province, Liguria) is widely regarded as
    Europe's mountain-bike capital: a dense limestone-hinterland trail
    network above the Mediterranean coast, with hundreds of kilometres
    of signed singletrack ranging from historic mule tracks to purpose-
    built enduro lines. The hinterland ridge system enables classic
    "sea-to-summit-to-sea" rides, and the coastal Mediterranean climate
    gives a long dry season. Trail surface here is a mix of packed dirt,
    exposed limestone rock, and root sections that turn treacherously
    slick when wet; the area hosts an annual Enduro World Series round
    reflecting its technical pedigree.

