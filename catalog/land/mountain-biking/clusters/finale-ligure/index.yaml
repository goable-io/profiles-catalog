gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain creates dangerous traction loss and accelerates trail erosion — IMBA and trail-stewardship policy gates riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed hinterland ridges destabilises riders at descent speeds.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m makes descending technical rocky/rooty sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C creates immediate heat-illness risk under sustained effort with helmet and pads.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 48
  carrying_capacity_sensitivity: high
  notes: |
    Finale Ligure's trail network sees some of the heaviest recreational
    mountain-bike traffic in Europe, drawing riders from across the
    continent year-round given the mild Mediterranean coastal climate.
    Local trail association Finale Outdoor Region coordinates trail
    maintenance, signage, and erosion control with the comune; several
    limestone sections become dangerously slick within hours of rain and
    take a full day or more to dry out.

