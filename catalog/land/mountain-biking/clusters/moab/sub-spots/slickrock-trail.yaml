tier_rationale:
  en: |
    The Slickrock Practice Loop and Main Loop on BLM's Sand Flats
    Recreation Area are the iconic Moab riding grounds, following painted
    dashed lines across exposed Navajo Sandstone domes and slabs. Grip on
    dry sandstone is exceptional, letting riders climb and descend
    surprisingly steep pitches, but there is minimal defined tread — route
    finding across open rock is part of the ride and inattentive riders
    can wander toward exposed drop-offs. Technical demand is intermediate
    (steep rollers, short ledges) but consequence rises with terrain
    exposure near canyon rims. Fully unrideable and dangerously slick when
    wet, so trail status depends entirely on recent precipitation.

display_name:
  en: Mountain Biking — Moab Slickrock Trail
description:
  en: |
    The trail that put Moab on the map — Practice and Main Loops painted
    across exposed Navajo Sandstone on the Sand Flats Recreation Area.
    Self-navigated slickrock riding with exceptional dry-rock grip and
    steep rollers, unrideable when wet.

