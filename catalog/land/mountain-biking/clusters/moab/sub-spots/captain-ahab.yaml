tier_rationale:
  en: |
    Captain Ahab is a technical, shuttle-served expert descent on the
    Amasa Back trail system combining exposed slickrock slabs with tight
    rock gardens and ledgy drops that demand precise line choice at
    speed. Sustained technical riding leaves little recovery terrain
    between features, and several sections traverse close to canyon-rim
    exposure above the Colorado River corridor. The trail's reputation as
    one of Moab's must-ride expert lines comes from this combination of
    committing rock-garden technicality and consequence rather than raw
    length. Full suspension and strong technical-descending skill are
    treated as prerequisites by local shuttle operators.

