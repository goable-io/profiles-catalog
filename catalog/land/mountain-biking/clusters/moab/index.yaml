gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain makes Navajo Sandstone slickrock hazardously slick and raises flash-flood risk in canyon-adjacent sections — BLM Sand Flats Recreation Area guidance discourages riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed slickrock domes and the La Sal shuttle-descent ridgelines destabilises riders at descent speed.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m on the Whole Enchilada's high-alpine start makes descending technical sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C on the exposed desert-floor sandstone creates immediate heat-illness risk, common April-October at Moab.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Trails sit on Bureau of Land Management (BLM) land; Sand Flats
    Recreation Area (covering Slickrock Trail) charges a day-use/fee
    permit and caps camping capacity. Grand County and BLM trail
    stewardship programs flag soil-crust (cryptobiotic) protection as a
    core concern — riders are required to stay on marked slickrock and
    singletrack. Shuttle-served descents like the Whole Enchilada
    concentrate high visitor volume on a narrow trail corridor spanning
    four ecosystems, making carrying-capacity sensitivity high.

verdict_buckets:
