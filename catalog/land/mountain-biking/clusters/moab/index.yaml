meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Bureau of Land Management (BLM) Moab Field Office trail and Sand Flats Recreation Area guidance"
    - "Trailforks Moab trail database"
    - "Singletracks Moab trail guides"
  notes: |
    Cluster inherits base mountain-biking scoring unchanged. Season is
    longer than the Whistler lift-served park (40 weeks) since Moab's
    desert and shuttle trails are not snow-dependent, though summer
    midday heat routinely gates riding in practice.
