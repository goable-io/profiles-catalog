description:
  en: |
    Moab (Utah, USA) is the birthplace of modern American mountain biking,
    built on the friction-grip properties of Navajo Sandstone slickrock
    across BLM-managed desert terrain around the Colorado River and La Sal
    Mountains. Riding here spans exposed sandstone domes at the desert
    floor (1200m) to shuttle-served descents from subalpine La Sal terrain
    above 3300m. Heat is the dominant hazard most of the year — the desert
    floor regularly exceeds 35°C apparent temperature April-October — while
    the sandstone itself becomes hazardously slick when wet, and flash
    flood risk in slot-canyon-adjacent trail sections rises sharply during
    monsoon season (July-September).

