tier_rationale:
  en: |
    The Rodellar-adjacent canyon rim lines run technical rocky descents
    along the edge of the Mascún canyon, one of the Sierra de Guara's most
    dramatic limestone formations. Exposed rim-side sections, loose-over-
    rock surfaces, and steep technical steps close to significant drops
    make this expert-only. High-consequence terrain demanding precise line
    choice and strong technical bike-handling.

