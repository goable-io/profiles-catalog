tier_rationale:
  en: |
    The Zona Zero main network around Ainsa is the reference Aragonese
    enduro trail system, with 500+ km of signed singletrack across varied
    limestone and conglomerate terrain. It hosted an Enduro World Series
    round, reflecting a trail mix that spans intermediate flow through
    genuinely technical rocky descents. But the sheer breadth and
    consistent signage/grading of the network keeps it moderate and
    approachable overall for competent intermediate-to-advanced riders.

