gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain creates dangerous traction loss and accelerates trail erosion — IMBA and trail-stewardship policy gates riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed canyon-rim sections destabilises riders at descent speeds.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m makes descending technical rocky canyon-rim sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C — common in Aragonese summer — creates immediate heat-illness risk under sustained effort with helmet and pads.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Zona Zero's 500+ km signed network is maintained by the Comarca de
    Sobrarbe in partnership with local trail associations, supporting a
    long riding season given the mild Aragonese pre-Pyrenean climate.
    High summer heat in the exposed limestone canyon terrain and
    seasonal wildlife-nesting closures near Rodellar/Mascún (used by
    climbers and riders alike) are managed access considerations.

