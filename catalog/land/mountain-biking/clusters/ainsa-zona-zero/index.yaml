description:
  en: |
    Zona Zero, centred on the medieval town of Ainsa (Huesca province,
    Aragón, Spain), is the reference enduro destination of the Spanish
    Pyrenean foothills, with a signed network exceeding 500km of trail
    across limestone canyon country at the gateway to the Sierra de
    Guara. It is an Enduro World Series venue and draws riders for its
    combination of rocky technical descents and dramatic canyon
    scenery near Rodellar and the Mascún gorge. The Mediterranean-
    continental climate gives hot, dry summers and generally stable
    riding conditions outside of localised convective storms.

