tier_rationale:
  en: |
    The Avoriaz side and its cross-border trail links into Champéry
    (Switzerland) via the Portes du Soleil lift network give riders
    access to a wide spread of red-graded flow-enduro terrain across
    two countries on a single lift pass. Trail character is
    predominantly moderate flow with intermittent technical sections.
    The zone is well suited to intermediate riders comfortable with
    sustained lift-served descending across a large, high-traffic
    network.

