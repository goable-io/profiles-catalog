tier_rationale:
  en: |
    The Canyon (accessed via the Nyon lift) is Morzine's signature enduro
    descent, renowned across the enduro racing scene for its sustained
    rocky and rooty technical sections, off-camber traverses, and
    committing drops. Consequence is high throughout — mistakes on the
    rock-garden. Root sections at speed carry real injury risk — making
    this expert-only terrain requiring full-suspension enduro geometry and
    strong technical bike-handling.

