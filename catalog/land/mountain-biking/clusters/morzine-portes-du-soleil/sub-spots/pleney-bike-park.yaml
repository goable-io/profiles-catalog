tier_rationale:
  en: |
    Le Pleney is Morzine's main chairlift-served bike park, hosting a
    dense set of DH and flow-trail lines directly above the town and
    serving as an Enduro World Series venue. Trail grading spans blue
    flow through red enduro and black DH, with berms, jumps, and
    technical root/rock sections on the harder lines. The lift-served,
    signed-trail format keeps overall consequence moderate for
    intermediate riders while still offering real technical terrain for
    advanced riders on the black lines.

