gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain creates dangerous traction loss and accelerates trail erosion — IMBA and trail-stewardship policy gates riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed lift-served descents destabilises riders at speed.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m from alpine cloud makes descending technical DH/enduro sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C creates immediate heat-illness risk under sustained effort with helmet and pads.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 18
  carrying_capacity_sensitivity: high
  notes: |
    Portes du Soleil bike-park lifts typically run mid-June through
    mid-September, coordinated across the multi-resort lift consortium
    (Portes du Soleil / Morzine-Avoriaz Tourisme). This is one of
    Europe's highest-traffic MTB destinations, and heavy rider volume
    on the signature descents (notably the Canyon trail) accelerates
    tread erosion, prompting periodic trail closures for maintenance.

