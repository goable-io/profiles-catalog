description:
  en: |
    Morzine (Haute-Savoie, France) is the historic hub of the Portes
    du Soleil, one of the world's largest interconnected lift-served
    bike-park networks spanning the France-Switzerland border. Chairlift
    access opens up hundreds of kilometres of DH, enduro, and flow trail
    across multiple resort sides (Morzine, Avoriaz, and onward toward
    Champéry), and the area is a fixture on the Enduro World Series
    calendar. Alpine convective weather brings frequent afternoon
    thunderstorms in summer; wet granite roots and rock gardens on the
    signature descents become significantly more hazardous in rain.

