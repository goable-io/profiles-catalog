description:
  en: |
    Val d'Aran (Lleida province, Pyrenees, Spain) is an Atlantic-facing
    Pyrenean valley whose Baqueira Beret ski resort converts to a summer
    chair-lift-served bike park, alongside a dense valley enduro trail
    network through alpine forest. The Pyrenean setting brings cooler,
    wetter summer conditions than the Iberian interior, with afternoon
    convective storms common; forest singletrack becomes notably slick
    and root-exposed after rain.

