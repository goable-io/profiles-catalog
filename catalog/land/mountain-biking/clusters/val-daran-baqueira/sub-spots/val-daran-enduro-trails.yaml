tier_rationale:
  en: |
    The Val d'Aran valley enduro trail network runs technical singletrack
    through dense Pyrenean alpine forest, largely accessed via local
    shuttle services such as Rider Bike rather than lift infrastructure.
    Trails combine root-laced, loamy forest surfaces with rockier sections
    lower in the valley, giving a moderate. Intermediate-to-advanced enduro
    character comparable to other shuttle-served Pyrenean networks.

