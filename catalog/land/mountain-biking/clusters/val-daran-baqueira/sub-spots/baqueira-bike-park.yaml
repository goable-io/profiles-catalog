tier_rationale:
  en: |
    Baqueira Beret's summer bike park uses the ski resort's chairlift
    infrastructure to serve a mix of flow and enduro trails through
    Pyrenean alpine-ridge terrain, with sweeping high-altitude scenery
    above the tree line. Grading spans intermediate flow through more
    technical enduro sections with loose rock and root features typical of
    Pyrenean granite terrain. Placing the zone at moderate overall
    consequence for competent intermediate riders.

