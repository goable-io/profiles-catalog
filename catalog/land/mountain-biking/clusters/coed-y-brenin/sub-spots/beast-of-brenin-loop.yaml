tier_rationale:
  en: |
    The Beast is Coed y Brenin's flagship 40km waymarked red trail
    through Snowdonia forest, the original signature route of the UK's
    first purpose-built MTB trail centre (Forestry England). Surface is
    engineered singletrack and forest fire-road on free-draining
    aggregate, with red-grade technical features (rock gardens, root
    sections, moderate climbs) that require intermediate skill and
    sustained fitness given the distance. Waymarking and mapped bail-out
    points keep navigation and rescue access straightforward relative to
    remote alpine trails, but the length and cumulative climbing make it
    a full-day commitment for most intermediate riders.

