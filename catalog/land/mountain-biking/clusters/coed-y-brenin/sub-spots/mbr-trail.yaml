tier_rationale:
  en: |
    The MBR Trail is a 20km red-graded loop at Coed y Brenin built in
    partnership with Mountain Bike Rider magazine, offering a shorter
    alternative to The Beast with a similar moderate technical profile
    of rock gardens, root sections, and berm-and-jump singletrack. The
    climbing profile is moderate and sustained rather than punchy, suited
    to intermediate riders progressing from blue-graded trails. Like the
    rest of the centre, surface is engineered free-draining tread that
    stays rideable in typical Welsh wet weather, with mapped waymarking
    and straightforward bail-out access back to the visitor centre.

