gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain overwhelms even Coed y Brenin's free-draining aggregate tread, creating dangerous traction loss and accelerating erosion — Forestry England trail-stewardship guidance discourages riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on the forest's more open upper sections destabilises riders and raises fallen-branch risk in mature conifer stands.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m, common in Welsh hill fog, makes descending technical rock and root sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C creates immediate heat-illness risk under sustained effort with helmet and pads, though rare in this climate.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 50
  carrying_capacity_sensitivity: high
  notes: |
    Forestry England manages Coed y Brenin as a year-round trail centre
    with a visitor-centre car-park charge funding trail maintenance;
    free-draining constructed tread keeps the network rideable through
    Wales's wet oceanic climate almost year-round. As the UK's original
    trail centre it carries high crowding and carrying-capacity
    sensitivity, particularly on weekends and school holidays, and
    Forestry England periodically closes sections for forestry operations
    or storm-damage clearance.

