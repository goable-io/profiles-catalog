description:
  en: |
    Coed y Brenin (Gwynedd, Wales) is the UK's first purpose-built
    mountain-bike trail centre, opened by Forestry England (then Forest
    Enterprise) in 1996 and the template for the trail-centre model now
    common across the UK. Trails wind through dense conifer forest in
    Snowdonia at moderate elevation (150-450m), with waymarked red and
    black-graded loops on mixed natural singletrack and constructed
    rock/root features. Britain's oceanic climate means persistent damp
    conditions are normal rather than exceptional: trail surfaces are
    engineered with free-draining aggregate to stay rideable in
    conditions that would close unmanaged trails, but sustained heavy
    rain still degrades traction on exposed rock sections and reduces
    visibility on the forest's higher, more open stretches.

