tier: 3
tier_rationale:
  en: |
    Hangover Trail is Sedona's iconic exposure test-piece: a slickrock
    traverse along a roughly 200 ft cliff edge where a single mistake has
    severe consequences and there is no meaningful runoff or margin for
    error on the exposed shelf sections. Technical difficulty on the rock
    itself is moderate compared to the exposure, meaning the trail's
    tier-3 rating is driven primarily by consequence rather than raw
    technicality. Riders are expected to dismount and walk sections they
    are not fully confident on; the trail is committing, remote from
    quick rescue access, and unrideable when the sandstone is wet.

display_name:
  en: Mountain Biking — Sedona Hangover Trail
description:
  en: |
    Sedona's signature exposure trail — a red-rock slickrock traverse
    along a roughly 200 ft cliff edge with minimal margin for error,
    committing and expert-only despite moderate raw technical difficulty.

