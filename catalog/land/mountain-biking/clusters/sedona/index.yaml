gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain makes Sedona's red-rock slickrock hazardously slick and damages saturated dirt tread — Coconino National Forest guidance discourages riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on the Hangover Trail's exposed cliff-edge traverse destabilises riders near unprotected drops.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m on exposed red-rock traverses makes navigating cliff-edge sections unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C on exposed low-desert red rock creates immediate heat-illness risk, common June-August at Sedona.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 42
  carrying_capacity_sensitivity: high
  notes: |
    Trails sit on Coconino National Forest and City of Sedona land; the
    Red Rock Pass fee system manages visitor access to trailheads and
    parking. Peak riding season runs October-April as summer desert heat
    limits use; the US Forest Service and Verde Valley Cyclists Coalition
    coordinate trail maintenance and closures on erosion-sensitive
    sandstone-and-dirt tread, keeping carrying-capacity sensitivity high.

