description:
  en: |
    Sedona (Arizona, USA) is a red-rock desert mountain-biking destination
    on Coconino National Forest land, known for technical slickrock
    exposure trails carved through Permian sandstone formations around
    1300-1400m elevation. As at Moab, trail-surface friction depends on
    the sandstone staying dry — wet red rock loses grip fast and the
    Forest Service discourages riding on damaged, saturated tread. Heat is
    the primary seasonal hazard: Sedona's low-desert exposure regularly
    exceeds 35°C apparent temperature June-August, while winter riding is
    comfortable and the area's dominant riding season shifts toward
    October-April relative to higher-elevation Rockies destinations.

