description:
  en: |
    Livigno (Sondrio province, Lombardy) sits in a high alpine valley at
    ~1800m and converts its winter ski infrastructure into one of the
    Alps' most complete summer bike destinations, with chairlift-served
    downhill and flow parks alongside wide valley-floor cross-country
    routes. The high-altitude setting means a shorter riding season and
    real afternoon-thunderstorm risk in summer; morning starts are
    typical. Trail surface ranges from packed alpine dirt on the valley
    floor to loose rock and scree on the higher park descents.

