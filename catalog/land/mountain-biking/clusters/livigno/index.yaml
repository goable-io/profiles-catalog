gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain creates dangerous traction loss and accelerates trail erosion — IMBA and trail-stewardship policy gates riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed alpine ridge sections destabilises riders at descent speeds.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m from alpine cloud/fog makes descending technical park sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C creates immediate heat-illness risk under sustained effort with helmet and pads.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 16
  carrying_capacity_sensitivity: high
  notes: |
    Livigno's bike park season runs roughly mid-June to mid-September,
    dictated by high-altitude snowpack and the shared chairlift
    infrastructure with the ski resort operator (Livigno Turismo /
    Carosello Tourism). Lift-served descents concentrate rider traffic
    on a limited trail set, and afternoon convective thunderstorms are
    common at this altitude in summer, pushing most riding to morning
    hours.

