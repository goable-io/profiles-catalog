tier_rationale:
  en: |
    Mottolino is Livigno's flagship chairlift-served bike park, with a
    wide network of purpose-built flow lines and freeride/DH tracks
    served by dedicated bike lifts. It has hosted Enduro Europe stages,
    reflecting a trail mix that spans machine-built berms and jumps
    through to genuinely technical rock-garden freeride sections.
    Riders of intermediate flow-trail ability can session the graded
    lines while advanced riders find real technical challenge on the
    black-graded descents.

