tier_rationale:
  en: |
    The Valle Federia and Val di Livigno cross-country trails run along
    wide gravel valley-floor tracks and easy singletrack through open
    alpine meadow scenery. With minimal elevation gain and no technical
    features. This is Livigno's beginner-friendly and family zone,
    accessible without lift assistance and well suited to riders new to
    mountain terrain or seeking a low-consequence, scenic ride.

