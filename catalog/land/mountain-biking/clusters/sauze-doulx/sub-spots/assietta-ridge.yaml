tier_rationale:
  en: |
    The Strada dell'Assietta is a 30km high-altitude ridge traverse on a
    former WW1 military dirt road running above 2400m, one of the Alps'
    most iconic XC/enduro ridge rides. Full exposure to weather with no
    shelter, sustained altitude effort, and long remote sections far from
    any rescue access place this firmly at expert consequence level. Even
    though the road surface itself is not technically extreme — the risk is
    environmental (lightning, whiteout, hypothermia exposure) rather than
    purely trail-technical.

