description:
  en: |
    Sauze d'Oulx (Turin province, Piedmont) is a Via Lattea ski resort
    that converts to a chairlift-served bike park in summer, connected
    to the wider Alta Val Susa trail landscape. The area spans everything
    from park-graded flow and technical descents around Sportinia to the
    high-altitude Strada dell'Assietta, a historic WW1 military ridge
    road traversing above 2400m. Alpine weather here is changeable:
    afternoon thunderstorms and rapid visibility loss on the exposed
    Assietta ridge are the dominant summer hazards.

