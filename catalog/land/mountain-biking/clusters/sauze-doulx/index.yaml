gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain creates dangerous traction loss and accelerates trail erosion — IMBA and trail-stewardship policy gates riding above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on the exposed high-altitude Assietta ridge destabilises riders at descent speeds.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m from alpine cloud on the exposed 2400m+ ridge road makes navigation and descending unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C creates immediate heat-illness risk under sustained effort with helmet and pads.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 16
  carrying_capacity_sensitivity: high
  notes: |
    Sauze d'Oulx's bike park operates on the Via Lattea summer lift
    schedule (roughly late June to early September); the Strada
    dell'Assietta is a seasonal high-altitude dirt road generally
    accessible July through September once snow clears above 2400m.
    Local trail maintenance is coordinated with the Comune di Sauze
    d'Oulx and Via Lattea lift operator.

