description:
  en: |
    Rotorua (Bay of Plenty, New Zealand) is one of the Southern
    Hemisphere's premier mountain-bike destinations, built around the
    volcanic and geothermal terrain of the central North Island. The
    Whakarewarewa Forest ("The Redwoods") network, a gondola-served park
    on Mount Ngongotaha, and geothermal-hillside trails at Rainbow
    Mountain together give the region flow, enduro, and DH riding across
    varied volcanic soils. Volcanic loam trail surfaces drain and grip
    well when dry but become notably slick and rutted when saturated —
    the region's high annual rainfall (Bay of Plenty subtropical-temperate
    climate) makes precipitation the dominant trail-quality variable, with
    Rotorua Mountain Bike Club rating trails "closed" after sustained wet
    weather to protect tread.

