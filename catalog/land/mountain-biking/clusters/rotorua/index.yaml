gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain on Rotorua's volcanic loam creates dangerous traction loss and accelerates trail erosion — Rotorua Mountain Bike Club trail-status guidance closes graded trails above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots destabilises riders on the Skyline Gondola bike park's exposed upper descents and can trigger gondola-service suspension.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m, including geothermal steam-haze near Rainbow Mountain, makes descending technical sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C creates immediate heat-illness risk under sustained effort with helmet and pads.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 48
  carrying_capacity_sensitivity: high
  notes: |
    Whakarewarewa Forest is managed jointly by the Redwoods Trust,
    Ngati Whakaue iwi (landowners), and the Rotorua Mountain Bike Club,
    which coordinates trail building, grading, and wet-weather closures
    across 180+ km of trail. Skyline Rotorua operates the gondola-served
    bike park commercially and hosts Crankworx Rotorua, concentrating
    high visitor volume that raises carrying-capacity sensitivity in peak
    (November-April Southern Hemisphere summer) season. Year-round mild
    climate keeps the riding season long relative to Northern Hemisphere
    alpine destinations.

