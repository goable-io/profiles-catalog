tier_rationale:
  en: |
    Whakarewarewa Forest ("The Redwoods") is Rotorua's flagship trail
    network, threading over 180km of purpose-built singletrack through
    towering Californian redwood plantation and native bush. The network
    spans red-graded flow trails and enduro-style descents built and
    maintained by the Rotorua Mountain Bike Club, with well-benched
    tread, berms, and moderate jumps sized for intermediate riders while
    still offering harder black-graded lines within the same network.
    Volcanic loam surface grips well when dry but becomes slick fast in
    rain; extensive waymarking, proximity to Rotorua town, and mapped
    bail-out points keep overall consequence moderate for a network of
    this scale.

