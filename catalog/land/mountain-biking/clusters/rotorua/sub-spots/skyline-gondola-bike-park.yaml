tier_rationale:
  en: |
    Skyline Rotorua's gondola-served bike park on Mount Ngongotaha offers
    lift-accessed downhill and enduro trails graded from intermediate
    flow to expert black lines, and hosts the Crankworx Rotorua stop —
    signalling world-class trail construction and maintenance standards.
    Gondola service removes the climbing effort, letting riders lap
    graded descents repeatedly, with the core visitor-graded trails
    built to intermediate red-line standard (berms, rollers, graded
    jumps with roll-around options). Volcanic soil surface and forest
    cover keep grip reasonable in light rain, though the park suspends
    gondola operation in high wind, gating access outright rather than
    just degrading conditions.

display_name:
