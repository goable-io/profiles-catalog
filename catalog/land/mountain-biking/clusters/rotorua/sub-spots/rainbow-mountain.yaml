tier_rationale:
  en: |
    Rainbow Mountain offers intermediate flow singletrack across an
    active geothermal hillside south of Rotorua, with volcanic mineral
    soils and steam-vent-adjacent terrain giving the ride a distinctive
    character among the region's trail networks. Trail grading is
    intermediate — flowing berms and rollers on well-drained volcanic
    substrate — without the sustained technical demand of the black
    lines at Skyline or the Redwoods' harder sectors. Geothermal
    activity nearby means riders should stay on marked tread rather than
    exploring off-trail ground, and localized steam haze can briefly
    reduce visibility near vent areas after rain.

