description:
  en: |
    Whistler Mountain Bike Park (British Columbia, Canada) is the world's
    largest lift-served gravity bike park, opened 1999 on Whistler
    Mountain's lower and upper flanks. Chairlift access via the Fitzsimmons
    Express and Garbanzo/Whistler Village Gondola serves over 70 trails
    spanning green flow to double-black-diamond, plus a full jump-park
    progression. The dominant condition is trail-surface moisture: the
    park's loamy, glacially-derived soil grips superbly when dry-to-tacky
    but becomes greasy and dangerous within minutes of rain onset, and
    operations close specific black-graded trails after sustained wet
    weather. Alpine sections above 1850m add wind exposure and rapidly
    shifting visibility not present at the village-base trails.

