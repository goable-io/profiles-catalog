gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_TRAIL_DAMAGE
    description: Heavy active rain on Whistler's loamy soil creates dangerous traction loss and accelerates tread erosion — Whistler Blackcomb bike-park operations close graded trails above this threshold.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on the exposed alpine sections above 1850m destabilises riders at descent speed and can trigger lift closures.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: LOW_VISIBILITY_DESCENT
    description: Visibility below 200m on Top of the World's alpine descent makes navigating technical sections at speed unsafe.

  - metric: apparent_temp_c
    condition: gt
    value: 40
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 40°C creates immediate heat-illness risk under sustained effort with helmet and body armour.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Whistler Blackcomb (Vail Resorts) operates the bike park on a lift-ticket
    and trail-permit model, typically open mid-May to early-October snow
    permitting. Trail counts and crowding are managed by the resort's own
    grooming and closure schedule; several black trails close after heavy
    rain to protect tread. E-bikes are prohibited on lift-served park
    trails, keeping equipment dependency centred on downhill/enduro bikes,
    full-face helmets, and body armour.

