sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 10
  carrying_capacity_sensitivity: high
  notes: |
    Approach depends on the Aiguille du Midi cable car or the Envers des
    Aiguilles hut system, both operated/managed by Compagnie du Mont-Blanc
    and the CAF/FFCAM hut network respectively — capacity-limited and
    weather-dependent. Peak summer weeks concentrate hundreds of parties
    on classic lines (Frendo Spur, Cosmiques Arête, Grand Capucin area),
    driving cumulative rockfall hazard from traffic and glacier retreat
    exposing looser rock on approach paths.

