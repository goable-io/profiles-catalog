description:
  en: |
    The Chamonix granite cluster covers the classic high-alpine
    multipitch terrain of the Mont-Blanc massif, from cable-car-accessed
    granite towers around the Aiguille du Midi (3842m) to glacier-
    approached faces on Mont Blanc du Tacul and hut-based routes on the
    Envers des Aiguilles wall system. Rock is compact, generally
    excellent-quality granite, climbed via mixed trad and sport
    protection at grades from F6a to F7c depending on route and era of
    equipping. Altitude dominates conditions here: routes sit between
    3200m and 4200m, so freeze-thaw rockfall, glacier crevasse hazard on
    approaches, and rapid afternoon weather deterioration are the
    defining physical constraints. Season is short, roughly July to
    early September, and even within season a route can be in or out of
    condition day to day depending on recent freeze-thaw cycling and
    glacier state. Cable car (Aiguille du Midi) or hut-based approaches
    (Envers hut) are required; there is no roadside access.

