tier_rationale:
  en: |
    The east face of Mont Blanc du Tacul, including the Grand Capucin
    granite triangle, offers high-alpine trad and mixed multipitch
    climbing up to roughly 4200m, among the most committing terrain in
    the cluster. Protection on established lines mixes trad gear with
    some fixed bolts on the steeper granite faces, but hardware is sparse
    by sport-climbing standards and route-finding requires alpine
    experience. Approach is via glacier from the Aiguille du Midi cable
    car station, crossing crevassed terrain that demands roped travel and
    crevasse-rescue capability. Altitude (up to 4200m) magnifies every
    weather and cold-injury risk, and afternoon storm buildup is rapid;
    this is expedition-style alpine climbing with PGHM helicopter rescue
    as the only realistic evacuation option.

