tier_rationale:
  en: |
    The Aiguille du Midi granite towers, reached by the cable car to
    3842m, host classic committing multipitch lines including the
    Rebuffat-Baquet arête, the Frendo Spur, and the Cosmiques Arête,
    graded roughly F6a to F7c on compact high-quality granite. Protection
    is mixed trad placements and fixed bolts of varying vintage, with
    some rappel anchors on established descents but sparse hardware on
    less-traveled variations. The approach and descent both cross
    glaciated terrain requiring crevasse-rescue readiness, and altitude
    (3200-3842m) means rapid weather deterioration, freeze-thaw rockfall,
    and cold-injury risk are ever-present even mid-summer. Rescue relies
    on PGHM helicopter response given the terrain; this is committing
    alpine-grade climbing, not a roadside crag.

