tier_rationale:
  en: |
    The Envers des Aiguilles wall system is a classic granite trad
    multipitch venue reached via the Envers hut (Refuge de l'Envers des
    Aiguilles), offering 10-20 pitch routes on compact high-quality
    granite in the F6a-F7c range. Protection is predominantly traditional
    gear placement with some fixed belay anchors, demanding a full trad
    rack and competent multipitch systems management. The hut-based
    approach crosses glaciated and moraine terrain, and routes here sit
    at altitudes where afternoon thunderstorms build quickly, making
    early starts standard practice. Rescue access requires descent to the
    hut or PGHM helicopter response; this is serious, remote alpine
    granite climbing well beyond roadside sport crags.

