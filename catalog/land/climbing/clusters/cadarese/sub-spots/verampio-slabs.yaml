tier_rationale:
  en: |
    Verampio Slabs sits adjacent to the Val Cadarese gorge entry and
    offers gentler, lower-angle granite terrain than the crack-school
    sector, with a mixed sport-and-trad rack of routes from F5 to F7a.
    Bolting is partial — stainless bolts protect the blanker slab
    sections while corners and seams take natural gear — so a light rack
    is recommended alongside quickdraws. Morning shade from the valley
    walls keeps the rock cool early, warming through midday, and the
    short approach from the Cadarese parking area keeps this an
    accessible, moderate-consequence complement to the harder crack
    lines nearby.

