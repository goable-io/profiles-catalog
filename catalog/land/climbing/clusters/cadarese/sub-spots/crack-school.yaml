tier_rationale:
  en: |
    Widely known as Italy's crack-climbing school, this sector holds the
    gorge's core collection of clean, parallel-sided Ossola granite
    cracks from 5.9 to 5.13, protected entirely by natural gear (cams
    from fingers to offwidth sizes) with essentially no fixed hardware
    on the crack lines themselves. The north-facing gorge stays shaded
    and cool through summer, a defining feature that keeps climbing
    comfortable in hot months but slows rock-drying after rain. Jamming
    technique on unfamiliar crack sizes and the trad-only protection
    scheme make this a committing, technique-demanding venue placed in
    the advanced tier despite short pitch lengths, consistent with its
    reputation as the reference trad-crack venue in Italy.

