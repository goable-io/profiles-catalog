gates:
  - { metric: precipitation_mm_h, condition: gt, value: 0.7,  reason_code: WET_ROCK_AND_STORM, description: Active precipitation above 0.7 mm/h wets the parallel-sided cracks and reduces friction badly; the shaded gorge dries slower than open-aspect crags. }
  - { metric: wind_speed_kn,      condition: gt, value: 38,   reason_code: HIGH_WIND_RIDGE,     description: Sustained wind above 38 knots channeling through the narrow Val d'Ossola gorge creates rope-management and communication hazards. }
  - { metric: visibility_km,      condition: lt, value: 0.4,  reason_code: ALPINE_NAVIGATION,   description: Visibility below 400m impairs approach-trail navigation and belay communication in the gorge. }
  - { metric: apparent_temp_c,    condition: lt, value: -12,  reason_code: ALPINE_HYPOTHERMIA,  description: Apparent temperature below -12°C creates frostbite risk on cold-hands crack jamming and stiffens rope handling at belay stances. }

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 20
  carrying_capacity_sensitivity: high
  notes: |
    Cadarese is a compact, high-traffic gorge managed informally by the
    local climbing community and CAI Verbano; crack-climbing routes are
    trad-protected with minimal fixed hardware, so equipment turnover is
    low but crowding at popular crack lines is common on weekends. The
    narrow gorge floor is sensitive to trampling near the base of the
    most popular crack pitches.

