description:
  en: |
    Cadarese, in the Val d'Ossola near Verbania-Cusio-Ossola, is widely
    regarded as Italy's premier crack-climbing destination — a compact
    granite gorge where clean, parallel-sided cracks of every width from
    fingers to offwidth are packed into a short valley. Elevation sits
    around 700-800m, with a mostly north-facing orientation that keeps
    the gorge shaded and cool even in high summer, the crag's defining
    physical trait. Grades span roughly 5.6 to 5.13 (crack-specific
    rating), with adjacent slab and low-angle granite sectors offering a
    gentler F5-F7a sport-and-trad mix. Best season is late spring through
    early autumn; the narrow gorge shades out morning sun and can stay
    damp longer after rain than open-aspect crags.

