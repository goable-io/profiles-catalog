tier_rationale:
  en: |
    Sergent is the Val d'Orco's reference multipitch granite dome,
    climbing 4-8 pitch trad and mixed-sport lines from F5c to F7a on the
    boundary of Gran Paradiso National Park. Protection is a mix of
    sparse fixed bolts at belay stations and natural gear on the run-out
    slab and corner pitches, demanding a solid trad rack and confident
    slab technique. The dome sits around 1600-1800m, high enough that
    afternoon convective storms are a recurring summer hazard and
    descent — typically by rappel or a walk-off gully — requires care in
    poor visibility. Rescue access is limited compared to roadside
    crags, reflecting its status as a committing alpine objective.

