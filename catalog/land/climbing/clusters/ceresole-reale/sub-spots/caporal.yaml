tier_rationale:
  en: |
    Caporal is the dome immediately adjacent to Sergent and shares its
    character: clean granite trad multipitch from F5c to F7b+ over 4-8
    pitches, protected primarily by natural gear with fixed bolts limited
    to belay stances. Together with Sergent, Caporal anchors the Val
    d'Orco's Piemontese granite "classic tour," so route-finding
    conventions and rappel lines are well documented by local guides,
    but the exposed, high-altitude (~1600-1800m) setting still carries
    the same afternoon-storm and limited-rescue-access profile as its
    neighbor. Slightly harder grade ceiling than Sergent places it in
    the same advanced tier.

