description:
  en: |
    Ceresole Reale and the Val d'Orco (Città Metropolitana di Torino,
    Piemonte) form one of the Alps' classic granite multipitch valleys,
    bordering the Gran Paradiso National Park. Elevation sits around
    1600-1800m at the dome bases, high enough that afternoon convective
    storms and cool mountain air are recurring factors even in
    midsummer. The valley's signature routes climb clean granite domes
    in 4-8 pitch trad-and-mixed lines from F5c to F7b+, on rock famous
    for its friction and sparse but well-placed protection. Best season
    is a short alpine window, roughly June through September, with
    afternoon thunderstorm risk the dominant scheduling constraint. The
    Val d'Orco is closely associated with the Piemontese granite
    "classic tour" of dome routes climbed by generations of Italian
    alpinists.

