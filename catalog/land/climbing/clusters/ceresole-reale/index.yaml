sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 16
  carrying_capacity_sensitivity: high
  notes: |
    Ceresole Reale sits on the boundary of the Parco Nazionale Gran
    Paradiso, whose access rules constrain approach trails and camping
    near the park perimeter. The classic dome routes (Sergent, Caporal,
    and neighbors) see concentrated summer traffic from parties doing
    the Val d'Orco "classic tour," which CAI Torino and local guides
    coordinate to reduce queuing and rockfall risk from parties
    climbing above one another.

