gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 1.5
    reason_code: WET_ROCK
    description: Active precipitation on Railay/Tonsai limestone makes tufa and pocket features slick, and tropical monsoon downpours arrive with little warning.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m impairs boat access to the peninsula and to the deep-water-soloing islands, and disrupts belayer-climber communication.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots makes longtail-boat transfers to Railay, Tonsai, and Koh Poda unsafe and creates rope-management hazards on sea-cliff sectors.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent (not a realistic tropical scenario but retained as the global safety floor), grip and rope handling deteriorate sharply.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 26
  carrying_capacity_sensitivity: high
  notes: |
    Climbing tourism is central to the Railay-Tonsai economy and to Krabi's
    longtail-boat operators, concentrating heavy foot and boat traffic at
    flagship sectors and on the deep-water-soloing islands during the
    November-April dry season. Local guiding shops coordinate stainless-steel
    re-bolting given rapid saltwater corrosion of hardware; karst island
    access for DWS is sensitive to monsoon swell and to marine-park
    conservation rules around Koh Poda.

