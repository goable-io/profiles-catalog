description:
  en: |
    Railay and Tonsai (Krabi province, Thailand) form a single climbing
    peninsula accessible only by longtail boat, cut off from the mainland by
    sheer limestone walls. Grey and orange pocketed limestone rises directly
    from turquoise water, heavily featured with tufa columns, stalactites,
    and huecos on steep overhanging terrain, alongside more technical
    vertical faces. The area is tropical monsoon climate: hot and humid
    year-round with a pronounced wet season (roughly May-October) when
    afternoon storms and saturated rock make climbing unreliable, and a dry,
    climbable season (November-April) with high heat and humidity but
    generally stable weather. Beyond the fixed sport crags, the peninsula and
    surrounding karst islands are a global centre for deep-water soloing —
    rope-free climbing above the sea, with the water itself acting as the
    landing. Hardware is predominantly stainless steel given the tropical
    marine environment, maintained through local guiding-shop and community
    re-bolting efforts.

