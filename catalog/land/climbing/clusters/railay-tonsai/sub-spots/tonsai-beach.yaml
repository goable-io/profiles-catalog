tier_rationale:
  en: |
    The cliffs above Tonsai Beach hold one of Southeast Asia's densest
    concentrations of steep sport climbing, with sustained tufa-and-hueco
    limestone routes from F6a to F8b spread across multiple sectors just
    behind the beach. Hardware is stainless steel installed and maintained
    by the long-running local climbing-shop community, with well-established
    lower-off anchors on the classic lines. The overhanging, three-
    dimensional terrain produces long, clean falls into open air on the
    steepest routes, and the dense hueco and tufa features demand real
    technique to read, placing the sector's harder end solidly in advanced
    territory even though moderate lines exist. Approach is a short walk
    from the beach through jungle paths that can be muddy after rain.

