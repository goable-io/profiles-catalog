tier_rationale:
  en: |
    Thaiwand Wall, rising directly above Railay East's mangrove shoreline, is
    one of Thailand's most photographed sea-cliffs: grey and orange
    tufa-featured limestone with sport routes from F5c to F8a on generally
    vertical-to-overhanging terrain. Bolting is stainless steel, maintained
    by local guiding shops given the tropical marine environment, with
    mailon-and-chain lower-offs on the more heavily trafficked lines. The
    approach is a short walk along Railay East's shoreline path, tide-
    dependent at the base of some routes, and the wall's sustained tufa
    features reward good route-reading without demanding the advanced
    endurance of the steepest cave lines elsewhere on the peninsula. Shade
    coverage is partial through the day given the wall's orientation.

