tier_rationale:
  en: |
    Koh Poda and the surrounding karst islands off Railay are a global
    reference for deep-water soloing (DWS): rope-free climbing on
    overhanging pocketed and tufa limestone directly above the sea, with the
    water itself serving as the fall protection. Routes range from F6c to
    F8c and are entirely unbolted, accessed only by longtail boat, with no
    fixed hardware, no belayer, and commitment governed by tide state, swell,
    and the climber's own fall tolerance from heights that can exceed 10-15
    m on the harder lines. The absence of rope protection, the boat-only
    access, and the need to accurately judge water depth and submerged rock
    before committing to a line place this squarely in advanced,
    high-consequence terrain despite the "soft" landing. Best conditions are
    calm seas and mid-to-high tide to ensure adequate water depth below the
    routes.

