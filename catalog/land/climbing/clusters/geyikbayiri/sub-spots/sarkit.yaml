tier_rationale:
  en: |
    Sarkıt is the main sector of Geyikbayırı, with south to south-east
    facing pocketed limestone routes from F6a to F8a on generally solid
    rock. Bolting is stainless steel with chain lower-offs, maintained by
    the local Antalya climbing community and periodic international
    volunteer equipping trips. The sun-facing aspect makes it a strong
    autumn-through-spring venue, becoming uncomfortably hot at midday in
    summer, and it is the social hub of Geyikbayırı's camp-based climbing
    culture with a short, well-established approach path. Falls are clean
    single-pitch falls onto bolts with straightforward lowering descents.

