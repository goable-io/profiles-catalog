tier_rationale:
  en: |
    Trebenna is an adjacent limestone sector to Sarkıt with routes in the
    F5c-F7c range on generally shaded aspects, making it a useful summer
    and midday alternative when the main sun-facing sectors become too hot.
    Hardware is stainless steel bolts with chain lower-offs, maintained
    alongside the rest of the Geyikbayırı area by the local climbing
    community. Approach is a short walk through pine forest from the
    roadside; the moderate grade range and single-pitch height keep falls
    clean and descents straightforward via lowering.

