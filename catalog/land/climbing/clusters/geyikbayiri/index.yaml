gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 1.5
    reason_code: WET_ROCK
    description: Active precipitation on Geyikbayırı's pocketed limestone makes holds slick and raises fall risk, particularly on the steeper sectors.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m impairs approach navigation on the forested hillside trails and belayer-climber communication.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots creates rope-management hazards on the more exposed south-facing sectors.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature, rare but possible on winter nights in the foothills, grip and rope handling deteriorate sharply.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Geyikbayırı's camp-based climbing tourism concentrates visitor density
    at flagship sectors like Sarkıt during the long October-April season.
    Local Antalya-area climbing associations and international volunteer
    equipping trips maintain bolting; forest-floor erosion and vegetation
    trampling at popular crag bases is an ongoing management concern for
    the pine forest ecosystem.

