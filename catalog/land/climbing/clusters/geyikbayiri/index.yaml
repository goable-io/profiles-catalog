description:
  en: |
    Geyikbayırı, in the pine-forested foothills above Antalya on Turkey's
    Mediterranean coast, is Turkey's largest sport-climbing area with well
    over 1,000 routes on grey and orange limestone. Sectors span south- to
    south-east-facing sun-drenched walls to shaded north-facing crags,
    letting climbers chase comfortable conditions across seasons — the area
    is climbable nearly year-round, with a dedicated camp-based climbing
    culture supporting long stays. Grades run from beginner-friendly F4 up
    through F8b+ testpieces. Rock is generally solid pocketed and featured
    limestone; best conditions are October-April, with summer climbing
    concentrated at shaded or higher-altitude sectors to avoid midday heat.

