gates:
  - { metric: precipitation_mm_h, condition: gt, value: 0.3, reason_code: WET_SANDSTONE_DAMAGE, description: "Climbing on wet Corbin sandstone breaks holds and causes irreversible rock damage; RRGCC ethics ask climbers to avoid routes for 24-48h after rain." }
  - { metric: visibility_km, condition: lt, value: 0.5, reason_code: LOW_VISIBILITY, description: "Visibility below 500m makes approach-trail navigation to forested cliff-line sectors unsafe." }
  - { metric: wind_speed_kn, condition: gt, value: 35, reason_code: HIGH_WIND_EXPOSED, description: "Sustained wind above 35 knots creates rope-drag and communication hazards on the taller overhanging sectors." }
  - { metric: apparent_temp_c, condition: lt, value: -5, reason_code: EXTREME_COLD, description: "Below -5°C apparent, tendons stiffen and grip deteriorates on sandstone crimps and pockets; frostbite risk rises at belay stances." }

sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 32
  carrying_capacity_sensitivity: high
  notes: |
    Much of the cluster sits on RRGCC-held recreational preserves
    (including the Pendergrass-Murray Recreational Preserve), which manage
    parking, trail maintenance, and access agreements with adjoining
    private land. The gorge's defining local ethic — never climb on wet
    sandstone — is a hold-preservation rule, not just a safety one, and is
    actively promoted by the RRGCC. Select cliff lines carry seasonal
    raptor nesting closures.

