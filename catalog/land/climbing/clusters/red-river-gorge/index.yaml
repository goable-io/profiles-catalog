description:
  en: |
    Red River Gorge (Daniel Boone National Forest, Kentucky) is one of the
    world's premier steep sport-climbing destinations, cut into pocketed
    and featured Corbin sandstone at a low elevation of roughly 250-400m.
    Thousands of routes span F5 easy vertical walls to F9a overhanging
    testpieces, with the gorge's signature overhanging jug-hauls drawing
    climbers year-round, though spring and fall offer the most consistent
    conditions in this humid continental/subtropical climate. Sandstone is
    highly sensitive to moisture — climbing on wet rock breaks holds and
    causes irreversible damage — so the Red River Gorge Climbers'
    Coalition (RRGCC) asks climbers to stay off routes for 24-48h after
    rain, an ethic this catalog encodes as a tightened precipitation gate.
    Access across much of the cluster runs through RRGCC-held recreational
    preserves with seasonal raptor closures on select cliff lines.

