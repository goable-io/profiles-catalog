meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "RRGCC (Red River Gorge Climbers' Coalition) access and wet-rock ethics guidance"
    - "Red River Gorge Rock Climbs guidebook (RRGCC / Wolverine Publishing)"
    - "Mountain Project Red River Gorge area guide"
  notes: |
    Cluster overrides vs base climbing: precipitation weight raised to
    0.30 (vs 0.21 base) and the gate tightened to 0.3 mm/h (vs 2 mm/h
    base) to encode the sandstone wet-rock damage ethic, which is a
    stricter constraint here than the generic wet-rock slip hazard.
    Rockfall weight kept at the 0.08 base default since these are
    single-pitch sport sectors without the exfoliation profile of alpine
    granite. Season set to 32 weeks reflecting the RRG's practical
    year-round but spring/fall-favored climbing calendar.
