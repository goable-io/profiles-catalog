tier_rationale:
  en: |
    Motherlode is the Red River Gorge's flagship steep sector, cut into
    overhanging pocketed Corbin sandstone with routes from moderate 5.10s
    up to national testpieces like Pure Imagination and Golden Ticket in
    the F8c-F9a range. Hardware is stainless bolts and chain or mailon
    lower-off anchors maintained through the RRGCC's bolt-replacement
    program. The steep, overhung terrain keeps most falls clean swings
    into space rather than ledge-falls, the approach is a short walk from
    parking on RRGCC-held land, and cell coverage in the gorge is
    patchy — routine bolted-sport residual risk (lowering errors, rope-end
    accidents, holds breaking on hard moves).

