tier_rationale:
  en: |
    Roadside is Red River Gorge's easiest-access sector, a short flat walk
    from the pull-off to vertical-to-slightly-overhanging Corbin sandstone
    in the F5-F6c range. Hardware is well-maintained stainless bolts with
    chain or mailon lower-offs under the RRGCC bolt-replacement program.
    Falls are clean drops onto bolted lines with no ledge hazard on the
    moderate-angle rock, and cell coverage near the road is reliable.
    Red River Gorge's classic beginner-friendly, kids-safe reference
    sector.

