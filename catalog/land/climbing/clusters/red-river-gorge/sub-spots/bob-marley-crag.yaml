tier_rationale:
  en: |
    Bob Marley Crag is a steep, pocketed Corbin sandstone sector with
    sport routes in the F7a-F8b range, a popular training ground for
    climbers working the gorge's overhanging jug-hauls. Anchors are
    stainless bolts with chain or mailon lower-offs maintained under the
    RRGCC bolt-replacement program, the approach is a short forested
    walk-in, and the steep, overhanging profile of most lines keeps falls
    away from ledges. Cell coverage is patchy in the gorge and rescue
    access is via forest-road trailheads, consistent with the cluster's
    routine bolted-sport risk profile.

