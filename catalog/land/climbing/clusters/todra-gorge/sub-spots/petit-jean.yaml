tier_rationale:
  en: |
    The Petit Jean sector offers moderate limestone sport routes from
    roughly F5c to F7a, positioned for an easy walk-in directly from the
    gorge road, making it one of Todra's most tourist-friendly and
    frequently visited areas. Hardware is stainless steel maintained
    through Fédération Royale Marocaine des Sports de Montagne et
    d'Escalade (FRMSM) rebolting work, with well-spaced bolts and reliable
    lower-offs suited to climbers newer to outdoor limestone. Route lengths
    are short to moderate single-pitch, keeping falls clean and manageable,
    and the sector's proximity to the road and local guiding operations
    makes it the default introduction to the gorge for visiting climbers.

