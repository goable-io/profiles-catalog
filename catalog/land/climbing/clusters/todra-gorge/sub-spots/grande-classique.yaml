tier_rationale:
  en: |
    The Grande Classique sector sits at the dramatic base of Todra Gorge,
    beneath roughly 300 m red limestone walls, offering sustained sport
    routes from F6a to F7c on generally vertical to slightly overhanging
    rock. Bolting is stainless steel installed and maintained through
    Fédération Royale Marocaine des Sports de Montagne et d'Escalade
    (FRMSM) rebolting campaigns, with reliable chain lower-offs on the
    established lines. The approach is a short walk from the gorge road,
    and the canyon's depth provides shade for much of the day, making this
    one of the more comfortable sectors even in warmer months. Route
    lengths are predominantly single-pitch, keeping the climbing accessible
    to solid intermediate climbers without the commitment of the gorge's
    taller multipitch-adjacent lines.

