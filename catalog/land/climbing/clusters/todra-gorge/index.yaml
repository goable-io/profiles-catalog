gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 2
    reason_code: WET_ROCK
    description: Active precipitation on Todra's limestone walls raises flash-flood risk in the narrow canyon floor in addition to making rock slick, a well-known regional hazard.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m in the narrow gorge impairs approach navigation and belayer-climber communication on the taller sectors.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots funnelling through the canyon creates rope-management hazards, particularly on the gorge's taller multipitch-adjacent lines.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature, possible on High Atlas foothill winter nights, tendons stiffen and grip deteriorates dramatically.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 32
  carrying_capacity_sensitivity: medium
  notes: |
    Todra Gorge climbing tourism supports the local Tinghir-area economy
    alongside trekking and vehicle tourism through the canyon road. The
    Fédération Royale Marocaine des Sports de Montagne et d'Escalade
    (FRMSM) coordinates stainless-steel rebolting campaigns; the gorge's
    narrow floor and shared road/foot traffic make flash-flood awareness
    during and after rain a standing local safety concern rather than a
    pure carrying-capacity issue.

