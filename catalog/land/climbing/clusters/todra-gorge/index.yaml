description:
  en: |
    Todra Gorge (High Atlas foothills, Morocco) is a dramatic limestone
    canyon near Tinghir, its walls rising up to 300 m in places, cut by a
    narrow river gorge that has long drawn trekkers before becoming a
    significant North African sport-climbing destination. The rock is
    generally solid orange-red limestone, and route development has been
    substantially supported by the Fédération Royale Marocaine des Sports
    de Montagne et d'Escalade (FRMSM), which has coordinated stainless-steel
    rebolting campaigns across the gorge's sectors. Climbing is
    concentrated at the gorge's base, close to the road and the small
    settlement that has grown around tourism, with easy walk-in access
    contrasting with the imposing scale of the surrounding walls. The
    climate is semi-arid with hot summers that make the gorge's walls
    uncomfortably hot at midday, and mild, more climbable conditions in
    spring, autumn, and winter; the canyon's depth gives welcome shade for
    much of the day on many sectors.

