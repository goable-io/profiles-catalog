description:
  en: |
    Kalymnos (Dodecanese, Greece) is one of the world's premier sport-climbing
    destinations: grey and orange pocketed limestone rising directly from the
    Aegean, with over 3,500 routes ranging from F4 to F9a+. The island's
    sectors span sea-level tufa caves to inland cliffs at 100-400 m, with
    aspects covering the full compass so climbers rotate crags through the
    day to chase or escape sun. Rock is generally solid, well-cleaned pocket
    limestone with stalactite and tufa features on the steepest lines. The
    climbing federation (local Kalymnos bolting fund + Hellenic Federation of Mountaineering and Climbing (EOOA), working with local
    equippers) maintains stainless-steel and titanium hardware on the
    heaviest-traffic sectors given proximity to sea spray and salt corrosion.
    Best season is spring (March-May) and autumn (September-November); summer
    is viable at shaded or high-altitude sectors but many south-facing walls
    become uncomfortably hot by midday. Rain is rare outside winter.

