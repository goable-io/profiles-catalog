gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 1.5
    reason_code: WET_ROCK
    description: Active precipitation on Kalymnos limestone makes pockets and tufa features slick; wet holds materially raise fall risk on steep terrain.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m impairs approach navigation on coastal footpaths and belayer-climber communication on longer sectors.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots, common with the Meltemi in summer, creates rope-management hazards on exposed sea-facing crags.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature (rare on Kalymnos but possible on winter nights), grip and rope handling deteriorate sharply.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 36
  carrying_capacity_sensitivity: high
  notes: |
    Kalymnos climbing tourism is the primary driver of the island's shoulder-
    season economy, concentrating crowding at flagship sectors (Grande
    Grotta, Odyssey) during the October climbing festival and spring peak.
    The local Kalymnos bolting fund + Hellenic Federation of Mountaineering and Climbing (EOOA) coordinates re-bolting campaigns funded
    partly by climber donations; salt-air corrosion of older mild-steel bolts
    is an ongoing safety concern being addressed sector-by-sector.

