tier_rationale:
  en: |
    Iliada sits within the Poets area and offers moderate-grade limestone
    routes from F5c to F7a, making it one of the more approachable sectors
    on Kalymnos for climbers still building endurance for the island's
    steeper testpieces. Hardware is stainless steel bolts with excellent,
    recently-maintained anchors, reflecting the federation's ongoing
    re-bolting priority for high-traffic beginner-to-intermediate sectors.
    The wall is broadly vertical with occasional bulges, single-pitch, and
    the approach is a short, gentle walk from the road. Falls are clean and
    the grade range makes this a common choice for mixed-ability groups.

