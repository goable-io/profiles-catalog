tier_rationale:
  en: |
    Odyssey is a sustained limestone sector offering routes in the F6b-F8a
    range on generally vertical-to-slightly-overhanging grey rock, popular
    with intermediate to advanced climbers working toward the harder grades
    found elsewhere on the island. Hardware is stainless steel bolts with
    chain or mailon lower-offs, maintained through federation re-bolting
    campaigns. The approach is a short, well-marked walk-in from the
    roadside, and the sector's moderate height keeps falls clean and
    retrievable without complex rope-management. Shade coverage varies by
    time of day, making it a popular morning or late-afternoon venue in the
    warmer months.

