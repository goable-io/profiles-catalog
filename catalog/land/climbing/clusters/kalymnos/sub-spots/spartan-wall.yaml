tier_rationale:
  en: |
    Spartan Wall is one of the classic original Kalymnos sectors, offering
    vertical-to-overhanging grey limestone routes across the F6a-F7c range.
    Bolting is stainless steel with chain lower-offs, installed during the
    island's earliest development and subsequently re-bolted by the
    federation as part of ongoing hardware-modernization efforts. The
    approach is a short uphill walk on an established path, and the wall's
    single-pitch height keeps descents simple via lower-off. Rock quality is
    generally solid and well-travelled, though some older, more polished
    holds exist on the most popular lines.

