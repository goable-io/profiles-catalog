tier_rationale:
  en: |
    La Grande Grotta is a deep overhanging limestone cave sector with
    heavily featured tufa and stalactite formations, hosting some of the
    hardest and most sustained sport lines on the island in the F7c-F9a+
    range. Bolting is stainless/titanium hardware installed and maintained
    by the Kalymnos Climbing Federation given the corrosive sea-spray
    environment, with mailon-and-chain lower-off anchors. The cave's steep,
    3D roof terrain means long, powerful falls into open air rather than
    onto ledges, but the sustained overhanging pump and reachy tufa
    sequences demand advanced technique and endurance, and route-finding
    among the stalactite features is non-trivial for the grade. Approach is
    a short walk from the Grande Grotta parking area; cell coverage is
    generally reliable on this part of the island.

