  carrying_capacity_sensitivity: high
  notes: |
    Margalef sees growing international traffic as an alternative to
    the more crowded Siurana, with local associations (FEEC) and the
    village community coordinating bolting and trail maintenance.
    Conglomerate rock is more susceptible to cobble loosening than
    limestone, so climbers are advised to test holds before committing
    weight, particularly on newer or less-traveled lines. Some sectors
    have seasonal raptor nesting closures.

