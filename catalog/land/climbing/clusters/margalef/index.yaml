description:
  en: |
    Margalef (Tarragona province, Catalonia, near Siurana) is a
    conglomerate sport-climbing destination distinctive for its rounded
    pocket and cobble-studded rock, offering steep, powerful, technical
    climbing quite different in texture from the limestone at nearby
    Siurana. Grades span roughly F5 to F9a+, with a concentration of
    hard testpieces on overhanging orange-grey conglomerate walls.
    Aspect and sector variety allow sun/shade rotation, and the
    Mediterranean climate gives a long season, primarily October through
    May, with summer climbable at altitude or in shade. Approach is via
    short walks from village and roadside parking. The main physical
    constraint is heat in summer and, since conglomerate can be more
    friable than limestone in spots, occasional loose cobbles on
    less-traveled or newer lines.

