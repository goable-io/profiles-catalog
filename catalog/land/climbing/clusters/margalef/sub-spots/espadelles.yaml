tier_rationale:
  en: |
    Espadelles is a sport sector on Margalef conglomerate offering routes
    from F6c to F8a, well bolted with stainless hardware and chain
    lower-offs. The rock is characteristic rounded-pocket and cobble
    conglomerate, moderately steep, less extreme than the cluster's
    hardest sector at La Finestra but still sustained and technical.
    Approach is a short walk from roadside or village parking. Falls are
    generally clean onto bolts; standard bolted-sport-route residual
    risks apply, with the usual conglomerate caution to test holds
    before committing weight.

