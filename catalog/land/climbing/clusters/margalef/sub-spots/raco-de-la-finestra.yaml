tier_rationale:
  en: |
    Racó de la Finestra sits adjacent to the flagship La Finestra sector
    and offers a more moderate grade band, F6a to F7c, on the same
    rounded-pocket conglomerate. Bolting is stainless with chain
    lower-offs, maintained to the same standard as the neighbouring
    hard sector. The rock character is identical conglomerate texture
    but with less-steep, more approachable lines suited to climbers
    building toward Margalef's pocket-pulling style. Approach is a short
    walk from roadside or village parking, sharing access with La
    Finestra. Falls are clean onto bolts; standard bolted-sport-route
    residual risks apply.

