tier_rationale:
  en: |
    La Finestra is Margalef's iconic hard-climbing sector, distinguished
    by rounded conglomerate pockets and cobbles on steep, overhanging
    orange-grey rock, home to test-pieces such as those in the Era Vella
    area in the F8a-F9a+ range. Bolting is modern stainless with chain
    lower-offs maintained given the sector's profile among visiting
    climbers, but the pocket-pulling style demands precise technique and
    the conglomerate matrix can occasionally shed a loose cobble,
    particularly after rain or on less-polished holds. Approach is a
    short walk from roadside or village parking. Falls on the steep
    terrain are generally clean and air-y; the tier reflects grade
    severity and sustained power demands characteristic of Margalef's
    hardest climbing.

