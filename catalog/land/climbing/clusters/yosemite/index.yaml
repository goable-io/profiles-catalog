meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "SuperTopo Yosemite Big Walls guidebook (Reid & McNamara)"
    - "National Park Service Yosemite climbing regulations and permit guidance"
    - "American Alpine Club Accidents in North American Climbing, Yosemite incident reports"
  notes: |
    Cluster overrides vs climbing-alpine base: temperature curve reverted
    to the warmer mid-latitude profile (base `climbing` curve) rather than
    the cooler high-alpine curve, reflecting Yosemite Valley's 1200-2600m
    elevation band versus true high-alpine terrain. Rockfall weight raised
    to 0.13 (vs 0.08 default) given documented granite exfoliation events
    on El Capitan and Half Dome. Season narrowed to 26 weeks (spring/fall)
    to reflect summer heat avoidance on sun-exposed faces and winter
    closures.
