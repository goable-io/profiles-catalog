description:
  en: |
    Yosemite Valley (Sierra Nevada, California) is the reference big-wall
    granite destination, with formations rising 700-900m off the valley
    floor at 1200-2600m elevation. The cluster spans committing multi-day
    trad/aid big walls (El Capitan, Half Dome) and shorter intermediate
    multipitch (Cathedral Rocks), on clean, generally sound granite with
    grades from 5.7 moderate trad to 5.14 free testpieces. Aspect varies by
    formation — El Capitan is broadly southwest-facing and bakes in summer
    afternoon sun, Half Dome's NW Face stays shaded most of the day, and
    Cathedral Rocks offers a mix. Best conditions are spring (April-June)
    and fall (September-October); summer heat on sun-exposed faces and
    winter storms/snow both degrade conditions. Access requires an NPS
    wilderness permit for overnight bivouac on the wall, and select
    formations carry seasonal peregrine falcon nesting closures.

