gates:
  - { metric: precipitation_mm_h, condition: gt, value: 1.5, reason_code: WET_ROCK, description: "Active precipitation on Yosemite granite sharply increases fall risk on friction slabs and degrades rope/hardware handling on multi-day walls." }
  - { metric: visibility_km, condition: lt, value: 0.5, reason_code: LOW_VISIBILITY, description: "Visibility below 500m on 700-900m big-wall faces creates route-finding and party-communication risk, especially on the upper pitches of El Capitan and Half Dome." }
  - { metric: wind_speed_kn, condition: gt, value: 35, reason_code: HIGH_WIND_EXPOSED, description: "Sustained wind above 35 knots on the exposed faces of El Capitan and Half Dome makes hauling, rope handling, and verbal communication between pitches unsafe." }
  - { metric: apparent_temp_c, condition: lt, value: -5, reason_code: EXTREME_COLD, description: "Below -5°C apparent, tendons stiffen and grip deteriorates on granite crimps; frostbite risk rises sharply at exposed hanging belays." }

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 26
  carrying_capacity_sensitivity: high
  notes: |
    Big-wall routes (El Capitan, Half Dome) require an NPS wilderness
    permit for overnight bivouac and portaledge use; queueing on The Nose
    in peak spring/fall season is actively managed by Yosemite Search and
    Rescue (YOSAR) to reduce rockfall from stacked parties. Select
    formations carry seasonal peregrine falcon nesting closures
    (typically spring into early summer). Cathedral Rocks and shorter
    multipitch routes have lower gear dependency than the big walls.

