tier_rationale:
  en: |
    Higher, Middle, and Lower Cathedral Rocks, together with the
    neighboring Cookie Cliff, offer 100-300m granite multipitch trad
    routes in the 5.7-5.10 range — Yosemite's classic intermediate
    stepping-stone from single-pitch cragging to full big-wall routes.
    Protection is mixed trad with fixed anchors at many belays and route
    tops; rock quality is generally sound clean granite with occasional
    loose blocks on ledgy sections. Approach is via use trails from the
    valley floor, shorter and less committing than the big walls, and
    descent/rescue access is comparatively straightforward given proximity
    to the road.

