description:
  en: |
    The Nose on El Capitan is the defining big-wall route of American
    climbing: 900m/31 pitches of golden granite up the prow of El Cap,
    climbable as a multi-day aid line (5.9 C2) or all-free at 5.14a. Alex
    Honnold's 2017 free solo and the sub-2-hour speed-climbing record era
    have made it the most storied wall in the sport.

