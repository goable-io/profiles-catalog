tier_rationale:
  en: |
    The Nose climbs 900m of golden El Capitan granite over 31 pitches,
    broadly southwest-facing, as a multi-day trad/aid route (5.9 C2) or an
    all-free line at 5.14a — famously free-soloed by Alex Honnold in 2017.
    Protection is primarily trad (removable cams and nuts placed by the
    leader) with fixed pins and bolted anchors at established belays;
    sections of the route carry loose rock requiring helmet use, and party
    stacking during peak spring/fall season increases rockfall exposure
    from climbers above. Descent is by rappel retracing the route or via
    the East Ledges, with no easy bail once committed above the lower
    pitches; rescue is technical big-wall rescue coordinated by Yosemite
    Search and Rescue (YOSAR). An NPS wilderness permit is required for
    overnight bivouac and portaledge use on the wall.

