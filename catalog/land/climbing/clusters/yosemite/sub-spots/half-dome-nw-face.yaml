tier_rationale:
  en: |
    The Regular Northwest Face of Half Dome climbs 700m of granite over
    roughly 23 pitches as a trad/aid route (5.9 C1) or a 5.12 free line,
    first climbed in 1957 and now the historical sibling to The Nose as
    America's other reference big wall. Protection is mostly trad, with
    fixed pins at many belays; the glacier-polished Zig-Zags sections
    demand precise footwork on low-friction slab. Descent from the summit
    is via the cable route or hiking trail — a long, exposed hike-off with
    real afternoon-thunderstorm lightning exposure on the open summit
    plateau — and an NPS wilderness/backcountry permit is required for the
    approach and any overnight bivouac on the wall.

