  - { metric: visibility_km,      condition: lt, value: 0.5, reason_code: LOW_VISIBILITY,    description: Fog or cloud below 500m on the plateau obscures the exposed uphill approach trail and cliff-base route-finding. }
  - { metric: wind_speed_kn,      condition: gt, value: 35,  reason_code: HIGH_WIND_EXPOSED, description: Sustained wind above 35 knots on the open plateau makes rope handling and communication unsafe on the steep faces. }
