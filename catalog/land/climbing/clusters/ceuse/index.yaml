sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 16
  carrying_capacity_sensitivity: high
  notes: |
    Céüse's short summer season and 1-1.5 hour uphill approach
    concentrate climber traffic into a compact window (roughly June-
    September), driving cliff-base erosion and trail wear that local
    associations (FFME, Grimper à Céüse) work to manage. Griffon vulture
    nesting closes select sectors seasonally each spring. Fixed-gear
    maintenance on the world-class hard routes is coordinated by local
    equippers and relies on climber donations.

