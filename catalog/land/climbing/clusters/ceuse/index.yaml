description:
  en: |
    Céüse (Hautes-Alpes) sits on a limestone plateau above Sigoyer at
    roughly 2000m altitude, widely regarded as one of the world's premier
    sport-climbing destinations for its steep, technical, immaculate grey
    and orange limestone. The cliff faces south and east, giving strong
    sun exposure and a short usable season of roughly June to September
    at altitude — snow and cold shut it down outside summer. The approach
    is a genuine 1-1.5 hour uphill walk from the parking area, with no
    shortcuts, so weather and daylight planning matter more here than at
    roadside crags. Grades run from moderate F6a testpieces up through
    some of the hardest sport routes in the world (F8a-F9b+), all on
    well-bolted stainless hardware maintained by local equippers. The
    defining physical constraints are altitude-driven weather volatility
    (afternoon storms build fast) and the long, exposed approach walk.

