tier_rationale:
  en: |
    Face de Rat is a well-bolted single-pitch sport sector on Céüse
    limestone offering routes from F6a to F7c, with stainless hardware
    and chain lower-offs maintained by local equippers. It sits at the
    far end of the plateau's approach network, requiring the same
    1-hour-plus uphill walk from the parking area as the rest of Céüse,
    which is the sector's main added commitment beyond the climbing
    itself. Grades here are more moderate than Berlin or Cascade, making
    it a reasonable entry point to Céüse-style steep limestone technique
    for climbers not yet ready for the plateau's hardest lines. Falls are
    generally clean onto bolts; standard bolted-sport-route residual
    risks apply.

