tier_rationale:
  en: |
    The Berlin sector is the historic heart of Céüse's hardest climbing,
    home to Biographie (also known as Realization, first climbed by
    Chris Sharma), one of the world's earliest 5.15a/F9a+ routes, along
    with a concentration of F8a-F9b lines on steep, technical grey
    limestone. Bolting is modern stainless with chain lower-offs,
    well-maintained given the sector's international profile, but the
    routes themselves are steep, powerful, and often run-out on
    technical faces between bolts by design of the original equippers.
    The 1-1.5 hour uphill approach from the parking area and the
    plateau's altitude-driven weather volatility (fast-building
    afternoon storms) add commitment beyond the climbing itself, and
    rescue access requires descending the same approach trail.

