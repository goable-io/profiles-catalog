tier_rationale:
  en: |
    The Cascade sector offers sustained single-pitch sport routes from
    F7a to F8b on Céüse's characteristic steep grey limestone, well
    bolted with stainless hardware and chain anchors maintained by local
    equippers. It sits within the same 1-1.5 hour uphill approach as the
    rest of the plateau, but the routes themselves are moderate sport
    testpieces without the extreme run-outs found in the hardest Berlin
    lines, giving cleaner falls onto bolts. Aspect is broadly south to
    east, so the sector gets strong sun and is best climbed in morning
    or shoulder-season conditions during the short summer window.
    Standard bolted-sport-route hazards apply — lowering errors,
    rope-end incidents — with the approach walk as the main added
    commitment factor.

