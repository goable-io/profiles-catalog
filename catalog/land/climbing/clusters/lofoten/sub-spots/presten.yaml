tier_rationale:
  en: |
    Presten's north-west face is a 400 m+ granite big wall offering classic
    Arctic multipitch trad climbing from F5c to F7a, split by clean crack
    systems on generally solid rock with some sections requiring careful
    route-finding among featured slabs and corners. Protection is primarily
    trad (cams and nuts) with occasional fixed anchors at belay stances;
    descent is by rappel down established lines. The midnight-sun summer
    season (roughly June-July) allows unusually flexible start times, but
    weather off the Norwegian Sea can deteriorate rapidly, and the wall's
    height and remoteness make retreat from upper pitches a serious
    undertaking with limited rescue access from the fjord below.

