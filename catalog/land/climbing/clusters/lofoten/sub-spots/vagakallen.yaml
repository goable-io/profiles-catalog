tier_rationale:
  en: |
    Vågakallen's north face, rising above Kabelvåg, is an alpine-style
    granite multipitch objective with committing 6-10 pitch routes
    protected primarily by trad gear (cams, nuts) on generally solid rock
    with some looser sections requiring careful placement judgment. The
    approach involves a sustained hike-in before roping up, and the route's
    mountain setting means weather can change quickly, with descent
    typically by a long walk-off or multiple rappels depending on route
    chosen. This is serious alpine terrain by any standard — no-fall
    consequences on run-out sections, remote from road access, and rescue
    would require organized mountain-rescue response rather than a simple
    lower-off.

