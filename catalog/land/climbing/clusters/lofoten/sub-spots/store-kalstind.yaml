tier_rationale:
  en: |
    The Store Kalstind area, near Reine and Moskenes, offers shorter
    granite multipitch and single-pitch routes on clean, friction-friendly
    rock with generally solid protection — a lower-commitment alternative
    to the big walls further north in the archipelago. Protection is a mix
    of trad placements and occasional fixed anchors at belay stances,
    with retreat and descent more manageable than the longer Presten or
    Vågakallen objectives given the shorter route lengths. The approach
    involves a moderate hike from road access near Reine, and the exposed
    coastal setting means wind and rapidly changing maritime-Arctic weather
    remain the primary hazards even on shorter routes.

