description:
  en: |
    The Lofoten archipelago (Nordland, Norway) offers Arctic granite
    climbing rising directly from fjords and sea, with peaks and walls up
    to 600-1000 m reaching from near sea level. Rock is generally solid,
    clean granite with good friction, split by cracks suited to trad
    protection alongside select bolted sport lines. The defining feature of
    the season is the midnight sun: from roughly late May to late July,
    continuous daylight allows climbing at any hour, extending the
    practical climbing day well beyond temperate-latitude norms. Weather is
    maritime-Arctic and can change rapidly — wind and precipitation off the
    Norwegian Sea are the dominant hazards, and temperatures stay cool even
    in summer. Season runs roughly June-August; snow and short daylight
    close most objectives outside this window.

