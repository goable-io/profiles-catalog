gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 1.5
    reason_code: WET_ROCK
    description: Active precipitation on Lofoten granite makes crack and friction climbing slick and signals rapidly deteriorating maritime-Arctic weather.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m on committing multipitch granite faces above the fjords creates serious route-finding and descent risk.

  - metric: wind_speed_kn
    condition: gt
    value: 32
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 32 knots off the Norwegian Sea creates fall and communication risk on exposed ridgelines and open faces.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature, tendons stiffen and grip deteriorates dramatically; frostbite risk on exposed belay stances.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 12
  carrying_capacity_sensitivity: high
  notes: |
    The Lofoten climbing season is short (roughly June-August) and
    concentrated around the midnight-sun window, producing sharp seasonal
    crowding peaks on classic lines like Presten and Vågakallen. Access is
    via small fishing villages with limited infrastructure; local
    guidebook authors and the Norwegian Trekking Association (DNT)
    encourage minimal-impact camping and respect for reindeer grazing land
    near approach trails.

