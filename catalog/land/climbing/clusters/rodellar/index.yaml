sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 36
  carrying_capacity_sensitivity: high
  notes: |
    Rodellar sits within the Sierra y Cañones de Guara Natural Park,
    which regulates canyon and trail access; local climbing associations
    coordinate bolting maintenance. Griffon vulture and other raptor
    nesting closes select sectors seasonally in spring. Canyon-floor
    approaches are subject to flash-flood risk after heavy rain, and
    park guidance should be checked before approaching low sectors
    following storms.

