description:
  en: |
    Rodellar (Huesca province, Aragon) sits above the Mascún canyon in
    the Sierra de Guara, renowned for steep tufa-streaked limestone
    walls forming some of the most striking overhanging sport climbing
    in Europe. Grades run from moderate lines up through F9b test-pieces,
    concentrated on south- and canyon-facing aspects that stay dry and
    climbable across a long season, roughly September through June, with
    summer too hot at midday. The canyon setting means some approaches
    involve short canyon-floor walks and occasional stream crossings that
    can be affected by seasonal water levels. Bolting is generally modern
    stainless given ongoing local re-equipping efforts, though older
    fixed gear persists on some less-traveled lines. The main physical
    constraints are heat in summer, canyon shade/sun rotation, and
    localized flash-flood risk in the Mascún gorge after heavy rain.

