tier_rationale:
  en: |
    Ventanas del Mascún is Rodellar's flagship sector, an overhanging
    tufa-streaked limestone wall above the Mascún canyon offering routes
    from F8a to F9b among the steepest, most sustained climbing in the
    cluster. Bolting is modern stainless on the well-traveled classics,
    maintained via ongoing local re-equipping, though the sheer scale of
    tufa features and steep terrain demands strong technique and stamina
    to manage. Approach involves a canyon-floor walk from Rodellar
    village that can cross seasonal watercourses; heavy rain upstream
    raises flash-flood risk in the gorge. Falls on the very steep
    terrain are generally clean and air-y; the tier reflects sustained
    grade severity and canyon approach hazard rather than loose rock.

