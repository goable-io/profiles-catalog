tier_rationale:
  en: |
    The Delfín sector offers sustained sport climbing from F6c to F8a on
    tufa-featured Rodellar limestone, well bolted with stainless
    hardware maintained by local re-equipping efforts. The rock and
    canyon setting matches the cluster's flagship sector but with a more
    moderate grade band, less extreme steepness, and shorter sustained
    sections, making it a solid intermediate-to-advanced venue.
    Approach follows the same canyon-floor trail from Rodellar village
    used by neighbouring sectors, sharing the same seasonal watercourse
    crossing and flash-flood considerations after heavy rain. Falls are
    generally clean onto bolts; standard bolted-sport-route residual
    risks apply.

