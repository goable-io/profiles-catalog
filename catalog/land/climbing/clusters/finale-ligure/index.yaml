gates:
  - { metric: precipitation_mm_h, condition: gt, value: 1.5, reason_code: WET_ROCK,          description: Active precipitation on Finale's compact limestone reduces friction and slickens pocketed holds, especially on the multipitch towers. }
  - { metric: visibility_km,      condition: lt, value: 0.5, reason_code: LOW_VISIBILITY,    description: Visibility below 500m impairs route-finding and rappel-line communication on the multipitch sectors above Finalborgo. }
  - { metric: wind_speed_kn,      condition: gt, value: 35,  reason_code: HIGH_WIND_EXPOSED, description: Sustained coastal wind above 35 knots creates rope-drag and communication hazards on the exposed towers and ridgeline sectors. }
  - { metric: apparent_temp_c,    condition: lt, value: -5,  reason_code: EXTREME_COLD,      description: Apparent temperature below -5°C is rare at this coastal elevation but stiffens tendons and degrades grip on cold winter mornings. }

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 42
  carrying_capacity_sensitivity: high
  notes: |
    Finale Ligure crags fall largely within the Parco del Finalese, which
    coordinates trail maintenance and manages seasonal raptor closures
    (peregrine falcon nesting) on several sectors February-June. The area
    sees heavy international crowding in spring and autumn shoulder
    seasons; local climbing associations coordinate re-bolting campaigns
    on the older sport lines with stainless hardware.

