description:
  en: |
    Finale Ligure (Savona province, Liguria) is a year-round Mediterranean
    sport-climbing and multipitch destination on compact grey limestone
    riddled with pockets and tufa formations. Crags spread across the
    hills above Finalborgo and the coast, with aspects ranging from
    sun-exposed south faces to shaded north sectors, letting climbers
    chase good conditions through the seasons. Grades run from beginner
    F3 school routes to sustained F7c+ testpieces, with the bulk of the
    catalog in the F5-F7b sport range plus a handful of long multipitch
    lines on the signature limestone towers. Mediterranean climate keeps
    rock mostly dry outside autumn storm fronts, and the mild coastal
    winters make several sectors climbable year-round when aspect is
    chosen well. The area is managed in part through the Parco del
    Finalese and local climbing associations.

