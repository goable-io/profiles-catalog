tier_rationale:
  en: |
    Bric Pianarella sits south of Le Manie and is one of Finale's
    best-known sport-training crags: single-pitch limestone tufa routes
    from F5 to F7b on fully stainless-bolted lines with chain lower-off
    anchors. The approach is a short, well-marked walk from the Le Manie
    plateau road. Falls are clean onto bolts on the steep, pocketed tufa
    terrain, and the moderate pitch length keeps this at an intermediate
    consequence level compared to the cluster's multipitch objective at
    Rocca dell'Aquila.

