tier_rationale:
  en: |
    Rocca dell'Aquila is Finalborgo's multipitch limestone icon, a
    tufa-streaked tower with 3-6 pitch trad-and-sport routes from F5 to
    F7c. Hardware is a mix of stainless sport bolts on the popular lines
    and sparser natural-gear placements higher up, so parties should carry
    a rack alongside quickdraws. The north-facing aspect keeps the wall
    shaded and cool through summer, which is a draw in hot months but
    means slower rock-drying after rain. Descent is by multi-station
    rappel; route-finding and rappel-anchor identification in poor
    visibility is the main navigational hazard, and the sustained,
    committing nature of the upper pitches puts this firmly in the
    advanced multipitch category for the cluster.

