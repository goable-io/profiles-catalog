tier_rationale:
  en: |
    Rian Cornei is a sport sector on the Rocca di Perti massif with
    sustained single-pitch limestone routes from F6a to F7c, bolted with
    stainless hardware and chain anchors typical of Finale's well-serviced
    crags. The south-facing aspect makes it one of the area's most popular
    winter venues, holding sun through the cooler months while remaining
    steep enough to stay shaded in the early hours of hot summer days.
    Approach is a moderate uphill walk from roadside parking; falls are
    clean onto bolts with no ledge hazard on the steep terrain.

