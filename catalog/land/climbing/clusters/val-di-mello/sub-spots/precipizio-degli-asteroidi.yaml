tier_rationale:
  en: |
    Precipizio degli Asteroidi is the flagship big-wall multipitch of Val
    di Mello: 10-15 pitch trad routes on clean, glacier-polished Val
    Masino granite, with sustained crack and slab climbing in the F6a-F7a
    range. Protection is entirely natural gear (cams and nuts) on most
    lines, with only sparse fixed anchors at belay stances, so parties
    need a full trad rack and multipitch experience. The wall faces
    generally south, giving long summer sun exposure and fast drying
    after rain, but the long, committing nature of the routes and
    exposure to afternoon convective storms typical of the Alps put this
    firmly in the advanced, no-easy-retreat category. Descent is by
    multi-pitch rappel or walk-off depending on the line.

