tier_rationale:
  en: |
    Sasso Remenno is a giant granite erratic block near San Martino, one
    of Europe's largest single boulders, offering a sport-and-bouldering
    hybrid with slabby and arête single-pitch lines from F5 to F7a
    alongside its famous high-ball boulder problems. Sport routes are
    bolted with stainless hardware and chain lower-offs; the compact
    granite face dries quickly after rain. The short, flat approach from
    San Martino di Val Masino makes it one of the most accessible venues
    in the valley, with good cell coverage and clean falls onto bolts on
    the roped lines.

