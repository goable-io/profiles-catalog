tier_rationale:
  en: |
    Placca dell'Oasi is a low-angle friction-slab area on the approach
    into Val di Mello proper, with granite slab routes from F4 to F6a
    protected by natural gear (small cams and nuts) on generally
    low-consequence, low-angle terrain. The flat valley-floor approach
    keeps walk-in short. The gentle slab angle means falls are typically
    slides rather than freefalls, making this a common venue for parties
    building trad and slab-friction skills before committing to the
    valley's harder multipitch objectives.

