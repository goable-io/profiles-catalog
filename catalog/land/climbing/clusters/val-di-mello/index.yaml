description:
  en: |
    Val di Mello (Val Masino, Sondrio province, Lombardy) is one of the
    Alps' premier granite climbing valleys, often called "Italy's little
    Yosemite" for its glacier-polished slabs and clean crack systems.
    Elevations range roughly 900-1400m on the valley floor and
    approach slopes, with south- and west-facing walls that catch long
    summer sun and north-facing slabs that stay cooler. Grades span
    beginner-friendly F4 slabs to sustained F7a+ crack and face pitches,
    with the valley's signature big-wall multipitch routes running
    10-15 pitches. The best season is late spring through early autumn;
    granite dries fast after rain but afternoon convective storms are a
    recurring summer hazard typical of alpine terrain. The valley sits
    within a protected nature reserve (Riserva Naturale Val di Mello)
    with restricted vehicle access.

