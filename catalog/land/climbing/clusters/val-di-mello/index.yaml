gates:
  - { metric: precipitation_mm_h, condition: gt, value: 0.7,  reason_code: WET_ROCK_AND_STORM, description: Active precipitation above 0.7 mm/h on Val Masino granite signals incoming afternoon convective storms typical of the Alps in summer, and wet granite slabs lose friction fast. }
  - { metric: wind_speed_kn,      condition: gt, value: 38,   reason_code: HIGH_WIND_RIDGE,     description: Sustained wind above 38 knots on the exposed upper pitches of the valley's big-wall routes creates fall risk and impairs partner communication. }
  - { metric: visibility_km,      condition: lt, value: 0.4,  reason_code: ALPINE_NAVIGATION,   description: Visibility below 400m makes route-finding on the 10-15 pitch multipitch routes and descent navigation unsafe. }
  - { metric: apparent_temp_c,    condition: lt, value: -12,  reason_code: ALPINE_HYPOTHERMIA,  description: Apparent temperature below -12°C creates frostbite risk on exposed belay stances and impairs rope handling on the long multipitch routes. }

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Val di Mello lies within the Riserva Naturale Val di Mello, which
    bans motor vehicle access beyond the reserve gate and prohibits
    camping outside designated areas, managed by the Comune di Val
    Masino. The valley sees heavy weekend crowding in summer; approach
    trail erosion and boulder-base vegetation trampling are actively
    monitored by the local alpine club (CAI Val Masino).

