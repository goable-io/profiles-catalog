  notes: |
    Weights and curves follow the climbing-alpine regional template
    (cooler temperature optimum, tightened precipitation gate at 0.7
    mm/h for convective-storm risk) with a slightly higher precipitation
    weight (0.24) reflecting the valley's exposure to fast-moving
    afternoon storms off the Bregaglia/Masino granite massif. Season
    window (22 weeks) is shorter than the alpine base default given the
    valley's ~900-1400m elevation band and snow-affected shoulder months.
