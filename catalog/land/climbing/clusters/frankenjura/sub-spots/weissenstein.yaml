tier_rationale:
  en: |
    Weißenstein is a moderate-grade limestone crag offering routes from
    F5c to F7c, well-suited to climbers building technique before tackling
    the region's harder testpieces. Bolting follows DAV (Deutscher
    Alpenverein) federation standards with well-maintained stainless
    hardware and chain lower-offs. The approach is a short forest walk-in
    from roadside parking, and the crag's moderate single-pitch height
    keeps falls clean with straightforward lowering descents. Aspect and
    rock quality are typical of the Frankenjura style — compact, pocketed
    limestone that dries quickly after rain.

