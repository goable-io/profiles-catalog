tier_rationale:
  en: |
    Krottenseer Turm is a limestone tower crag hosting some of the
    Frankenjura's hardest historical and modern testpieces, with routes
    from F7c up to F9a on compact, pocketed rock demanding precise
    pocket-pulling technique. The area sits within the region's classic
    testing ground, historically associated with the training grounds used
    by pioneers such as Wolfgang Güllich in developing the era's hardest
    grades. Bolting follows DAV (Deutscher Alpenverein) standards with
    stainless hardware and chain lower-offs; the walk-in is short through
    forest, and single-pitch height keeps falls clean with straightforward
    lowering, though the hard, technical grades demand strong technique
    given the small holds typical of the style.

