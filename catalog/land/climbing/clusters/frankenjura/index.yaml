description:
  en: |
    The Frankenjura (Franconian Jura, Bavaria) is one of Europe's oldest and
    densest sport-climbing regions, with over 1,000 crags and 10,000+
    routes on compact, pocketed grey limestone in a rolling forested
    plateau landscape. Walls are generally short-to-moderate single-pitch
    (10-30 m), rewarding technical pocket-pulling and powerful movement
    over sheer height, with grades spanning F4 up to some of the world's
    historically hardest testpieces at F9a+. The region has a long
    development history dating to the 1970s-80s, including routes
    established by pioneers such as Wolfgang Güllich, and bolting standards
    are generally excellent under German climbing-federation (DAV) norms.
    Best season is April-October; many crags dry quickly after rain given
    the compact rock and forested but well-drained terrain.

