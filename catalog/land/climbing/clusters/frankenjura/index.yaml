gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 1.5
    reason_code: WET_ROCK
    description: Active precipitation on Frankenjura pocketed limestone makes small crimps and pockets slick, sharply raising fall risk on the region's technical grades.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m on forest approach trails impairs navigation between the region's densely scattered crags.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots creates rope-management hazards on the more exposed plateau-edge sectors.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature, common on winter mornings in the Bavarian plateau, grip and rope handling deteriorate sharply.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 28
  carrying_capacity_sensitivity: high
  notes: |
    The Frankenjura is managed under long-standing agreements between the
    Deutscher Alpenverein (DAV) and local landowners/forestry authorities;
    several crags have seasonal raptor-nesting closures (eagle owl and
    peregrine falcon) enforced March-June. Dense crag concentration
    spreads climber traffic well relative to single-destination areas, but
    flagship sectors still see weekend crowding within day-trip range of
    Nuremberg.

