gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 2
    reason_code: WET_ROCK
    description: Active precipitation on the Chief's granite makes crack systems and friction slabs slick, and Squamish's coastal weather can turn quickly on committing multipitch routes.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m on the Chief's tall multipitch routes creates serious route-finding and rappel/descent-gully navigation risk.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots on the exposed granite face above Howe Sound creates rope-management and communication hazards over long multipitch routes.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature, tendons stiffen and grip deteriorates dramatically; crack-climbing technique on granite becomes markedly harder with cold hands.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 20
  carrying_capacity_sensitivity: high
  notes: |
    The Stawamus Chief draws heavy climbing and hiking traffic through the
    short dry season, concentrating pressure on approach trails and base
    areas. The Squamish Access Society coordinates fixed-anchor replacement
    and seasonal peregrine-falcon nesting closures on several of the
    Chief's faces (typically spring into early summer), which profiles
    should encode as advisory alerts during that window.

