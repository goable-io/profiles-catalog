description:
  en: |
    Squamish (British Columbia, Canada), known locally as the "outdoor
    recreation capital of Canada," is one of North America's premier
    granite trad-climbing destinations, centred on the Stawamus Chief, a
    700 m granite monolith rising directly above Howe Sound between
    Vancouver and Whistler. This cluster covers the Chief's trad and
    multipitch terrain, complementing the corridor's separately catalogued
    bouldering. Rock is solid, clean granite with excellent friction,
    split by crack systems ideal for traditional protection alongside
    select bolted face-climbing sections on the longer routes. The
    climate is coastal-temperate: mild but wet winters largely close the
    granite to climbing, while summer (roughly June-September) brings the
    dry, stable conditions the Chief's big walls demand, with spring and
    fall offering good conditions between rain systems. Squamish Access
    Society coordinates fixed-anchor maintenance and seasonal raptor
    closures on several of the Chief's faces.

