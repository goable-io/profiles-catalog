tier_rationale:
  en: |
    The Grand Wall is Squamish's defining big-wall route, a roughly ten-pitch
    line up the Stawamus Chief's steepest granite (5.11a A0 with the
    original aid moves, or 5.13 for the fully free variant), first climbed
    in 1961 and still the reference objective for West-Canadian granite
    climbing. Protection is a mix of traditional gear in the Chief's
    sustained crack systems and fixed bolts on the committing face
    sections, with the Split Pillar and Sword pitches demanding technical
    crack technique well above entry level. A full ascent requires multi-
    hour commitment, competent multipitch systems, and route-finding
    through featured but sustained terrain, with retreat options limited
    once past the lower pitches. The approach is a steep, well-trodden
    climbers' trail from the base of the Chief.

