tier_rationale:
  en: |
    The Papoose, a smaller granite formation at the north end of the
    Squamish corridor, offers an accessible mix of moderate multipitch trad
    and single-pitch routes in the 5.7-5.11 range on clean, well-featured
    rock. Protection is predominantly traditional gear in solid crack
    systems, with a handful of bolted single-pitch lines suited to climbers
    building multipitch experience before tackling the taller Chief faces.
    Approach is short relative to the main Chief sectors, and route lengths
    are typically two to four pitches, keeping retreat straightforward and
    falls clean on the well-protected cracks.

