tier_rationale:
  en: |
    The Stawamus Chief's north face hosts a set of sustained granite
    multipitch trad lines in the 5.10-5.12 range, including well-known
    routes such as Angel's Crest and Ultimate Everything, on clean
    crack-and-face terrain that stays in shade for much of the day.
    Protection is primarily traditional gear with periodic fixed anchors at
    belay stances, and the routes' length (commonly eight or more pitches)
    demands efficient multipitch systems and route-finding across featured
    but continuously technical granite. Descent is typically via walk-off
    or rappel from established anchors, and the north-facing aspect keeps
    the rock cooler and often damp longer after rain than sun-exposed
    sectors, extending the effective drying time needed before conditions
    are safe.

