gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 2
    reason_code: WET_ROCK
    description: Active precipitation makes Smith Rock's welded tuff slick, particularly on polished high-traffic holds, and raises rockfall risk on looser sectors.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m impairs approach navigation along the Crooked River canyon trails and belayer-climber communication on longer routes.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots, common with high-desert weather systems, creates rope-management hazards on exposed rim and upper-wall sectors.

  - metric: apparent_temp_c
    condition: lt
    value: -8
    reason_code: EXTREME_COLD
    description: Below -8°C apparent temperature, a realistic winter high-desert scenario at Smith Rock, grip and rope handling deteriorate sharply and ice can form on north-facing rock.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 34
  carrying_capacity_sensitivity: high
  notes: |
    Smith Rock State Park is one of the most heavily visited climbing
    destinations in the western United States, with Oregon State Parks and
    local climbing organisations managing trail erosion, base-area
    vegetation loss, and seasonal raptor closures (notably on Monkey Face
    and other tall formations during nesting season). Bolted-hardware
    maintenance is coordinated through local climbing coalitions given the
    park's popularity and traffic-driven wear.

