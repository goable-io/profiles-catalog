description:
  en: |
    Smith Rock State Park (central Oregon, USA) is widely credited as the
    birthplace of American sport climbing: welded volcanic tuff and
    columnar basalt walls rising above a horseshoe bend of the Crooked
    River, first extensively bolted for redpoint-style sport climbing by
    Alan Watts and local climbers beginning in the 1980s. The tuff is
    generally solid but varies in texture from sharp and featured to
    polished on the most popular lines, with routes spanning the full
    difficulty spectrum from beginner-friendly slabs to some of the
    country's hardest sport testpieces. The high-desert climate produces
    hot, dry summers that push climbers to shaded or higher-elevation
    sectors, and cool, more consistently climbable spring and fall
    conditions; winter brings occasional snow and ice that closes most
    objectives. Smith Rock's popularity and proximity to Bend/Redmond make
    it one of the most heavily visited climbing areas in the western
    United States.

