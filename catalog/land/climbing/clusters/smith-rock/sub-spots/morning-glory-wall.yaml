tier_rationale:
  en: |
    Morning Glory Wall, along the Crooked River on Smith Rock's popular
    east-facing sectors, offers a broad spread of moderate sport routes
    from roughly F6a to F7c on welded tuff, making it one of the park's most
    approachable and heavily visited walls. Bolting is well-maintained
    given consistent local climbing-coalition attention, and the routes'
    single-pitch length keeps falls clean and easily managed for climbers
    working through the intermediate grades. The short, flat approach from
    the main river trail and the wall's status as a standard guided-tour
    venue make it a reliable, family-friendly introduction to Smith Rock's
    tuff climbing.

