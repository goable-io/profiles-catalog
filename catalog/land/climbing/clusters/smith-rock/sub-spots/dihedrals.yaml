tier_rationale:
  en: |
    The Dihedrals sector is the historic birthplace of American sport
    climbing, where Alan Watts established "To Bolt or Not to Be" in 1986,
    at the time the hardest sport route in the United States, on steep,
    technical welded tuff. Routes here run from roughly F7c to F9a+ on
    sustained, powerful terrain requiring precise footwork on the tuff's
    variable texture and the confidence to commit to bolt-protected redpoint
    attempts well above the last piece of gear on some sections. Hardware
    is maintained by local climbing-coalition rebolting efforts given
    decades of heavy traffic, but the routes' sustained difficulty and
    technical, sometimes polished holds place this sector firmly in
    advanced-only terrain. Approach is a moderate descent and river crossing
    from the main park rim.

