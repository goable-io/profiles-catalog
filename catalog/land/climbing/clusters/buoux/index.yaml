description:
  en: |
    Buoux, in the Luberon (Vaucluse, Provence), is one of the historic
    birthplaces of modern European sport climbing, drawing pilgrimage
    traffic through the 1980s and 1990s and remaining a benchmark crag
    for steep technical limestone. The cliff sits above the Aiguebrun
    valley on south-facing orange and grey limestone, with grades from
    F6a moderate lines up through F8c overhanging test-pieces known for
    old-school, sometimes sparse bolting by modern standards. Season runs
    roughly March-November given the Mediterranean climate and south
    aspect, with summer afternoons hot enough to push climbing into
    morning hours. The approach is a short walk from valley parking,
    though some sectors sit on ledges with meaningful exposure. Wet
    weather is uncommon but the historic bolting on some classic lines
    means climbers should check hardware condition on less-visited
    routes.

