sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 32
  carrying_capacity_sensitivity: high
  notes: |
    Buoux's status as a historic pilgrimage crag concentrates visitor
    traffic on classic 1980s-90s lines, and the Luberon Regional Natural
    Park (Parc naturel régional du Luberon) manages access and trail
    erosion around the valley approach. Some sectors retain older
    bolting from the sport-climbing era that local associations (CAF,
    FFME) periodically re-equip; climbers should verify hardware
    condition before committing to less-traveled classic routes.

