tier_rationale:
  en: |
    Bout du Monde is the historic showcase sector of Buoux, the crag that
    drew European sport-climbing pilgrimage traffic through the 1980s and
    90s, with routes from F6a to F8a on south-facing orange and grey
    limestone. Bolting reflects the sector's era of first ascents — mostly
    retrofitted or re-equipped over the decades but with some older
    hardware still present on less-traveled lines, so climbers should
    check individual routes rather than assume uniform modern stainless.
    The approach is a short walk from valley parking with some ledge
    exposure at the cliff base. Falls are generally clean on the popular
    re-bolted classics; standard bolted-sport-route hazards apply, with
    added caution warranted on older hardware.

