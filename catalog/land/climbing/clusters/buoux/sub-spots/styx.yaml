tier_rationale:
  en: |
    The Styx sector holds Buoux's steepest, most overhanging limestone,
    with routes from F7c to F8c that became iconic test-pieces during
    the 1980s European sport-climbing boom. The rock is grey and orange
    limestone under a pronounced roof/overhang profile, demanding
    sustained power endurance; bolting is mixed-era, with some routes
    re-equipped and others retaining older hardware from their first
    ascent, so hardware condition should be verified per route. The
    approach is a short walk from valley parking but the sector sits on
    an exposed ledge system at the cliff base. Falls on the steep terrain
    are typically clean and air-y rather than ledge-hazard falls, but the
    grade band and hardware variability place this firmly above the
    cluster's more moderate sectors.

