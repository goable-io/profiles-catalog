tier_rationale:
  en: |
    Baone is a kids-friendly limestone crag with school-grade routes from
    F3 to F5, entirely single-pitch bolt-and-lower with stainless hardware
    and chain anchors placed low enough for easy toproping and instructor
    supervision. The approach is a short, flat walk from parking, and the
    low-angle slab terrain keeps falls low-consequence with no ledges in
    the fall zone. Baone is a popular venue for climbing schools and youth
    training groups from the Arco area, with good cell coverage and quick
    vehicle access for any incident response.

