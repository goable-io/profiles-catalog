tier_rationale:
  en: |
    Nago is a limestone crag north of Nago-Torbole with a south-to-southeast
    aspect, mixing single-pitch sport lines with short trad-protected
    multipitch up to F7a. Bolting is a mix of stainless sport hardware on
    the popular sectors and sparser gear-protected placements on the
    multipitch lines, so parties should carry a small rack for the longer
    routes. The approach is a moderate walk from roadside parking, and
    several sectors have low-angle, family-friendly bases that make Nago
    a common warm-up or beginner-accompaniment venue close to Lake Garda.
    Rescue access is straightforward given the proximity to Nago-Torbole.

