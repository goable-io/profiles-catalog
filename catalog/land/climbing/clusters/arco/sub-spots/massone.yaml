tier_rationale:
  en: |
    Massone is the Arco sport-climbing showcase: south-facing compact
    limestone slab-and-vertical terrain with 200+ single-pitch routes from
    F5 to F8b. Hardware is stainless bolts placed and maintained by the
    SAT Arco climbing committee, with chain or double-mailon lower-off
    anchors on nearly all lines. The approach is a short walk from the
    dedicated parking area with clear trail signage. Full sun exposure
    makes the wall excellent in spring and autumn and uncomfortably hot
    in summer afternoons; falls are clean onto bolts with no ledge-fall
    hazard on the vertical-to-slab terrain. Massone is the primary venue
    for the annual Rockmaster festival, so hardware turnover and route
    density are unusually high for the grade range.

