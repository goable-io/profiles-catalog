gates:
  - { metric: precipitation_mm_h, condition: gt, value: 1.5, reason_code: WET_ROCK,          description: Active precipitation on Arco limestone reduces friction sharply and increases lowering/rope-handling risk on steep sport routes. }
  - { metric: visibility_km,      condition: lt, value: 0.5, reason_code: LOW_VISIBILITY,    description: Visibility below 500m impairs approach navigation and communication on multipitch sectors above Massone and Nago. }
  - { metric: wind_speed_kn,      condition: gt, value: 35,  reason_code: HIGH_WIND_EXPOSED, description: Sustained wind above 35 knots is unusual in the sheltered Sarca valley but creates rope-drag and communication hazards when it occurs. }
  - { metric: apparent_temp_c,    condition: lt, value: -5,  reason_code: EXTREME_COLD,      description: Apparent temperature below -5°C is rare at this elevation but stiffens tendons and degrades grip on cold winter mornings. }

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 36
  carrying_capacity_sensitivity: high
  notes: |
    Arco crags are managed cooperatively with the SAT (Società Alpinisti
    Tridentini) Arco climbing committee, which coordinates re-bolting and
    signage. The lower Sarca valley sees heavy seasonal crowding
    spring/autumn and during the Rockmaster festival; some sectors post
    advisory closures during raptor nesting (peregrine falcon, kestrel)
    on the surrounding crags February-June. Parking and approach-trail
    erosion at Massone are actively managed by the local climbing club.

