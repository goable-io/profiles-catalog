meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "SAT Arco (Società Alpinisti Tridentini) climbing area management documentation"
    - "Vertical-Life Arco route database"
  notes: |
    Weights follow the catalog default sport-climbing template
    (temperature-dominant at 0.30) reflecting Arco's reputation as a
    warm, low-precipitation destination where heat management (aspect
    rotation) is the primary strategic decision, similar in character to
    El Chorro. Season window (36 weeks) is shorter than El Chorro because
    Arco's continental-alpine winters are colder.
