description:
  en: |
    Arco (Trentino, on the northern shore of Lake Garda) is one of Europe's
    premier sport-climbing destinations, with thousands of bolted limestone
    routes spread across sun-warmed crags in the lower Sarca valley. Elevation
    ranges from near lake level up to a few hundred metres on the surrounding
    slopes, with aspects covering south-facing showcase walls, north-facing
    shaded multipitch, and family-friendly low-angle sectors. Grades span
    F3 beginner routes to F8c+ testpieces, with the bulk of the catalog in
    the F5-F7c sport range. Best season runs spring and autumn; south-facing
    crags become uncomfortably hot in July-August while shaded or higher
    sectors remain climbable. Rock is predominantly compact Dolomia and
    grey limestone, mostly dry-fast after rain given the steep, well-drained
    terrain. Arco hosts the annual Rockmaster competition and is managed in
    part by the local SAT (Società Alpinisti Tridentini) climbing committee.

