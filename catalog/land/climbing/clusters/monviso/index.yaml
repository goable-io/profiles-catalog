  notes: |
    Spot overrides vs climbing-alpine: matches regional baseline for a
    3800+ m Cottian Alp peak. Rockfall weight kept slightly lower (0.05
    vs 0.08 base) because Monviso serpentinite is chronically loose
    regardless of freeze-thaw signal — the physical hazard is baseline
    high, not primarily driven by the freeze-thaw metric. 14-week
    typical season (mid-June to mid-September, with N face conditions-
    dependent shoulder windows).
