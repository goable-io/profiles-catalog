description:
  en: |
    Monviso (3841 m) is the highest peak of the Cottian Alps and the
    iconic Piedmontese mountain — the "Re di Pietra" — first climbed on
    30 August 1861 by William Mathews, Frederick William Jacomb, Michel
    Croz, and Jean-Baptiste Croz. The mountain rises isolated between
    the Po and Varaita valleys inside the Parco Naturale del Monviso
    (Riserva della Biosfera UNESCO 2013). Climbing spans the PD- south-
    west normal route from Rifugio Quintino Sella (2650 m), the E face
    Coolidge line (F.W. Coolidge, 1881), and the committing N face
    mixed alpine terrain. Rock is metamorphic serpentinite and quartzite
    — often loose in the couloirs — with snow persistence from mid-
    October to mid-July on shaded faces. Weather changes fast: afternoon
    convective storms on the Po basin side are the recurring fatality
    driver. Route access via Pian del Re (Po source) trailhead.

