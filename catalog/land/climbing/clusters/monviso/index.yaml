gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 0.7
    reason_code: WET_ROCK_AND_STORM
    description: Active precipitation above 0.7 mm/h on Monviso signals afternoon convective storm buildup — lightning + rockfall + wet loose serpentinite cascade closes the routes immediately.

  - metric: wind_speed_kn
    condition: gt
    value: 38
    reason_code: HIGH_WIND_RIDGE
    description: Sustained wind above 38 knots on the exposed Monviso ridges and summit block makes rope handling and communication unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.4
    reason_code: ALPINE_NAVIGATION
    description: Visibility below 400 m on the summit block and upper faces of Monviso makes route-finding and descent navigation unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -15
    reason_code: ALPINE_HYPOTHERMIA
    description: Apparent temperature below -15°C creates immediate frostbite risk on Monviso's exposed belay stances and impairs rope handling.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    Parco Naturale del Monviso + Riserva della Biosfera UNESCO 2013
    manage visitor access via a permit-tracked hut booking system at
    Rifugio Quintino Sella. Peak season (July-August weekends) sees
    100+ climbers per day on the via normale, driving cumulative
    rockfall on the summit couloir and queue-related descent accidents.
    CAI Torino coordinates seasonal route-condition bulletins.

