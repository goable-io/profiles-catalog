tier_rationale:
  en: |
    The E face Coolidge route was first climbed 12 August 1881 by
    William Auguste Coolidge and the Almer guides — a sustained mixed
    alpine line up 800 m of serpentinite face on the SE-E aspect.
    Grade AD/D depending on line variant and conditions; loose rock
    bands and short vertical steps require solid alpine trad protection
    experience. Committing: retreat from the upper face requires
    abseil descents over loose terrain with poor anchor placement
    options. Historical significance as the second-major-line ascent
    of Monviso. Reserved for competent trad alpine parties.

