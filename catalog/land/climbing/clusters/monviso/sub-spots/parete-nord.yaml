tier_rationale:
  en: |
    The N face is Monviso's most committing objective — 800+ m of
    mixed alpine terrain with snow + ice + serpentinite rock steps
    on shaded aspect that retains winter conditions well into July.
    Standard grade D+ to TD depending on line and conditions, with
    trad protection on rock steps and screws on ice. Retreat via
    N-face abseil descent is exposed and time-consuming.
    Committing objective reserved for advanced alpine parties with
    documented mixed-alpine experience; guided ascent by IFMGA guides
    is the standard access mode for non-professional-alpine parties.

