tier_rationale:
  en: |
    The Via Normale on the SW ridge is the historical Monviso ascent
    line, first climbed 30 August 1861 by William Mathews with the
    Croz brothers as guides. Approach from Pian del Re (Po source
    trailhead) via Rifugio Quintino Sella (2650 m) then ~1200 m of
    ascent to the 3841 m summit on grade PD- mixed rock scrambling
    and short exposed sections, with fixed ropes on the summit couloir
    steps in season. Rock is loose serpentinite requiring careful
    party spacing; helmet mandatory. Descent by reverse route with
    abseils on the couloir steps. Peak-season queue-related rockfall
    on the summit block is the dominant hazard.

