tier_rationale:
  en: |
    The Falaise de l'Escalès, on the north rim above the Verdon river, is
    a 250-300m grey limestone big wall and the cluster's flagship
    multi-pitch venue. Routes mix trad protection with fixed bolts on
    classics such as Éperon Sublime and La Demande, spanning F5c to F8a
    across 10-15+ pitch lines. Access is by rappel from the rim down into
    the gorge, meaning most routes require full commitment to the climb
    and exit — there is no simple walk-off retreat partway up. Bolt
    hardware varies by line and era, from older mailon-and-piton anchors
    on classic routes to more recently re-equipped stainless belays;
    parties should carry a trad rack for many lines. Rockfall from loose
    bands and cumulative wear on popular lines is a documented hazard,
    and rescue access is limited to trained mountain rescue teams given
    the canyon depth.

