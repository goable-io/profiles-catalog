    The Falaise de l'Escalès is the Verdon's iconic 250-300m limestone
    big wall on the north rim, home to classic multi-pitch trad and sport
    lines from F5c to F8a. Abseil-in access and committing exits make
    this the cluster's most serious and celebrated venue.

