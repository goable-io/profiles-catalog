tier_rationale:
  en: |
    La Demandée is a sustained limestone pillar sector in the Verdon
    Gorge offering multi-pitch routes from F6a to F7c, vertical near the
    base transitioning to overhanging orange rock higher up in classic
    Verdon style. Hardware is mixed sport bolting on the steeper pitches
    with some trad placements protecting easier ground; anchors are
    typically chain or mailon on established lines. The approach and
    descent involve exposed rim trail and, on several lines, an
    abseil-in start similar to neighbouring Escalès, so route-finding
    and rope management on multipitch descent are the primary hazards.
    Rescue access is limited given the canyon terrain, and afternoon
    convective weather in the Provençal summer can close in quickly on
    parties mid-route.

