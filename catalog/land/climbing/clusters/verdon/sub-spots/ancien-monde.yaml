tier_rationale:
  en: |
    Ancien Monde is a single-pitch sport sector on Verdon limestone, well
    bolted with modern stainless hardware and chain or mailon lower-off
    anchors, offering routes from F6a to F7c. Unlike the abseil-in
    big-wall sectors elsewhere in the cluster, Ancien Monde is
    approached by a short rim-side walk-in with a straightforward return
    to the top, making it the cluster's beginner-friendly introduction to
    Verdon sport climbing. Falls are clean onto bolts with no ledge
    hazards on most lines. The main residual risks are standard bolted-
    sport-route hazards — lowering errors and rope-end incidents — rather
    than the commitment and rockfall exposure of the gorge's flagship
    multipitch walls.

