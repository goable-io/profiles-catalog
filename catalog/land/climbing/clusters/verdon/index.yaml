    Cluster overrides vs global climbing: rockfall weight raised to 0.10
    (freeze-thaw limestone spalling on tall multipitch walls) and
    precipitation gate tightened to 1.5 mm/h reflecting the no-retreat
    abseil-in commitment on flagship routes. Temperature weight kept
    close to base since the gorge spans both rims with broad aspect
    choice across seasons.
