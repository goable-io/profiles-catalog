sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 32
  carrying_capacity_sensitivity: high
  notes: |
    The Verdon is a Natura 2000 site and Parc Naturel Régional; access
    tracks and rim parking are managed to limit erosion. Griffon vulture
    and other raptor nesting closes select sectors seasonally (typically
    February-June), enforced by local climbing associations (CAF, FFME)
    in coordination with the Parc du Verdon. Fixed-gear maintenance is
    coordinated by regional equippers; abseil-in commitment concentrates
    traffic on classic lines during peak season.

