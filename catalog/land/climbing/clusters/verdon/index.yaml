description:
  en: |
    The Verdon Gorge (Alpes-de-Haute-Provence / Var, Provence) is one of
    Europe's defining big-wall limestone destinations, with 250-300m grey
    and orange walls dropping directly into the canyon. Routes run from
    single-pitch sport sectors near the rim to committing multi-pitch trad
    and mixed lines requiring an abseil-in approach and a re-ascent or
    exit traverse — there is often no simple walk-off. Grades span F4 to
    F8a across a huge range of aspects (north and south rims), so shade
    can usually be found in summer and sun in shoulder season. The
    defining physical constraint is commitment: many multi-pitch routes
    have no easy retreat once the abseil is committed, and afternoon
    thunderstorms build quickly over the Provençal plateau in summer.
    Best season is April-June and September-October; July-August is
    climbable on shaded aspects but crowded and hot on the rim approach.

