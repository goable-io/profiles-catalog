gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 1.5
    reason_code: WET_ROCK
    description: Active precipitation on Meteora's conglomerate significantly weakens the sandstone matrix binding the embedded pebbles, sharply raising the risk of holds breaking away.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m on the exposed tower summits and descent gullies creates serious route-finding and rappel-anchor risk.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 35 knots on the freestanding, fully exposed towers creates rope-management and balance hazards on trad multipitch.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature, tendons stiffen and grip deteriorates dramatically; the conglomerate's pebble holds become harder to trust with numb hands.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 24
  carrying_capacity_sensitivity: high
  notes: |
    Meteora is a UNESCO World Heritage Site shared between climbers, monks,
    and mass tourism; access to several towers is restricted or requires
    coordination with the active monasteries, and some historic routes are
    off-limits out of respect for monastic privacy. The friable conglomerate
    is inherently carrying-capacity-sensitive — repeated traffic accelerates
    pebble loss on popular lines — and local guiding organisations encourage
    conservative, low-impact trad practice over bolting.

