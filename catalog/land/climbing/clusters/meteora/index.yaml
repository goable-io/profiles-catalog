meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Hellenic Federation of Mountaineering and Climbing (EOOA) Meteora access guidance"
    - "UNESCO World Heritage Centre — Meteora site documentation"
  notes: |
    Cluster overrides vs global climbing: rockfall weight raised to 0.15
    (from base 0.08) reflecting the conglomerate's pebble-matrix rock type,
    which is materially more sensitive to wet-weather hold failure than
    typical limestone or granite; precipitation gate tightened to 1.5mm/h
    for the same reason. Season set to 24 weeks (spring and autumn,
    avoiding summer heat and winter wet).
