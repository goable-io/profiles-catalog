description:
  en: |
    Meteora (Thessaly, Greece) is a UNESCO World Heritage landscape of
    towering conglomerate rock pillars, world-famous for the Byzantine
    monasteries perched on their summits and, among climbers, for a
    distinctive "pebbly" puddingstone rock unlike anywhere else in European
    trad climbing. The conglomerate is a matrix of rounded river pebbles
    cemented in sandstone, producing routes protected mostly by traditional
    gear (with sparse fixed protection on some lines) that demand careful
    judgement of pebble and matrix integrity — pulling on a loose pebble is
    a real and well-known hazard. German climber Dietmar "Aschenbrenner"
    Schuh pioneered much of the historic route development here from the
    1970s onward, continuing a tradition that traces back to earlier ascents
    by local monks and shepherds reaching the monasteries before roads and
    stairs existed. The best season is spring and autumn; summer heat on the
    sun-exposed towers is intense, and winter brings cold, wet conditions
    unsuited to the friable rock.

