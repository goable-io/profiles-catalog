tier_rationale:
  en: |
    The Holy Ghost Tower and its adjacent conglomerate formations carry some
    of Meteora's earliest documented modern routes, developed by German
    climber Dietmar Schuh through the 1960s-70s, graded roughly V+ to VII+
    on the UIAA scale across sustained multipitch lines. Protection is
    almost entirely traditional gear placed in the pebble-and-matrix rock,
    supplemented by sparse aging pitons on some older pitches, demanding
    careful judgement of which embedded pebbles will hold body weight.
    Descent is typically by rappel from fixed anchors on freestanding
    towers with full exposure on all sides, and the historic, lightly
    documented nature of many lines means route-finding itself is a
    meaningful part of the challenge. Approach involves scrambling through
    forest and scree below the towers.

