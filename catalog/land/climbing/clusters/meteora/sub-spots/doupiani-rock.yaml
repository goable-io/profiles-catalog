tier_rationale:
  en: |
    Doupiani Rock is Meteora's most approachable crag, a shorter conglomerate
    formation close to Kastraki village with a set of bolted sport routes
    from roughly 5c to 6c that serve as the standard introduction to the
    region's distinctive pebble rock. Unlike the historic towers, Doupiani
    carries fixed protection maintained for beginner and intermediate
    traffic, and its modest height keeps falls short and easily managed.
    The walk-in from Kastraki is short and well-trodden, making it the
    default venue for guided groups and climbers acclimatising to
    conglomerate technique before attempting the taller trad towers
    elsewhere in the range.

