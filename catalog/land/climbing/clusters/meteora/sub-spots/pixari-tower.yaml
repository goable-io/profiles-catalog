tier_rationale:
  en: |
    Pixari and its adjacent conglomerate formations offer sustained
    multipitch trad climbing on Meteora's characteristic pebble-and-matrix
    rock, among the historically significant towers documented since the
    early era of Meteora climbing exploration. Protection relies on
    traditional gear placements read directly off the rock's pebble
    structure, with limited fixed hardware, and the freestanding nature of
    the tower means full exposure and rappel descent once committed.
    Route-finding and rock-quality judgement on the sustained pitches keep
    this in advanced territory, consistent with the tower's status as one of
    the range's classic historic objectives. Approach follows forested
    trails from the base of the Meteora rock cluster.

