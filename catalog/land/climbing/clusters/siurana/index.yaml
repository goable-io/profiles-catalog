sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 38
  carrying_capacity_sensitivity: high
  notes: |
    Siurana draws heavy international climber traffic in the October-May
    window, concentrating crowding and cliff-base erosion around the
    village and popular sectors; local climbing associations (FEEC -
    Federació d'Entitats Excursionistes de Catalunya) and the Siurana
    community coordinate bolting maintenance and access. Some sectors
    have raptor nesting closures during spring, and parking in the small
    village is limited during peak weekends.

