description:
  en: |
    Siurana (Tarragona province, Catalonia) sits above the Siurana
    reservoir on a limestone plateau and is one of the world's premier
    sport-climbing destinations, historically home to some of the
    hardest routes ever established (including early ascents by Chris
    Sharma such as La Rambla). The orange and grey limestone offers
    steep, pocketed, and tufa-featured walls across a huge grade range
    from F5 moderate lines to F9a+ testpieces, with varied aspects
    allowing sun or shade rotation through the day. Mediterranean climate
    gives a long season, roughly October through May as the primary
    window, with summer climbable at altitude and in shade but generally
    too hot at midday. Approach is via short walks from village-adjacent
    parking; the main physical constraint is heat in summer and, after
    rain, limestone runoff that can leave routes wet for a day or more.

