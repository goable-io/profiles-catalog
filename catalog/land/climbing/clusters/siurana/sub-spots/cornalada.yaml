tier_rationale:
  en: |
    La Cornalada is a moderate sport sector on Siurana limestone with
    routes from F6a to F7a, well bolted with stainless hardware and
    chain or mailon lower-offs. The rock is typical Siurana orange-grey
    limestone, less steep and technical than the plateau's harder
    sectors, making this one of the more approachable venues in the
    cluster for climbers building toward Siurana's characteristic
    pocketed and tufa-featured style. Approach is a short walk from
    village-adjacent parking. Falls are clean onto bolts; standard
    bolted-sport-route residual risks apply.

