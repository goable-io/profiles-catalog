tier_rationale:
  en: |
    Ca l'Onso is a sustained sport sector on Siurana limestone offering
    routes from F6b to F7c, well bolted with stainless hardware and
    chain lower-offs maintained by the local climbing community. The
    rock is characteristic Siurana orange-grey limestone with pocket and
    edge features, less extreme in steepness than the plateau's hardest
    sectors, giving a more moderate but still sustained sport-climbing
    experience. Approach is a short walk from village-adjacent parking.
    Falls are clean onto bolts on most lines; standard bolted-sport-route
    residual risks apply, without the extreme run-outs or grade severity
    of the cluster's flagship hard sector.

