tier_rationale:
  en: |
    Can Piqui Pugui and its adjacent sectors form Siurana's world-class
    hard-climbing showcase, home to routes such as La Rambla and the
    Golpe de Estado area in the F8a-F9a+ range on steep, pocketed and
    tufa-featured orange limestone. Bolting is modern stainless with
    chain lower-offs, maintained given the sector's international
    profile, but the routes are steep and powerful with technical
    sequences between bolts by design. Approach is a short walk from
    village-adjacent parking, with the cliff sitting above significant
    exposure over the Siurana reservoir valley. Falls are generally
    clean and air-y on the overhanging terrain; the tier reflects grade
    severity and the sustained power-endurance demands rather than
    hardware or approach hazards.

