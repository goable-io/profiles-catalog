tier_rationale:
  en: |
    Klanci comprises single-pitch sport sectors near the base of Velika
    Paklenica canyon, offering compact grey limestone routes from F5 to
    F7b on stainless-steel bolted hardware with chain lower-offs. The short
    approach along the canyon path makes this an accessible warm-up or
    lower-commitment alternative to the big walls above, with clean,
    retrievable falls and straightforward lowering descents. Canyon shade
    keeps conditions comfortable into the warmer months, though post-rain
    drying can be slower than open crags given the gorge's limited sun
    exposure at midday.

