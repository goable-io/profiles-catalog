tier_rationale:
  en: |
    Anica Kuk is a 400 m compact grey limestone big wall rising from the
    floor of Velika Paklenica canyon, hosting classic multipitch routes in
    the F5c-F7c range that mix bolted sport pitches with sections requiring
    trad protection (cams and nuts) on older or less-equipped lines. The
    wall is broadly north-facing within the canyon, giving welcome shade in
    summer but also meaning slower drying after rain. Descent is typically
    by rappel or a long walk-off, and retreat mid-route is non-trivial —
    this is committing terrain requiring solid multipitch systems, rope
    management, and route-finding, with rescue access limited to park
    ranger and mountain rescue teams reachable by radio or phone from the
    canyon floor.

