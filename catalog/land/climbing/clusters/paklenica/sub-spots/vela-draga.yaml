tier_rationale:
  en: |
    Vela Draga is a limestone spire crag in Istria, geographically distinct
    from the Velika Paklenica canyon but grouped into this cluster as part
    of the shared Croatian climbing culture and guidebook coverage. Routes
    run F6a-F7c on distinctive freestanding limestone towers and pinnacles,
    single-pitch and bolted with stainless steel hardware and chain
    lower-offs. The site is sun-exposed with limited shade at midday, so
    aspect and time-of-day matter more here than in the shaded main
    Paklenica gorge. Approach is a short walk from roadside parking; falls
    are clean on the featured, well-travelled spire faces.

