description:
  en: |
    Paklenica National Park, on the southern flank of the Velebit range in
    Croatia, is the Balkans' premier multipitch limestone destination.
    Velika Paklenica canyon holds compact grey limestone walls up to 400 m
    tall, with the Anica Kuk big wall as its centerpiece — a mix of bolted
    sport pitches and mixed trad protection across F5-F8 grades. Canyon
    orientation gives predominantly north-facing shade in the main gorge,
    keeping summer climbing viable, while satellite crags elsewhere on the
    Croatian coast (e.g. Vela Draga in Istria) add sun-exposed limestone
    spire climbing to the regional picture. Best season is April-June and
    September-November; the Bura wind can gust violently through the canyon
    and is the dominant local hazard alongside afternoon convective storms
    in summer.

