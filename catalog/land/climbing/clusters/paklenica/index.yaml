gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 1.5
    reason_code: WET_ROCK
    description: Active precipitation on Paklenica limestone makes both bolted sport pitches and trad cracks slippery and raises rockfall risk on the big-wall terrain.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: LOW_VISIBILITY
    description: Visibility below 500m on Anica Kuk's 400m multipitch face creates serious route-finding and descent-navigation risk.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND_EXPOSED
    description: The Bura wind can gust violently through Velika Paklenica canyon; above 35 knots, rope handling and communication on exposed multipitch become unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -5
    reason_code: EXTREME_COLD
    description: Below -5°C apparent temperature, common on winter mornings in the canyon shade, grip and rope handling deteriorate sharply.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 28
  carrying_capacity_sensitivity: high
  notes: |
    Paklenica National Park charges a park entry fee and regulates access
    to protect the canyon's karst ecosystem and resident griffon vulture
    population; nesting-season closures on select walls are enforced by
    park rangers, typically in spring. Anica Kuk sees concentrated queuing
    on classic lines during peak weekends in the shoulder seasons.

