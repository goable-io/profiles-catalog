gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 0.5
    reason_code: WET_ROCK_RISK
    description: Active precipitation makes rock holds slippery and weakens certain rock types (sandstone, conglomerate) — both unsafe and damaging to the resource.

  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: SPOTTER_HAZARD
    description: Sustained wind above 45 knots makes spotting falls and predicting fall direction unsafe, particularly on highballs.

  - metric: apparent_temp_c
    condition: gt
    value: 38
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 38°C makes finger grip on holds unsustainable and creates heat exposure for ground belayers.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 26
  carrying_capacity_sensitivity: high
  notes: |
    Albarracín's sandstone sectors are managed informally by local
    climbing associations coordinated with the Federación Aragonesa de
    Montañismo; brushing chalk buildup and protecting pine-forest
    understory around popular sectors like Arrastradero is an ongoing
    local concern. The porous sandstone is vulnerable to erosion from
    both foot traffic and pad-drag, so path-marking is used to
    concentrate approach impact.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Federación Aragonesa de Montañismo (FAM) Albarracín sector documentation"
    - "Vertical Life Albarracín sector database"
    - "Rockfax bouldering guidance for Spanish sandstone areas"
  notes: |
    Cluster inherits base scoring unchanged. Albarracín's red sandstone
    behaves similarly to Fontainebleau's grès: the 0.5 mm/h precipitation
    gate and humidity_proxy weighting are kept at base values because
    porous sandstone friction and hold integrity degrade quickly in
    damp conditions.
