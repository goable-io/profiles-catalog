description:
  en: |
    Albarracín (Teruel, Aragón, Spain) is a red-sandstone bouldering
    area set among pine forest at roughly 1100-1200 m elevation, prized
    for its rounded pockets, sculpted friction, and photogenic rock
    color. The continental interior climate gives hot, dry summers and
    cold winters, so spring and autumn are the prime seasons; the porous
    sandstone loses friction sharply in humid or wet conditions, similar
    to Fontainebleau. The area spans several dozen sectors from
    kids-friendly warm-up zones to committing overhanging testpieces.

