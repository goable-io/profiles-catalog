tier_rationale:
  en: |
    Masia is Albarracín's kids-friendly warm-up zone, with low, easy
    sandstone problems from V0 to V4 on flat, sandy-soiled ground. The
    low boulder heights and gentle landings make it suitable for
    beginners and families with minimal spotting, and its position close
    to the village access road gives it the shortest approach of any
    Albarracín sector. Popular as a first-session or rest-day venue.

