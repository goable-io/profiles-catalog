tier_rationale:
  en: |
    Techos is Albarracín's dedicated roof-and-overhang sector, with red
    sandstone testpieces from V6 to V9 and harder that demand powerful,
    committing moves above uneven, rocky landings. The steep overhanging
    lines are highball-adjacent in consequence even where not tall,
    since awkward roof-exit falls are hard to spot cleanly, mandating a
    full pad stack and an experienced multi-person spotting team.
    Approach requires leaving the main marked trails, adding to the
    sector's remote, expert-only character.

