tier_rationale:
  en: |
    Arrastradero is the reference sector of Albarracín bouldering, with
    red sandstone problems from V3 to V8 defined by rounded pockets and
    technical friction slabs set in open pine forest. Boulder heights
    are moderate and mostly non-highball, calling for standard 3-6 pad
    coverage and an attentive spotter on the taller lines. The sector's
    fame and central parking access make it the busiest single area in
    Albarracín, with well-established trails between problems.

