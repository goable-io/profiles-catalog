tier_rationale:
  en: |
    The Plateau sector sits atop the Cederberg escarpment, offering a
    V4-V8 mix of technical sandstone problems on generally moderate-
    height boulders with sandy landings suited to a standard 3-5 pad
    setup and single spotter. The approach involves a longer walk-in
    across open plateau terrain, exposed to wind and sun, with dramatic
    views over the Cederberg range. Problems are less concentrated than
    at De Pakhuys, spreading climbers out and reducing crowding at
    individual boulders.

display_name:
  en: Bouldering — Rocklands Plateau Boulders

description:
  en: |
    Plateau sector — V4-V8 sandstone problems spread across the
    Cederberg escarpment top, with dramatic mountain views and a
    longer, more exposed approach walk than the valley sectors.

