tier_rationale:
  en: |
    Fields of Joy is a sustained-difficulty sandstone sector offering
    problems in the V5-V9 range on generally flatter, sandier landings
    than De Pakhuys, making it a standard intermediate zone for
    2-4 pad setups with a single spotter. The sector sees noticeably
    lighter crowds than the flagship boulders, keeping approach paths
    and landing zones less compacted. Problems favour crimpy technical
    footwork on the weathered sandstone rather than committing highball
    exposure.

