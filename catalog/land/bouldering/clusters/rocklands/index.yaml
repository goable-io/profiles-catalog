gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 0.5
    reason_code: WET_ROCK_RISK
    description: Active precipitation makes rock holds slippery and weakens certain rock types (sandstone, conglomerate) — both unsafe and damaging to the resource.

  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: SPOTTER_HAZARD
    description: Sustained wind above 45 knots makes spotting falls and predicting fall direction unsafe, particularly on highballs.

  - metric: apparent_temp_c
    condition: gt
    value: 38
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 38°C makes finger grip on holds unsustainable and creates heat exposure for ground belayers.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Rocklands is entirely accessed through private farmland; the De
    Pakhuys and Traveller's Rest farms charge a daily permit fee that
    funds sector maintenance and erosion control. Carrying capacity
    sensitivity is high: soft sandstone is vulnerable to chalk buildup
    and rubber-shoe polish on popular problems, and landing zones near
    fynbos vegetation are subject to trampling. Southern Hemisphere
    winter season (roughly May-September) concentrates visitation into a
    narrow window.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
