    - "Vertical Life Rocklands sector guide"
  notes: |
    Cluster inherits base bouldering scoring unchanged. Southern
    Hemisphere winter season timing (opposite of European bouldering
    destinations) is the key strategic deviation, noted in
    sustainability.typical_season_weeks rather than in the dimension
    curves themselves.
