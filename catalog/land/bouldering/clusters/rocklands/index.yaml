description:
  en: |
    Rocklands (Western Cape, South Africa) is one of the world's premier
    bouldering destinations, set on the Cederberg escarpment near the
    farming town of Clanwilliam. Orange-hued Cape sandstone
    weathers into featured, incut, and slopey boulders across a series of
    farm-access sectors, with problems from easy warm-ups to world-class
    V15+ testpieces. The season runs the Southern Hemisphere winter
    (May-September): cool, dry, offshore-wind days give the best friction
    on the sandstone, while summer heat and humidity render most problems
    unclimbable. Access is largely through private farms (De Pakhuys, the
    Traveller's Rest) that charge a permit fee supporting conservation and
    trail upkeep.

