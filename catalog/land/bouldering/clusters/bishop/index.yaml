  en: Bouldering — Bishop
  it: Boulder — Bishop
  es: Bulder — Bishop
  fr: Bloc — Bishop
  de: Bouldern — Bishop
description:
  en: |
    Bishop (Owens Valley, Eastern Sierra, California) is one of North
    America's premier bouldering destinations, split between two distinct
    rock types: granite boulders scattered across the Buttermilk Country
    at the base of the Sierra, and volcanic ignimbrite (welded tuff)
    pockets in the Volcanic Tableland canyons north of town. Winter (Nov-
    Mar) is the primary season — cold, dry desert air at 1,200-2,300m
    elevation gives excellent friction, while summer heat makes most
    problems unclimbable except at dawn. The Buttermilks in particular
    are known for committing highball lines requiring large pad stacks;
    the Tableland canyons offer more moderate, accessible pocket-pulling.

