gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 0.5
    reason_code: WET_ROCK_RISK
    description: Active precipitation makes rock holds slippery and weakens certain rock types (sandstone, conglomerate) — both unsafe and damaging to the resource.

  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: SPOTTER_HAZARD
    description: Sustained wind above 45 knots makes spotting falls and predicting fall direction unsafe, particularly on highballs.

  - metric: apparent_temp_c
    condition: gt
    value: 38
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 38°C makes finger grip on holds unsustainable and creates heat exposure for ground belayers.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 24
  carrying_capacity_sensitivity: high
  notes: |
    Bishop bouldering is managed jointly by the Bureau of Land Management
    and the City of Bishop; the Buttermilks and Volcanic Tableland see
    heavy winter-season crowding from climbers escaping colder or wetter
    regions. Carrying capacity sensitivity is high: dispersed camping
    areas and boulder-base vegetation show trampling, and local
    organizations (Bishop Area Climbers Coalition) coordinate trail and
    parking maintenance.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Rockfax Bishop Area Bouldering guidebook"
    - "Bishop Area Climbers Coalition access information"
  notes: |
    Cluster inherits base bouldering scoring unchanged. Winter-season
    (Nov-Mar) desert climate is the defining strategic factor, distinct
    from the summer-season European alpine bouldering clusters in this
    catalog.
