tier_rationale:
  en: |
    The Sad Boulders sit in a deeper, narrower canyon of the Volcanic
    Tableland just north of the Happy Boulders, with sustained V3-V10
    ignimbrite pocket and edge problems on generally flat sandy floor
    landings. The steeper canyon walls create more shade and a cooler
    microclimate than the Happy Boulders, extending the climbable window
    on warm days, though the narrower approach trail and canyon
    topography make pad-hauling slightly more awkward. A standard
    2-4 pad, single-spotter setup covers the majority of lines here.

