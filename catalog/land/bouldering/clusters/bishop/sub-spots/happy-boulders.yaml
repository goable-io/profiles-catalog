tier_rationale:
  en: |
    The Happy Boulders sector sits in a shallow canyon cut into the
    Volcanic Tableland, where welded-tuff (ignimbrite) rock forms
    pocket-pulling problems in the V2-V8 range on generally flat, sandy
    canyon-floor landings. The setting is standard intermediate Bishop
    bouldering: 2-4 pad setups with a single spotter suffice for the
    great majority of lines, and the canyon walls offer wind shelter.
    Approach is a short, well-marked trail from the trailhead parking
    area, keeping the sector accessible and popular with visiting
    climbers.

display_name:
  en: Bouldering — Bishop Happy Boulders

description:
  en: |
    Happy Boulders sector — Volcanic Tableland ignimbrite pocket-pulling
    at V2-V8, in a wind-sheltered canyon with sandy, flat landings.
    Standard intermediate Bishop bouldering.

