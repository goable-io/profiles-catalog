tier_rationale:
  en: |
    The Buttermilks is a Sierra granite highball zone scattered across
    open sagebrush terrain at the base of the range, featuring hueco- and
    pocket-studded boulders with world-class hard testpieces such as
    Evilution and Ambrosia, both graded V11 and both climbed well above
    typical bouldering fall heights. Landings are uneven, rocky, and
    sloped in places, demanding a full-pad-army setup (six or more pads)
    and a coordinated multi-person spotter team on the taller lines.
    Cell coverage is patchy and the nearest help is a drive from the
    trailhead, adding real consequence to any fall gone wrong.

