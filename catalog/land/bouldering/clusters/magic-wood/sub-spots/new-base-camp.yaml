tier_rationale:
  en: |
    New Base Camp is Magic Wood's main sector and social hub, with
    granite-gneiss forest boulders spanning V4 to V9. Boulder heights
    and landings vary problem to problem, requiring standard 3-6 pad
    coverage and attentive spotting on the taller lines, but nothing
    here demands the highball-specific pad stacking of the valley's
    hardest sectors. Its central position near the main parking and
    camping area makes it the busiest and most sociable part of the
    forest.

