tier_rationale:
  en: |
    This sector holds Magic Wood's beginner-friendly warm-up problems,
    graded V0 to V5 on low, forgiving gneiss boulders with flat forest-
    floor landings. Consequences of falls are minimal given the low
    boulder heights, making it suitable for newer boulderers and family
    groups with a single pad. Its gentle grading contrasts sharply with
    the valley's reputation for hard testpieces, offering an easy
    warm-up or rest-day circuit.

