tier_rationale:
  en: |
    The Riverbed sector is Magic Wood's hardest and most committing
    area, home to Dreamtime — first ascended by Fred Nicole in 2000 and
    historically credited as the first-ever confirmed V11 boulder
    problem — alongside a cluster of other V6-V11 testpieces on
    compact gneiss above the river gravel. Landings are uneven cobble
    and boulder rubble, and several lines sit high enough above the
    riverbed to require a full multi-pad stack and an experienced
    spotting team. Access along the riverbank can be affected by high
    water after rain.

