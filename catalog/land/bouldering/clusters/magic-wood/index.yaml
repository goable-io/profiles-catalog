  notes: |
    Cluster inherits base scoring unchanged. Alpine elevation (~1500 m)
    shortens the viable season relative to lowland European bouldering
    forests; the base temperature and precipitation curves are kept as-is
    since Magic Wood's climbing window (roughly May-October) already
    tracks the shape of the base dimension.
