description:
  en: |
    Magic Wood (Averstal, Graubünden, Switzerland) is one of the world's
    premier hard-bouldering forests, with granite-gneiss boulders
    scattered through a fairy-tale spruce forest at roughly 1500 m
    elevation. The valley is famous for producing some of history's
    hardest confirmed boulder problems (Dreamtime, first-ascended here
    by Fred Nicole in 2000) alongside gentler forest circuits suitable
    for beginners. Alpine weather is variable even in summer: afternoon
    thunderstorms and rapid temperature swings are common, and the
    gneiss holds friction well when dry but becomes treacherously
    slick when damp.

