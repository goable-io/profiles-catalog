tier_rationale:
  en: |
    Bas Cuvier is the historic birthplace of Fontainebleau bouldering and
    remains its most beginner-friendly circuit, with problems from V0 to
    V6 on fine orange sandstone. Landings are flat compacted sand at the
    base of low, non-highball boulders, so a single pad and a casual
    spotter are sufficient for the yellow and orange circuits. The sector
    is a five-minute walk from the parking area, extremely popular, and
    well-trodden, making it the standard first destination for visiting
    climbers.

display_name:
  en: Bouldering — Fontainebleau Bas Cuvier

description:
  en: |
    Historic Fontainebleau sector considered the birthplace of modern
    bouldering. Sandstone problems from V0 to V6 on flat sand landings,
    with the classic yellow, orange, and blue circuits.

