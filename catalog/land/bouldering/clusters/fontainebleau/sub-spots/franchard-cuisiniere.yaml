tier_rationale:
  en: |
    Franchard Cuisinière is a sustained, high-density sandstone sector
    with problems concentrated in the V4-V7c range, prized as one of the
    best winter crags in the forest because its open, sunny position
    dries quickly after rain. Boulder heights are moderate with the
    typical Fontainebleau slopers and pockets, requiring 2-3 pads and a
    spotter for the taller, more technical lines. Its popularity and
    dense problem count mean landings are well-packed sand but can get
    crowded on clear winter weekends.

display_name:
  en: Bouldering — Fontainebleau Franchard Cuisinière

description:
  en: |
    Sun-exposed Franchard Cuisinière sector, a favourite winter venue
    with a dense concentration of sustained V4-V7c sandstone problems
    and classic Fontainebleau friction.

