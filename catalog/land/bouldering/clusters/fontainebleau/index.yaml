gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 0.5
    reason_code: WET_ROCK_RISK
    description: Active precipitation makes rock holds slippery and weakens certain rock types (sandstone, conglomerate) — both unsafe and damaging to the resource.

  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: SPOTTER_HAZARD
    description: Sustained wind above 45 knots makes spotting falls and predicting fall direction unsafe, particularly on highballs.

  - metric: apparent_temp_c
    condition: gt
    value: 38
    reason_code: EXTREME_HEAT
    description: Apparent temperature above 38°C makes finger grip on holds unsustainable and creates heat exposure for ground belayers.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 32
  carrying_capacity_sensitivity: high
  notes: |
    Fontainebleau is the most heavily visited bouldering forest in the
    world, managed by ONF (Office National des Forêts) together with the
    Fédération Française de la Montagne et de l'Escalade (FFME). Chalk
    wash, brush-cleaning of holds, and soil compaction at popular
    boulders (Bas Cuvier, Cul de Chien) are actively monitored; some
    sectors carry seasonal or permanent access restrictions to protect
    rare flora and nesting birds.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Fédération Française de la Montagne et de l'Escalade (FFME) Fontainebleau bouldering access guidance"
    - "Office National des Forêts (ONF) Fontainebleau massif management notes"
    - "Vertical Life Fontainebleau sector database"
  notes: |
    Cluster inherits base scoring unchanged. Precipitation gate is
    materially important here: Fontainebleau's fine sandstone ("grès")
    is softer and more moisture-sensitive than granite or gneiss, so the
    0.5 mm/h wet-rock gate is treated strictly by local etiquette
    (climbing on damp sandstone is considered unacceptable, not just
    inadvisable).
