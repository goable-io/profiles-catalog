description:
  en: |
    Fontainebleau (Seine-et-Marne, France) is the global birthplace and
    reference of bouldering, with orange sandstone boulders scattered
    across the forest floor for tens of kilometres. Thousands of problems
    from V0 to V17 sit on fine-grained "grès" sandstone whose friction is
    exceptionally sensitive to moisture: the rock is soft and porous, so
    climbing on damp sandstone both risks holds breaking off and is
    prohibited by local etiquette. Cool, dry autumn and winter conditions
    give the best friction ("Fonte" conditions), while summer humidity
    and heat make the rock greasy. Landings are mostly flat sand, but
    stray roots and rock rubble under pads still require careful spotting.

