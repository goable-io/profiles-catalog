tier_rationale:
  en: |
    North Mountain is the iconic Hueco Tanks sector, hosting the park's
    hardest syenite hueco problems including testpieces such as Fry Boy
    and Slashface, both graded V13, on steep, pocketed rock with
    committing, sometimes highball, topouts. Access is restricted to
    reserved permits with a mandatory guided tour under the Texas Parks
    and Wildlife management regime instituted in 1998 to protect the
    site's Native American pictographs, meaning independent pad-hauling
    and route-finding are constrained by the tour schedule and guide
    routing. Landings are frequently uneven rock and boulder-strewn
    desert floor, requiring multi-pad setups and attentive spotting.

display_name:
