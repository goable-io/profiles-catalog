tier_rationale:
  en: |
    East Mountain offers a V2-V10 range of syenite hueco problems on
    generally more moderate terrain than North Mountain, with a similar
    permit-and-guided-tour access requirement under Texas Parks and
    Wildlife management. The sector sees noticeably lower crowding than
    North Mountain, making it a common choice for tour groups seeking
    more moderate grades. Landings are mixed rock and sand requiring a
    standard 2-4 pad setup with a single spotter for the majority of
    problems.

display_name:
