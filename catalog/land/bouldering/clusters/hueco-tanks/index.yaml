description:
  en: |
    Hueco Tanks (near El Paso, Texas) is a historic North American
    bouldering destination named for the water-holding pockets (huecos)
    weathered into its syenite rock. The rock forms steep, pocketed
    problems from moderate grades to some of the hardest bouldering in
    the world. Winter (Oct-Mar) is the primary season: cool, dry desert
    air maximizes friction, while summer heat makes the dark syenite
    unbearably hot to touch by midday. Since 1998, Texas Parks and
    Wildlife has managed access through a reservation and guided-tour
    system to protect the park's Native American pictographs and fragile
    desert ecology, which caps daily visitor numbers and restricts
    unguided access to designated zones.

