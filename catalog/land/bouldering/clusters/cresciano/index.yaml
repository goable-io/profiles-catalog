description:
  en: |
    Cresciano (Ticino, Switzerland) is a granite boulder valley in the
    lower Leventina, world-renowned for its steep, rain-shelter
    overhangs and some of the sport's most-repeated hard testpieces. The
    valley sits at low alpine elevation (roughly 400-500 m), which gives
    it one of the longer seasons among Ticino bouldering areas, usable
    from spring through late autumn and even into mild winter spells
    thanks to overhanging boulders that stay dry in light rain. Compact
    granite friction is excellent when dry but the steep landings
    beneath the overhangs demand careful pad placement regardless of
    conditions.

