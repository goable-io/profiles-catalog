  notes: |
    Cluster inherits base scoring unchanged. Cresciano's low elevation
    and abundance of rain-sheltering overhangs give it a longer usable
    season than higher alpine bouldering areas, but the base dimension
    curves and gates are kept unchanged since the underlying friction
    physics of dry granite are the same.
