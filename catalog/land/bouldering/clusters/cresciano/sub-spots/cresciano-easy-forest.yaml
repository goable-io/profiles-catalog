tier_rationale:
  en: |
    This sector holds Cresciano's beginner-friendly forest problems, graded
    V0 to V5 on low granite boulders with flat, forgiving forest- floor
    landings. Low boulder heights keep fall consequence minimal, a single
    pad is generally sufficient. And the sector's proximity to the main
    parking makes it a convenient warm-up before venturing to the valley's
    harder overhang testpieces.

