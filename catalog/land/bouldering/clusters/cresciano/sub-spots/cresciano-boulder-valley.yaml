tier_rationale:
  en: |
    The Cresciano boulder valley is one of the world's most celebrated
    hard-bouldering venues. Home to Dreamtime — relocated here and one of
    the most-repeated V15 boulder problems in the sport — alongside a
    cluster of other V8-V15 testpieces on steep, compact granite. Landings
    beneath the rain-shelter overhangs are often uneven and sloped, and the
    steepness of the lines means falls can carry horizontal swing,
    requiring a full multi-pad stack and an experienced spotting team even
    on shorter boulders.

