description:
  en: |
    Val di Mello (Val Masino, Lombardy, Italy) is a granite-walled alpine
    valley nicknamed the "Italian Yosemite," home to some of Europe's
    largest and most celebrated glacial-erratic boulders alongside a
    dense scatter of valley-floor problems on rough, high-friction Val
    Masino granite. The valley sits at roughly 1000-1300 m and is a
    summer-to-autumn destination: snowmelt and afternoon thunderstorms
    dominate June-July, while September brings the driest, coolest
    granite friction. Granite holds well when damp compared to
    sandstone, but wet rock is still a hard safety gate here given the
    boulder heights involved.

