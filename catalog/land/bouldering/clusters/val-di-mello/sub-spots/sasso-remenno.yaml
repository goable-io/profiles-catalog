tier_rationale:
  en: |
    Sasso Remenno is one of the largest single glacial-erratic boulders
    in Europe, offering granite problems from V3 up to V10 across its
    faces and roofs. Its size means several lines are tall enough to
    need a multi-pad, multi-spotter setup even though the overall grade
    range is standard intermediate-to-advanced bouldering, not
    exclusively highball. The rough Val Masino granite gives excellent
    friction when dry, and the meadow-flat approach makes it one of the
    valley's most accessible landmark boulders.

display_name:
  en: Bouldering — Val di Mello Sasso Remenno

description:
  en: |
    Giant glacial-erratic granite boulder, among the largest freestanding
    boulders in Europe, with problems from V3 to V10 on rough,
    high-friction Val Masino granite.

