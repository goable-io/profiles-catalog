tier_rationale:
  en: |
    This sub-spot covers the distributed scatter of granite boulders
    across the Val di Mello valley floor, with problems from V2 to V8 on
    rough Val Masino granite. The wide 800 m radius reflects that
    problems are spread along the meadow and riverside rather than
    concentrated at a single crag, requiring a short walk between
    boulders but generally flat, grassy landings. Note this sub-spot
    shares its physical footprint with a rope-climbing sub-spot in the
    catalog's climbing category — the two are distinct sport-mode
    entries at the same location.

display_name:
  en: Bouldering — Val di Mello Valley Boulders

description:
  en: |
    Distributed field of granite boulders scattered along the Val di
    Mello valley floor, offering V2-V8 problems on Val Masino granite in
    a scenic meadow setting.

