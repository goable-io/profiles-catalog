description:
  en: |
    Chironico (Ticino, Switzerland) is a granite-and-gneiss boulder
    valley above the Leventina, internationally regarded as one of the
    world's hardest-bouldering destinations alongside a scattering of
    easier forest problems. The valley sits at roughly 900-1000 m with a
    long alpine-Ticino season stretching from spring into autumn,
    interrupted by summer thunderstorms typical of the southern Alps.
    Compact granite and gneiss hold friction well when dry but become
    unusably slick when wet, and several of the valley's hardest
    testpieces are highball, magnifying the safety impact of the
    precipitation gate.

