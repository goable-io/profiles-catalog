  notes: |
    Cluster inherits base scoring unchanged. Chironico's hardest
    testpieces are highball, so the base 45-knot wind gate and 0.5 mm/h
    precipitation gate are retained without loosening despite the
    granite/gneiss rock type generally tolerating dampness better than
    sandstone.
