tier_rationale:
  en: |
    The Chironico classic boulder field is one of the world's benchmark
    hard-bouldering venues, home to testpieces such as Radja (V14) and
    Never Ending Story (V13) on compact, technical granite and gneiss.
    Grades here run V7 to V13+ and several of the valley's iconic lines
    are highball with uneven boulder-strewn landings, mandating a full
    multi-pad stack and an experienced, coordinated spotting team. The
    combination of hard technical movement and real fall consequence
    places this sector firmly in expert-only territory.

