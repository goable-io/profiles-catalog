tier_rationale:
  en: |
    This forest sector offers Chironico's beginner-friendly warm-up
    problems, graded V0 to V5 on low granite and gneiss boulders with
    flat forest-floor landings. Fall consequences are low given the
    modest boulder heights, making the sector suitable for newer
    climbers and casual sessions with a single pad. In clear contrast
    to the valley's world-class hard testpieces nearby, the atmosphere
    is relaxed and family-friendly.

