  notes: |
    Cluster inherits base bouldering scoring unchanged. Coastal Pacific
    Northwest rainforest climate (frequent rain, humid granite) is the
    defining strategic factor, distinct from the arid North American
    desert bouldering clusters (Bishop, Hueco Tanks) in this catalog.
