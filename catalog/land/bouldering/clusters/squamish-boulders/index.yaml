description:
  en: |
    Squamish (British Columbia, Canada) is a coastal-forest bouldering
    destination built around the granite base of the Stawamus Chief, with
    problems scattered through dense temperate rainforest from the Grand
    Wall Boulders up through the harder Section 16 zone. The compact,
    high-friction granite and cool, humid Pacific Northwest climate
    reward dry, mild-temperature windows; the primary season runs spring
    through fall, with a brief winter lull from wet weather. Squamish
    hosts internationally significant hard problems, including
    Dreamcatcher, widely cited as among the world's first confirmed V16
    boulder problems, first climbed here by Chris Sharma in 2005.

