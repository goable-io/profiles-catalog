tier_rationale:
  en: |
    The Grand Wall Boulders area sits in forest at the base of the
    Stawamus Chief, offering compact granite problems in the V3-V10
    range on a mix of flat sandy and root-strewn forest-floor landings.
    This is the iconic entry zone for Squamish bouldering, with a short
    approach from the main parking area and moderate spotting needs
    covered by a standard 3-5 pad setup. Shade from the forest canopy
    keeps the granite climbable later into warm afternoons than exposed
    sectors elsewhere in the region.

display_name:
  en: Bouldering — Squamish Grand Wall Boulders

description:
  en: |
    Grand Wall Boulders — Stawamus Chief granite base problems in
    forest, V3-V10, the iconic and most accessible Squamish bouldering
    zone.

