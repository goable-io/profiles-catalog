tier_rationale:
  en: |
    Section 16 is Squamish's hard testpiece and highball sector, home to
    V8-V13 granite problems and Dreamcatcher, a committing highball line
    often cited as the world's first confirmed V16 boulder problem,
    first climbed by Chris Sharma in 2005. Landings on the steeper lines
    are uneven forest floor with root and rock hazards, requiring a
    full multi-pad stacking setup and an experienced spotter team on
    the taller problems. The forest approach trail is longer and less
    trafficked than the Grand Wall Boulders, adding evacuation time in
    the event of a fall injury.

