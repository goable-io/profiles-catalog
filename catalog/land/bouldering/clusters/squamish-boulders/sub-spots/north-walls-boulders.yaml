tier_rationale:
  en: |
    The North Walls area lies adjacent to the Chief's climbing crags,
    offering sustained V4-V8 granite forest boulders on generally flat
    to gently sloped landings under dense tree cover. A standard 3-5 pad
    setup with a single spotter covers the majority of lines, and the
    forest canopy provides consistent shade that keeps friction good
    through warmer parts of the day. The approach trail shares access
    with rope-climbing parties heading to the North Walls crags, keeping
    the trail well maintained but occasionally busy.

