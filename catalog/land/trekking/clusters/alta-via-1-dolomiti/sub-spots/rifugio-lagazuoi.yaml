tier_rationale:
  en: |
    Rifugio Lagazuoi (2752 m) is the AV1 stage 5-6 waypoint sitting atop
    the WWI open-air museum on Monte Lagazuoi, reached via roughly 700 m
    of ascent on rocky, well-marked trail from Passo Falzarego, with
    exposed sections along former military tunnels and trenches cut into
    the rock. The staffed refuge provides food, water, and radio contact
    at altitude, and a cable car (Funivia Lagazuoi) from Passo Falzarego
    offers a fast alternate access and evacuation route independent of
    the walking trail. Hazards include loose rock underfoot near the
    tunnel entrances and significant afternoon temperature drop and wind
    exposure at this, one of the highest points on AV1.

