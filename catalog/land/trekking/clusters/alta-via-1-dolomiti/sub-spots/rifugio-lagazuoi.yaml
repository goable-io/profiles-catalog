description:
  en: |
    A high-altitude AV1 waypoint at 2752 m built into the WWI-era
    Lagazuoi tunnel network, with sweeping views over the Sella and
    Marmolada massifs. Cable-car accessible from Passo Falzarego for
    non-trekkers and as an evacuation option.

