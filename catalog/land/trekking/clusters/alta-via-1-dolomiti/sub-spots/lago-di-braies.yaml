description:
  en: |
    The iconic emerald-water trailhead of Alta Via 1, inside the
    Fanes-Sennes-Braies Nature Park. An easy, well-serviced lakeside
    start before the route climbs into the high Dolomites, popular with
    both day visitors and AV1 through-trekkers.

