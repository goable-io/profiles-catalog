tier_rationale:
  en: |
    Lago di Braies (1496 m) is the northern trailhead of Alta Via 1. The
    lakeside approach path is wide, gravel-surfaced, and essentially
    flat for the first 1-2 hours before the AV1 route begins its climb
    into the Fanes-Sennes-Braies Nature Park. A staffed hotel and
    refuge sit directly at the lake with food, water, and full mobile
    coverage, and the trailhead is served by a paved road and seasonal
    shuttle bus, making evacuation or bail-out immediate at any point on
    this section. Worst-case consequence at this sub-spot is weather
    exposure on the initial climb, fully recoverable by returning to the
    lakeside facilities.

