tier_rationale:
  en: |
    Rifugio Pramperet (1857 m) is the AV1 stage 10 waypoint in the
    southern Dolomiti Bellunesi, reached by a roughly 900 m descent from
    the higher central stages on rocky, well-marked forest and scree
    trail with several short exposed rock steps near Forcella Cadin. The
    staffed refuge offers food, water, and radio contact before the
    final descent toward Belluno. Evacuation from this section requires
    a multi-hour walk down forested valley trail to the nearest road
    access at Pralongo, as the surrounding Dolomiti Bellunesi National
    Park sector has no cable-car or vehicle shortcut; the principal
    hazard is afternoon thunderstorm exposure on the rocky approach
    ridges before the tree line resumes.

