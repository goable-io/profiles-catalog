description:
  en: |
    Alta Via 1 is the classic and most-walked of the Dolomites' long
    high-altitude routes, running roughly 120 km over 10-12 days from
    Lago di Braies (1496 m) south to Belluno via La Pissa. Altitude
    ranges from the trailhead lake up to around 2752 m near Rifugio
    Lagazuoi, with terrain moving through karst plateau, mixed forest,
    and rocky high passes on well-cairned trail; a handful of short
    fixed-cable sections require basic scrambling confidence but no
    technical gear. The route is served by CAI (Club Alpino Italiano)
    staffed refuges spaced roughly one day's walk apart, and booking
    ahead is strongly recommended in July-August. No permit is required,
    though the northern stages pass through the Fanes-Sennes-Braies
    Nature Park where camping is restricted to designated sites. Optimal
    season is late June to late September; the emerald waters of Lago di
    Braies and the WWI open-air museum around Rifugio Lagazuoi are the
    route's best-known landmarks.

