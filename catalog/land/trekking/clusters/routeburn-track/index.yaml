description:
  en: |
    The Routeburn Track is a 32 km, two-to-four-day "Great Walk"
    linking Fiordland National Park and Mount Aspiring National Park,
    running between the Routeburn Shelter (Glenorchy end, 460 m) and
    The Divide on the Milford road. The route climbs through silver
    beech forest and open valley flats to the alpine crossing of
    Harris Saddle at 1255 m, passing Lake Harris and the Ocean Peak
    corner viewpoint with views toward the Darran Mountains, before
    descending to Lake Mackenzie and Lake Howden. Terrain is a mix of
    well-graded valley track and rockier, more exposed alpine sections
    around the saddle. DOC operates serviced Great Walk huts (Routeburn
    Flats, Routeburn Falls, Mackenzie, Howden) with wardens during the
    Great Walks season (late October to April), when bookings are
    capped and the trail is walkable end-to-end without technical gear.
    Outside this window the track remains open but unserviced, with
    snow and avalanche hazard significantly raising the difficulty of
    the Harris Saddle crossing.

