    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m makes off-trail navigation unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain creates slippery trails, flash-flood risk in canyons, and hypothermia exposure.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed ridges creates fall risk.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 24
  carrying_capacity_sensitivity: high
  notes: |
    DOC caps independent Great Walk bookings and a parallel guided
    concession (Ultimate Hikes) operates a separate hut network,
    together limiting daily throughput on this two-national-park
    crossing. Equipment dependency is high given Fiordland's heavy
    rainfall and the alpine exposure of Harris Saddle, despite zero
    direct emissions from the walk itself.

