tier_rationale:
  en: |
    Routeburn Shelter, at 460 m, is the road-accessible trailhead on
    the Glenorchy side of the track and the start of the DOC Great
    Walk season (late October to April). The first stage to Routeburn
    Flats and Routeburn Falls Hut is a well-formed, graded valley path
    through beech forest with modest elevation gain and no exposure.
    Car park access at the shelter itself means evacuation is
    immediate for anyone who needs to turn back before committing to
    the trail, and DOC ranger presence at the nearby huts provides
    additional safety infrastructure during the booked season.

