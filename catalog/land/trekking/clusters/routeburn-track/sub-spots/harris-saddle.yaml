description:
  en: |
    Harris Saddle (1255 m) is the Routeburn Track's alpine high point,
    with an emergency shelter and a side-trip to Conical Hill
    overlooking Lake Harris and the Darran Mountains. It is the
    trail's most weather-exposed section, best crossed in a clear
    window.

