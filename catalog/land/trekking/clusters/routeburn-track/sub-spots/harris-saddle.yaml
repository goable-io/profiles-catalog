tier_rationale:
  en: |
    Harris Saddle sits at 1255 m roughly midway along the Routeburn
    Track, a mid-trail alpine crossing reached via a well-marked but
    rockier trail with several hundred metres of elevation gain from
    Routeburn Falls Hut. A DOC emergency shelter sits at the saddle
    itself, and the short side-trip to Conical Hill offers views over
    Lake Harris and the Darran Mountains. The crossing is exposed to
    weather but is shorter and less committing than a multi-hour
    high-alpine traverse, and standard practice is to time the crossing
    within a clear weather window; both Routeburn Falls Hut and
    Lake Mackenzie Hut are within a few hours' walk on either side for
    retreat if conditions deteriorate.

