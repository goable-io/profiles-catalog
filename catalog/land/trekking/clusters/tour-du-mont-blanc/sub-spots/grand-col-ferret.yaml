description:
  en: |
    The Italy-Switzerland border pass on TMB stage 8, crossed between
    Rifugio Elena and the Swiss Val Ferret. At 2537 m it is the highest
    standard point on the route, with sweeping views back toward the
    Mont Blanc massif and forward into the Swiss Alps.

