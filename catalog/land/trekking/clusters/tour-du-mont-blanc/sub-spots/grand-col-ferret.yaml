tier_rationale:
  en: |
    Grand Col Ferret (2537 m), the highest standard point on the TMB, is
    the Italy/Switzerland border crossing on stage 8 — a roughly 18-19 km,
    6-7 hour day climbing about 800 m from Rifugio Elena (2062 m) on
    broad, well-marked grassy switchbacks before descending into
    Switzerland's Val Ferret toward Ferret village. Rifugio Elena offers
    staffed food, water, and radio contact on the Italian approach; on
    the Swiss side the Val Ferret road provides a straightforward vehicle
    evacuation route within 2-3 hours of the pass. Signature hazards are
    afternoon thunderstorm exposure on the broad open saddle and rapid
    temperature drop at this, the route's highest elevation.

display_name:
  en: Trekking — Grand Col Ferret
