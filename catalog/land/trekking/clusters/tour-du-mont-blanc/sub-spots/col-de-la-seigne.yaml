tier_rationale:
  en: |
    Col de la Seigne (2516 m) is the France/Italy border crossing on TMB
    stage 4, a roughly 14-15 km, 5-6 hour day climbing about 900 m from
    Refuge des Mottets (1868 m) on well-marked, switchbacked dirt trail
    before descending a moderate scree-and-talus slope into the Val Veny
    toward Rifugio Elisabetta (2195 m) on the Italian side. Two staffed
    refuges bracket the crossing, each with food, water, and radio-
    equipped emergency contact, and evacuation on either side takes
    2-3 hours on foot via the Vallée des Glaciers or the Val Veny jeep
    track. The principal hazards are afternoon thunderstorm exposure on
    the open pass, where there is no shelter for roughly an hour on
    either side, and loose scree footing on the Italian-side descent.

