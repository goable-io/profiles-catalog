description:
  en: |
    The France-Italy border pass on TMB stage 4, crossed between
    Refuge des Mottets and Rifugio Elisabetta. A well-marked, heavily
    trafficked crossing at 2516 m offering the first classic views of
    the Mont Blanc massif's Italian side.

