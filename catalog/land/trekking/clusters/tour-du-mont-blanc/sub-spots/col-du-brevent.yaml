tier_rationale:
  en: |
    Col du Brévent forms the final high ridge crossing of the TMB on
    stages 10-11 above Chamonix, a roughly 5-6 hour, ~1000 m ascent day
    on a narrow balcony trail with short fixed-cable-protected rock
    steps and sustained exposure directly across the valley from the
    Mont Blanc massif. Refuge de Bellachat sits on the approach for
    overnight or emergency shelter, and the Brévent cable car station
    nearby provides an unusually fast evacuation option compared to
    most TMB high passes — a descent to Chamonix in minutes rather than
    hours. The principal hazards are exposure on the narrow ridge
    sections in wind or wet rock, and afternoon thunderstorm cells
    typical of the Chamonix valley's orographic convection.

