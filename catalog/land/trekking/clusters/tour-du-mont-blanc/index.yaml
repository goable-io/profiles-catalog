gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: ALPINE_WHITEOUT
    description: Visibility below 300m in alpine terrain creates immediate route-finding hazard; high-altitude rescue often impossible.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_PRECIPITATION_ALPINE
    description: Heavy active precipitation in alpine terrain triggers flash floods in gullies and rapidly degrades trail surface.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: ALPINE_HIGH_WIND
    description: Sustained wind above 50 knots at alpine altitude makes ridge traverses and exposed sections dangerous.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: EXTREME_COLD_ALPINE
    description: Apparent temperature below -20°C in alpine terrain creates immediate frostbite risk.

sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    The TMB is human-powered with zero direct emissions, but is among the
    most crowded long-distance treks in the Alps, with an estimated
    25,000-30,000 trekkers completing the full circuit annually plus
    many more day-walkers on access sections near Chamonix and Courmayeur.
    The Autour du Mont Blanc reservation platform (operated by the
    Chamonix and Courmayeur tourist offices) centralizes refuge booking
    and functions as a de facto carrying-capacity control during the
    June-September peak. Trail erosion on the Col de la Seigne and
    Grand Col Ferret approaches is documented and actively managed by
    park authorities on both the French and Italian sides.

