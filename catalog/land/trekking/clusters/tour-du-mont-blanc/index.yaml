description:
  en: |
    The Tour du Mont Blanc (TMB) is a ~170 km circuit around the Mont Blanc
    massif crossing France, Italy, and Switzerland in 10-11 days. Altitude
    ranges from roughly 1000 m in the Chamonix and Courmayeur valleys to
    2537 m at Grand Col Ferret, the route's highest standard pass. Terrain
    alternates between valley pasture, larch forest, and rocky high passes
    with moderate scree on the steeper descents; several optional variants
    add via-ferrata-style exposure. A dense network of staffed refuges
    (Rifugio Elisabetta, Refuge des Mottets, Rifugio Elena, Cabane de la
    Balme, and others) covers nearly every stage, and booking ahead through
    the Autour du Mont Blanc reservation system is effectively mandatory in
    July-August. No permits are required, and the route is walkable without
    a guide, though route-finding in whiteout on the high cols is a real
    hazard. Optimal season is mid-June to mid-September; the three-country
    border crossings at Col de la Seigne and Grand Col Ferret, and the
    Chamonix-valley balcony trail near Col du Brévent, are the trek's most
    photographed landmarks.

