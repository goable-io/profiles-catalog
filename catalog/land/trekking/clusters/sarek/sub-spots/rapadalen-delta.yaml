tier_rationale:
  en: |
    Rapadalen (the Rapa Valley delta), at roughly 500 m, is the iconic
    wilderness sector of Sarek National Park — Europe's oldest
    protected wilderness area — and carries no marked trail, no huts,
    and no bridges of any kind. Reaching it requires multiple days of
    off-trail travel over rock, marsh, and tundra from any road access,
    with the delta's braided glacial river channels themselves
    presenting the crux hazard: crossings shift daily with meltwater
    volume and can be genuinely impassable after rain, forcing long
    detours. Navigation is entirely map/compass or GPS based, mobile
    coverage is absent, and evacuation from the valley floor is
    realistically helicopter-only, coordinated through Swedish Mountain
    Rescue — this is a mandatory-experience, self-sufficient
    wilderness zone rather than a maintained trekking route.

