tier_rationale:
  en: |
    Skierfe (1179 m) is the cliff-edge viewpoint overlooking the
    Rapadalen delta, reached via a steep, unmarked off-trail ascent of
    roughly 700 m gain from the valley floor over rock, tundra, and
    talus with no cairns or waymarking inside the park. The summit
    plateau ends in an exposed vertical drop toward the delta below,
    creating serious fall-hazard exposure in poor visibility or high
    wind, and the approach itself crosses the same unbridged glacial
    channels as the Rapadalen floor. There is no hut, shelter, or
    mobile coverage anywhere near the summit, and reaching help
    requires descending the full off-trail approach or a helicopter
    response — consistent with the rest of Sarek's no-infrastructure
    wilderness design.

