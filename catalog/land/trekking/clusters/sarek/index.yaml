description:
  en: |
    Sarek National Park, established in 1909, is Europe's oldest true
    wilderness national park and one of the continent's most demanding
    trekking destinations: roughly 1970 km² of glaciated peaks, deep
    U-shaped valleys, and braided glacial rivers in Swedish Lapland,
    with no marked trails, no huts, and no bridges anywhere inside the
    park boundary. Altitude ranges from about 500 m in the Rapadalen
    (Rapa Valley) delta floor to over 2000 m on the park's highest
    summits. Trekking is entirely off-trail on rock, tundra, marsh, and
    talus, requiring map-and-compass or GPS navigation, glacial-river
    fording competence, and self-sufficient wild camping; multi-day
    routes commonly run 5-10 days. The classic itinerary crosses or
    skirts the Rapadalen delta — a vast braided wetland viewed
    iconically from the Skierfe cliff above — connecting to
    neighbouring Kungsleden via the Sarek massif's eastern rim. The
    reliable season is short, mid-July to early September, with
    unbridged rivers at their most dangerous during snowmelt in June
    and after any heavy rain; helicopter evacuation is the only
    practical emergency exit from the park interior.

