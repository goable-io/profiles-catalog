    Cluster inherits trekking base scoring unmodified (no matching
    alpine-family region variant exists for the subarctic Lapland
    wilderness regime). Very short 8-week reliable season and high
    equipment dependency reflect Sarek's no-trail, no-hut, no-bridge
    wilderness design — the most demanding cluster in this batch.
