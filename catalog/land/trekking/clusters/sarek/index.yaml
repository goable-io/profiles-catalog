gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m is a severe hazard in Sarek, where there are no marked trails and navigation depends entirely on map/compass or GPS sightlines.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain rapidly raises Sarek's unbridged glacial rivers to un-fordable levels, the park's single greatest trekking hazard.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed viewpoints like Skierfe and open valley floors creates fall and hypothermia risk far from any shelter.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 8
  carrying_capacity_sensitivity: high
  notes: |
    Human-powered wilderness trekking with zero direct emissions per
    session, but equipment dependency is high (glacial-river fording
    gear, full wild-camping kit, GPS/satellite communicator recommended
    given no marked trails or huts). Naturvårdsverket (Swedish EPA)
    manages Sarek as strict wilderness with no infrastructure by design;
    carrying capacity sensitivity is high given fragile alpine tundra
    vegetation and reindeer-husbandry (Sami) land use inside the park.

