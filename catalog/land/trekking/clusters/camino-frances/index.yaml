description:
  en: |
    The Camino Francés is the classic and most-walked route of the
    Camino de Santiago pilgrimage network, running approximately 780 km
    from Saint-Jean-Pied-de-Port on the French side of the Pyrenees to
    Santiago de Compostela in Galicia. Most pilgrims complete it in
    30-35 days, crossing the Pyrenees into Roncesvalles at 950 m, the
    high meseta plateau of Castile, the symbolic Cruz de Ferro at
    1504 m (the route's highest point) in the Montes de León, and the
    green hills of Galicia before the cathedral square finish in
    Santiago. Terrain is overwhelmingly well-marked dirt track, farm
    road, and paved village street, with altitude ranging from near
    sea level to just over 1500 m — physically demanding through sheer
    distance and daily accumulation rather than technical difficulty.
    An extensive network of albergues (pilgrim hostels) along the
    entire route provides low-cost overnight lodging, and the
    Pilgrim's Credential is required to access them and to receive the
    Compostela certificate on arrival. The route is walkable
    year-round, though summer (June-August) is hottest and most
    crowded on the meseta, and spring/autumn shoulder seasons are
    generally preferred for milder temperatures.

