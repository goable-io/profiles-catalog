gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m makes route-finding hazardous on the exposed Pyrenean crossing into Roncesvalles and the Montes de León high sections.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain creates slippery farm-track and dirt-path sections and elevates hypothermia exposure on the unsheltered meseta and mountain passes.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on the Pyrenean crossing and the open Cruz de Ferro plateau creates fall and wind-chill risk.

sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Human-powered pilgrimage trek with zero direct emissions per session
    and low equipment dependency given the extensive albergue network.
    Carrying capacity sensitivity is high: the Camino Francés is by far
    the most-walked Camino route (Oficina del Peregrino Santiago
    reports well over 200,000 Compostela certificates issued annually
    on this route alone), with albergue overcrowding and trail erosion
    concentrated in peak summer months and around Sarria (the shortest
    qualifying start point for the Compostela).

