tier_rationale:
  en: |
    The Cruz de Ferro (1504 m), the highest point of the entire Camino
    Francés, sits in the Montes de León on a well-marked dirt-track
    stage between Foncebadón and Manjarín, roughly 5-6 km and modest
    further ascent from the last village. The path is a wide,
    established camino surface with regular waymarking and no
    technical difficulty, and the site itself is a simple roadside
    iron cross atop a large stone cairn built up over centuries by
    pilgrims dropping stones in a symbolic tradition. Nearby villages
    (Foncebadón, El Acebo) offer albergue accommodation, and the site
    is accessible by the parallel LE-142 road, keeping evacuation and
    resupply straightforward despite the altitude.

