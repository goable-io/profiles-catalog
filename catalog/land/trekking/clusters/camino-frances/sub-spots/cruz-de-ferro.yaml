description:
  en: |
    The Iron Cross atop a centuries-old pilgrim stone cairn at 1504 m
    in the Montes de León — the highest point of the Camino Francés and
    one of its most symbolic waypoints, where pilgrims traditionally
    leave a stone carried from home.

