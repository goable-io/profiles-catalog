tier_rationale:
  en: |
    Praza do Obradoiro, the cathedral square in Santiago de Compostela
    (260 m), is the terminus of the Camino Francés and a fully urban
    environment — paved city streets, complete infrastructure, and no
    trekking-specific hazard whatsoever. Pilgrims arrive here after
    roughly 780 km and 30-35 days from Saint-Jean-Pied-de-Port, with
    the final approach through Galician hill country and Santiago's
    outskirts being low-altitude, well-marked, and heavily trafficked.
    The city offers full services: the Pilgrim's Office for Compostela
    certificates, hotels and albergues, rail and air connections, and
    emergency services on par with any European city, making this the
    lowest-risk point in the entire cluster.

