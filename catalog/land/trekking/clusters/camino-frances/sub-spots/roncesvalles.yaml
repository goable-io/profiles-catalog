tier_rationale:
  en: |
    Roncesvalles (950 m) is the Spanish-side arrival point after the
    demanding roughly 25 km, 1200 m-ascent Pyrenean crossing from
    Saint-Jean-Pied-de-Port — the single hardest single stage of the
    entire Camino Francés, exposed to sudden fog, wind, and cold even
    in summer, with limited escape options partway along the route.
    Roncesvalles itself, however, is a well-developed, low-difficulty
    arrival village: the iconic Colegiata Real hosts a large modern
    albergue, a staffed pilgrim office, church, and restaurant, with
    road access and regular bus service to Pamplona. Once at
    Roncesvalles, terrain, shelter, and evacuation are all
    straightforward — the tier reflects the village itself as a
    trailhead/refuge, distinct from the preceding mountain crossing.

