description:
  en: |
    The historic Collegiate Church and pilgrim refuge at Roncesvalles
    (950 m), the first major stop in Spain after crossing the Pyrenees
    from Saint-Jean-Pied-de-Port — an iconic and heavily used stage-1
    overnight on the Camino Francés.

