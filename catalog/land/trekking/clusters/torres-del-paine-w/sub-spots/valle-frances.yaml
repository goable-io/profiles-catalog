tier_rationale:
  en: |
    Valle del Francés, the W Circuit's middle arm, climbs from
    Refugio/Campamento Italiano (roughly 200 m) to the mirador at
    850 m over about 7.5 km one-way, 3-4 hours, on a well-defined
    dirt-and-root forest trail with a moraine-scree final approach.
    The hanging valley offers close views of Paine Grande's hanging
    glacier, with periodic audible/visible ice-avalanche activity
    across the valley — a known but generally distant hazard.
    Campamento Italiano and Campamento Francés provide basic camping
    with river water sources; cell coverage is limited within the
    valley. Wind funnels strongly through the valley corridor, and
    evacuation from the upper mirador is on foot back to Italiano.

