tier_rationale:
  en: |
    The Glaciar Grey mirador and Refugio Grey area, 500 m, sit at the
    western end of the W Circuit, reached via an undulating ~11 km,
    3-4 hour lakeshore-and-forest trail from Refugio Paine Grande
    with modest elevation change (under 300 m gain). The trail is
    well-marked dirt with some rooty and rocky sections and passes
    two suspension bridges over ravines. Refugio Grey offers full
    services (food, water, emergency communication) at the ice-face
    viewpoint, and boat/catamaran access on Lago Grey provides an
    alternative evacuation route independent of the trail itself,
    making this the most logistically forgiving of the W's three
    signature viewpoints despite persistent lake-corridor wind.

