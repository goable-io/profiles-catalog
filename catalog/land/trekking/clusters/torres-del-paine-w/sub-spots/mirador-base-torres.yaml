tier_rationale:
  en: |
    Mirador Base de las Torres, 900 m, is reached by an ~8.5 km, 4-5
    hour one-way day-hike from Refugio Chileno, gaining roughly 450 m
    on well-marked lenga-forest dirt trail before a final ~45 minute
    boulder-field scramble over glacial moraine to the lake beneath
    the three granite towers. The talus final section is unshaded,
    frequently windswept, and slippery when wet, raising this
    sub-spot's difficulty above the forested approach. Refugio Chileno
    and Refugio Torres provide water, food, and emergency shelter
    below the mirador; cell coverage is patchy above the tree line.
    Evacuation from the mirador itself requires the full descent on
    foot, as no vehicle or helicopter landing zone exists at altitude.

