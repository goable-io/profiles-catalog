description:
  en: |
    The W Circuit is a roughly 71-80 km, 4-5 day trek through Parque
    Nacional Torres del Paine in Chilean Patagonia, tracing a W-shaped
    route between three signature arms: the granite Torres viewpoint
    in the east, the hanging Valle del Francés in the middle, and the
    Glaciar Grey ice-face in the west. Altitude is modest by Andean
    standards (500-900 m) but the defining hazard is the relentless
    Patagonian westerly wind, routinely exceeding 60 knots on exposed
    ridges and lakeshores. Terrain mixes lenga-forest dirt trail,
    glacial moraine, and a final boulder-field scramble to the Torres
    mirador. Accommodation runs through CONAF-regulated refugio and
    campamento concessions (Fantástico Sur, Vertice) that cap nightly
    tent numbers per site and require advance booking — wild camping
    is prohibited. Season runs the austral summer (November-March),
    with December-February the peak-wind, peak-crowd window; wind and
    river conditions can close sections without notice.

