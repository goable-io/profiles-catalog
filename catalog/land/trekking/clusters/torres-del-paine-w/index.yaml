gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: PATAGONIAN_WIND
    description: Sustained wind above 55 knots on Torres del Paine's exposed W circuit ridges and lakeshores exceeds safe trekking threshold — trekkers are routinely blown off feet, tent damage is standard.

  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: ANDEAN_STORM
    description: Precipitation above 5 mm/h combined with Patagonian wind signals dangerous storm conditions with trail-washout and hypothermia risk on exposed W circuit sections.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_ANDES
    description: Visibility below 500 m at the Torres mirador and Valle del Francés prevents cairn navigation and removes the principal reason for the trek (the granite-tower and glacier views).

  - metric: apparent_temp_c
    condition: lt
    value: -12
    reason_code: ANDEAN_HYPOTHERMIA
    description: Apparent temperature below -12°C at Patagonian campamentos creates frostbite risk during trekking-tent overnight exposure, compounded by wind chill.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 20
  carrying_capacity_sensitivity: high
  notes: |
    CONAF (Corporación Nacional Forestal) caps nightly tent and bed
    numbers per campamento/refugio at roughly 80 spaces through
    concessionaires Fantástico Sur and Vertice Patagonia; all
    overnight stays require pre-booked reservations and wild camping
    is prohibited park-wide following a major 2011-2012 wildfire
    caused by an unattended trekker stove. Peak-season (Dec-Feb)
    demand regularly exceeds capacity, driving a shoulder-season
    booking rush.

