tier_rationale:
  en: |
    Spray Park, 1900 m, is a subalpine meadow section on the northern
    Wonderland Trail near Mowich Lake, reached via a moderate ~5-6 km
    approach with roughly 500 m of elevation gain on dirt-and-root
    trail through old-growth forest before opening onto exposed
    meadow with close views of Mount Rainier's Mowich Face and Flett
    and Russell glaciers. The meadow terrain is fragile alpine
    vegetation with marked-trail requirements to prevent trampling;
    weather can change quickly with the meadow fully exposed to wind
    and sudden Cascades precipitation. No hut exists on this section;
    the nearest ranger presence and cell coverage are limited, and
    evacuation is on foot back to the Mowich Lake trailhead, a
    multi-hour proposition in poor conditions.

