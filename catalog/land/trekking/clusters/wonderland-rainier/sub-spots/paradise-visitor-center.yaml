tier_rationale:
  en: |
    Paradise Visitor Center, 1647 m, is Mount Rainier National Park's
    principal hub and a Wonderland Trail junction, with paved parking,
    restrooms, ranger station, and full cell coverage. The immediate
    surrounding trail network is a wide, well-maintained paved and
    gravel path through subalpine wildflower meadow with benign
    gradient on its lower loops (Skyline Trail lower section), heavily
    used by day visitors. Water, food, and NPS emergency services are
    on-site. Worst-case consequence at this location is low given
    year-round vehicle and medical evacuation access via the paved
    park road.

