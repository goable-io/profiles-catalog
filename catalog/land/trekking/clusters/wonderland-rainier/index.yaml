  notes: |
    Cluster inherits trekking base scoring exactly (no dimension/gate
    overrides) — the Cascades lack a dedicated pacific-Northwest
    region variant in this catalog phase, so weights/curves are
    copied verbatim from the trekking base profile. 10-week typical
    season reflects the narrow late-July to early-October
    Cascades snow-free window, shorter than the base profile's
    36-week default.
