gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m makes off-trail navigation unsafe, particularly on the Panhandle Gap shoulder crossing above tree line.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain in the Cascades' maritime climate rapidly raises glacial-melt river levels at Wonderland Trail crossings and creates slippery root-and-mud trail sections.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed subalpine meadow sections (Spray Park, Panhandle Gap) creates fall risk and rapid wind-chill exposure.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 10
  carrying_capacity_sensitivity: high
  notes: |
    Mount Rainier National Park (NPS) issues Wonderland Trail permits
    through a heavily oversubscribed early-season lottery, with
    designated backcountry camps at fixed capacity per night and no
    off-site camping permitted. Subalpine meadow trampling (Spray
    Park, Paradise) is a documented carrying-capacity concern given
    fragile high-elevation vegetation with short growing seasons;
    NPS actively reroutes and rests damaged meadow sections.

