description:
  en: |
    The Wonderland Trail is a roughly 150 km (93 mi), 10-14 day loop
    entirely circumnavigating Mount Rainier (4392 m) in Washington
    State's Cascade Range, staying largely in the 900-1980 m band
    through old-growth forest, subalpine meadow, and glacial river
    valleys, with a handful of higher shoulder crossings near
    Panhandle Gap (~2000 m). Terrain is well-established dirt and
    root trail maintained by the National Park Service, with
    designated backcountry camps (no free camping) spaced along the
    loop and several glacier-fed river crossings that can become
    hazardous during afternoon snowmelt surges. Permits are quota-
    controlled through a competitive NPS lottery given the trail's
    popularity; bear canisters are recommended and food-storage
    lockers exist at many camps. Season runs roughly late July to
    early October, bounded by lingering snowpack at Panhandle Gap
    early season. The Paradise and Sunrise/Mowich areas serve as the
    principal access points and shorter day-hike sampler sections.

