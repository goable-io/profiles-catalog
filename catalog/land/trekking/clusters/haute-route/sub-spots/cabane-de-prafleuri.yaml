tier_rationale:
  en: |
    Cabane de Prafleuri (2624 m) is a Haute Route stage 3 hut approached
    by roughly 700-800 m of ascent on well-marked, established trail
    across rocky moraine and grassy alpine terrain above the Lac des
    Dix reservoir, with no technical scrambling required in normal
    conditions. The staffed CAS-run hut provides food, water, and radio
    contact at altitude, and the approach along the reservoir shoreline
    offers a manageable retreat route toward the Val des Dix road-head
    within 3-4 hours. Hazards are afternoon thunderstorm exposure on the
    open moraine terrain and cold-exposure risk given the hut's
    altitude, but the well-trodden trail and hut infrastructure keep
    this within standard intermediate difficulty.

