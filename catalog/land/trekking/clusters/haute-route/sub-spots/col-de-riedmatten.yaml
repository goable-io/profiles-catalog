tier_rationale:
  en: |
    Col de Riedmatten (2919 m) is a committing high pass on Haute Route
    stage 4-5 (walking variant; the glaciated ski Haute Route uses
    different cols), reached by roughly 800-900 m of ascent on rocky,
    increasingly exposed trail with a steep, cable-assisted final scramble
    to the notch. Snow patches routinely persist on the approach and
    descent gullies into July, requiring careful step-kicking or an ice
    axe in early season, and the descent toward Arolla crosses loose
    scree with sustained exposure. There is no hut directly at the pass;
    the nearest shelter (Cabane des Dix or Refuge de la Barma) is
    2-3 hours away, mobile coverage is unreliable on the approach, and
    evacuation in poor weather effectively requires multi-hour retreat
    on foot rather than any vehicle or cable-car option.

