tier_rationale:
  en: |
    The Europaweg high-traverse leg from Grächen to Zermatt covers
    roughly 25-30 km and 8-10 hours across two long stage-days, holding
    a near-constant ~2200-2500 m contour on well-marked, established
    trail with several sections of fixed cable and a suspension bridge
    (Charles Kuonen bridge) crossing a deep ravine. Staffed huts (Europa
    Hut, Gasenried) sit along the route with food, water, and radio
    contact, and several villages along the valley below (Randa, Täsch)
    provide bail-out descent options within 2-3 hours. The dramatic,
    sustained exposure on the traverse and the suspension-bridge
    crossing are the defining hazards, alongside afternoon thunderstorm
    risk on the open balcony trail with the Matterhorn in view for the
    final approach.

