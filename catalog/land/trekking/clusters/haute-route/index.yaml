display_name:
  en: Trekking — Haute Route (Chamonix-Zermatt)
  it: Trekking — Alta Via (Chamonix-Zermatt)
  es: Senderismo — Alta Ruta (Chamonix-Zermatt)
  fr: Randonnée — Haute Route (Chamonix-Zermatt)
  de: Wandern — Haute Route (Chamonix-Zermatt)
description:
  en: |
    The walker's Haute Route connects Chamonix, France to Zermatt,
    Switzerland over roughly 180 km and 11-12 days, passing beneath four
    of the six highest summits in the Alps. Altitude ranges from around
    1035 m in the Chamonix valley to nearly 2919 m at Col de Riedmatten,
    with terrain crossing high alpine passes, glacial moraine, and talus
    fields where late-lying snow patches can persist into July. Swiss
    Alpine Club (CAS) and French refuges cover most stages, though a few
    remote huts (Cabane de Prafleuri, Cabane des Dix) require reservation
    well ahead in season. No permit is required for the walking route,
    but this is distinct from the ski Haute Route, which follows glaciated
    terrain and different cols in winter/spring and mandates roped glacier
    travel and a guide. Optimal season is early July to mid-September; the
    Matterhorn approach on the Europaweg high traverse into Zermatt is the
    trek's signature finale.

