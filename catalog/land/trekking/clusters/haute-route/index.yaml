    - "Club Alpin Suisse (CAS) hut network and reservation guidance"
    - "Fédération Française des Clubs Alpins et de Montagne (FFCAM) trail guidance"
  notes: |
    Cluster inherits trekking-alpine scoring unchanged (weights, gates,
    curves copied exactly — no material deviation identified for this
    route relative to the regional baseline). equipment_dependency
    raised to high vs the low regional default given late-lying snow on
    the higher cols; typical_season_weeks lowered to 10 to reflect this
    narrower reliable window relative to the 14-week regional baseline.
    This profile describes the summer walking route only, distinct from
    the glaciated ski Haute Route.
