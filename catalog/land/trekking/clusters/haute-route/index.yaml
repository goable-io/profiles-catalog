gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: ALPINE_WHITEOUT
    description: Visibility below 300m in alpine terrain creates immediate route-finding hazard; high-altitude rescue often impossible.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_PRECIPITATION_ALPINE
    description: Heavy active precipitation in alpine terrain triggers flash floods in gullies and rapidly degrades trail surface.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: ALPINE_HIGH_WIND
    description: Sustained wind above 50 knots at alpine altitude makes ridge traverses and exposed sections dangerous.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: EXTREME_COLD_ALPINE
    description: Apparent temperature below -20°C in alpine terrain creates immediate frostbite risk.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 10
  carrying_capacity_sensitivity: medium
  notes: |
    The walker's Haute Route is human-powered with zero direct emissions
    per session, but the short reliable weather window (snow persistence
    on high cols into July, early autumn snowfall from mid-September)
    compresses use into a narrow 10-week season. Remote huts including
    Cabane de Prafleuri rely on helicopter resupply, an indirect
    emissions source typical of high Alpine refuges run by the Club
    Alpin Suisse (CAS). Carrying-capacity sensitivity is medium — the
    route is less crowded than the TMB but individual huts have hard
    bed-count caps that function as a natural throughput limit.

