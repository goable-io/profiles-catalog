tier_rationale:
  en: |
    Landmannalaugar (600 m) is the northern trailhead of the Laugavegur
    and the most accessible point in the cluster, reachable by
    highland bus and 4x4 track in summer. The immediate area is flat
    to gently rolling terrain around geothermal springs and rhyolite
    mountains, with a well-marked, wide gravel path network suitable
    for day-walkers as well as trekkers starting the multi-day route.
    A staffed Ferðafélag Íslands hut and campsite with warden, shop,
    and geothermal bathing pool sit at the trailhead, giving reliable
    water, shelter, and first-aid access. Mobile coverage is
    intermittent but the site sees heavy summer visitor traffic and
    regular highland-bus service, keeping evacuation straightforward
    compared to the trail's remote middle sections.

