description:
  en: |
    The northern gateway to the Laugavegur Trail, set in the Fjallabak
    Nature Reserve amid multicoloured rhyolite mountains, obsidian
    lava fields, and natural geothermal bathing pools. Most trekkers
    spend a night here before setting out south toward Hrafntinnusker.

