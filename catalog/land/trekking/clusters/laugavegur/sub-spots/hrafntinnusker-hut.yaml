tier_rationale:
  en: |
    The first stage out of Landmannalaugar climbs roughly 12 km and
    400 m of ascent to the Hrafntinnusker hut at 1027 m, the highest
    and most exposed point on the entire Laugavegur trail, typically
    taking 4-6 hours. The path crosses obsidian (hrafntinna) lava
    fields, geothermal steam vents, and semi-permanent snow patches
    that persist into midsummer, with poor cairn visibility possible
    in fog. A staffed Ferðafélag Íslands hut provides overnight
    shelter and emergency contact, but the surrounding plateau is
    fully exposed to wind and sudden temperature drops, and the
    nearest vehicle access is a multi-hour walk back to
    Landmannalaugar or onward to Álftavatn — making this a genuine
    multi-day-trek waypoint rather than a day-hike destination.

