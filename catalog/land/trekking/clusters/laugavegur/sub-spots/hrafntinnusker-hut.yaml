description:
  en: |
    The trail's highest overnight stop at 1027 m, set among obsidian
    lava fields and lingering snowfields with sweeping glacier vistas.
    The stage-1 overnight for most Laugavegur trekkers, and the most
    weather-exposed hut on the route.

