tier_rationale:
  en: |
    Þórsmörk (200 m) is the southern trailend of the Laugavegur, roughly
    55 km and 3-4 days from Landmannalaugar, reached via a final
    descent through birch and rowan woodland flanked by the
    Eyjafjallajökull, Mýrdalsjökull, and Tindfjallajökull glaciers. The
    valley floor is sheltered relative to the exposed highland
    sections above, with well-marked paths, several campsites (Húsadalur,
    Langidalur, Básar) with staffed wardens, shops, and mountain-hut
    accommodation. Access is by highland bus (river-fording 4x4 track)
    in summer, giving a straightforward evacuation route and the
    lowest-altitude, most forgiving terrain on the entire trail;
    onward trekkers can continue via the more demanding Fimmvörðuháls
    pass to Skógar.

