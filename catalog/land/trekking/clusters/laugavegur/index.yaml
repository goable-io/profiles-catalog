description:
  en: |
    The Laugavegur Trail is Iceland's most iconic multi-day trek, running
    roughly 55 km from the geothermal Landmannalaugar highlands south to
    the birch-forested Þórsmörk valley. The route crosses a volcanic
    landscape of rhyolite mountains, obsidian lava fields, black-sand
    deserts, and glacier-fed river fords, with altitude ranging from
    about 200 m at Þórsmörk to over 1000 m at the Hrafntinnusker plateau.
    Most trekkers complete the trail in 3-4 days, overnighting at the
    Ferðafélag Íslands (Icelandic Touring Association) hut network at
    Landmannalaugar, Hrafntinnusker, Álftavatn, and Emstrur before
    finishing at Þórsmörk (often continuing on to Skógar via the
    Fimmvörðuháls extension). Huts require advance booking in peak
    season and camping is permitted alongside them. The season window is
    short — reliably open only late June through early September — with
    unmarked snow patches, sub-zero overnight temperatures, and abrupt
    weather shifts possible even in summer. River crossings (notably at
    Álftavatn/Bratthálskvísl and near Emstrur) are unbridged and can
    become impassable after heavy rain or rapid snowmelt.

