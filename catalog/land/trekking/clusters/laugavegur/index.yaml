gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m makes off-trail navigation unsafe across the unmarked volcanic desert sections between huts.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain creates slippery trails, raises glacial rivers to un-fordable levels, and elevates hypothermia exposure.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on the exposed Hrafntinnusker plateau and Fjallabak highlands creates fall and hypothermia risk.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 10
  carrying_capacity_sensitivity: high
  notes: |
    Human-powered trek with zero direct emissions per session, though
    international flight access to Iceland is a material indirect
    footprint for most trekkers. Ferðafélag Íslands operates a capped
    hut-bed reservation system at Landmannalaugar, Hrafntinnusker,
    Álftavatn, and Emstrur; peak-season demand routinely exceeds hut
    capacity, pushing overflow into designated tent areas.

