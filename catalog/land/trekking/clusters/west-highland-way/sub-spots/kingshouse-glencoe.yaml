tier_rationale:
  en: |
    Kingshouse (250 m) sits on stage 6 of the West Highland Way, at
    the point where the trail leaves the open expanse of Rannoch Moor
    and enters the Glencoe approach beneath the Buachaille Etive Mòr
    and the Glencoe mountains. The preceding moor crossing is roughly
    12-13 km of exposed, largely flat but pathless-feeling gravel
    track with no shelter and variable mobile coverage, making
    Kingshouse — a staffed hotel with food, lodging, and road access
    via the A82 — an important resupply and shelter point before the
    steeper climb over the Devil's Staircase that follows. The
    combination of moor exposure and dramatic mountain terrain gives
    this stage more weather sensitivity and a longer walk between
    reliable shelter points than the lower-altitude Loch Lomond
    section.

