tier_rationale:
  en: |
    The Rowardennan-to-Inversnaid stage runs roughly 12 km along the
    rocky eastern shore of Loch Lomond at near sea-level altitude,
    typically taking 4-5 hours. The path is well-signed but genuinely
    rooty and rocky underfoot in sections, becoming notably muddy and
    slick in the region's frequent wet weather — the defining
    character of this low-altitude, low-technical-difficulty stretch.
    Regular villages, a youth hostel at Rowardennan, and the Inversnaid
    Hotel provide shelter, food, and phone signal at intervals, and the
    West Highland Way's popularity means the path sees heavy foot
    traffic with straightforward road or boat evacuation at several
    points along the shore.

