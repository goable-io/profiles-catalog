description:
  en: |
    The West Highland Way is Scotland's original long-distance trail,
    running 154 km (96 miles) from Milngavie near Glasgow north to
    Fort William, at the foot of Ben Nevis. The route typically takes
    6-8 days, tracing the eastern shore of Loch Lomond, crossing
    Rannoch Moor, and descending into Glencoe before the final climb
    over the Devil's Staircase to Kinlochleven and on to Fort William.
    Altitude is modest by Alpine standards — from near sea level at
    Loch Lomond to about 550 m at the Devil's Staircase — but terrain
    is varied: lochside path, open moorland, forestry track, and
    stony drove roads, with well-established waymarking throughout.
    Accommodation is a mix of bunkhouses, B&Bs, hotels, and
    wild-camping (permitted under Scottish access law in most
    sections), with no formal permit required. The trail is walkable
    April to October, though Scottish Highland weather is notoriously
    changeable in any month — wind-driven rain and low cloud can arrive
    with little warning even in summer, and the route is largely
    unsheltered across Rannoch Moor and the higher Glencoe approaches.

