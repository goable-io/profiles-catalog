gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m over open, unsheltered Rannoch Moor and the higher Glencoe approaches makes waymark-to-waymark navigation unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain, common in the Highlands, saturates peaty moorland sections and elevates hypothermia risk on exposed stretches.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on Rannoch Moor and the Devil's Staircase approach to Glencoe creates fall and wind-chill risk.

sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 26
  carrying_capacity_sensitivity: high
  notes: |
    Human-powered trek with zero direct emissions per session and low
    equipment dependency given the well-served accommodation network.
    Carrying capacity sensitivity is high: the West Highland Way is
    Scotland's busiest long-distance trail (roughly 40,000+ walkers per
    year per NatureScot/Loch Lomond and The Trossachs National Park
    Authority estimates), with wild-camping byelaws in force around
    Loch Lomond during peak season to manage visitor pressure.

