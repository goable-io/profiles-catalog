sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 26
  carrying_capacity_sensitivity: high
  notes: |
    KINAPA (Kilimanjaro National Park Authority) mandates a licensed
    operator, guide, and porter team for every climb, with park fees
    funding trail and campsite maintenance; the Machame Route's
    camping-only model (no huts) concentrates impact at designated
    campsites, which KINAPA manages via permit allocation. Equipment
    dependency is high given the five-zone climate range from tropical
    rainforest to arctic summit conditions within a single trek.

