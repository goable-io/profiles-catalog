description:
  en: |
    The Machame Route ("Whiskey Route") is a roughly 62 km, six-to-
    seven-day ascent of Mount Kilimanjaro, Africa's highest peak,
    climbing from Machame Gate at 1800 m through five distinct
    ecological zones — montane rainforest, moorland, alpine desert,
    and finally arctic summit zone — to Uhuru Peak at 5895 m. The
    route is renowned for its scenic diversity and superior
    acclimatization profile compared to shorter routes, featuring the
    iconic Barranco Wall scramble at roughly 3960 m on day three or
    four. Terrain progresses from maintained forest trail to rocky
    volcanic scree and, on summit night, loose scoria underfoot in
    darkness and extreme cold. Kilimanjaro National Park Authority
    (KINAPA) mandates a licensed guide, park fees, and camping-only
    accommodation (no huts on this route) for every climber, with
    porters carrying communal gear between designated campsites.
    Summit night begins around midnight from Barafu Camp (4670 m) for
    a dawn arrival at Uhuru Peak, the single most physically demanding
    and altitude-exposed stretch of the climb. The main climbing
    season is January-March and June-October, avoiding the long and
    short rains.

