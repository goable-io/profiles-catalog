tier_rationale:
  en: |
    Machame Gate, at 1800 m, is the road-accessible trailhead where
    KINAPA rangers register every climber, verify the mandatory
    licensed-guide requirement, and process park fees. The first
    stage from here climbs roughly 11 km gently through montane
    rainforest to Machame Camp at 3000 m. The gate itself involves
    no elevation gain or technical terrain, has vehicle access,
    ranger presence, and radio/communications infrastructure —
    the most accessible and lowest-consequence point on the entire
    route before the mandatory-guide multi-day ascent begins in earnest.

