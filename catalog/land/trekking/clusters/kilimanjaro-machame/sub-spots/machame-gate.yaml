  de: Wandern — Machame Gate

description:
  en: |
    Machame Gate (1800 m) is the KINAPA-permit-controlled trailhead
    where climbers register and begin the rainforest-zone first stage
    of the route. Guides are mandatory for all Kilimanjaro ascents,
    and this gate is where that requirement is enforced.

