tier_rationale:
  en: |
    Barranco Camp sits at roughly 3960 m and is followed at first
    light by the Barranco Wall, a roughly 300 m scramble up a broken
    volcanic rock face that uses hands for balance and short holds but
    involves no ropes or fixed protection, taking most parties one to
    two hours. The route is on stage three of the climb, part of the
    "climb high, sleep low" acclimatization strategy that is the
    hallmark of the Machame Route's superior success rate versus
    shorter routes. Guides and assistant guides are present throughout
    per KINAPA's mandatory-guide rule, camping is the only overnight
    option, and evacuation from the wall or camp requires descent on
    foot or, in emergencies, stretcher evacuation coordinated by the
    guide team — there is no vehicle or helicopter access at this
    altitude on the route.

