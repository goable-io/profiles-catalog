tier_rationale:
  en: |
    Uhuru Peak, at 5895 m, is the summit of Kilimanjaro and the
    highest point in Africa, reached via a roughly 5-6 km, 1225 m
    ascent from Barafu Camp (4670 m) that begins around midnight for
    a dawn summit arrival. Terrain is loose volcanic scoria and scree
    on steep switchbacks in darkness and extreme cold, with
    temperatures routinely falling below -15°C with wind chill and
    supplemental oxygen levels around half of sea level. This is the
    single most physically demanding stretch of the climb, with high
    rates of altitude sickness (AMS/HAPE/HACE) turning back climbers
    even with mandatory guide supervision; evacuation above Barafu
    Camp is on foot or by stretcher/wheeled litter carried by the
    guide team down to lower altitude, as no vehicle or reliable
    helicopter access exists at this elevation on the route.

