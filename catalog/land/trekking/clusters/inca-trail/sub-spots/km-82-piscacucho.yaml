tier_rationale:
  en: |
    Km 82 (Piscacucho), 2600 m, is the official permit-controlled
    trailhead of the Classic Inca Trail beside the Urubamba river,
    reached by a short drive from Ollantaytambo. SERNANP checks
    permits and passports here (500 pax/day cap, guide mandatory)
    before the first day's gentle 11 km, ~4-5 hour walk along the
    river valley with modest elevation gain (~350 m) on a wide dirt
    and stone path. Multiple villages (Miskay, Llactapata viewpoint)
    lie en route with basic services and cell coverage. Consequence
    of a mishap is low: vehicle evacuation to Ollantaytambo remains
    possible along the valley road for most of the stage.

