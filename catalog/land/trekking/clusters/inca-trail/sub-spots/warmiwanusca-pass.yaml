tier_rationale:
  en: |
    Warmiwañusca ("Dead Woman's Pass"), 4215 m, is the highest point
    of the Inca Trail and the crux of stage 2: a relentless ~1200 m
    stone-and-dirt climb from Wayllabamba camp (3000 m) over roughly
    5-6 hours, then a steep knee-jarring stone-staircase descent to
    Pacaymayo. Altitude sickness (headache, nausea, in rare cases
    HAPE/HACE) is the trail's principal medical hazard here; there is
    no vehicle or road access — evacuation is on foot/horseback to
    the nearest trailhead, or by emergency helicopter in severe cases,
    both multi-hour operations. Weather turns quickly at this
    altitude with cold rain, hail, and reduced visibility common;
    licensed guides carry oxygen and radio contact but cell coverage
    is unreliable on the pass itself.

