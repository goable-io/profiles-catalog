tier_rationale:
  en: |
    The Sun Gate (Intipunku), 2720 m, is reached on stage 4 via a
    pre-dawn 5-6 km, ~2 hour walk from Phuyupatamarca/Wiñay Wayna
    camp along a narrow but well-trodden stone path with a short
    steep stairway ("gringo killer" steps) just before the gate.
    Terrain is dirt and Inca stonework through cloud-forest with
    some exposed drop-offs; the descent onward into Machu Picchu
    itself (2430 m) is gentle. Cell coverage improves near the
    Machu Picchu site and the Aguas Calientes evacuation route
    (train + road) is within a few hours' walk, making this a more
    forgiving stage than Warmiwañusca despite the pre-dawn timing
    pressure to reach the gate for sunrise.

