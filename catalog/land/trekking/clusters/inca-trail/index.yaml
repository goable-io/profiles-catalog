gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: PATAGONIAN_WIND
    description: Sustained wind above 55 knots exceeds safe trekking threshold on exposed high-Andean passes.

  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: ANDEAN_STORM
    description: Precipitation above 5 mm/h on the Inca Trail's stone stairways signals convective storm activity with lightning + slick-stone slip risk on the steep Warmiwañusca ascent/descent.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_ANDES
    description: Visibility below 500 m on Warmiwañusca pass and cloud-forest sections prevents safe navigation of narrow stone stairways with drop-offs.

  - metric: apparent_temp_c
    condition: lt
    value: -12
    reason_code: ANDEAN_HYPOTHERMIA
    description: Apparent temperature below -12°C at the high-altitude Warmiwañusca camps creates frostbite risk during trekking-tent overnight exposure.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 20
  carrying_capacity_sensitivity: high
  notes: |
    SERNANP enforces a hard cap of 500 daily trail entrants (trekkers,
    guides, cooks, and porters combined) via a permit system booked
    through licensed tour operators — the tightest carrying-capacity
    control of any trek in this catalog. The trail closes entirely
    each February for erosion-recovery maintenance. Porter welfare
    (weight limits, footwear, insurance) is regulated by Peruvian law
    following historical abuses, and is monitored by operator
    associations in Cusco.

