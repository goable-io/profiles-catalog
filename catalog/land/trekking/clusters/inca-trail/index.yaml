display_name:
  en: Trekking — Inca Trail to Machu Picchu (Peru)
  it: Trekking — Cammino Inca per Machu Picchu (Perù)
  es: Senderismo — Camino Inca a Machu Picchu (Perú)
  fr: Randonnée — Chemin de l'Inca vers le Machu Picchu (Pérou)
  de: Wandern — Inka-Pfad zum Machu Picchu (Peru)
description:
  en: |
    The Classic Inca Trail is a 43 km, 4-day trek through the Cusco
    region of the Peruvian Andes, following stone-paved Inca roadway
    from the Km 82 (Piscacucho) trailhead at 2600 m over Warmiwañusca
    ("Dead Woman's Pass") at 4215 m — the trail's highest point — and
    two further passes before descending through cloud-forest to the
    Sun Gate (Intipunku) and Machu Picchu itself at 2720 m. Terrain
    alternates original Inca stonework, dirt switchbacks, and stepped
    stone staircases, with camping at designated SERNANP sites along
    the route (no free camping). Access is strictly permit-controlled:
    SERNANP (Servicio Nacional de Áreas Naturales Protegidas) caps
    daily trail entrants at 500 people including guides, porters, and
    cooks, and a licensed guide is mandatory for all trekkers. Permits
    routinely sell out 4-6 months ahead in peak season (May-September,
    dry austral winter); the trail closes entirely each February for
    maintenance. Altitude sickness on Warmiwañusca is the trek's
    defining physical challenge, generally managed with 1-2 days of
    Cusco (3400 m) acclimatization before starting.

