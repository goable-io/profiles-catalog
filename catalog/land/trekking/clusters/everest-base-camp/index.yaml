gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: HIMALAYAN_MONSOON_DELUGE
    description: Precipitation above 5 mm/h in the Khumbu signals monsoon-band arrival with rapid trail-washout + landslide + river-crossing failure risk — trek closes immediately.

  - metric: wind_speed_kn
    condition: gt
    value: 40
    reason_code: HIGH_ALTITUDE_WIND
    description: Sustained wind above 40 knots grounds Lukla STOL flights and forces closure of the Kala Patthar / Base Camp high-altitude sections — hypothermia + wind-chill risk exceeds safe threshold.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_PASS
    description: Visibility below 500 m at Lukla or on the Kala Patthar / Base Camp approach prevents fixed-wing STOL operations and safe glacial-moraine navigation.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: HIMALAYAN_HYPOTHERMIA
    description: Apparent temperature below -20°C at Gorak Shep / Kala Patthar creates immediate frostbite + hypothermia risk during standard tea-house overnight exposure.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    The EBC corridor is the busiest high-altitude trekking route in
    Nepal — Sagarmatha National Park recorded 45,000+ trekker entries in
    peak spring seasons. Lukla flights, tea-house kerosene heating, and
    porter/yak logistics drive a documented per-visitor carbon and
    waste footprint. Sagarmatha Pollution Control Committee and the
    Nepal Tourism Board (via TIMS-successor local permits) coordinate
    waste-carry-out rules and visitor caps at Base Camp itself, where
    overnight camping is limited to expedition season.

