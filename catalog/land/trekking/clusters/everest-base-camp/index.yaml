description:
  en: |
    The Everest Base Camp (EBC) trek is the flagship high-altitude trek of
    the Khumbu region in Sagarmatha National Park, Nepal. The classic
    round-trip route from Lukla (2860 m) to Everest Base Camp (5364 m) and
    the Kala Patthar viewpoint (5644 m) covers roughly 130 km over 12-14
    days, with a mandatory fly-in/fly-out at the short mountain airstrip
    of Lukla. Terrain progresses from forested river valleys through
    Sherpa villages to glacial moraine and high-altitude scree above
    5000 m, with the Khumbu Glacier's lateral moraine forming the final
    approach to Base Camp itself. The trail is served by a dense
    tea-house network offering food, beds, and basic warmth at every
    overnight stop, so no tents are required on the standard itinerary.
    A Sagarmatha National Park entry permit and a Khumbu Pasang Lhamu
    Rural Municipality entry permit are both required; independent
    trekking is legal but most visitors travel with a licensed guide
    given altitude risk. The safe trekking windows are the post-monsoon
    Oct-Nov and pre-monsoon Mar-May seasons; the route is defined by its
    signature landmarks — Namche Bazaar, Tengboche Monastery, Dingboche,
    Gorak Shep, and the Base Camp icefall itself.

