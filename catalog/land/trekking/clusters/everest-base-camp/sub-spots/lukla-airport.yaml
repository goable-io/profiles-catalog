description:
  en: |
    Lukla (2860 m) is the EBC trek's mandatory air gateway, served by
    the notoriously short 527 m Tenzing-Hillary Airport runway. Nearly
    all trekkers fly in and out here via Kathmandu or Ramechhap, and
    the village's tea-houses form the first and last overnight stop of
    the standard itinerary.

