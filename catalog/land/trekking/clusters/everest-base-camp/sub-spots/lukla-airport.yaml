tier_rationale:
  en: |
    Tenzing-Hillary Airport at Lukla (2860 m) is the fixed-wing gateway
    to the Khumbu and the practical start/end point of the Everest Base
    Camp trek. The runway is only 527 m long, sloped at roughly 12%, and
    bounded by a mountainside on one end and a sheer drop on the other —
    it is widely regarded as one of the most demanding STOL (short
    take-off and landing) airstrips in commercial aviation. Flights
    operate only in daylight with visual-flight-rules minimums and are
    routinely cancelled or delayed by cloud, wind, or crosswind, which
    can strand trekkers for multiple days at either end. There is no
    hut/tent camp requirement here — trekkers stay in Lukla's tea-houses
    — but the elevated cancellation risk, tight village-street funnel of
    porters and cargo, and total dependence on a single fair-weather
    air corridor for evacuation to Kathmandu place it above a simple
    trailhead in operational complexity.

