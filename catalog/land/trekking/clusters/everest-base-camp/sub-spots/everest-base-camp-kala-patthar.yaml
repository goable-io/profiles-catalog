tier_rationale:
  en: |
    This sub-spot covers the terminal high-altitude objective of the
    trek: Everest Base Camp itself (5364 m), reached across the Khumbu
    Glacier's shifting lateral moraine from Gorak Shep, and the Kala
    Patthar viewpoint (5644 m) — the world's highest 5000+ m point
    routinely accessible to trekkers without technical climbing gear.
    Both stages are typically done from Gorak Shep on summit-style
    pre-dawn starts of 4-6 hours round trip, over loose talus and
    glacial rubble with no marked path in places. Full AMS/HACE/HAPE
    exposure applies at this elevation; a guide and Sagarmatha NP permit
    are mandatory, tea-house beds exist only at Gorak Shep (5164 m) —
    there is no overnight shelter at Base Camp or Kala Patthar
    themselves — and evacuation beyond basic first aid requires
    helicopter extraction, which is itself weather- and altitude-
    limited. This is the most committing, remote, and physiologically
    demanding stage of the entire EBC trek.

