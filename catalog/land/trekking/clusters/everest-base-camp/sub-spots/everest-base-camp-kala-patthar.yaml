description:
  en: |
    The trek's terminal high-altitude objectives: Everest Base Camp
    (5364 m) on the Khumbu Glacier moraine, and the Kala Patthar
    viewpoint (5644 m) above Gorak Shep, offering the classic close-up
    view of Everest's summit pyramid. Both are reached on exposed,
    high-altitude, guide-led pre-dawn pushes from Gorak Shep.

