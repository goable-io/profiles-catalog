description:
  en: |
    Namche Bazaar (3440 m) is the cultural and logistical heart of the
    Khumbu, a terraced Sherpa town built into a natural amphitheatre.
    Nearly every EBC itinerary schedules an acclimatization day here,
    and its dense tea-house, bakery, and gear-shop network makes it the
    trek's most comfortable overnight stop.

