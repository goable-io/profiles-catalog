tier_rationale:
  en: |
    Namche Bazaar (3440 m) is the Khumbu's largest Sherpa settlement and
    the trek's principal acclimatization hub, typically reached on day
    2-3 after a steep ~800 m climb from the Dudh Kosi river at Phakding.
    Standard itineraries schedule a mandatory rest day here to reduce
    AMS risk before continuing above 3500 m. The trail is a well-marked
    stone-and-dirt path with suspension-bridge river crossings and no
    technical difficulty, and the village itself has the densest
    tea-house, lodge, bakery, and clinic (Himalayan Rescue Association
    post) concentration on the entire route. Evacuation is straight-
    forward via a short helicopter hop or a multi-day walk-out to Lukla;
    the principal hazard at this stage is altitude-gain rate rather than
    terrain, since Namche sits just below the threshold where AMS
    incidence rises sharply.

