gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: HIMALAYAN_MONSOON_DELUGE
    description: Precipitation above 5 mm/h in the Markha Valley signals rare but hazardous cloudburst conditions in this cold-desert region, with flash-flood risk in the narrow river gorge sections used as the trail — trek closes immediately.

  - metric: wind_speed_kn
    condition: gt
    value: 40
    reason_code: HIGH_ALTITUDE_WIND
    description: Sustained wind above 40 knots forces closure of the Kongmaru La crossing — hypothermia + wind-chill risk exceeds safe pass-crossing threshold on this exposed trans-Himalayan pass.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_PASS
    description: Visibility below 500 m on the Kongmaru La approach prevents cairn + trail navigation across the rock and scree high-pass terrain.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: HIMALAYAN_HYPOTHERMIA
    description: Apparent temperature below -20°C on the Kongmaru La approach or at high camp creates immediate frostbite + hypothermia risk given Ladakh's continental cold-desert temperature swings.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    Hemis National Park administers entry permits for the Markha
    Valley corridor, and the homestay-based lodging model (rather than
    commercial tea-houses) distributes visitor impact across village
    households while still creating documented water and firewood
    pressure in this arid cold-desert ecosystem. The trek's brief
    Jun-Sep season concentrates visitor volume sharply; local Ladakhi
    trekking associations coordinate with Hemis NP on homestay
    rotation and pack-animal grazing management to limit trail and
    pasture degradation.

