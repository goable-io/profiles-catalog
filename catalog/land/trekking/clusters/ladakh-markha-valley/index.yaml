description:
  en: |
    The Markha Valley trek is the classic multi-day route through
    Hemis National Park in Ladakh, India's trans-Himalayan cold-desert
    region. The route runs roughly 60-70 km over 6-9 days, starting
    near Leh at the Spituk monastery trailhead (3300 m) and crossing
    the Kongmaru La pass (5260 m) near its eastern end. Terrain is
    high-altitude cold desert — arid river-valley walking on gravel
    and sand tracks through willow-and-poplar oasis villages, framed by
    stark, treeless mountainsides, transitioning to rock and scree on
    the pass approaches. A homestay network in villages such as Skiu,
    Markha, and Hankar provides overnight lodging and meals, so tents
    are optional but recommended as backup. A Hemis National Park entry
    permit (Inner Line Permit for the wider Ladakh region where
    applicable) is required, and while independent trekking is
    possible for experienced hikers, a local guide is recommended given
    the pass crossing and river-ford sections. Ladakh's brief safe
    trekking window is Jun-Sep, since the region lies in the Himalayan
    rain shadow and is snowbound outside summer; Markha village and the
    Kongmaru La crossing form the trek's signature stages.

