tier_rationale:
  en: |
    The Spituk monastery trailhead (3300 m) sits a short drive from Leh
    and marks the western start of the Markha Valley trek. The
    opening stages follow the Indus and Zanskar river confluence area
    and the Jingchan/Rumbak side valley on a wide, well-trodden gravel
    track with gentle grade, passing through the Hemis National Park
    buffer zone with regular blue-sheep and occasional snow-leopard
    habitat. Homestays and basic camping are available at Rumbak;
    river crossings here are minor and seasonal cell coverage exists
    near Leh's outskirts. Road-based evacuation back to Leh is same-day
    given the trailhead's proximity to the city, making this the most
    accessible and forgiving stage of the trek.

