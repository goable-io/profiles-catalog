tier_rationale:
  en: |
    Kongmaru La (5260 m) is the Markha Valley trek's eastern high-pass
    crossing, typically climbed from a high camp near Nimaling
    (4700 m) in a committing 6-8 hour, roughly 12-14 km day over rock
    and scree with a steep, loose final approach and a long descent
    toward Chogdo/Sumdo at the edge of Hemis National Park. There is no
    fixed shelter on the pass itself, and the descent side involves
    exposed narrow gorge sections. A pre-dawn start is standard to
    avoid afternoon wind. Full AMS exposure applies given the
    accumulated altitude from Nimaling camp, cell coverage is absent on
    the crossing, and evacuation once committed requires either a
    multi-hour walk to Chogdo/Sumdo or helicopter extraction — the
    most remote and demanding stage of the Markha Valley trek.

