tier_rationale:
  en: |
    Markha village (3800 m) is the largest hamlet on the trek and the
    homestay base typically reached around day 3-4, sitting below a
    ruined fort and gompa on the Markha river. The trail to this point
    involves several unbridged river fords through the Markha gorge
    that can run high with snowmelt in early summer, requiring
    careful timing and occasionally guide assistance. Markha's cluster
    of family homestays offers meals, beds, and basic warmth, making it
    the trek's most comfortable overnight stop after the western
    approach villages. Evacuation from here is a multi-day walk-out in
    either direction or a helicopter lift; the principal hazards en
    route are river-crossing depth/flow rather than technical terrain.

