description:
  en: |
    Alta Via 2 is the longer and more technical sibling of Alta Via 1,
    running roughly 160-180 km over 13-16 days from Rifugio Plose above
    Bressanone south to Feltre. Altitude ranges from around 1200 m in the
    forested approach valleys to nearly 2930 m near the Marmolada massif,
    with terrain including rocky ridgelines, scree traverses, and several
    short via-ferrata-protected sections that require a harness and
    lanyard set. The route is served by CAI staffed refuges spaced along
    each stage, with cable-car access available at a handful of points
    (notably Passo Pordoi) for resupply or bail-out. No permit is
    required, though guide engagement is commonly recommended for the
    Marmolada-area via-ferrata stages. Optimal season is early July to
    mid-September given later snow-melt on the higher passes; the
    Sella massif crossing at Passo Pordoi and the Marmolada glacier
    approach are the route's signature landmarks.

