tier_rationale:
  en: |
    Rifugio Passo Cereda (1361 m) is a southern AV2 waypoint on the
    stages descending toward Feltre, reached by several hundred metres
    of descent on well-marked forest and rocky trail from the higher
    Pale di San Martino sector. The staffed refuge sits directly on a
    minor paved road (SP347), giving straightforward vehicle-based
    evacuation unlike most AV2 huts, and offers food, water, and mobile
    coverage. The principal hazard on the approach stages is loose rock
    on the descent from the higher Pale di San Martino terrain rather
    than any risk at the refuge itself.

