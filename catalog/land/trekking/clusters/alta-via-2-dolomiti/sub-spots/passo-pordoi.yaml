tier_rationale:
  en: |
    Passo Pordoi (2239 m) is the AV2 stage 4-5 crossing of the Sella
    massif, reached by roughly 600-800 m of ascent on rocky, well-marked
    trail from either adjoining stage, with talus and scree sections
    near the pass itself. A cable car from the pass road to Sass Pordoi
    (2950 m) provides an alternate high-altitude viewpoint and a fast
    evacuation option independent of the walking route, and the pass
    itself sits on a paved road with restaurants and mobile coverage.
    Hazards are afternoon thunderstorm exposure on the open saddle and
    loose talus underfoot on the steeper approach sections.

