tier_rationale:
  en: |
    Rifugio Plose (2447 m) near Bressanone is the AV2 stage 1 entry
    point, reached from the Plose cable car and chairlift station via a
    short, wide, well-graded path (~30-45 minutes, under 100 m gain)
    across open alpine meadow. The staffed refuge and the mountain
    station's restaurant offer food, water, and full mobile coverage,
    with the cable car providing near-instant evacuation back to
    Bressanone. Worst-case consequence at this sub-spot is weather
    exposure on the open plateau, fully recoverable by returning to
    the cable-car station.

