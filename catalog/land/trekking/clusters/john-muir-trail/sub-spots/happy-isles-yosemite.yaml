tier_rationale:
  en: |
    Happy Isles, 1250 m, is the northern trailhead of the John Muir
    Trail in Yosemite Valley — a paved, shuttle-accessible location
    with restrooms, ranger station, and full cell coverage. The
    immediate trail (shared with the Mist Trail / Vernal-Nevada Falls
    route) is a wide, well-maintained granite-paved and stepped path
    with heavy day-visitor traffic and benign gradient for its first
    stretch. Water, food, and emergency services are available in
    Yosemite Valley within minutes. Wilderness permit required only
    once continuing past the day-use zone. Worst-case consequence at
    the trailhead itself is low: full vehicle and medical evacuation
    access exists year-round.

