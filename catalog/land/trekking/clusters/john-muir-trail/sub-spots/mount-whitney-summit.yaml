tier_rationale:
  en: |
    Mount Whitney's summit, 4421 m, is the highest point in the
    contiguous United States and the John Muir Trail's southern
    terminus, reached via a final ~3200 m of cumulative elevation
    gain from Happy Isles over 3-4 weeks, or a steep ~1900 m single
    push from Whitney Portal on rocky switchbacks and exposed granite
    slabs above tree line. Altitude sickness and afternoon lightning
    on the largely shelterless summit ridge are the defining hazards;
    a wilderness permit issued through a competitive lottery is
    mandatory for the Whitney Zone exit. No hut exists — an emergency
    stone shelter near the summit is explicitly NOT lightning-safe.
    Cell coverage is intermittent, and evacuation from the summit
    plateau requires either a multi-hour descent on foot or helicopter
    rescue in a genuine emergency.

