  notes: |
    Cluster inherits trekking base scoring exactly (no dimension/gate
    overrides) — the Sierra Nevada high country lacks a dedicated
    rockies region variant in this catalog phase, so weights/curves
    are copied verbatim from the trekking base profile. 12-week
    typical season reflects the narrow July-September high-Sierra
    snow-free window, shorter than the base profile's 36-week default.
