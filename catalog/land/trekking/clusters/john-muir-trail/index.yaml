description:
  en: |
    The John Muir Trail is a roughly 340 km (211 mi), 3-4 week
    high-Sierra classic running from Happy Isles in Yosemite Valley
    (1250 m) south to the Mount Whitney summit (4421 m), the highest
    point in the contiguous United States. The route crosses seven
    major passes above 3300 m, largely on well-graded granite and dirt
    trail through Yosemite, Ansel Adams Wilderness, Kings Canyon, and
    Sequoia National Parks, with backcountry camping at durable
    established sites rather than a hut system. Permits are quota-
    controlled by the National Park Service / US Forest Service via
    a competitive lottery (Yosemite trailhead) and Inyo National
    Forest (Whitney exit); bear canisters are mandatory throughout.
    Season runs roughly July-September, bounded by snowpack at the
    high passes early and first snow late; afternoon thunderstorms
    are a recurring hazard above tree line. Resupply is via a small
    number of remote pack-stations or trail towns (Tuolumne Meadows,
    Muir Trail Ranch, Independence via Kearsarge Pass).

