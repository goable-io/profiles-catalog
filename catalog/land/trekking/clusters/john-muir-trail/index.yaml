gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m makes off-trail navigation unsafe, particularly at unmarked high passes above tree line.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain creates slippery granite trail, flash-flood risk in Sierra creek crossings, and hypothermia exposure above tree line.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on exposed high passes (Forester, Muir, Whitney) creates fall risk on narrow switchbacks.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 12
  carrying_capacity_sensitivity: high
  notes: |
    NPS/USFS enforce a strict trailhead-quota permit lottery for the
    Yosemite (Happy Isles) start and a separate exit-quota system at
    the Whitney Portal / Mt. Whitney Zone, both heavily oversubscribed
    in peak season. Bear canisters are legally mandatory across the
    length of the trail following decades of habituated-bear food
    conflicts. Carrying capacity sensitivity is high given the JMT's
    status as one of the most sought-after long-distance permits in
    the US wilderness system.

