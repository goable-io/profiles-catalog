description:
  en: |
    The GR20's most iconic and technical section, historically a
    committing scramble through the Cirque de la Solitude and now
    permanently rerouted via a via-ferrata-equipped bypass over the
    Pointe des Éboulis at 2007 m following a 2015 fatal rockfall.

