tier_rationale:
  en: |
    The historic Cirque de la Solitude section on the GR20's northern
    stages was permanently closed after a fatal 2015 rockfall and is now
    rerouted via the via-ferrata-equipped Pointe des Éboulis bypass at
    around 2007 m, involving roughly 2-3 hours of chain- and
    cable-protected scrambling on exposed granite slabs and boulder
    fields with significant rockfall potential from above. There is no
    hut within the section itself, mobile coverage is intermittent in
    the surrounding high terrain, and evacuation in poor weather or after
    injury effectively requires helicopter extraction given the terrain's
    remoteness and technicality. This remains the single most demanding
    and consequence-heavy section on the entire GR20.

