tier_rationale:
  en: |
    Col de Bavella (1218 m) sits in the GR20's gentler southern sector,
    approached by well-marked, established trail through Corsican pine
    forest transitioning to open granite terrain beneath the Aiguilles
    de Bavella spires, with moderate elevation change of a few hundred
    metres between stages. The pass sits directly on a paved road (D268)
    with restaurants and mobile coverage, giving straightforward vehicle
    evacuation unlike most GR20 sections, and Refuge de Paliri and
    Refuge d'Asinau bracket the surrounding stages with staffed shelter
    and water. Hazards are limited to standard afternoon thunderstorm
    exposure on the open granite sections and loose rock underfoot near
    the spires.

