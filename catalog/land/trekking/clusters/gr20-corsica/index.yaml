gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: ALPINE_WHITEOUT
    description: Visibility below 300m in alpine terrain creates immediate route-finding hazard; high-altitude rescue often impossible.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_PRECIPITATION_ALPINE
    description: Heavy active precipitation in alpine terrain triggers flash floods in gullies and rapidly degrades trail surface.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: ALPINE_HIGH_WIND
    description: Sustained wind above 50 knots at alpine altitude makes ridge traverses and exposed sections dangerous.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: EXTREME_COLD_ALPINE
    description: Apparent temperature below -20°C in alpine terrain creates immediate frostbite risk.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 16
  carrying_capacity_sensitivity: high
  notes: |
    The GR20 is human-powered with zero direct emissions per session.
    The Parc Naturel Régional de Corse operates a mandatory refuge and
    camping-platform reservation system precisely because carrying
    capacity is a documented concern — northern stages around the
    Cirque de la Solitude and Monte Cinto sector see severe bottlenecks
    in peak July-August weeks. Following the fatal 2015 rockfall, PNRC
    closed and permanently rerouted the historic Cirque de la Solitude
    scramble via a via-ferrata-equipped bypass, an explicit carrying-
    capacity and safety intervention.

