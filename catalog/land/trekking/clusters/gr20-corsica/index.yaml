description:
  en: |
    The GR20 crosses the granite spine of Corsica from Calenzana in the
    north to Conca in the south over roughly 180 km and 15-16 stages,
    widely regarded as one of Europe's most physically demanding
    long-distance treks. Altitude ranges from around 600 m at the
    southern trailheads to over 2200 m on the northern high stages,
    with terrain switching between exposed granite slabs, boulder
    fields, and short chain- and ladder-protected scramble sections
    (particularly north of Vizzavona). The route is served by Parc
    Naturel Régional de Corse (PNRC) refuges and designated camping
    platforms; wild camping outside these sites is prohibited. No
    permit is required for day access, but overnight camping on refuge
    platforms must be booked through the PNRC reservation system.
    Optimal season is mid-June to early October, with snow persisting
    at altitude into June some years; the historic Cirque de la
    Solitude scramble and the granite towers above Col de Bavella are
    the trek's signature landmarks.

