tier_rationale:
  en: |
    Besisahar (760 m) is the traditional road-head start of the
    Annapurna Circuit, reached by a 5-6 hour bus or jeep ride from
    Kathmandu or Pokhara. The trail from here follows the Marsyangdi
    river valley on a wide, well-marked, gently-graded path through
    subtropical rice-terrace villages, and although a motorable road
    now extends jeep access well beyond Besisahar toward Chame and even
    Manang, the trailhead retains its role as the circuit's low-
    altitude starting gate. Tea-houses are dense and inexpensive at
    this stage, river crossings are on permanent bridges, cell coverage
    is reliable, and road-based evacuation to Pokhara is same-day. This
    is the most benign and accessible stage of the entire circuit.

