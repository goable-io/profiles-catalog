    Besisahar (760 m) is the traditional trailhead of the Annapurna
    Circuit, gateway to the Marsyangdi valley. Though a jeep road now
    extends much further up-valley toward Manang, Besisahar remains
    the circuit's low-altitude starting point, with dense budget
    tea-houses and easy road access.

