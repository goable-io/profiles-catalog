description:
  en: |
    Manang (3540 m) is the Annapurna Circuit's high-altitude desert
    village and the trek's essential acclimatization stop before
    Thorong La. Nearly every itinerary schedules a rest day here, and
    its dense tea-house network makes it the most comfortable overnight
    stop above 3000 m on the route.

