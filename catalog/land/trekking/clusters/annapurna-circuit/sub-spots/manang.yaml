tier_rationale:
  en: |
    Manang (3540 m) sits in the rain-shadow of the Annapurna massif and
    is the circuit's iconic acclimatization stop before the Thorong La
    crossing, typically reached around day 6-7 with a mandatory rest
    day scheduled here on most itineraries. The high alpine desert
    terrain around Manang is dry, wide, and well-trodden, and the
    village has the densest tea-house concentration above 3000 m on the
    route, including a Himalayan Rescue Association altitude-sickness
    aid post that runs daily briefings in season. Evacuation is
    feasible via helicopter or a multi-day walk-back down-valley; the
    principal risk at this stage is AMS from the accumulated altitude
    gain rather than technical terrain difficulty.

