tier_rationale:
  en: |
    Thorong La (5416 m) is the world's most-crossed high mountain pass
    on a trekking itinerary, connecting Thorong Phedi (4450 m) to
    Muktinath (3760 m) in a single committing 8-9 hour, roughly 15 km
    day with no viable overnight shelter or easy retreat once past the
    midpoint. The route climbs steep switchback scree and can carry
    snow cover into shoulder season, with the descent to Muktinath
    losing over 1600 m on loose talus and moraine. A pre-dawn start is
    standard to avoid afternoon wind and cloud buildup, and full AMS
    exposure applies given the rapid ascent from Phedi. A guide is
    strongly recommended and the crossing has a documented history of
    weather-related fatalities (notably the October 2014 blizzard);
    evacuation once committed to the pass is helicopter-only or a
    multi-hour walk to either end.

