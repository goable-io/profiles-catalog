description:
  en: |
    Thorong La (5416 m) is the Annapurna Circuit's committing high-pass
    crossing, linking Thorong Phedi to Muktinath in a single long,
    exposed day over scree and moraine. It is the most-crossed 5000+ m
    trekking pass in the world and the circuit's defining stage.

