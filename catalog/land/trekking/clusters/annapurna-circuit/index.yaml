description:
  en: |
    The Annapurna Circuit is one of the world's classic long-distance
    treks, looping around the Annapurna massif through the Annapurna
    Conservation Area in central Nepal. The full route runs roughly
    160-230 km depending on start/end points and road-encroachment
    shortcuts, over 12-18 days, with an altitude range from about 760 m
    at Besisahar to 5416 m at the Thorong La pass. Terrain shifts
    dramatically from subtropical river valleys and rice terraces in
    the lowlands to high alpine desert in the rain-shadow Manang valley
    and glaciated high pass terrain near Thorong La. A dense tea-house
    network covers the entire route, so tents are not required on the
    standard itinerary. An Annapurna Conservation Area Permit (ACAP) and
    a TIMS (Trekkers' Information Management System) card are both
    required, and while independent trekking is legal, a guide is
    strongly recommended for the pass crossing. Safe trekking windows
    are the post-monsoon Oct-Nov and pre-monsoon Mar-May seasons; road
    construction has shortened some lower sections in recent years,
    with Manang and the Thorong La crossing remaining the trek's
    signature stages.

