gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: HIMALAYAN_MONSOON_DELUGE
    description: Precipitation above 5 mm/h on the Annapurna Circuit signals monsoon-band arrival with rapid trail-washout + landslide + river-crossing failure risk — trek closes immediately.

  - metric: wind_speed_kn
    condition: gt
    value: 40
    reason_code: HIGH_ALTITUDE_WIND
    description: Sustained wind above 40 knots forces closure of the Thorong La crossing — hypothermia + wind-chill risk exceeds safe pass-crossing threshold.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_PASS
    description: Visibility below 500 m on the Thorong La approach prevents cairn + trail navigation and has historically been implicated in fatal whiteout incidents on this pass.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: HIMALAYAN_HYPOTHERMIA
    description: Apparent temperature below -20°C at Thorong Phedi high camp or on the pass creates immediate frostbite + hypothermia risk during the committing Phedi-to-Muktinath crossing.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    The Annapurna Conservation Area is Nepal's largest protected area
    and its highest-visitor-volume trekking region, with ACAP recording
    tens of thousands of permit entries per peak season. Tea-house
    diesel/kerosene heating, porter and mule-train logistics, and road
    encroachment into former trail sections have altered the route's
    footprint over the past decade. The Annapurna Conservation Area
    Project (ACAP) enforces permit-tracked visitor caps and coordinates
    with Nepal TAAN on operator SOP, particularly around Thorong La
    crossing-day traffic management.

