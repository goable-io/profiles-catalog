description:
  en: |
    Kungsleden ("the King's Trail") runs roughly 440 km through Swedish
    Lapland's arctic wilderness from Abisko in the north to Hemavan in
    the south, crossing the Sarek/Sjaunja high-mountain region. The
    northern stretch covered by this cluster, Abisko to Saltoluokta
    (roughly 105 km, typically walked in 5-6 days), passes through
    subarctic birch forest, open tundra, and the Tjäktja Pass at
    1150 m — the trail's highest point. Terrain alternates between
    duckboard-covered wetland, rocky moraine, and gravel path, with
    altitude ranging from about 340 m at Abisko to 1150 m at the pass.
    The Svenska Turistföreningen (STF) operates a chain of staffed
    huts and unstaffed shelters roughly a day's walk apart, each with
    wood-fired sauna and emergency provisions; a small number of
    unbridged streams require fording, and the Vakkotavare-Saltoluokta
    leg ends with a boat/ferry crossing of Langas lake in summer. The
    reliable trekking season runs late June to mid-September; snow can
    persist on the pass into July and arctic weather can turn from calm
    to storm within hours even in midsummer.

