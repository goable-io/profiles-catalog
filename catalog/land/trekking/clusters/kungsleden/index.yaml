gates:
  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: NAVIGATION_HAZARD
    description: Visibility below 300m on the exposed Tjäktja Pass tundra crossing makes cairn-to-cairn navigation unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_ACTIVE_RAIN
    description: Heavy active rain saturates duckboard sections, raises unbridged fords, and elevates hypothermia exposure above tree line.

  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: HIGH_WIND_EXPOSED
    description: Sustained wind above 50 knots on the open arctic-tundra pass crossing creates fall and hypothermia risk with no shelter available.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 11
  carrying_capacity_sensitivity: medium
  notes: |
    Human-powered trek with zero direct emissions per session. STF
    (Svenska Turistföreningen) operates the hut network under a
    reservation-recommended, walk-up-tolerant model; carrying capacity
    is moderate compared to Alpine or Himalayan flagship treks but the
    Abisko gateway and boat-crossing bottleneck at Saltoluokta see
    concentrated peak-July demand.

