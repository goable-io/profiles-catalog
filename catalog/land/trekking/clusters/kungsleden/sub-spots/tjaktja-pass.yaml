tier_rationale:
  en: |
    Tjäktja Pass (1150 m) is the highest point on the Kungsleden main
    trail, reached via a long approach of roughly 15-18 km and 600+ m
    of cumulative ascent from the nearest STF huts at Alesjaure or
    Sälka, typically a full trekking day each way. The crossing is a
    fully exposed arctic-tundra traverse above the tree line on rock
    and gravel path with duckboards over the wettest sections; snow
    can persist on the pass into July, and there is no shelter, hut,
    or reliable mobile coverage anywhere on the crossing itself.
    Sudden arctic weather shifts (whiteout, high wind, sub-zero wind
    chill even in summer) are the defining hazard, and evacuation from
    the pass requires a multi-hour walk back to the nearest staffed
    hut or a helicopter response coordinated through Swedish Mountain
    Rescue.

