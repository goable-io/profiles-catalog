tier_rationale:
  en: |
    Abisko (385 m) is the northern trailhead of Kungsleden, sitting
    inside Abisko National Park and directly served by the E10 road
    and the Abisko Östra/Turiststation railway station, making it the
    most accessible point on the whole trail. The surrounding terrain
    is gentle lakeside and birch-forest path around Torneträsk lake,
    well-marked and maintained, with the STF (Svenska Turistföreningen)
    Abisko Turiststation offering staffed accommodation, a shop,
    restaurant, and mountain-safety desk with daily condition reports.
    Mobile coverage is reliable in the village, and road/rail access
    gives straightforward evacuation, making Abisko a low-risk starting
    point regardless of a trekker's onward ambitions south into the
    high-mountain sections.

