tier_rationale:
  en: |
    Saltoluokta STF mountain station marks the ferry-crossing waypoint
    in the southern sector of the Kungsleden cluster, reached from
    Vakkotavare via a short boat crossing of Langas lake in summer.
    The bus-and-boat combination replaces a multi-day walk-around when
    the ferry runs, then a roughly 4-hour, 500 m ascent through birch
    forest leads to the station itself. The staffed STF facility
    offers full-service accommodation, meals, and a mountain guide
    desk, but the boat-dependent access point introduces schedule and
    weather-dependent logistics not present on purely trail-based
    sections.

