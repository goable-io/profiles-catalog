tier_rationale:
  en: |
    Laguna Torre, 620 m, is reached via an approximately 9-10 km
    one-way, 3-3.5 hour walk from El Chaltén on a well-graded dirt
    and gravel trail through lenga forest with far gentler elevation
    gain (under 250 m) than the Laguna de los Tres approach, making
    it the easier-gradient of the two classic day-hikes. The lake
    faces Cerro Torre's needle spire across floating glacial ice.
    Free Campamento De Agostini sits near the lakeshore with river
    water; cell coverage is intermittent. Wind funnels strongly
    across the open lake basin. Evacuation is on foot along the same
    valley trail back to El Chaltén, generally straightforward given
    the gentle grade.

