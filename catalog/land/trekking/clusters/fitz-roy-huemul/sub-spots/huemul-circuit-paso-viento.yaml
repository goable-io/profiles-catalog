tier_rationale:
  en: |
    Paso del Viento, 1550 m, is the high point of the ~64 km, 4-day
    Huemul Circuit, a committing loop over two glaciated mountain
    passes with sweeping views across the Southern Patagonian Ice
    Field. The route requires an unassisted Tyrolean-traverse
    crossing of both the Río Túnel and Río Fernández using rope,
    harness, and pulley carried by the trekker — a mandatory
    technical skill checked by APN before permit issuance. Terrain
    includes loose talus, glacial ice margins, and sections with no
    marked trail, navigated by cairn and map. There is no hut system;
    trekkers carry full camping kit and cross entirely exposed,
    wind-scoured terrain with no cell coverage and no realistic
    evacuation short of a multi-day walk-out or helicopter rescue in
    a genuine emergency, making this by far the most remote and
    consequential sub-spot in the cluster.

