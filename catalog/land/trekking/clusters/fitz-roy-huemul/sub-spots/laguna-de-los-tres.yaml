tier_rationale:
  en: |
    Laguna de los Tres, 1200 m, is El Chaltén's signature day-hike:
    roughly 10 km one-way, 4 hours, on well-marked dirt trail through
    lenga forest with a steep, exposed final ~400 m ascent on loose
    rocky switchbacks directly beneath the sheer granite north face
    of Monte Fitz Roy. The final pitch is unshaded and windswept with
    no shelter; wind gusts here are notably amplified by the glacial
    cirque topography. Free Campamento Poincenot below the ascent
    offers a tent base with river water; cell coverage is intermittent
    above the forest line. Evacuation from the lake is entirely on
    foot back down the same trail — no vehicle or heli access above
    Poincenot in routine conditions.

