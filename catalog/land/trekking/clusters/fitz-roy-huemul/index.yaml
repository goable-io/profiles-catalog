gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: PATAGONIAN_WIND
    description: Sustained wind above 55 knots on El Chaltén's exposed ridgelines (Huemul Circuit passes especially) exceeds safe trekking threshold — trekkers are routinely blown off feet.

  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: ANDEAN_STORM
    description: Precipitation above 5 mm/h signals convective storm activity with trail-washout and Río Túnel / Río Fernández level-rise risk that can strand Huemul Circuit trekkers.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_ANDES
    description: Visibility below 500 m at Laguna de los Tres, Laguna Torre, or Huemul Circuit passes prevents navigation and removes the iconic Fitz Roy / Cerro Torre / ice-field views.

  - metric: apparent_temp_c
    condition: lt
    value: -12
    reason_code: ANDEAN_HYPOTHERMIA
    description: Apparent temperature below -12°C at Patagonian high camps creates frostbite risk during trekking-tent overnight exposure, compounded by wind chill.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 20
  carrying_capacity_sensitivity: high
  notes: |
    APN (Administración de Parques Nacionales) provides free, open
    access to the day-hike network around El Chaltén with no permit
    fee, but the Huemul Circuit requires mandatory registration,
    equipment inspection (crampons, harness, rope for the Tyrolean
    traverses), and proof of experience or a certified guide,
    reflecting its higher objective hazard and lower rescue
    accessibility. Free campamentos (Poincenot, De Agostini, Río
    Túnel) have no bookable capacity limit but are subject to Leave
    No Trace enforcement by rangers.

