description:
  en: |
    The El Chaltén sector of Parque Nacional Los Glaciares in
    Argentine Patagonia offers free, open-access trekking (no permit
    fee, APN ranger oversight) ranging from the classic day-hikes to
    Laguna de los Tres beneath Monte Fitz Roy and Laguna Torre beneath
    Cerro Torre, to the far more committing multi-day Huemul Circuit.
    Day-hike altitudes run 400-1200 m with well-marked dirt trail and
    established free campamentos; the Huemul Circuit is a ~4-day,
    ~64 km loop climbing to 1550 m at Paso del Viento, crossing two
    glaciated passes and requiring an unassisted Tyrolean-traverse
    crossing of the Río Túnel and Río Fernández — permit-controlled
    and gear-checked by APN due to its technical demands. Patagonian
    westerly wind, identical in character to Torres del Paine across
    the border, is the dominant hazard throughout. Season is the
    austral summer (November-March); El Chaltén itself has no permit
    fee but Huemul Circuit trekkers must register and demonstrate
    Tyrolean-traverse and glacier-travel competence or hire a guide.

