description:
  en: |
    The Manaslu Circuit is a restricted-area trek that loops around the
    eighth-highest mountain in the world, Mount Manaslu (8163 m), in
    west-central Nepal. The route runs roughly 150-180 km over 14-18
    days, from the Budhi Gandaki river lowlands near Soti Khola (700 m)
    up through the Nubri and Tsum valleys to the Larke La pass (5106 m)
    before descending into the Manang region to link with the Annapurna
    trail network. Terrain progresses from subtropical terraced
    farmland and dense forest through narrow gorge sections with
    exposed cliffside trail to high alpine moraine and glaciated pass
    terrain near Larke La. A growing but less dense tea-house network
    covers most of the route compared to Everest or Annapurna, and the
    upper Nubri valley remains a Restricted Area requiring a Manaslu
    Restricted Area Permit (RAP), a Manaslu Conservation Area Permit
    (MCAP), and an Annapurna Conservation Area Permit (ACAP) for the
    Larke La descent side — all of which mandate trekking with a
    licensed guide and in a minimum group of two. Safe trekking windows
    are the post-monsoon Sep-Nov and pre-monsoon Mar-May seasons, with
    Samagaon and the Larke La crossing forming the trek's signature
    high-altitude stages.

