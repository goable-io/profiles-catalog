gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: HIMALAYAN_MONSOON_DELUGE
    description: Precipitation above 5 mm/h on the Manaslu Circuit signals monsoon-band arrival with rapid trail-washout + landslide risk in the narrow Budhi Gandaki gorge sections — trek closes immediately.

  - metric: wind_speed_kn
    condition: gt
    value: 40
    reason_code: HIGH_ALTITUDE_WIND
    description: Sustained wind above 40 knots forces closure of the Larke La crossing — hypothermia + wind-chill risk exceeds safe pass-crossing threshold.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_PASS
    description: Visibility below 500 m on the Larke La approach prevents cairn + trail navigation across the glaciated high-pass terrain between Dharmasala and Bimtang.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: HIMALAYAN_HYPOTHERMIA
    description: Apparent temperature below -20°C at Dharmasala high camp or on the pass creates immediate frostbite + hypothermia risk during the committing Dharmasala-to-Bimtang crossing.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    The Manaslu Conservation Area and the upper Nubri Restricted Area
    enforce mandatory guide + minimum-group-of-two rules that function
    as a direct carrying-capacity control, keeping visitor volume far
    below Everest or Annapurna levels. Tea-house diesel/kerosene
    heating and porter/mule logistics still drive a documented
    per-visitor footprint in the narrow gorge villages. The Manaslu
    Conservation Area Project (MCAP) and Nepal's Department of
    Immigration jointly administer the Restricted Area Permit system
    that caps and tracks entries.

