description:
  en: |
    Samagaon (3520 m) is the Manaslu Circuit's essential acclimatization
    village below Larke La, and the base for an optional side trip
    toward the Manaslu Base Camp viewpoint. Its tea-house cluster is
    the best-developed above 3000 m on the route.

