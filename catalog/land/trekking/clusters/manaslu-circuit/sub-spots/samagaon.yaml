tier_rationale:
  en: |
    Samagaon (3520 m) is the key acclimatization stop below Larke La,
    typically reached around day 6-7 with a rest day scheduled here on
    most itineraries, often used for a side trip toward the Manaslu
    Base Camp viewpoint (adding roughly 6-8 hours round trip on
    moraine and glacial-approach terrain). The village trail itself is
    a well-established alpine path with moderate grade, and Samagaon
    has the region's best-developed tea-house cluster above 3000 m,
    including basic medical aid in season. Evacuation is feasible via
    helicopter or a multi-day walk-back down the Budhi Gandaki valley;
    the principal risk at this stage is AMS from accumulated altitude
    gain, compounded for trekkers who add the Base Camp side trip
    without adequate acclimatization.

