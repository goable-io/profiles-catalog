tier_rationale:
  en: |
    Larke La (5106 m) is the Manaslu Circuit's high-point pass
    crossing, connecting the Dharmasala high camp (4460 m) to Bimtang
    (3720 m) in a single committing 8-10 hour, roughly 15-19 km day
    with no shelter and minimal retreat options once past the
    midpoint. The route climbs over glacial moraine and can hold
    significant snow cover into shoulder season, with the descent to
    Bimtang losing over 1300 m on loose talus and occasionally icy
    terrain. A pre-dawn start is standard given the length of the day
    and afternoon wind/cloud risk. Full AMS exposure applies given the
    accumulated altitude from Samagaon, a guide is mandatory under the
    Restricted Area permit rules, and evacuation once committed is
    helicopter-only or a multi-hour walk to either end — this is the
    circuit's most remote and physiologically demanding stage.

