description:
  en: |
    Soti Khola (700 m) is the Manaslu Circuit's road-head trailhead
    along the Budhi Gandaki river, and the point where the Restricted
    Area permit zone begins. The lower valley trail here is wide and
    forested, with tea-houses at each stage.

