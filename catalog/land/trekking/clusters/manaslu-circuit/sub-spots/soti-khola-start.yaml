tier_rationale:
  en: |
    Soti Khola (700 m) is the road-head trailhead of the Manaslu
    Circuit, reached by a 7-9 hour jeep or bus ride from Kathmandu, and
    marks the point where the Manaslu Restricted Area Permit zone
    begins. The initial trail stages follow the Budhi Gandaki river on
    a well-trodden, moderately-graded path through subtropical
    farmland and forest, with permanent suspension bridges over the
    river's main crossings. Tea-houses are available though less dense
    than on Everest or Annapurna, cell coverage is intermittent but
    present in villages, and road-based evacuation back toward
    Arughat/Kathmandu is feasible within a day. This is the most
    accessible and forgiving stage of the circuit, before the trail
    narrows into exposed gorge sections further up-valley.

