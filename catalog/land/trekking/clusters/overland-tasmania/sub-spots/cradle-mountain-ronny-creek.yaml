description:
  en: |
    Ronny Creek (940 m) is the road-accessible northern trailhead of
    the Overland Track, at the foot of Cradle Mountain. A duckboarded
    moorland path leads from the shuttle-bus car park into the six-day
    traverse, with PWS booking required 1 October-31 May.

