tier_rationale:
  en: |
    Ronny Creek, at 940 m, is the road-accessible northern trailhead
    of the Overland Track below Cradle Mountain, reached via a wide,
    duckboarded button-grass moorland path with negligible elevation
    gain. PWS-permit-controlled access caps independent walkers at 60
    per day during the peak season (1 October-31 May), with a shuttle
    bus and visitor centre at the car park providing immediate
    evacuation options for anyone turning back before committing to
    the six-day traverse. Waldheim huts and PWS ranger presence are a
    short walk away, making this the most accessible and forgiving
    point on the whole track.

