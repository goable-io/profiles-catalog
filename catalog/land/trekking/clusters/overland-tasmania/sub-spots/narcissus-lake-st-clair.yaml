tier_rationale:
  en: |
    Narcissus Hut, at 750 m, is the southern terminus of the Overland
    Track on the shore of Lake St Clair, reached by flat, well-formed
    forest track on the final stage from Pine Valley Hut junction.
    There is no elevation gain and no technical terrain at the hut
    itself. Walkers can either continue on the two-day walk-out track
    to Cynthia Bay or take the scheduled ferry across the lake,
    providing a fast, low-effort evacuation route in the event of
    injury or fatigue earlier on the trek; PWS ranger presence and
    radio contact are available at the hut.

