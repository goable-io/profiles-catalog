tier_rationale:
  en: |
    Mount Ossa (1617 m) is Tasmania's highest peak, reached by an
    optional side-trip of roughly 8.5 km return from Pelion Gap with
    around 500 m of ascent on stage three of the Overland Track. The
    upper section leaves the maintained gravel track for a rough,
    unmaintained scree-and-rock scramble with route-finding required
    in poor visibility and no fixed protection. There is no shelter on
    the summit approach, and weather on exposed dolerite terrain can
    turn abruptly with snow possible in any month; the only evacuation
    route is retracing the scramble back to Pelion Gap and onward to
    Kia Ora or Pelion Hut, a multi-hour walk with no vehicle access.

