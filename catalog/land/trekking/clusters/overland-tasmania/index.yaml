sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 35
  carrying_capacity_sensitivity: high
  notes: |
    Tasmania's Parks and Wildlife Service (PWS) caps independent
    walker departures from Ronny Creek at 60 people per day during
    the booked peak season (1 October-31 May), a hard carrying-
    capacity mechanism protecting the alpine dolerite plateau and
    Gondwanan rainforest from erosion. Equipment dependency is high
    given Tasmania's famously changeable weather, where snow is
    possible in any month even at moderate elevation.

