description:
  en: |
    The Overland Track is a 65 km, six-day traverse of Tasmania's
    Cradle Mountain-Lake St Clair National Park, running from Ronny
    Creek at 940 m in the north to Narcissus Bay on Lake St Clair in
    the south. The route crosses button-grass moorland, ancient
    Gondwanan rainforest, and alpine dolerite plateau, with altitude
    ranging from roughly 700 m at Lake St Clair to 1617 m at the
    optional Mount Ossa summit side-trip — Tasmania's highest peak.
    Terrain includes duckboarded wetland, well-formed gravel track,
    and, on side trips, loose scree and rock scramble. The Parks and
    Wildlife Service (PWS) operates a chain of unstaffed huts with
    platform camping alongside, and enforces a booking system capping
    independent walkers at 60 per day departing Ronny Creek during the
    peak season (1 October to 31 May), when the track is walked in one
    direction only. Tasmania's weather is notoriously changeable —
    snow, hail, and gale-force wind are possible in any month — and
    the walk finishes with a choice of a two-day walk-out or a boat
    pick-up across Lake St Clair from Narcissus Hut to Cynthia Bay.

