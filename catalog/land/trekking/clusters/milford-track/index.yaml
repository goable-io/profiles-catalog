  notes: |
    Cluster inherits trekking base scoring unmodified (no matching
    alpine-family region variant exists for Fiordland's temperate
    rainforest + single alpine-crossing regime). 24-week typical season
    reflects the DOC Great Walks booking window (late Oct-Apr) plus
    shoulder access for experienced independent walkers; outside this
    window the track is unmaintained and considerably higher risk.
