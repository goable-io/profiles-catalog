description:
  en: |
    The Milford Track is a 53.5 km, four-day "Great Walk" through
    Fiordland National Park, running from the boat-only Glade Wharf
    trailhead on Lake Te Anau to Sandfly Point on Milford Sound, with
    no road access at either end. The route climbs from valley
    rainforest at around 100 m through beech forest to the exposed
    Mackinnon Pass at 1154 m — the trail's high point and only true
    alpine crossing — before descending through the Arthur Valley to
    the coast. Terrain alternates between well-formed gravel valley
    track and rocky, weather-exposed alpine tussock on the pass. The
    Department of Conservation (DOC) operates three serviced Great
    Walk huts (Clinton, Mintaro, Dumpling) with bunks, gas cookers,
    and warden presence during the guided/independent walking season.
    Access is strictly controlled: independent walkers must book a
    fixed hut itinerary and the daily start is capped at roughly 40
    people, walking in one direction only. The Great Walks season runs
    late October to April; outside this window the track is officially
    "unmaintained" and river crossings plus avalanche exposure on
    Mackinnon Pass become significantly more hazardous. Sandfly Point
    is a boat-only exit — walkers are collected by ferry across Milford
    Sound to Milford village, with no road or trail continuation.

