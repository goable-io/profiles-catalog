sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 24
  carrying_capacity_sensitivity: high
  notes: |
    DOC (Department of Conservation) caps independent Great Walk
    bookings at roughly 40 walkers/day departing Glade Wharf, plus a
    parallel guided-walk quota via Ultimate Hikes, giving Fiordland's
    most iconic track a hard carrying-capacity ceiling year-round.
    Fiordland receives among the highest rainfall totals in New
    Zealand (Milford Sound averages 6000+ mm/year), so equipment
    dependency (rain gear, hut bookings, sandfly protection) is high
    despite zero direct emissions from the walk itself.

