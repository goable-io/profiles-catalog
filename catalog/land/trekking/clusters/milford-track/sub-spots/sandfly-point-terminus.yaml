tier_rationale:
  en: |
    Sandfly Point marks the trail terminus on Milford Sound, reached
    after a short final 1.5 km stretch of flat, well-formed track from
    Dumpling Hut through coastal rainforest at near sea level. There is
    no elevation gain and no technical terrain, but the point is
    boat-only: walkers wait under a DOC shelter for a scheduled ferry
    crossing to Milford village, as no trail or road continues from
    here. The shelter provides protection from rain and the notoriously
    dense sandflies, and the short ferry crossing to Milford Sound
    village offers a fast, reliable evacuation route in the event of
    injury earlier on the track.

