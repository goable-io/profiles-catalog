description:
  en: |
    Sandfly Point is the Milford Track's official finish on Milford
    Sound, at near sea level. A DOC shelter here protects walkers
    while awaiting the scheduled ferry to Milford village — the only
    way out, as no road or trail continues from this trailhead.

