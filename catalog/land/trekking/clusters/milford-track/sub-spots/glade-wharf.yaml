description:
  en: |
    Glade Wharf is the boat-drop-off trailhead on Lake Te Anau where
    the Milford Track officially begins, at just 100 m elevation.
    Access is DOC-permit-controlled with a capped daily start of
    around 40 walkers during the Nov-Apr Great Walks season, followed
    by a gentle first stage to Clinton Hut through native beech forest.

