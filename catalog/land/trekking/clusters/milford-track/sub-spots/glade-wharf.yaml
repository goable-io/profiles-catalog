tier_rationale:
  en: |
    Glade Wharf is the boat-only trailhead at 100 m elevation, reached
    by ferry across Lake Te Anau, marking the start of the Milford
    Track's first 5 km stage to Clinton Hut through flat beech-forest
    valley floor. Terrain is a wide, well-formed gravel path with
    negligible elevation gain and no exposure. DOC-permit-controlled
    access caps independent walkers at roughly 40/day during the
    Great Walks season (late October to April), with a warden present
    at Clinton Hut a short walk away. Cell coverage is limited but the
    lake-boat evacuation route is straightforward and fast, making this
    the most benign and forgiving point on the entire track.

