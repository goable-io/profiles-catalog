tier_rationale:
  en: |
    Mackinnon Pass sits at 1154 m and is the crux of the Milford
    Track's third stage, a roughly 14 km day from Mintaro Hut to
    Dumpling Hut with around 500 m of ascent and descent on rocky,
    exposed alpine tussock and scree above tree-line. The crossing has
    no shelter for several hours of exposed walking, passes sub-alpine
    tarns and a memorial cairn, and offers views of Mount Balloon and
    the Clinton Canyon, but weather can close in rapidly with sleet,
    snow, or gale-force wind even in midsummer. DOC closes or reroutes
    the pass in poor conditions; the only evacuation options are
    retreat to Mintaro Hut or continuation to the Quintin Shelter, both
    multi-hour walks with no vehicle or road access, making this the
    most committing and weather-sensitive stage of the whole track.

