  de: Wandern — Mackinnon Pass

description:
  en: |
    Mackinnon Pass (1154 m) is the Milford Track's high point and only
    true alpine crossing, an exposed saddle with sub-alpine tarns and
    panoramic views of Mount Balloon. Reached on stage three between
    Mintaro and Dumpling huts, it is fully exposed to weather with no
    shelter along the crossing.

