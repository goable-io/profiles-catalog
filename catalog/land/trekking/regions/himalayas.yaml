description:
  en: |
    Himalayan trekking spans the Nepal high-country (Everest BC, Annapurna
    Circuit, Manaslu, Langtang), Indian Ladakh + Kumaon + Sikkim, and
    Bhutan. Distinct regime from Alpine trekking: routine multi-day
    exposure at 3500-5500 m altitude requires acclimatization protocols
    (AMS + HACE + HAPE physiology), pass crossings above 5000 m
    (Thorong La 5416 m, Kongma La 5535 m, Cho La 5420 m, Larke La
    5106 m), and monsoon-partitioned seasons — hard-closed during
    NE-monsoon Jun-Sep with landslide + trail-washout risk, plus
    post/pre-monsoon Oct-Nov and Mar-May as the two safe windows.
    Cold-air outbreaks can drop temperatures to -20°C on 5000 m+ passes
    even in shoulder seasons. Water treatment mandatory throughout.

