gates:
  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: HIMALAYAN_MONSOON_DELUGE
    description: Precipitation above 5 mm/h in the Himalayas signals monsoon-band arrival with rapid trail-washout + landslide + river-crossing failure risk — trek closes immediately.

  - metric: wind_speed_kn
    condition: gt
    value: 40
    reason_code: HIGH_ALTITUDE_WIND
    description: Sustained wind above 40 knots on 5000+ m Himalayan passes (Thorong La, Larke La, Kongma La) forces pass-closure — hypothermia + wind-chill risk exceeds safe crossing threshold.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_PASS
    description: Visibility below 500 m on high-altitude Himalayan passes prevents cairn + trail navigation; falls into crevasses + off-trail exposure become material hazards.

  - metric: apparent_temp_c
    condition: lt
    value: -20
    reason_code: HIMALAYAN_HYPOTHERMIA
    description: Apparent temperature below -20°C on Himalayan camps creates immediate frostbite + hypothermia risk during standard trekking-tent overnight exposure.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    Himalayan trekking has a documented per-visitor footprint (porter
    logistics, tea-house diesel + kerosene for heating and cooking,
    single-use bottled water at altitude, air access to Lukla / Jomsom
    / Leh). Sagarmatha NP + Annapurna Conservation Area + Manaslu
    Conservation Area enforce permit-tracked visitor caps; carrying
    capacity is high on the classic Everest BC corridor (spring peak
    35 000+ trekkers/season). Local operator ratios (Nepal TAAN,
    Indian IMF) coordinate SOP.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "UIAA Mountain Medicine Commission high-altitude trekking protocols"
    - "Nepal TAAN (Trekking Agencies' Association of Nepal) SOP"
    - "IMF (Indian Mountaineering Foundation) trekking-permit standards"
    - "Sagarmatha National Park + Annapurna Conservation Area management authorities"
  notes: |
    Regional overrides vs trekking base: temperature curve extended
    left to -20°C for high-camp cold-outbreak profile; added freezing_
    level_m dimension (0.05 weight) as a proxy for cold-air-mass
    intrusion at trekking altitudes; precipitation gate at 5 mm/h
    reflects the fatality-driver profile (monsoon-band landslide);
    wind gate at 40 kn for pass closure. 14-week season (7-week
    post-monsoon Oct-Nov + 7-week pre-monsoon Mar-May).
