gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: PATAGONIAN_WIND
    description: Sustained wind above 55 knots on Patagonian ridges (Torres del Paine W circuit, Fitz Roy Huemul) exceeds safe trekking threshold — trekkers are blown off feet, tent damage is standard.

  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: ANDEAN_STORM
    description: Precipitation above 5 mm/h in Andean high-country signals convective storm activity with lightning + trail-washout + river-crossing failure risk on granite-schist Patagonian and Peruvian trails.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: WHITEOUT_ANDES
    description: Visibility below 500 m on Andean high passes and Patagonian mirador viewpoints prevents cairn + trail navigation; hypothermia risk elevated in Patagonian W-flow context.

  - metric: apparent_temp_c
    condition: lt
    value: -12
    reason_code: ANDEAN_HYPOTHERMIA
    description: Apparent temperature below -12°C on Andean high-altitude camps creates frostbite risk during trekking-tent overnight exposure.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 20
  carrying_capacity_sensitivity: high
  notes: |
    Andean trekking has documented visitor footprint (arriero + porter
    logistics, tea-house / refugio energy, air access to Cusco / El
    Calafate / Puerto Natales). Machu Picchu Inca Trail enforces a
    strict 500 daily-visitor cap (incl. porters) via SERNANP permit;
    Torres del Paine caps 80 tents/night per campamento via CONAF;
    Chalten Fitz Roy area has open access under APN oversight.

