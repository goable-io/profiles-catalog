description:
  en: |
    Andean trekking spans Peruvian Cordillera Blanca (Santa Cruz,
    Choquequirao, Salkantay), Cusco region (Inca Trail, Ausangate),
    Chilean Patagonia (Torres del Paine W + O circuits), Argentinean
    Patagonia (Fitz Roy, Cerro Torre, Huemul), and Colombia + Ecuador
    high-country. Distinct regime from Himalayan trekking: altitudes
    3500-5000 m routine but pass geometries are shorter (single-day
    passes vs multi-day approaches), season is austral summer
    (Nov-Mar) with dry-anticyclone dominance, Patagonian W-wind is
    the dominant safety variable (routinely 60+ knots on exposed
    Torres del Paine ridges), and coca-leaf-mediated altitude
    tradition + local guide culture support acclimatization on 4000
    m+ passes. Water sources are generally clear but treatment
    remains recommended.

