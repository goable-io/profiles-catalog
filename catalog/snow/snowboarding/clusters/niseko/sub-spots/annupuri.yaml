tier_rationale:
  en: |
    Annupuri, on Niseko's western flank, is the quietest of the four
    linked Niseko United sectors. It offers extensive tree-run
    snowboarding with lower crowd density than Grand Hirafu or
    Hanazono. Terrain difficulty is comparable to the other linked
    sectors — groomed runs plus moderate tree-lined descents without
    requiring backcountry equipment — supporting the same Tier 2
    classification.

