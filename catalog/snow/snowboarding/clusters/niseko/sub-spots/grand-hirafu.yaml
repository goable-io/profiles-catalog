tier_rationale:
  en: |
    Grand Hirafu is Niseko's flagship snowboarding sector. Combining
    extensive tree-run terrain with night-snowboarding availability under
    resort lighting — a rare feature among world resorts that extends the
    daily riding window. Terrain spans beginner-friendly groomed runs
    through moderate tree-lined descents, without requiring backcountry
    gear or hike-to access, placing the overall sector at Tier 2 despite
    its JAPOW-driven powder reputation.

