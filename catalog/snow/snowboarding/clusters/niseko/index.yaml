description:
  en: |
    Niseko (Hokkaido, Japan) is snowboarding's
    premier JAPOW destination, driven by the Siberian NW monsoon dumping
    exceptional dry powder onto the Niseko United linked resort (Grand
    Hirafu, Hanazono, Niseko Village, Annupuri). Tree-run terrain is
    extensive across all four linked areas, and Grand Hirafu offers
    night-snowboarding sessions under lights — a distinctive feature
    among world resorts. Hanazono's snowpark is internationally
    recognised, hosting World Snow Awards events. Lift operator is
    Niseko United consortium. Season mid-Dec to early-Apr.

