description:
  en: |
    Avoriaz (Portes du Soleil, French Alps) built its
    identity as a snowboard-pioneer resort — it hosted early snowboard
    World Cup events and remains famous for The Stash, a natural-wood
    freestyle zone integrated into the forest rather than a conventional
    park build. The resort's car-free, ski-in/ski-out architecture and
    direct connection to the wider Portes du Soleil lift network (one of
    the largest linked ski areas in the world) give it broad intermediate
    red-piste terrain alongside its freestyle signature zones. Season
    roughly mid-Dec to late-Apr. Lift operator is Avoriaz 1800
    / Portes du Soleil consortium.

