tier_rationale:
  en: |
    The Stash is Avoriaz's iconic natural-wood freestyle zone, built
    directly into the forest along a piste run rather than as a standalone
    park — reclaimed wood features. Natural transitions and organic wood-
    and-earth berms give it a distinctive snowboard-only character among
    European resort parks. Terrain is approachable rather than pro-line:
    features scale from mellow wood rollers to moderate jumps, making it
    accessible to red-level intermediate riders rather than requiring
    expert big-air commitment, which places it at Tier 2 alongside
    comparable red-park zones.

