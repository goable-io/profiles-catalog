tier_rationale:
  en: |
    The Arare sector combines intermediate red-piste cruising with
    adjacent park lines and direct connections into the broader Portes
    du Soleil lift network. Snowboarders can link toward Châtel and
    Morzine without returning to the Avoriaz centre. Terrain is
    groomed and moderately pitched, suited to red-level riders
    building mileage across the interconnected domain rather than
    requiring advanced technical commitment, consistent with a Tier 2
    classification.

