tier_rationale:
  en: |
    Rendezvous Peak, accessed via the Aerial Tram, delivers Jackson Hole's
    most advanced in-bounds snowboarding terrain. Including the traverse-in
    access to the legendary Corbet's Couloir — a mandatory-air chute
    requiring committed technique at entry. Sustained steep pitches and
    minimal grooming across most of the sector place this firmly at Tier 3,
    consistent with the resort's reputation as one of North America's
    premier expert-terrain destinations.

