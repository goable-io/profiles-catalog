description:
  en: |
    Jackson Hole Mountain Resort (Wyoming, USA) is
    famed for extreme terrain — the Aerial Tram accesses Rendezvous Peak
    and the iconic Corbet's Couloir — alongside family-friendly beginner
    terrain at the Teton Village base and a dedicated freestyle park
    sector. This range from expert big-mountain riding to true beginner
    zones gives the resort broad appeal across the full snowboarding
    skill spectrum. Lift operator is Jackson Hole Mountain Resort. Season
    early-Dec to early-Apr.

