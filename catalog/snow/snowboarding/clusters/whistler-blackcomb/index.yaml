description:
  en: |
    Whistler-Blackcomb (British Columbia, Canada) is
    North America's largest ski resort by skiable terrain and a
    long-standing snowboard-culture hub — Blackcomb was among the first
    major resorts to formally welcome snowboarders in the 1980s. The
    resort combines a pro-line terrain park (Highest Level Park) with
    extensive open-bowl intermediate cruising and glacier-served advanced
    terrain on Blackcomb Glacier. Lift operator is Vail Resorts (Whistler
    Blackcomb Holdings). Season late-Nov to late-Apr, with glacier-sector
    access sometimes extending into summer for competitive training
    camps.

