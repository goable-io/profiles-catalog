description:
  en: |
    Livigno (Lombardy, Italian Alps) is one of
    Europe's premier freestyle snowboarding destinations, built around
    the Mottolino and Carosello 3000 sectors and their large-scale
    snowparks. The resort's duty-free status and long, dry-snow season
    (driven by its high, sheltered valley position) support consistent
    snowpark operation across the full winter. Lift operator is Livigno
    Ski consortium (Mottolino SpA / Carosello 3000 SpA). Season
    early-Dec to early-May, among the longest in the Italian Alps.

