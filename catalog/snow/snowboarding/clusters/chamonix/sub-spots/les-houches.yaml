tier_rationale:
  en: |
    Les Houches, at the southern entrance to the Chamonix valley. Offers
    wide family-friendly red pistes and a terrain park suited to
    progression riders — a deliberate contrast to the valley's extreme-
    terrain reputation elsewhere. Lower altitude gives it easier access and
    gentler grades, and the sector's terrain park adds moderate freestyle
    features without pro-line commitment, consistent with a Tier 2
    classification.

