tier_rationale:
  en: |
    Grands Montets above Argentière is Chamonix's iconic advanced
    snowboarding sector, historically famous for steep black pistes and
    direct access to freeride-adjacent off-piste lines beneath the Aiguille
    des Grands Montets. Terrain is sustained and steep with minimal
    beginner grooming, and the sector's reputation among expert riders
    places it well above the valley's intermediate zones. Warranting Tier 3
    alongside comparable expert steeps elsewhere in the catalog.

