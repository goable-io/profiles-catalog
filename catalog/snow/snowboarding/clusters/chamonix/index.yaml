description:
  en: |
    Chamonix (Haute-Savoie, French Alps) is best
    known for extreme freeride and mountaineering terrain, but its
    resort-managed piste sectors — Grands Montets above Argentière and
    Les Houches at the valley's southern entrance — provide distinct
    snowboarding experiences ranging from advanced steep terrain to
    family-friendly wide pistes. The valley's high relief (Mont Blanc
    massif) means individual sectors vary sharply in difficulty and
    altitude. Lift operator is Compagnie du Mont-Blanc. Season
    mid-Dec to late-Apr, with Grands Montets' higher altitude extending
    reliable snow later into the season.

