tier_rationale:
  en: |
    Happo-One is Hakuba Valley's largest and best-known resort, combining a
    resort-standard snowpark with tree-run terrain that borders
    backcountry-adjacent zones without itself requiring beacon-and-shovel
    equipment on the marked runs. As the former 1998 Nagano Olympic alpine
    venue, grooming and lift infrastructure are well developed. And terrain
    difficulty spans beginner through advanced tree lines, supporting a
    Tier 2 classification for the marked in-bounds product.

