tier_rationale:
  en: |
    Hakuba Cortina's tree runs are celebrated among JAPOW-focused riders
    for sustained, technical tree-line descents through deep dump-cycle
    powder, with terrain demanding active line selection between trees
    rather than groomed-corridor cruising. The sector's smaller lift
    infrastructure and lower crowd density concentrate a genuinely advanced
    riding experience. Consistent with the Tier 3 hike-to/expert-steeps
    classification used elsewhere in this catalog for technical tree and
    off-piste terrain.

