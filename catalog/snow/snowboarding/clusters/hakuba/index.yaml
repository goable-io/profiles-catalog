description:
  en: |
    Hakuba Valley (Nagano, Japan) is a linked
    collection of 10 resorts on Honshu's Sea-of-Japan-facing slopes,
    hosting alpine events for the 1998 Nagano Winter Olympics. Snowboard
    terrain spans Happo-One's mixed park-and-tree-run offering to Hakuba
    Cortina's celebrated JAPOW tree runs, driven by the same NW monsoon
    snowfall pattern that defines the broader Sea-of-Japan region. Lift
    operator is Hakuba Valley Ski Alliance consortium. Season mid-Dec to
    early-Apr.

