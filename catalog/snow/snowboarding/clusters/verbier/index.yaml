description:
  en: |
    Verbier (Valais, Swiss Alps) shares its lift
    network and piste geography with the resort's alpine-skiing catalog
    entry — the Quatre Vallées system spans over 400 km of marked terrain
    from the mid-mountain Attelas/Ruinettes bowls up to the Mont Fort
    glacier at 3330 m. For snowboarding, Verbier's reputation rests on its
    freeride-adjacent steep terrain (the Freeride World Tour finale runs
    on the neighbouring Bec des Rosses) combined with mid-mountain park
    and cruising infrastructure suited to progression riders. Lift
    operator is Téléverbier SA. Season late-Nov to early-May on the
    glaciated upper sector.

