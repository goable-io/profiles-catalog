tier_rationale:
  en: |
    The Attelas and Ruinettes sector is
    Verbier's mid-mountain hub, combining the resort's main terrain park
    with the bulk of its intermediate red-piste cruising terrain. Lift
    density is highest here, and grooming quality is consistently strong
    given the sector's flagship intermediate status. Terrain difficulty
    and feature scale are moderate rather than expert, placing this at
    Tier 2 in contrast to the summit Mont Fort sector.

