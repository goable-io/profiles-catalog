tier_rationale:
  en: |
    Mont Fort's 3330 m summit, reached via the Jumbo cable car, delivers
    Verbier's highest lift-served snowboarding with in-bounds black pistes
    plus patrolled hike-to variants directly adjacent to the freeride-
    famous Bec des Rosses. Steep sustained pitches, minimal grooming at the
    highest sections. Glacier avalanche-control operations before most
    morning openings place this firmly in expert territory — a freeride-
    adjacent zone distinct from Verbier's intermediate mid-mountain
    terrain, warranting Tier 3.

