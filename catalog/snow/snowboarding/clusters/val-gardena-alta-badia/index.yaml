description:
  en: |
    Val Gardena and Alta Badia (South Tyrol, Italian
    Dolomites) are linked sectors of the Sella Ronda circuit, sharing
    lift infrastructure and geography with the resort's alpine-skiing
    catalog entries. Terrain is dominated by wide, well-groomed red
    pistes across dramatic Dolomite limestone scenery, with the Alta
    Badia side hosting a moderate freestyle snowpark. The Sella Ronda
    circuit connects four valleys via a single lift-and-piste loop,
    giving snowboarders exceptional cruising mileage. Lift operators
    include Val Gardena and Alta Badia consortiums under the Dolomiti
    Superski umbrella. Season early-Dec to early-Apr.

