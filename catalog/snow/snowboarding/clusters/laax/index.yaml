description:
  en: |
    Laax (Grisons, Swiss Alps) is widely regarded as
    European snowboarding's spiritual capital, built around the Weisse
    Arena Gruppe's flagship Crap Sogn Gion freestyle hub and Europe's
    largest snowpark. The resort's terrain is snowboard-first in
    philosophy: wide red-piste cruising corridors connect directly to
    progressive park lines, and the high-altitude Vorab glacier sector
    extends the season into early summer on upper runs. Season roughly
    Dec-Apr on the main piste network, with glacier-sector access
    extending later. Lift operator is Weisse Arena Bergbahnen AG.

