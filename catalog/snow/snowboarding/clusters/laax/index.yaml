gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: LIFT_CLOSURE_WIND
    description: Sustained wind above 55 knots closes chairlifts and gondolas; flat-traverse exits become unmanageable on a snowboard.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: WHITEOUT_RISK
    description: Visibility below 200m makes piste navigation unsafe — snowboarders rely on visual feedback for edge transitions at speed.

  - metric: apparent_temp_c
    condition: lt
    value: -28
    reason_code: FROSTBITE_RISK
    description: Apparent temperature below -28°C creates immediate frostbite risk on exposed skin.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 18
  carrying_capacity_sensitivity: high
  notes: |
    Weisse Arena Gruppe operates under Seilbahnen
    Schweiz coordinated environmental protocols and has publicly committed
    to a "Greenstyle" sustainability program (solar-assisted snowmaking,
    resort-wide waste reduction). Snowpark construction/grooming adds
    incremental machine-hours versus piste-only operation, but park-user
    concentration in dedicated zones reduces wider habitat pressure
    relative to all-mountain traffic.

