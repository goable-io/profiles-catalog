tier_rationale:
  en: |
    The Vorab glacier sector extends Laax's skiable terrain to its highest
    altitude, providing consistent snow surface quality across the full
    season including shoulder-season weeks when lower sectors soften. The
    terrain is red-piste cruising oriented — wide, groomed. Glacier-safe
    marked corridors rather than technical or hike-to terrain — making it a
    solid intermediate snowboarding sector whose main value proposition is
    reliability of snow surface rather than technical difficulty.

