tier_rationale:
  en: |
    The Laax Snowpark on Crap Sogn Gion is
    Europe's largest snowpark by feature count, with over 90 obstacles
    spanning beginner to pro lines including a competition-grade
    superpipe. The park hosts the annual World Rookie Fest and has been
    a Burton Open venue, drawing elite riders for its pro-line kickers
    and rail gardens. This concentration of large-airtime features and
    technical rail setups places the sector firmly in expert territory —
    distinct from the surrounding cruising pistes — warranting the
    highest tier alongside hike-to freeride terrain elsewhere in the
    catalog.

