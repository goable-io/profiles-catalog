tier_rationale:
  en: |
    Crap Sogn Gion (2228 m) is Laax's central
    freestyle hub, combining a dense network of red-and-black groomed
    pistes with direct lift access to the resort's snowpark facilities.
    The sector sits at the intersection of the Laax, Falera, and Flims
    lift networks, giving snowboarders continuous red-piste cruising
    alongside constant park exposure. Grooming quality is high given the
    sector's flagship status, and moderate altitude keeps snow surface
    reliable through most of the core season without the extreme exposure
    of the higher Vorab glacier terrain.

