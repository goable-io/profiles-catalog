gates:
  # Feasibility floor (auto): no natural snowpack -> physically
  # impossible at any skill level. Hard PREREQUISITE (Gate.kind='feasibility').
  - metric: swe_mm
    condition: lt
    value: 20
    kind: feasibility
    reason_code: NO_SNOWPACK
    description: Below ~20 mm snow water equivalent there is no natural snowpack, so ski touring is not feasible regardless of the other conditions.
  - metric: visibility_km
    condition: lt
    value: 0.4
    reason_code: ARCTIC_WHITEOUT
    description: Visibility below 400m in the Hurrungane's steep, complex terrain makes route-finding around Store Skagastølstind and Fannaråken unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 38
    reason_code: HIGH_WIND_ARCTIC
    description: Sustained wind above 38 knots on the Hurrungane ridgelines makes exposed sections dangerous; wind-loaded slab forms aggressively.

  - metric: apparent_temp_c
    condition: lt
    value: -32
    reason_code: EXTREME_COLD_ARCTIC
    description: Apparent temperature below -32°C creates immediate frostbite risk; standard Norwegian spring-touring kit is rated to this band.

  - metric: precipitation_mm_h
    condition: gt
    value: 8
    reason_code: HEAVY_SNOWFALL_AVALANCHE_LOADING
    description: Heavy active snowfall loads slopes acutely; consult Snøskredvarsel (varsom.no) Sogn-region bulletin before any ascent.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 14
  carrying_capacity_sensitivity: low
  notes: |
    Turtagrø touring is human-powered with zero direct session
    emissions. Equipment footprint is moderate-to-high (touring skis
    + skins + boots + safety kit; glacier kit recommended on the
    Skagastølstind approach). The Fannaråken and Skagastøl DNT huts
    concentrate overnight traffic during the short spring window;
    Jotunheimen National Park regulations apply to camping and
    wildlife (wild reindeer calving zones) outside the immediate
    Turtagrø/Hurrungane touring corridor.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Norges Snøskredvarsling (Snøskredvarsel) avalanche bulletin standards (varsom.no)"
    - "Den Norske Turistforening (DNT) Hurrungane / Fannaråken hut documentation"
    - "Norwegian Ski Touring Federation (NOTF) Jotunheimen site documentation"
  notes: |
    Cluster aggregates the two flagship Hurrungane spring-touring
    summits, both based from Turtagrø. Dimensions/gates copied
    verbatim from ski-touring-arctic region variant to preserve the
    Norwegian spring-touring scoring regime, though Hurrungane
    (~61.5°N) sits south of the strict arctic latitude bbox used
    for coastal ranges like Lyngen/Lofoten/Tromsø (~69-70°N) — the
    two sub-spots therefore omit the `region` tag rather than
    mistag a bbox check, while the cluster keeps `region: arctic`
    to reflect the shared scoring profile.
