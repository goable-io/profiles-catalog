slug: ski-touring-spot-turtagro
spot_kind: cluster
version: "1.0.0"
category: snow
extends: ski-touring-arctic
region: arctic
country_code: "NO"
sub_spots:
  - ski-touring-spot-turtagro-store-skagastolstind
  - ski-touring-spot-turtagro-fannaraken
display_name:
  en: Ski Touring — Turtagrø / Hurrungane
  it: Sci alpinismo — Turtagrø / Hurrungane
  es: Esquí de travesía — Turtagrø / Hurrungane
  fr: Ski de randonnée — Turtagrø / Hurrungane
  de: Skitourengehen — Turtagrø / Hurrungane
description:
  en: |
    Turtagrø, in Sogn og Fjordane's inner Jotunheimen, is the historic
    mountaineering base for the Hurrungane range — Norway's steepest
    and most alpine massif, and the springboard for the country's
    classic high-alpine ski-touring objectives. Store Skagastølstind
    (2405 m) and Fannaråken (2068 m, with a DNT hut on the summit)
    define the range's spring-touring season, which runs roughly
    March-June once the snowpack stabilises and daylight lengthens.
    Unlike the coastal Arctic ranges (Lyngen, Lofoten), Hurrungane
    is an inland continental-alpine massif at a lower latitude but
    shares the same short-window spring-touring regime and DNT hut
    infrastructure. Avalanche risk consult: Snøskredvarsel
    (varsom.no), Sogn region.

