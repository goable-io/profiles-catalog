tier_rationale:
  en: |
    Store Skagastølstind (2405 m) is Norway's third-highest peak and
    the iconic summit of the Hurrungane range, first climbed in 1876
    and long regarded as the country's premier alpine objective. The
    ski-touring approach from Turtagrø crosses steep, complex
    glaciated and rocky terrain with sustained exposure, and the
    upper mountain demands confident route-finding through couloirs
    and ridgelines well above typical intermediate-tour terrain. The
    short spring-touring window (roughly April-June) and committing
    descent lines place this firmly in advanced territory. Reserved
    for advanced ski-tourers with full alpine kit and, on first
    visits, a certified mountain guide.

