tier_rationale:
  en: |
    Fannaråken (2068 m) is the Hurrungane's classic moderate
    day-tour, distinguished by the DNT hut perched directly on its
    summit — one of Norway's highest-altitude staffed mountain
    huts. The ascent from Turtagrø follows a well-defined ridge and
    glacier-margin route with manageable gradient throughout,
    making it the standard introduction to Hurrungane spring
    touring for parties not yet ready for Store Skagastølstind's
    technical terrain. Some glacier-margin sections warrant
    standard avalanche and crevasse awareness but without the
    sustained steep exposure of the range's harder objectives. A
    solid intermediate route suited to parties with basic
    glacier-travel competence.

