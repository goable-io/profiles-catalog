gates:
  # Feasibility floor (auto): no natural snowpack -> physically
  # impossible at any skill level. Hard PREREQUISITE (Gate.kind='feasibility').
  - metric: swe_mm
    condition: lt
    value: 20
    kind: feasibility
    reason_code: NO_SNOWPACK
    description: Below ~20 mm snow water equivalent there is no natural snowpack, so ski touring is not feasible regardless of the other conditions.
  - metric: visibility_km
    condition: lt
    value: 0.4
    reason_code: ALPINE_WHITEOUT
    description: Visibility below 400m on the Ötztal glaciated summits makes crevasse-field route-finding unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 42
    reason_code: HIGH_WIND_RIDGE
    description: Sustained wind above 42 knots on the Similaun/Wildspitze summit ridges accelerates wind-slab formation and threatens balance on exposed glacier terrain.

  - metric: apparent_temp_c
    condition: lt
    value: -28
    reason_code: EXTREME_COLD_ALPINE
    description: Below -28°C at 3600m+ altitude creates immediate frostbite risk; equipment (skins, bindings, crampons) malfunction risk rises sharply.

  - metric: precipitation_mm_h
    condition: gt
    value: 8
    reason_code: HEAVY_SNOWFALL_AVALANCHE_LOADING
    description: Heavy active snowfall loads slopes acutely on the Ötztal 3600er tours; consult LWD Tirol bulletin before any glaciated ascent.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: medium
  notes: |
    Ötztal glaciated touring is human-powered with zero direct session
    emissions once at the trailhead hut. Equipment footprint is high
    (touring skis + skins + boots + full glacier kit: rope, harness,
    crevasse-rescue gear, in addition to standard avalanche safety
    kit). Hut-to-hut access (Similaunhütte, Braunschweiger Hütte)
    concentrates traffic in shoulder-season weekends; glacier retreat
    on both objectives has measurably altered standard route lines
    over the past two decades, a documented concern for Ötztaler
    Alpenverein sections.

