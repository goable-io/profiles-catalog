  en: Ski Touring — Ötztal
  it: Sci alpinismo — Val Senales / Ötztal
  es: Esquí de travesía — Ötztal
  fr: Ski de randonnée — Ötztal
  de: Skitourengehen — Ötztal
description:
  en: |
    The Ötztal (Tyrol, Austria) is the glaciated heart of the Ötztaler
    Alpen and one of the classic ski-touring ranges of the Eastern
    Alps, home to the "3600er" high-summit tours straddling the
    Austrian-Italian border. Similaun and Wildspitze are the range's
    two signature glaciated objectives, both accessed from
    high-altitude huts (Similaunhütte, Braunschweiger Hütte) and both
    requiring full glacier-travel kit. Peak touring season runs
    December-May, with the spring corn-snow window (March-May) the
    classic period for the highest summits once crevasse bridges
    firm up. Avalanche risk consult: LWD Tirol (Lawinenwarndienst
    Tirol).

