tier_rationale:
  en: |
    Wildspitze (3768 m) is Tirol's second-highest peak and the
    Ötztaler Alpen's high-altitude touring objective, approached via
    the Braunschweiger Hütte across the Mittelbergferner glacier.
    The standard route crosses heavily glaciated terrain with
    crevasse fields requiring rope teams and technical glacier-travel
    kit, and the final summit pyramid involves exposed, sustained
    steep skiing above 3600 m. Altitude and glacier commitment place
    this firmly beyond intermediate touring parties. Reserved for
    advanced ski-tourers with full glacier kit and, on first visits,
    a certified mountain guide.

