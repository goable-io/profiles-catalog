tier_rationale:
  en: |
    Similaun (3606 m) sits directly on the Austrian-Italian border
    in the Ötztaler Alpen and is one of the classic "3600er" glaciated
    ski-touring summits in the Eastern Alps. The standard approach
    from the Similaunhütte crosses open glacier terrain with
    crevassed sections requiring rope and crevasse-rescue kit,
    especially once spring melt opens bridges. The summit ridge is
    exposed with cornice risk on the north side, and the descent
    line demands confident glacier skiing at altitude. This is a
    spring-touring reference route reserved for advanced ski-tourers
    with full glacier kit and, on first visits, a mountain guide.

