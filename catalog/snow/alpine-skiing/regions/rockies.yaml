display_name:
  en: Alpine Skiing — North American Rockies
  it: Sci Alpino — Rocciose Nord-Americane
  es: Esquí Alpino — Rocosas Norteamericanas
  fr: Ski Alpin — Rocheuses Nord-Américaines
  de: Alpiner Skilauf — Nordamerikanische Rocky Mountains
description:
  en: |
    The North American Rockies + Sierra Nevada resort belt spans the
    Coast Range (Whistler-Blackcomb), Wasatch (Park City, Alta,
    Snowbird), Tetons (Jackson Hole), Colorado Rockies (Vail, Aspen,
    Breckenridge, Steamboat), Utah cottonwoods, and the Sierra
    (Squaw, Mammoth). Continental dry-snow climate: 30-60 cm overnight
    storm cycles Jan-Feb, cold-air drainage keeps snow-surface quality
    exceptional at altitude, but continental arctic-air outbreaks
    can drop temperatures to -35°C on Colorado + Wyoming days. Lift
    infrastructure comparable to European Alps but with terrain-park
    + steep-inbounds emphasis. Season 20-22 weeks (mid-Nov to
    mid-Apr typical).

