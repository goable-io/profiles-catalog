gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots (tighter than global 55) closes upper cable cars and tramways in the European Alps (Foehn + Bise events); on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m in high-glaciated Alpine terrain (Aiguille du Midi, Klein Matterhorn, Pointe Helbronner sectors) makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on Alpine glaciated high sectors creates immediate frostbite risk on lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    European-Alps resorts operate under Domaines Skiables de France (FR),
    Seilbahnen Schweiz (CH), ANEF (IT), and Seilbahnen Österreich (AT)
    coordinated environmental protocols. Snowmaking + grooming +
    electric lift electricity are the dominant operational footprint;
    rail-connected resorts (Zermatt, St. Anton, Kitzbühel) have lower
    per-day access transport footprint than car-only access.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Domaines Skiables de France (DSF) lift-closure and grooming protocol"
    - "Seilbahnen Schweiz operational safety standards"
    - "ANEF (Associazione Nazionale Esercenti Funiviari) Italian resort protocols"
    - "Seilbahnen Österreich operational + lift-closure protocols"
    - "FIS European Alpine race-venue weather criteria"
  notes: |
    Regional overrides vs alpine-skiing base: wind + visibility weights
    raised (0.22 each) reflecting Alpine lift-closure driver frequency;
    wind gate tightened from 55 → 50 kn (Foehn events shut Swiss +
    Austrian upper lifts routinely); visibility gate tightened from 0.2
    → 0.3 km (glaciated whiteout navigation). Precipitation weight
    reduced to 0.13 (Alpine grooming compensates for fresh snow more
    aggressively than Rockies).
