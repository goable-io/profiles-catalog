description:
  en: |
    European-Alps resort skiing spans French Alps (Chamonix, Val d'Isère,
    Trois Vallées), Swiss Alps (Verbier, Zermatt, St. Moritz), Italian
    Alps + Dolomites (Cortina, Val Gardena, Alta Badia, Livigno), and
    Austrian Alps (Kitzbühel, St. Anton, Ischgl, Sölden). The regime
    is high-altitude piste-managed with dense lift infrastructure,
    snowmaking coverage on low-altitude sectors below ~2200 m due to
    climate pressure, and full patrol + grooming operations. Dominant
    condition variables are wind (Bise + Foehn events close upper
    lifts, cable cars, and gondolas within 45-55 kn thresholds),
    visibility (whiteout on the high glaciated terrain shuts navigation)
    and snow quality on shoulder-season warm days. Season 20-24 weeks
    typical (Dec-Apr core, Nov + May shoulder on high-altitude glacier
    sectors).

