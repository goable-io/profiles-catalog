display_name:
  en: Alpine Skiing — Sea of Japan (JAPOW)
  it: Sci Alpino — Giappone (Sea of Japan)
  es: Esquí Alpino — Japón (Mar del Japón)
  fr: Ski Alpin — Japon (Mer du Japon)
  de: Alpiner Skilauf — Japan (Sea of Japan)
description:
  en: |
    Japanese resort skiing on the Sea-of-Japan W-facing slopes (Niseko
    on Hokkaido, Hakuba Valley + Myoko + Nozawa Onsen on Honshu) is
    driven by the winter Siberian NW monsoon — cold-air masses from
    the Asian continent absorb massive Sea-of-Japan moisture and
    dump 10-15 m annual snowfall (world-record snowfall totals) on
    the W-facing Japanese Alps. Snow surface quality is exceptional
    (dry maritime-continental hybrid — "JAPOW"), but visibility during
    active dump cycles routinely drops below 500 m for days. Wind
    is generally moderate (Sea-of-Japan pressure-gradient less
    ridge-exposed than European Alps) but blizzard conditions during
    peak monsoon dumps close some upper lifts. Season 20 weeks
    (mid-Dec to mid-Apr).

