gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: LIFT_CLOSURE_WIND
    description: Sustained wind above 55 knots closes upper gondolas at Japanese resorts during blizzard windows; on-piste exposure above treeline becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.15
    reason_code: JAPOW_WHITEOUT
    description: Visibility below 150 m during peak JAPOW dump cycles makes piste navigation impossible even on marked runs; resorts close ungroomed upper terrain first.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK
    description: Apparent temperature below -25°C on Hokkaido interior sectors creates immediate frostbite risk on lift-served descents.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 20
  carrying_capacity_sensitivity: medium
  notes: |
    Japanese resort operators (Niseko United, Hakuba Valley Ski Alliance)
    coordinate seasonal grooming + snowmaking + lift-closure protocols.
    Snow is abundant and cold — snowmaking is less critical than in
    the European Alps. Peak season carrying capacity is medium
    (foreign-visitor concentration is high but Japanese domestic ski
    tourism has been declining, freeing peak-day capacity in most
    resorts).

