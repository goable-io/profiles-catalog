  notes: |
    Regional overrides vs alpine-skiing base: precipitation weight
    raised to 0.20 (JAPOW dump cycles are the value proposition — heavy
    snow is a positive, not a negative); snow_surface weight raised
    to 0.20 (dry powder is baseline expectation); visibility gate
    tightened to 0.15 km reflecting JAPOW whiteout intensity. Season
    tightened to 20 weeks (mid-Dec to mid-Apr) — Japan has short
    resort season vs 20-22 weeks in Alps/Rockies.
