description:
  en: |
    Aspen Snowmass (Elk Mountains, Colorado) is a four-mountain complex
    — Aspen Mountain (Ajax), Aspen Highlands, Buttermilk, and Snowmass —
    operated as a single lift-ticket product by Aspen Skiing Company.
    Combined the complex covers roughly 5,500 skiable acres across more
    than 40 lifts. Aspen Mountain rises directly from downtown to a
    3417 m summit via the Silver Queen gondola and is advanced-and-
    expert-only terrain with no green pistes, having hosted FIS World
    Cup Winternational races for decades. Snowmass is the family and
    intermediate flagship of the complex, with extensive red-piste
    cruising, terrain parks, and dedicated kids zones across its
    3862-vertical-foot descent. Aspen Highlands adds the hike-to
    Highland Bowl (summit 3773 m / 12,392 ft) alongside in-bounds black
    and double-black piste terrain. Snowmaking covers base and
    mid-mountain runs across all sectors; ski patrol manages daily
    avalanche control on Highland Bowl before opening. Season typically
    runs late November to early April.

