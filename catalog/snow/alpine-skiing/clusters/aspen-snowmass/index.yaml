gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: LIFT_CLOSURE_WIND
    description: Sustained wind above 55 knots closes chairlifts + gondolas at N-American Rockies resorts; upper-mountain and above-treeline zones become unsafe for on-piste skiing.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: WHITEOUT_RISK
    description: Visibility below 200 m in continental Rocky-Mountain conditions makes piste navigation on wide alpine bowls unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -32
    reason_code: ARCTIC_OUTBREAK_FROSTBITE
    description: Apparent temperature below -32°C (continental arctic-air outbreak days, esp. Wyoming + Colorado + Alberta) creates immediate frostbite risk on lift-served exposure; resorts often close upper lifts.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 21
  carrying_capacity_sensitivity: high
  notes: |
    Aspen Skiing Company has long positioned itself as an environmental-
    policy leader among US resort operators, including early solar and
    methane-capture investment (the Skico Cardiff Glacier methane
    plant), though snowmaking and grooming still dominate the complex's
    operational footprint. The four-mountain shuttle-bus network
    (managed with the City of Aspen and RFTA regional transit) reduces
    car dependency between sectors relative to single-mountain
    Colorado resorts. Highland Bowl carrying capacity is deliberately
    limited by hike-to access and daily avalanche-control gating.

