tier_rationale:
  en: |
    Aspen Highlands combines an in-bounds black and double-black piste
    zone with the hike-to Highland Bowl, whose summit reaches roughly
    3773 m (12,392 ft) via a bootpack accessed from the top of the
    Deep Temerity lift. Piste marking is black throughout the advanced
    zone, with the bowl itself ungroomed, avalanche-control-gated
    terrain that ski patrol opens only after morning control work.
    There is no snowmaking or terrain park at this altitude; grooming
    is limited to the resort's lower-mountain cruising runs outside
    this advanced-focused sector. The combination of sustained hike-to
    access and steep, often wind-affected bowl terrain makes this
    sector strictly advanced-and-expert-focused.

