tier_rationale:
  en: |
    Aspen Mountain ("Ajax") rises to a 3417 m summit via the Silver
    Queen gondola directly from downtown Aspen and is the complex's
    iconic advanced-and-expert-only mountain, with no green pistes
    anywhere on the trail map. Piste marking is entirely blue-and-up,
    with a substantial share of black and double-black terrain on the
    upper mountain; grooming is applied selectively to keep some
    cruising runs accessible while preserving mogul and steep-pitch
    character elsewhere. Aspen Mountain has hosted FIS World Cup
    Winternational races for decades on its race-standard pitches, and
    ski patrol maintains full coverage across the marked network. There
    is no terrain park and minimal snowmaking given the reliable
    altitude-driven snowpack; the mountain is reserved for
    intermediate-and-above skiers given the absence of true beginner
    terrain.

