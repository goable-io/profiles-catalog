tier_rationale:
  en: |
    The Snowmass sector is the family-and-intermediate flagship of the
    Aspen four-mountain complex, offering red-piste cruising across a
    3862-vertical-foot descent served by a dense network of high-speed
    chairs. Piste marking is predominantly red with extensive blue-
    piste beginner terrain at the base and around dedicated kids zones,
    plus black pistes on steeper upper-mountain pitches. Grooming
    coverage is comprehensive daily, terrain parks are extensive
    (including the Coney Glade and Central Park features), and
    snowmaking secures base and mid-mountain runs. Ski school
    facilities and ski patrol coverage are dense throughout, making
    this the complex's most beginner-and-family-accessible large
    mountain.

