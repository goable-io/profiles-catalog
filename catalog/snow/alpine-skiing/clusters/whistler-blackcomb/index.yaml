description:
  en: |
    Whistler-Blackcomb (Coast Range, British Columbia) is North America's
    largest resort-skiing operation by skiable area, with over 200 marked
    trails spanning roughly 3,300 hectares and served by 37+ lifts,
    including the Peak2Peak gondola linking the twin summits. Altitude
    range runs from the 653 m Creekside/Whistler Village base up to the
    2284 m Blackcomb summit and 2182 m Whistler summit, with snowmaking
    concentrated on the lower-mountain green and blue runs. Piste marking
    covers the full spectrum from wide beginner greens at village level
    through red-piste cruising on the mid-mountain to black and
    double-black terrain off the peak chairs, plus patrolled glacier
    skiing on the Blackcomb Glacier sector. The resort hosted the 2010
    Winter Olympic alpine downhill on the Dave Murray Downhill (Franz's
    Run) at Creekside and continues to host FIS World Cup and NorAm race
    events. Terrain parks (including Habitat) are concentrated on
    Blackcomb. Primary operator is Whistler Blackcomb (Vail Resorts).
    Season typically runs late November to April on the main lift
    network, with limited glacier-sector operation into early summer.

