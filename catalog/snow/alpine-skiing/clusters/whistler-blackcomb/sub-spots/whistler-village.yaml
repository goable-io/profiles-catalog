tier_rationale:
  en: |
    The Whistler Village and Creekside base sectors combine wide green
    and blue-piste terrain served by the beginner-friendly Magic Chair
    plus the Creekside gondola, giving family and novice skiers gentle,
    low-gradient runs close to lodge services. Snowmaking secures the
    lower-mountain green and blue runs against variable base-elevation
    snow conditions, and grooming coverage is comprehensive across this
    sector each morning. Ski school meeting areas, magic-carpet lifts
    for first-timers, and extensive on-mountain restaurant/lodge access
    make this the resort's lowest-collision-risk, most family-friendly
    zone, with ski patrol stationed at both base areas for rapid
    response.

