tier_rationale:
  en: |
    The Whistler Peak Chair sector tops out at the 2181 m summit and is
    the cluster's flagship, combining black and red-piste terrain with
    the Peak-to-Creek run — at roughly 11 km the longest continuous
    descent in North America, dropping to the Creekside base. Piste
    marking is predominantly black off the summit chair with red-piste
    links lower down, and the sector sits above treeline with full
    exposure to wind and whiteout conditions on ridge terrain. Ski
    patrol maintains daily avalanche-control operations before opening
    the peak chair each morning, and snowmaking is not present at this
    altitude given the reliable natural snowpack. Terrain-park presence
    is minimal here; the sector's identity is long, sustained descent
    rather than freestyle features, and it is reserved for confident
    intermediate-to-advanced skiers given the sustained pitch and
    altitude exposure.

