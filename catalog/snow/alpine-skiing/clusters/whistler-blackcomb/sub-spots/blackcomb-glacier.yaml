tier_rationale:
  en: |
    The Blackcomb Glacier sector is reached via the Showcase T-bar and
    delivers sustained black-piste skiing on glacier snow, one of the
    few lift-served glacier-skiing sectors in North America. Piste
    marking is black throughout the glacier descent, with the Horstman
    Hut sub-lodge providing on-mountain food service and warming
    shelter near the T-bar top station. Grooming is minimal on the
    glacier itself given the natural firm-snow surface; ski patrol
    manages crevasse-hazard boundary marking and avalanche control on
    the surrounding slopes. The T-bar is a fixed-grip surface lift
    exposed to wind, and this sector is among the first to close in
    high-wind events; it is reserved for advanced skiers comfortable
    with variable glacier snow conditions and sustained steep pitch.

