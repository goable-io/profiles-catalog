tier_rationale:
  en: |
    Sunnegga (2288 m), reached by underground funicular directly
    from Zermatt village, is the resort's family-friendly zone with
    a dedicated kids' park and magic-carpet lifts alongside gentle
    blue pistes. Snowmaking base coverage keeps the sector reliably
    open even in thin-snow early season, and the wide, low-gradient
    runs carry light collision risk. Ski-patrol presence is constant
    given the sector's beginner traffic, and the funicular access
    avoids surface-lift queuing common at other village-level
    beginner areas.

