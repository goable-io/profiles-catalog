tier_rationale:
  en: |
    The Klein Matterhorn (3883 m) summit sector, reached via the
    Matterhorn Glacier Ride 3S cable car, is the highest year-round
    ski area in Europe with glacier skiing above 3000 m nearly every
    month of the year. Piste marking is red and black across the
    glacier bowl, with ski patrol managing daily avalanche-control
    and crevasse-marking operations on the upper terrain. Snowmaking
    is largely unnecessary at this altitude given permanent glacier
    cover, though grooming coverage is more limited than lower
    sectors given the terrain's scale. This is the cluster's
    flagship high-altitude sector, reserved for skiers comfortable
    with sustained altitude, exposure and variable glacier snow.

