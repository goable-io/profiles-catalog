tier_rationale:
  en: |
    The Rothorn sector (3103 m), reached via the Sunnegga funicular
    and Blauherd gondola, offers sunny-side red-piste cruising on
    the long Rothorn-Findelbach descent. Grooming coverage is
    consistent across the marked network with ski-patrol presence
    throughout, and the sector benefits from good snow retention on
    its higher shoulder-season sections. Piste marking is
    predominantly red with a handful of connecting blue links lower
    down, making it a standard intermediate cruising ground with
    mountain-restaurant service at Blauherd and Rothorn stations.

