gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the Matterhorn Glacier Ride 3S and other upper Zermatt cable cars during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Klein Matterhorn glacier sector makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the glaciated Klein Matterhorn summit sector creates immediate frostbite risk on lift-served descents.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Zermatt is car-free, with village access via the Matterhorn
    Gotthard Bahn cogwheel railway, giving it a lower per-day access
    footprint than car-only Alpine resorts. Lift operator Zermatt
    Bergbahnen AG runs under the Seilbahnen Schweiz coordinated
    environmental protocol; the Klein Matterhorn lift is a
    year-round operational expenditure as the highest cable car
    in Europe.

