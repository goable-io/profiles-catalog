description:
  en: |
    Zermatt (Valais, Swiss Alps) sits at the foot of the Matterhorn
    and offers over 360 km of piste across the Matterhorn ski
    paradise, connected on the Italian side to Cervinia. The resort
    spans from the family-friendly Sunnegga sector at 2288 m up to
    Klein Matterhorn at 3883 m, the highest lift-served point and the
    highest year-round glacier ski area in Europe, reached via the
    Matterhorn Glacier Ride 3S tri-cable gondola. Piste marking runs
    blue through black, with snowmaking covering the lower sectors
    below 2200 m and full ski-patrol coverage across the network.
    Zermatt is famously car-free, with village access via the
    Matterhorn Gotthard Bahn cogwheel railway, giving it a lower
    per-day access-transport footprint than car-only Alpine resorts.
    Primary lift operator is Zermatt Bergbahnen AG. Season runs
    November to April core, with the Klein Matterhorn glacier sector
    open essentially year-round.

