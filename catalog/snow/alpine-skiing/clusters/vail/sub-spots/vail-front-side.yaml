tier_rationale:
  en: |
    The Vail front-side sector (Lionshead, Wildwood, and Golden Peak
    base areas) is the intermediate red-piste cruising heart of the
    mountain, served by a dense high-speed chair network including
    several detachable quads and six-packs. Piste marking is
    predominantly red with blue-piste beginner terrain near the base
    areas and select black pistes on steeper front-side pitches;
    grooming coverage is comprehensive and daily across the network.
    Terrain parks are concentrated in this sector (including features
    near Golden Peak), and snowmaking secures the lower-mountain runs.
    Ski patrol and lodge services are dense throughout, making this the
    resort's highest-traffic but also most infrastructure-supported
    zone.

