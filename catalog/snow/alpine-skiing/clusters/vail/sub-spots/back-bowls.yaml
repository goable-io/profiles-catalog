tier_rationale:
  en: |
    Vail's Back Bowls sector spans seven connected above-treeline bowls
    (Sun Up, Sun Down, China, Siberia, Mongolia, plus adjoining Tea Cup
    and Genesis terrain), accessed via the Wildwood and Game Creek
    chairs. Piste marking is black and advanced-red throughout, with
    wide-open, in-bounds freeride-adjacent slopes lacking the fixed
    grooming pattern of front-side runs — grooming is limited to
    perimeter access routes rather than the bowl interiors. Ski patrol
    conducts avalanche-control operations across the bowls before
    opening on storm mornings, and there is no snowmaking or terrain
    park at this altitude. The open, above-treeline exposure makes wind
    and visibility significant hazards, and the sector is reserved for
    advanced-to-expert skiers comfortable with variable, ungroomed
    snow.

