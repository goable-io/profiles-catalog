tier_rationale:
  en: |
    Blue Sky Basin is Vail's "third" mountain section, a north-facing
    sector reached via the Skyline and Pete's Express chairs that
    delivers gladed black and advanced-red piste terrain with
    exceptional deep-snow retention thanks to its shaded aspect. Piste
    marking runs black through the glades with advanced-red access
    runs, grooming is limited given the tree-skiing character of the
    terrain, and there is no snowmaking or terrain park in this sector.
    Ski patrol maintains standard coverage across the marked glade
    boundaries, and the sector's remoteness from the front-side base
    areas (a longer chair-and-traverse approach) keeps crowding lower
    than the Back Bowls on powder days; it is best suited to advanced
    skiers comfortable with glade and variable-snow skiing.

