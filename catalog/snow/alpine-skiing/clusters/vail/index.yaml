gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: LIFT_CLOSURE_WIND
    description: Sustained wind above 55 knots closes chairlifts + gondolas at N-American Rockies resorts; upper-mountain and above-treeline zones become unsafe for on-piste skiing.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: WHITEOUT_RISK
    description: Visibility below 200 m in continental Rocky-Mountain conditions makes piste navigation on wide alpine bowls unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -32
    reason_code: ARCTIC_OUTBREAK_FROSTBITE
    description: Apparent temperature below -32°C (continental arctic-air outbreak days, esp. Wyoming + Colorado + Alberta) creates immediate frostbite risk on lift-served exposure; resorts often close upper lifts.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 21
  carrying_capacity_sensitivity: high
  notes: |
    Vail Mountain is operated by Vail Resorts under Colorado's grid mix,
    which has been steadily adding renewables through the 2020s. The
    Back Bowls and Blue Sky Basin see significant carrying-capacity
    pressure on powder mornings, with the operator using an app-based
    parking-reservation system at the Vail Village and Lionshead
    structures to manage peak-day access. I-70 highway congestion on
    weekend "ski traffic" days is a recognised regional environmental
    and access issue.

