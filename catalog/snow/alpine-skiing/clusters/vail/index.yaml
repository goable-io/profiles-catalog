description:
  en: |
    Vail Mountain (Gore Range / Sawatch, Colorado) is the largest single
    ski mountain in the United States, with roughly 5,300 skiable acres
    across more than 195 marked trails and over 30 lifts. The resort is
    organized into three distinct sections: the front-side network
    (Lionshead, Wildwood, Golden Peak) with high-speed chair-served
    red-piste cruising and terrain parks; the famous Back Bowls, seven
    connected above-treeline advanced bowls (Sun Up, Sun Down, China,
    Siberia, Mongolia, Tea Cup, Genesis) reached via Wildwood and Game
    Creek lifts; and Blue Sky Basin, a gladed, north-facing third
    section with black and advanced-red piste that retains snow quality
    longer into the season. Altitude ranges from the 2475 m base at
    Vail Village to the 3527 m summit of Blue Sky Basin's Pete's Bowl.
    Snowmaking covers front-side and lower-mountain runs; the Back
    Bowls and Blue Sky Basin rely on natural snowpack. Primary operator
    is Vail Resorts. Vail has hosted FIS Alpine World Ski Championships
    (1989, 1999, 2015 partly at Beaver Creek).

