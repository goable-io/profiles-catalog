description:
  en: |
    Sölden (Ötztal Alps, Tyrol, Austria) is a glacier-anchored resort
    famous worldwide as the venue for the FIS Alpine Ski World Cup's
    annual October season opener, run on the Rettenbachgletscher's
    permanent race piste. The resort spans two glacier sectors —
    Rettenbach and Tiefenbach — both above 2800 m, connected to each
    other by a tunnel through the Tiefenbachjoch and down to the main
    Sölden village lift network, giving the resort one of the longest
    guaranteed early- and late-season windows in the Alps. Piste
    colours run from red glacier cruising on both sectors to the
    hardened black race piste on Rettenbach that hosts the World Cup
    giant slalom and slalom openers each year. Snowmaking and grooming
    are extensive across the lower village runs, while the glacier
    sectors rely primarily on natural glacier ice and managed
    snowfarming to maintain the October race surface. Season runs
    effectively year-round on the glacier top, with the core resort
    season late October to early May.

