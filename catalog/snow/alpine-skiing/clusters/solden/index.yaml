gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the upper glacier gondolas and cable cars on Rettenbach and Tiefenbach during Foehn events; on-piste exposure on the exposed glacier terrain becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Rettenbach/Tiefenbach glacier sectors makes piste navigation and race-piste operations unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the glaciated Sölden sectors creates immediate frostbite risk on lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 24
  carrying_capacity_sensitivity: high
  notes: |
    Sölden's twin-glacier operation under Seilbahnen Österreich
    protocols carries a higher operational footprint than lower-
    altitude Alpine resorts: glacier grooming, extensive snowfarming
    (covering and preserving snow through summer) to guarantee the
    October World Cup race surface, and tunnel infrastructure linking
    Rettenbach and Tiefenbach to the valley lift network. The October
    World Cup opener weekend is a recognised carrying-capacity peak,
    concentrating visitor and media traffic on the Rettenbach sector.

