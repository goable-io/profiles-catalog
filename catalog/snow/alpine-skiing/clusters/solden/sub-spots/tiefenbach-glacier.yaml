tier_rationale:
  en: |
    The Tiefenbachgletscher sector is Sölden's second glacier zone,
    offering red-piste intermediate cruising that is generally gentler
    than the neighbouring Rettenbach race sector. The sector connects
    to the main resort via a tunnel through the Tiefenbachjoch, giving
    it reliable access independent of surface weather on the connecting
    ridge. Grooming and glacier-safety protocols match the Rettenbach
    side, but the terrain profile favours wide, moderate-gradient red
    pistes suited to sustained intermediate cruising rather than race-
    piste-style steepness.

