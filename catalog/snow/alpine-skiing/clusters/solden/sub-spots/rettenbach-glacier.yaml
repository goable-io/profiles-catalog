tier_rationale:
  en: |
    The Rettenbachgletscher (3040 m) hosts the FIS Alpine Ski World
    Cup's annual October season opener, giving this sector a permanent
    hardened race piste maintained through summer snowfarming to
    guarantee an early-season World Cup surface. Outside race
    operations, the sector offers a mix of demanding black race-piste
    terrain and red glacier cruising, with crevasse-marking and glacier
    safety protocols in effect across the marked network. Snow surface
    is typically firmer and more variable than lower-altitude Alpine
    sectors given the glacier's exposure and the artificial hardening
    used for race preparation, placing sustained demands on
    intermediate-to-advanced technique.

