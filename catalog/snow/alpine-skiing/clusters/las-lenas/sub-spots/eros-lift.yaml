tier_rationale:
  en: |
    The Eros lift sector forms the mid-mountain bridge between the
    sheltered Venus/Neptuno base and the exposed Marte upper zone,
    delivering sustained intermediate-to-advanced terrain on a mix of
    red and black pistes. The sector sits on more open Andean rock
    slopes than the base, giving it a wider range of pitch than the
    valley-floor runs while remaining less wind-exposed than Marte.
    Grooming and ski-patrol coverage are standard, and the lift is a
    key connector for skiers progressing from the base cruising terrain
    toward the resort's expert upper-mountain zone.

