tier_rationale:
  en: |
    The base area around the Venus and Neptuno lifts is Las Leñas'
    sheltered valley-floor sector, offering intermediate red-piste
    cruising close to the purpose-built village at roughly 2240 m.
    The valley setting provides more consistent shelter from the wind
    events that regularly close the upper Marte sector, making this
    the reliable fallback zone on high-wind days. Grooming and
    ski-patrol coverage are standard across the marked network, with
    wide, moderate-gradient red pistes dominating the terrain profile
    and easier links back to the village base.

