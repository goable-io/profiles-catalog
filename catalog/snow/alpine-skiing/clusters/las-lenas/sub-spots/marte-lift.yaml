tier_rationale:
  en: |
    The Marte lift sector is Las Leñas' iconic advanced-and-expert
    zone, serving steep, rocky Andean faces with a mix of marked black
    pistes and hike-to freeride variants immediately accessible from
    the lift's upper station. The terrain is largely treeless and
    wind-scoured, with rock bands and couloir-like features typical of
    the exposed Argentine Andes rather than the forested runs common
    elsewhere. This exposure drives a well-documented roughly 30%
    closure rate on high-wind days, making the sector highly weather-
    sensitive even by expert-terrain standards. Ski patrol maintains
    avalanche control on the open faces, but the terrain is freeride-
    adjacent and reserved for confident advanced-to-expert skiers.

