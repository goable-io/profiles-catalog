description:
  en: |
    Las Leñas (Mendoza Province, Argentine Andes) is South America's
    most famous expert-terrain resort, built on a single dramatic
    rocky massif rising above a purpose-built base village at roughly
    2240 m. The resort's lift network runs from the sheltered Venus
    and Neptuno base sector up through the mid-mountain Eros bridge
    zone to the exposed Marte lift, which serves the resort's iconic
    hike-to and lift-accessed freeride faces on wind-scoured Andean
    rock. Las Leñas is internationally known for its steep, rocky,
    largely treeless terrain and dry continental-Andes snowpack, but
    the same exposure that creates the terrain also drives frequent
    wind-related lift closures on the upper mountain. Piste colours
    run from red cruisers around the base through red-and-black
    mid-mountain runs to black and off-piste-adjacent expert lines
    off Marte. Season typically runs June-September/October (Southern
    Hemisphere winter).

