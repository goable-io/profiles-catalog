gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: LIFT_CLOSURE_WIND
    description: Sustained wind above 55 knots closes chairlifts at Las Leñas; the exposed rocky upper-mountain terrain around the Marte sector becomes unsafe for on-piste skiing.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: WHITEOUT_RISK
    description: Visibility below 200m makes piste navigation unsafe even on marked runs, increasing collision and off-piste-drift risk.

  - metric: apparent_temp_c
    condition: lt
    value: -28
    reason_code: FROSTBITE_RISK
    description: Apparent temperature below -28°C creates immediate frostbite risk on exposed skin even with lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 15
  carrying_capacity_sensitivity: high
  notes: |
    Las Leñas' purpose-built base village limits sprawl but concentrates
    access-transport pressure on the single road link from San Rafael,
    Mendoza. The exposed Marte sector's 30% wind-closure rate is a
    recognised operational constraint that both limits carrying
    capacity on high-wind days and drives concentrated crowding on the
    sheltered Venus/Neptuno runs when the upper mountain is shut. Lift
    electricity draws on the Argentine grid mix; grooming fuel is
    diesel. Equipment footprint is high given the rocky, off-piste-
    adjacent terrain favoured by visiting expert skiers.

