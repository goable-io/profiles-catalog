tier_rationale:
  en: |
    The Kitzbüheler Horn sector (1996 m) is reached by gondola directly
    from Kitzbühel town, on the sunny east side of the resort. Pistes are
    predominantly red-marked cruising runs across broad, south-facing
    mid-mountain terrain, with a dedicated terrain park featuring jumps
    and rail lines for freestyle skiers. Grooming is daily and thorough,
    snowmaking coverage supplements the lower-altitude pistes, and ski
    patrol coverage is standard gondola-network access. The sector is
    popular for its panoramic views over the Kitzbühel valley and its
    reliable sun exposure through the day.

