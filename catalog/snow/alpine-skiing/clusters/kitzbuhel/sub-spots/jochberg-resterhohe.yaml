tier_rationale:
  en: |
    The Jochberg-Resterhöhe sector sits on the quieter side of the
    Kitzbühel ski area, connected via the lift network to the Hahnenkamm
    sector. Pistes are predominantly red-marked, extended cruising runs
    across mid-mountain terrain with fewer crowds than the Hahnenkamm and
    town-facing sectors. Grooming is daily, snowmaking coverage secures
    the lower connecting pistes, and ski patrol coverage is standard
    chairlift-network access. The sector suits intermediate skiers
    looking for longer, less-congested red-piste runs away from the
    Streif's race-week crowds.

