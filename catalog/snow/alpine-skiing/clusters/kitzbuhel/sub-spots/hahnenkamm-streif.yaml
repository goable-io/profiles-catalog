tier_rationale:
  en: |
    The Hahnenkamm (1712 m) is home to the Streif, the single most
    demanding and celebrated downhill course on the FIS Alpine Ski World
    Cup calendar. The black-marked race piste reaches gradients up to
    85% at the Mausefalle jump, combined with high-speed compressions,
    blind rolls, and the notorious Hausbergkante traverse that together
    make it the benchmark test of advanced downhill skiing worldwide.
    Race-standard grooming and snowmaking secure the course surface, with
    extensive safety netting installed for the annual World Cup event and
    elevated ski patrol presence year-round given the terrain's
    consequence. This sector is the cluster's flagship advanced zone and
    is not suitable for intermediate or beginner skiers.

