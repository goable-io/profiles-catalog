gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes exposed Hahnenkamm and Kitzbüheler Horn summit lifts during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Hahnenkamm and Kitzbüheler Horn summit sectors makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the exposed Hahnenkamm and Horn upper sectors creates immediate frostbite risk on lift-served descents.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Kitzbühel operates under Seilbahnen Österreich (Austrian cable-car
    association) protocols. Snowmaking is extensive given the resort's
    relatively low base elevation (~760 m), covering the majority of
    pistes on the Hahnenkamm and Kitzbüheler Horn. Kitzbühel is directly
    rail-connected via ÖBB, giving it a lower per-day access-transport
    footprint than car-only Alpine resorts; carrying-capacity pressure
    peaks sharply during the annual Hahnenkamm World Cup race week in
    January.

