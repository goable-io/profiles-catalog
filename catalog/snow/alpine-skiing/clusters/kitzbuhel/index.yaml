description:
  en: |
    Kitzbühel (Tyrol, Austria) is one of the oldest and most prestigious
    ski resorts in the Alps, part of the Kitzski/SkiWelt-adjacent lift
    network spanning the Hahnenkamm, Kitzbüheler Horn, and Jochberg-
    Resterhöhe sectors across roughly 179 km of pistes. Altitude ranges
    from the town at around 760 m up to 2000 m on the Hahnenkamm and
    Kitzbüheler Horn summits, with extensive snowmaking covering the
    lower and mid-mountain pistes given the resort's relatively modest
    base elevation. Kitzbühel is world-famous for the Hahnenkamm Streif,
    the single most demanding and celebrated course on the FIS Alpine Ski
    World Cup calendar, drawing enormous crowds each January. Beyond the
    Streif, the resort offers extensive red-piste cruising on the
    Kitzbüheler Horn and the quieter Jochberg-Resterhöhe side, with
    terrain parks and well-developed rail access via the ÖBB network.
    Operator: Kitzbüheler Bergbahn AG (Kitzski).

