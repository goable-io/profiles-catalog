description:
  en: |
    Les Trois Vallées (Savoie, French Alps) links Courchevel,
    Méribel and Val Thorens into the largest interconnected ski
    domain in the world, with over 600 km of piste and roughly 160
    lifts spanning valley bases near 1300 m up to Val Thorens'
    Cime Caron at 3200 m — Val Thorens itself is Europe's
    highest-altitude ski resort base. Piste marking runs blue
    through black across the linked network, with extensive
    snowmaking on the lower and mid-mountain sectors below roughly
    2200 m and full ski-patrol coverage throughout. Courchevel is
    known for luxury resort infrastructure and its pinnacle sector
    at La Saulire; Méribel sits centrally with steep couloir-adjacent
    terrain off Mont Vallon; and Val Thorens delivers the domain's
    highest and longest descents. Primary lift operators include
    S3V (Courchevel), Méribel Alpina, and SETAM (Val Thorens). Season
    runs late November to early May, with Val Thorens' altitude
    supporting an extended core season.

