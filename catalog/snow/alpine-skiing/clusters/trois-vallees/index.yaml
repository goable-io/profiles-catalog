gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the Cime Caron cable car and other upper Trois Vallées lifts during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Cime Caron and Mont Vallon high sectors makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the Val Thorens high-altitude sectors creates immediate frostbite risk on lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Les Trois Vallées is operated jointly by S3V (Courchevel),
    Méribel Alpina and SETAM (Val Thorens) under the Domaines
    Skiables de France coordinated environmental protocol. As the
    world's largest interconnected ski domain, peak-week carrying
    capacity is a well-documented pressure point on lift lines and
    piste crowding, and extensive snowmaking below 2200 m carries a
    significant water and energy footprint.

