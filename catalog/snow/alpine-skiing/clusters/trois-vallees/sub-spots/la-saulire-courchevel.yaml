tier_rationale:
  en: |
    La Saulire (2738 m) is Courchevel's main pinnacle sector,
    reached by cable car and delivering red-piste cruising down into
    both the 1850 and 1650 base areas. Grooming coverage is
    extensive and consistent across the marked network, with ski
    patrol present throughout and snowmaking supplementing the
    lower connecting runs. The sector links directly into the
    broader Trois Vallées domain toward Méribel, and its wide,
    well-maintained red pistes make it the standard intermediate
    reference point for Courchevel visitors.

