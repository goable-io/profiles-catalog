tier_rationale:
  en: |
    Cime Caron (3200 m) is Val Thorens' summit sector, sitting above
    Europe's highest-altitude ski resort base, and is reached via
    cable car to deliver a long red-piste top-to-base descent with
    around 1400 m of vertical. Ski patrol manages the exposed summit
    terrain, and the sustained length and altitude of the descent —
    combined with black-piste variants near the top — place this
    firmly in advanced territory despite the predominant red marking
    on the main descent line. Snowmaking is largely unnecessary
    given the altitude, but wind exposure at the summit station is
    significant.

