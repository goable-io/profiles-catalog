tier_rationale:
  en: |
    Mont Vallon (2952 m), on the Méribel/Mottaret side of the
    domain, combines black and red pistes with high-altitude
    cruising and adjacent steep couloir access for confident
    skiers. Ski patrol manages the upper terrain closely given its
    exposure and pitch, and grooming is limited on the black
    sections in favour of natural snow retention. Cable-car access
    delivers a sustained vertical descent back toward Mottaret, and
    the sector's combination of black-piste steepness and couloir
    proximity makes it Méribel's most demanding lift-served zone.

