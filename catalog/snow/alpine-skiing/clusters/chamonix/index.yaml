description:
  en: |
    Chamonix-Mont-Blanc (Haute-Savoie, French Alps) is a valley
    resort made up of several distinct, non-interlinked ski areas
    strung along the base of the Mont Blanc massif, rather than one
    connected lift network. The Grands Montets sector above
    Argentière tops out near 3300 m and is the valley's most
    technical piste zone; Brévent-Flégère on the opposite valley
    wall delivers red-piste cruising with direct Mont-Blanc-face
    views; and Les Houches at the valley entrance hosts World Cup
    downhill racing alongside family-friendly terrain. Snowmaking
    covers the lower sectors below roughly 2000 m, and full
    ski-patrol coverage operates across all marked pistes. Chamonix
    is internationally known as a mountaineering and freeride capital
    as well as a piste resort, with the Aiguille du Midi cable car
    (outside the piste-skiing sectors catalogued here) drawing
    off-piste and glacier-touring traffic. Primary lift operator is
    Compagnie du Mont-Blanc. Season runs December to April core.

