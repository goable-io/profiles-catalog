gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the Grands Montets and Brévent-Flégère cable cars during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Grands Montets high sector makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the Grands Montets 3300 m top sector creates immediate frostbite risk on lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Chamonix's separate ski areas are operated by Compagnie du
    Mont-Blanc under the Domaines Skiables de France coordinated
    environmental protocol. The valley's non-interlinked layout
    means most visitor traffic is car-dependent between sectors,
    though the Mont-Blanc Express rail line serves the valley floor
    and reduces access-transport footprint for village-based stays.

