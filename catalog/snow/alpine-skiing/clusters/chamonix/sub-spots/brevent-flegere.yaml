tier_rationale:
  en: |
    The combined Brévent and Flégère sector sits across the valley
    from the Mont Blanc massif, delivering red-piste cruising with
    dramatic direct views of the Mont-Blanc face. Access is via
    cable car and chairlift, with a groomed intermediate network and
    a smaller share of connecting blue runs. Ski patrol covers the
    marked pistes throughout, and mountain restaurants operate at
    both the Brévent and Flégère stations, making this the valley's
    standard intermediate cruising sector.

