tier_rationale:
  en: |
    The Grands Montets sector above Argentière tops out near 3300 m
    and is Chamonix valley's most technically demanding piste zone,
    reached via cable car with black pistes dominating the upper
    mountain and freeride-adjacent terrain immediately accessible
    from the marked network. Ski patrol manages avalanche control on
    the steep upper faces, and grooming is limited on the black runs
    given sustained pitch. Snowmaking supports the lower connecting
    pistes, but the sector's identity is its iconic technical skiing
    rather than beginner-friendly cruising — this is the cluster's
    technical-piste flag.

