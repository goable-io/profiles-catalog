tier_rationale:
  en: |
    Les Houches sits at the entrance to the Chamonix valley and
    hosts the Kandahar World Cup downhill venue alongside wide,
    well-groomed red-piste cruising and an intermediate terrain
    park. The sector's lower elevation is supported by consistent
    snowmaking coverage, and its wide runs plus family-friendly base
    area make it more approachable than the higher valley sectors.
    Ski patrol covers the full marked network, including the
    race-piste terrain used for FIS competition.

