tier_rationale:
  en: |
    The Super C Couloir is Portillo's signature hike-to in-bounds
    steep line, a granite-walled chute pitching above 45 degrees that
    requires a bootpack ascent from the lift network before dropping
    into the narrow, rock-flanked couloir. Ski patrol controls access
    and avalanche mitigation for the line, but the terrain is
    freeride-adjacent rather than groomed, with no grooming or
    snowmaking possible on the confined rock walls. Fall consequences
    are severe given the couloir's width and the exposed granite on
    both sides, and the entry is reserved for expert skiers who can
    commit to sustained steep turns in a no-fall zone. Conditions are
    highly sensitive to fresh snow and wind-loading given the couloir's
    orientation and confinement.

