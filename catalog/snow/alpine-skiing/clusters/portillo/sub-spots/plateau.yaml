tier_rationale:
  en: |
    The Portillo Plateau and Roca Jack chair sector forms the resort's
    main intermediate cruising ground in the 2800-3300 m Andean-alpine
    band directly above Laguna del Inca. Piste marking is dominated by
    red runs served by a mix of historic slow chairs and the plateau's
    surface lifts, with wide open pitches typical of the treeless
    high-Andes terrain rather than the tree-lined runs common in
    European or North American resorts. The sector is the traditional
    venue for the Chilean Ski Federation's national training camps and
    FIS speed-discipline pre-season sessions, reflecting consistent
    grooming quality and a dependable dry-snow surface at altitude.
    Full ski-patrol coverage and grooming apply across the marked
    network, making this the standard entry point for visiting
    intermediate skiers.

