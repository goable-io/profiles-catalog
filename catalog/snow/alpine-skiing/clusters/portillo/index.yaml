gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: LIFT_CLOSURE_WIND
    description: Sustained wind above 55 knots closes chairlifts at Portillo; the exposed Andean ridge terrain above the Laguna del Inca becomes unsafe for on-piste skiing.

  - metric: visibility_km
    condition: lt
    value: 0.2
    reason_code: WHITEOUT_RISK
    description: Visibility below 200m makes piste navigation unsafe even on marked runs, increasing collision and off-piste-drift risk.

  - metric: apparent_temp_c
    condition: lt
    value: -28
    reason_code: FROSTBITE_RISK
    description: Apparent temperature below -28°C creates immediate frostbite risk on exposed skin even with lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 16
  carrying_capacity_sensitivity: high
  notes: |
    Portillo's operational footprint centres on its historic single
    hotel-village model, which limits sprawl compared to multi-village
    Alpine resorts but concentrates carrying-capacity pressure on the
    single access road (Ruta 60 / Los Libertadores) and the lift
    network circling Laguna del Inca. Lift electricity draws on the
    Chilean central grid mix; grooming fuel is diesel. Equipment
    footprint is high (skis, boots, helmet, layers), and access
    transport is dominated by bus/private car from Santiago given the
    resort's remote high-Andes location.

