description:
  en: |
    Portillo (Chilean Andes, Región de Valparaíso) is one of South
    America's oldest and most famous ski resorts, perched around the
    turquoise Laguna del Inca at roughly 2880 m base elevation just
    below the Chile-Argentina border crossing at Los Libertadores.
    The resort is famous for its single hotel-centric village, historic
    single-chair and slow double lifts, and Andean-alpine red-piste
    terrain in the 2800-3300 m band that regularly hosts national ski
    teams for pre-season training due to its reliable dry, high-altitude
    snowpack. Portillo has also been a long-standing Chilean Ski
    Federation competition venue and FIS speed-event training site.
    Beyond the groomed piste network, the resort is internationally
    known for its steep hike-to in-bounds couloirs reached on foot from
    the lift network, most famously the Super C Couloir. Season
    typically runs June-October (Southern Hemisphere winter).

