gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the Grande Motte funicular/cable-car link and Bellevarde upper lifts during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Grande Motte glacier sector makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the Grande Motte glacier sector above 3000 m creates immediate frostbite risk on lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    The Espace Killy is operated jointly by STVI (Val d'Isère) and
    STGM (Tignes) under the Domaines Skiables de France coordinated
    environmental protocol. Snowmaking is extensive across the
    mid-mountain given the domain's below-2200 m connecting runs;
    the Grande Motte glacier's extended summer season adds year-round
    operational and glacier-preservation pressure.

