description:
  en: |
    Val d'Isère and Tignes together form the Espace Killy (Savoie,
    French Alps), a fully interconnected domain of roughly 300 km of
    piste and around 80 lifts spanning from the valley floor near
    1550 m up to the Grande Motte glacier at 3456 m. The area carries
    deep Olympic and World Cup pedigree — Val d'Isère's Bellevarde
    face hosted the men's downhill at the 1992 Albertville Games and
    remains a regular World Cup venue, while Tignes' Grande Motte
    glacier offers above-3000 m skiing into the summer months. Piste
    marking spans blue through black across the linked domain, with
    snowmaking covering lower and mid-mountain sectors and full
    ski-patrol coverage on all marked runs. Primary lift operators
    are Val d'Isère's STVI and Tignes' STGM. Season runs late
    November to early May, with the Grande Motte glacier sector
    extending into summer skiing.

