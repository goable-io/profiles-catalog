tier_rationale:
  en: |
    Bellevarde (2827 m) is Val d'Isère's iconic sector and home to
    the Face de Bellevarde, the World Cup downhill piste that hosted
    the men's downhill at the 1992 Albertville Olympics and remains
    an FIS race venue. Black and red pistes dominate the marked
    network, with sustained steep pitch on the race face and full
    ski-patrol coverage across the sector. Cable-car access from the
    village delivers skiers directly to the top of the race piste,
    and grooming is race-grade on the Bellevarde face itself outside
    competition windows.

