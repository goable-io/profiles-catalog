tier_rationale:
  en: |
    The Solaise sector (2551 m), reached via the Solaise gondola,
    offers sunny-side red-piste cruising with an extended network of
    family-friendly runs and a dedicated beginner area near the
    mid-station. Grooming coverage is consistent across the marked
    pistes, with ski patrol present throughout, and the sector's
    south-facing aspect keeps conditions comfortable through the
    core season. Mountain restaurants and a scenic viewing platform
    at the Solaise station add to its standard intermediate appeal.

