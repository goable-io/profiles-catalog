tier_rationale:
  en: |
    The Grande Motte glacier (3456 m) is the Tignes side's
    high-altitude sector, reached via funicular and cable car above
    3000 m, with red and black glacier pistes across the permanent
    snowfield. Ski patrol manages daily crevasse-marking and
    avalanche-control operations before opening, and the sector
    extends the Espace Killy's season into the summer months on the
    glacier. Grooming coverage is more limited than lower-mountain
    sectors given the terrain's scale and altitude, and exposure to
    wind and cold is higher than anywhere else in the domain.

