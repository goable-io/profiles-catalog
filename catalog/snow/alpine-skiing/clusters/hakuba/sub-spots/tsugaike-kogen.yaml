tier_rationale:
  en: |
    Tsugaike Kogen's base sector is the flattest and widest terrain in
    the Hakuba Valley, served by gondola and a network of gentle
    chairlifts and magic-carpet lifts dedicated to beginner terrain.
    The piste network here is dominated by green and blue-marked runs
    with full grooming coverage and low-gradient, wide-corridor
    geometry that keeps collision risk low, plus dedicated kids' zones
    and ski-school terrain near the base lodge. Ski patrol coverage is
    standard across the marked network. This lower, family-friendly
    base sector is distinct from the resort's higher above-treeline
    bowls, which feed the Tsugaike freeride cluster and share its
    summit-area coordinate.

