tier_rationale:
  en: |
    Goryu and Hakuba 47 form a combined lift-linked sector immediately
    south of Happo-One, connected by a shared gondola and chairlift
    network across the two resort bases. The terrain is dominated by
    red-marked cruising pistes with full grooming coverage and standard
    ski-patrol presence, plus a terrain park at Hakuba 47 that gives the
    sector its freestyle-skiing identity within the valley. The base
    areas are gentler and more family-friendly than Happo-One's upper
    mountain, with blue-piste runs serving beginners near both resort
    base stations.

