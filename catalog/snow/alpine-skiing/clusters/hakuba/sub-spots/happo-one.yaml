tier_rationale:
  en: |
    Happo-One is the largest of the Hakuba Valley's ten resorts and
    hosted the downhill and Super-G events of the 1998 Nagano Winter
    Olympics, giving it FIS-grade race-venue infrastructure alongside
    its recreational piste network. Lift access runs via gondola and a
    series of high-speed and fixed-grip chairlifts up to the Usagidaira
    upper sector at roughly 1830 m, with extensive red-piste cruising
    across the mid-mountain and black-piste terrain concentrated on the
    upper mountain. The top-station Kurobishi run is one of the
    steepest lift-served in-bounds black pistes in Japan, moguled and
    narrow in its upper pitch, with ski-patrol coverage across the
    marked network and full grooming on the standard red and blue
    runs below it.

