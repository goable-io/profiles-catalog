description:
  en: |
    Hakuba Valley (Nagano, Japanese Northern Alps) is Japan's largest
    resort-skiing region, a network of ten interconnected ski areas
    across the valley including Happo-One, Goryu, Hakuba 47, and
    Tsugaike Kogen, combining for well over 200 km of marked piste
    served by more than 130 lifts. Happo-One hosted the downhill and
    Super-G events of the 1998 Nagano Winter Olympics, and its Kurobishi
    top-station black run remains one of the steepest lift-served
    in-bounds pistes in Japan. Piste colours span the full range from
    green and blue beginner terrain at the valley-floor bases through
    extensive red cruising to black-piste terrain on the upper
    mountains. Altitude ranges from roughly 750 m at the valley base
    areas up to around 1830 m on Happo-One's Usagidaira upper sector.
    Snowfall is heavy and reliable via the same Sea-of-Japan lake-effect
    monsoon that feeds Niseko, so snowmaking plays a limited supporting
    role. Lift operator coordination runs through the Hakuba Valley
    Tourism Bureau / Hakuba Valley Ski Alliance.

