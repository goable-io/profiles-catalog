gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes exposed Pardatschgrat and Palinkopf ridgeline lifts during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Pardatschgrat and Höllenkar high sectors makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the exposed high Silvretta Skiarena sectors creates immediate frostbite risk on lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Ischgl operates under Seilbahnen Österreich (Austrian cable-car
    association) protocols as part of the Silvretta Skiarena
    cross-border network with Samnaun, Switzerland. Snowmaking is
    extensive across the lower and mid-mountain pistes. Ischgl draws
    heavy peak-season and event-week visitor volume with carrying-
    capacity pressure concentrated on the Silvrettabahn base station and
    Idalp hub.

