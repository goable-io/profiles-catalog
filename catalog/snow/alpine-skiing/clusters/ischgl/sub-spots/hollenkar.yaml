tier_rationale:
  en: |
    The Höllenkar sector is connected via the Silvretta Skiarena lift
    chain and offers quieter red-piste cruising away from the busier
    Idalp and Pardatschgrat sectors. Pistes are predominantly red-marked
    with dramatic views of the surrounding mountain faces, groomed
    daily with snowmaking coverage on the connecting sections. Ski
    patrol and rescue access follows standard lift-network coverage, and
    the moderate gradient makes the sector accessible to confident
    intermediate skiers seeking a less-congested alternative within the
    Ischgl network.

