tier_rationale:
  en: |
    Idalp (2320 m) is the main hub of the Ischgl ski area, reached
    directly by the Silvrettabahn gondola from the village. Pistes are
    predominantly red-marked cruising runs across broad plateau terrain,
    with the Kids Park providing dedicated beginner infrastructure
    including a magic carpet and low-gradient practice slopes. Grooming
    is daily and thorough, snowmaking coverage secures the surface across
    the plateau, and ski patrol coverage is standard given the sector's
    role as the central lift-network hub. Mid-mountain restaurants and
    ski-school meeting points are concentrated here.

