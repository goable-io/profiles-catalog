tier_rationale:
  en: |
    The Pardatschgrat (2624 m), reached via the Pardatschgrat gondola,
    is Ischgl's iconic advanced sector, combining sustained steep red
    pistes with black-marked terrain on the ridgeline descents. The
    upper mountain is more exposed to wind than the sheltered Idalp
    plateau, and the steeper pitches demand confident technique at
    speed. Snowmaking backs up the lower connecting pistes, grooming is
    daily on the marked runs, and ski patrol coverage extends across the
    gondola network. This sector is well regarded among strong
    intermediate and advanced skiers as Ischgl's most challenging
    lift-served terrain.

