tier_rationale:
  en: |
    The Carosello 3000 sector is reached by gondola from Livigno-Centro
    up to the Costaccia station, forming the west-side counterpart to
    Mottolino. Pistes are predominantly red-marked with wide, beginner-
    friendly sub-sectors lower on the mountain that make it a popular
    progression zone for skiers moving up from blue runs. Grooming is
    daily and thorough, snowmaking coverage supplements the natural
    snowpack on the lower connecting pistes, and ski patrol coverage is
    standard across the gondola network. The sector connects onward to
    further Carosello 3000 lifts toward the Swiss border ridgeline.

