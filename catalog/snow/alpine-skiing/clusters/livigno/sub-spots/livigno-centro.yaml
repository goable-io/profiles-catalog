tier_rationale:
  en: |
    Livigno-Centro is the valley-floor base area, with predominantly
    blue-marked beginner pistes, magic-carpet lifts, and a dedicated
    snow-park kids zone for lessons and first turns. Terrain is gentle
    and wide, with full snowmaking coverage guaranteeing a secure surface
    from early season, and ski-school infrastructure concentrated in this
    area. Access is flat and direct from Livigno's main street, making it
    the natural family base for the whole resort, with immediate ski
    patrol response given the proximity to the village.

