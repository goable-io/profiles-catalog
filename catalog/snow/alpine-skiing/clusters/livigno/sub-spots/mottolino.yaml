tier_rationale:
  en: |
    The Mottolino sector (2870 m) is reached by gondola from Livigno's
    east side and combines cruising red pistes with the Mottolino Fun
    Mountain terrain park, one of the best-regarded freestyle venues in
    the Italian Alps, featuring graduated jump lines, rail features, and
    a dedicated boardercross. Grooming is thorough and daily, with
    consistent snowmaking coverage supplementing the valley's already
    reliable natural snowpack at altitude. Ski patrol and rescue access is
    standard gondola-network coverage, and the moderate-gradient red
    pistes outside the park zones remain accessible to confident
    intermediate skiers.

