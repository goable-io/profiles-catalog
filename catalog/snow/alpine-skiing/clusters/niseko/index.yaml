gates:
  - metric: wind_speed_kn
    condition: gt
    value: 55
    reason_code: LIFT_CLOSURE_WIND
    description: Sustained wind above 55 knots closes upper gondolas at Niseko United during blizzard windows; on-piste exposure above treeline becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.15
    reason_code: JAPOW_WHITEOUT
    description: Visibility below 150 m during peak JAPOW dump cycles makes piste navigation impossible even on marked runs; the resort closes ungroomed upper terrain first.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK
    description: Apparent temperature below -25°C on the Hokkaido interior sector creates immediate frostbite risk on lift-served descents.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 20
  carrying_capacity_sensitivity: medium
  notes: |
    Niseko United's four-resort consortium (Grand Hirafu, Hanazono,
    Niseko Village, Annupuri) coordinates shared grooming, snowmaking,
    and lift-closure protocols under the Niseko Rules framework. Snow
    is abundant and reliably cold, so snowmaking is a minor supporting
    input rather than a core dependency. Peak season carrying capacity
    is medium — international visitor concentration is high (heavily
    Australian-origin historically, growing pan-Asian and Western
    presence), but declining Japanese domestic ski tourism has freed
    peak-day lift capacity relative to the 1990s boom era. Road and rail
    access from Sapporo/New Chitose is car- and shuttle-bus dominant.

