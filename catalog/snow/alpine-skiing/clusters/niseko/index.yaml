description:
  en: |
    Niseko United (Hokkaido, northern Japan) is Japan's flagship resort-
    skiing destination, formed by four interconnected ski areas — Grand
    Hirafu, Hanazono, Niseko Village, and Annupuri — sharing a single lift
    pass across the flanks of Mt. Niseko-Annupuri (1308 m). The combined
    piste network runs to roughly 60 km of marked terrain served by over
    30 lifts, with piste colours spanning blue beginner runs at Annupuri
    and Hanazono through extensive red cruising to black pistes on
    Hirafu's upper mountain. Grand Hirafu operates Japan's best-known
    night-skiing programme, with illuminated pistes running until 20:30.
    Snowfall is exceptional and reliable — 14-16 m of dry lake-effect
    powder annually — so snowmaking plays a minor supporting role
    confined to the lowest connector runs. Terrain parks are concentrated
    at Hanazono, and formal in-bounds gates (such as Grand Hirafu Gate 3)
    provide ski-patrol-monitored access to controlled off-piste terrain
    adjacent to the groomed network. Primary operator coordination is
    through the Niseko United four-resort consortium.

