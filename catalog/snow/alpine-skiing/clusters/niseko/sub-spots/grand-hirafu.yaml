description:
  en: |
    The flagship sector of Niseko United — Grand Hirafu combines wide
    red-piste cruising with black-piste terrain on the upper mountain
    and Japan's best-known illuminated night-skiing circuit. Gate 3
    provides patrolled access to adjacent controlled off-piste.

