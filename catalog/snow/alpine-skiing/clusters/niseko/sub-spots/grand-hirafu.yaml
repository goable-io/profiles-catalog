tier_rationale:
  en: |
    Grand Hirafu is the largest of the Niseko United four resorts and
    carries the most extensive marked piste network in the cluster,
    running from wide lower-mountain red cruisers up to a mix of red
    and black-piste terrain on the upper flank of Mt. Niseko-Annupuri.
    Lift access is via a mix of gondola and high-speed quad chairlifts,
    with full grooming coverage on the marked runs and ski-patrol
    presence across the network. Grand Hirafu operates one of Japan's
    best-known night-skiing programmes, with a dedicated illuminated
    piste circuit running until 20:30, and its Gate 3 in-bounds access
    point provides ski-patrol-monitored entry to controlled off-piste
    terrain directly adjacent to the groomed pistes for confident
    intermediate-to-advanced skiers.

