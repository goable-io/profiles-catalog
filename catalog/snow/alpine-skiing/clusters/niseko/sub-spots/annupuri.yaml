tier_rationale:
  en: |
    Niseko Annupuri sector occupies the quieter western flank of Mt.
    Niseko-Annupuri, served by a smaller network of fixed-grip and
    high-speed chairlifts than Grand Hirafu on the opposite side of the
    mountain. The piste network is dominated by red-marked cruising
    runs with full grooming coverage and standard ski-patrol presence,
    plus blue beginner terrain lower on the mountain near the base
    lodge. Crowd density is notably lower than the Hirafu side of
    Niseko United, making Annupuri the preferred sector for skiers
    seeking uncrowded red-piste cruising within the same connected
    lift network.

