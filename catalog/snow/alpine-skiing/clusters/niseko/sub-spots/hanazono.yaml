tier_rationale:
  en: |
    Hanazono occupies the eastern flank of the Grand Hirafu side of
    Niseko United, connected into the shared lift network via
    interlinking chairlifts. The sector is dominated by red-marked
    piste terrain with full grooming coverage and ski-patrol presence,
    plus gentler blue-piste runs near the base area that make it the
    most family-friendly sector of the cluster. Hanazono hosts the
    Niseko United terrain park, giving it the cluster's primary
    freestyle-terrain presence alongside its standard groomed piste
    offering.

