gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the Freccia nel Cielo cable car and other exposed Tofana/Cristallo cabins during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the high Tofana and Cristallo sectors makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the exposed high Dolomite sectors creates immediate frostbite risk on lift-served descents.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Cortina d'Ampezzo skiing operates under ANEF (Associazione Nazionale
    Esercenti Funiviari) protocols and Dolomiti Superski consortium
    coordination. Snowmaking is standard below ~2200 m across the Tofana
    and Faloria-Cristallo mid-mountain pistes. The 2026 Winter Olympics
    build-out has brought new lift and piste infrastructure investment to
    the Olympia delle Tofane venue; carrying-capacity pressure is high in
    peak season and around race-week closures.

