description:
  en: |
    Cortina d'Ampezzo (Veneto, Dolomites) is one of the most storied resort
    towns in Alpine skiing, host of the 1956 Winter Olympics and once again
    the Winter Olympics in 2026, with the men's and women's Alpine events
    scheduled on the Tofana slopes. The ski area spans roughly 120 km of
    pistes across three main sectors — Tofana, Faloria-Cristallo, and 5
    Torri — connected by cable cars, gondolas, and chairlifts, and forms
    part of the wider Dolomiti Superski network via the Sella Ronda lift
    pass. Altitude ranges from the valley floor around 1220 m up to the
    Tofana di Mezzo summit station at 3244 m, with snowmaking coverage on
    the lower and mid-mountain pistes to secure the December-March core
    season. The area is renowned for dramatic Dolomite limestone scenery,
    the Cinque Torri open-air WW1 museum accessible directly from the
    piste network, and the Olympia delle Tofane downhill course, a fixture
    of the FIS Alpine Ski World Cup calendar. Operator: Cortina Skiworld /
    Dolomiti Superski consortium.

