tier_rationale:
  en: |
    Tofana di Mezzo (3244 m) is Cortina's flagship black-piste sector,
    reached via the Freccia nel Cielo cable-car chain from the valley
    floor. The sector hosts the Olympia delle Tofane downhill course, a
    fixture of the FIS Alpine Ski World Cup and the venue for the men's
    and women's downhill at the 1956, and again the 2026, Winter Olympics.
    Pistes are predominantly black-marked with sustained steep pitches,
    high-speed compression sections, and course-side safety netting during
    race weeks; snowmaking secures the lower race track through variable
    conditions. Ski patrol maintains constant presence given the sector's
    competition status, and the summit cable-car station offers panoramic
    Dolomite views but limited shelter in high wind.

