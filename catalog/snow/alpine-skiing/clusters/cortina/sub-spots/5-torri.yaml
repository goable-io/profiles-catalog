tier_rationale:
  en: |
    The 5 Torri (Cinque Torri) sector is reached via the Ra Valles and
    Pomedes chairlifts on the sunny side of the Cortina ski area. Pistes
    are predominantly red-marked, wide, south-facing runs that hold good
    grooming quality on clear days, with snowmaking coverage supplementing
    the mid-mountain slopes. The sector's signature feature is the open-
    air WW1 museum accessible directly from the piste network, with
    preserved trenches and gun emplacements viewable on skis or via short
    walks from lift stations. Terrain is broad and moderate-gradient,
    ski-patrol-served, and popular with intermediate skiers combining
    cruising runs with the historical sights.

