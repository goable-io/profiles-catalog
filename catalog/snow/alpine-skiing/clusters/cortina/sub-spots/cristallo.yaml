tier_rationale:
  en: |
    The Cristallo sector (3221 m) is accessed via the Rio Gere-Son Forca
    chairlift network on the northeast side of the Cortina ski area.
    Pistes are predominantly red-marked cruising runs across varied
    mid-mountain terrain, groomed nightly with snowmaking coverage on the
    lower Rio Gere slopes to bridge shoulder-season conditions. The sector
    is known for dramatic, close-up views of the Cristallo massif and is
    lift-connected toward Faloria, giving intermediate skiers a long
    cruising circuit with mid-mountain rifugi for food and rest. Ski
    patrol and rescue access is standard chairlift-network coverage, and
    the terrain is broad enough to stay family-friendly outside the
    steeper Son Forca approach pitches.

