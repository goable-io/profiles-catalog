tier_rationale:
  en: |
    The Nätschen and Oberalp side is Andermatt's main red-piste
    intermediate cruising sector, connected via the SkiArena lift
    network across the Oberalp Pass toward Sedrun. Terrain here is
    considerably gentler than the Gemsstock face, with wide groomed
    red pistes dominating the marked network and full snowmaking and
    ski-patrol coverage. The sector serves as the primary intermediate
    training and cruising ground for the resort and functions as the
    connective backbone linking Andermatt's village-side lifts to the
    Sedrun extension, making it the busiest through-traffic zone in
    the arena on midweek touring days.

