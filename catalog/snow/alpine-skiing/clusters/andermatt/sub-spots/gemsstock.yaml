tier_rationale:
  en: |
    Gemsstock (2961 m) is Andermatt's iconic freeride-adjacent peak,
    reached by cable car and known internationally for its rich
    in-bounds off-piste bowls alongside the demanding north-face black
    piste that drops from the summit station. Ski patrol maintains
    avalanche control on the open north-facing terrain, but much of
    the appeal lies in the ungroomed, rocky high-alpine bowls flanking
    the marked black piste rather than in wide groomed cruising. The
    summit's exposure to Foehn wind events makes the cable car
    particularly closure-prone compared to lower Andermatt lifts, and
    the steep pitch plus variable snow surface on the north face
    reserve this sector for confident advanced-to-expert skiers.

