tier_rationale:
  en: |
    The Sedrun sector forms the eastern extension of the Andermatt-
    Sedrun-Disentis lift arena, delivering extended red-piste
    intermediate coverage across the Graubünden side of the Oberalp
    Pass. Grooming and ski-patrol standards match the main Andermatt
    side, but crowd density is markedly lower given the sector's
    distance from the Andermatt village hub and its own separate base
    access from Sedrun town. The terrain profile is dominated by wide,
    moderate-gradient red pistes suited to sustained cruising, offering
    visiting skiers a quieter alternative within the same interconnected
    lift network.

