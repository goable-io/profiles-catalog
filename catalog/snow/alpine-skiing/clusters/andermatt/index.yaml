description:
  en: |
    Andermatt (Canton Uri, Central Swiss Alps) anchors the SkiArena
    Andermatt-Sedrun-Disentis lift network, one of the larger
    interconnected Alpine ski areas after major investment expanded
    the lift links across the Oberalp Pass toward Sedrun and Disentis.
    The resort is defined by the iconic Gemsstock peak at 2961 m,
    reached by cable car, which delivers rich in-bounds off-piste
    terrain and a demanding north-face black piste that has made
    Andermatt a favourite among freeride-minded skiers despite its
    resort-piste classification here. Below Gemsstock, the Nätschen
    and Oberalp sector offers red-piste intermediate cruising
    connected across the pass toward Sedrun, whose quieter Andermatt-
    Sedrun-Disentis arena extension provides extended red-piste
    coverage with markedly lower crowd density than the Gemsstock
    side. Season typically runs late November to late April.

