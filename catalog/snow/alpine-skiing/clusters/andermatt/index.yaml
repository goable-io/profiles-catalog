gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the Gemsstock cable car and upper SkiArena lifts during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Gemsstock summit sector makes piste navigation and cable-car retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the Gemsstock high sector creates immediate frostbite risk on lift-served descents.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 21
  carrying_capacity_sensitivity: high
  notes: |
    Andermatt's piste network is operated within the SkiArena
    Andermatt-Sedrun-Disentis consortium under Seilbahnen Schweiz
    coordinated environmental protocols. Recent large-scale lift and
    real-estate investment (Andermatt-Reuss development) has expanded
    capacity but also raised carrying-capacity attention on the
    Gemsstock cable car during peak weekends. Swiss-grid electricity
    (significant hydro share) powers lift operations; the Sedrun
    extension carries a lower crowd-density footprint than the main
    Gemsstock sector.

