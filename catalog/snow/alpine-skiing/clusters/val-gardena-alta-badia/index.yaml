gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes exposed Sella-massif cable cars and ridgeline chairs on the Sella Ronda circuit during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Sella Ronda circuit and Piz La Ila high sectors makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the exposed high Dolomite ridgelines creates immediate frostbite risk on lift-served descents.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Val Gardena and Alta Badia operate under ANEF (Associazione Nazionale
    Esercenti Funiviari) protocols and Dolomiti Superski consortium
    coordination. Snowmaking is extensive across both valleys given
    valley-floor and mid-altitude piste exposure. The Sella Ronda circuit
    concentrates heavy visitor throughput at peak season, with carrying-
    capacity pressure on connecting lifts and cross-valley bottlenecks at
    Passo Gardena and Passo Campolongo.

