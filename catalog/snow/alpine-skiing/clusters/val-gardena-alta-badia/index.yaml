description:
  en: |
    Val Gardena and Alta Badia (South Tyrol, Dolomites) form two of the
    twelve valleys of the Dolomiti Superski network, connected to each
    other and to Cortina, Arabba, and Fassa via the Sella Ronda lift-and-
    piste circuit around the Sella massif. Val Gardena hosts the annual
    Audi FIS Ski World Cup on the Saslong course below the Ciampinoi
    lift, while Alta Badia's Corvara and La Villa/San Cassiano sectors
    offer some of the most extensive red-piste cruising in the Dolomites.
    Combined the two valleys serve over 500 km of pistes within the wider
    Dolomiti Superski pass area, with altitude ranging from valley
    villages near 1300-1550 m up to the Sella massif ridgelines above
    2500 m. Snowmaking covers the large majority of pistes given the
    valley-floor and mid-altitude exposure, grooming is extensive and
    daily, and terrain parks are present at several access points.
    Operators: Val Gardena Ski / Alta Badia Ski, both within Dolomiti
    Superski.

