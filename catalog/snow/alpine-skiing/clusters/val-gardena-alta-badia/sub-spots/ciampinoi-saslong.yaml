tier_rationale:
  en: |
    The Ciampinoi-Saslong sector is Val Gardena's flagship black-piste
    zone, home to the Saslong course used annually by the Audi FIS Ski
    World Cup men's downhill and super-G. The piste is sustained black-
    marked terrain featuring the famous Camel Bumps compression section
    and the technical Ciaslat traverse, both requiring advanced technique
    at speed. Access is via the Ciampinoi cable car/chairlift network from
    Selva di Val Gardena, with race-standard grooming and snowmaking
    coverage on the lower course to guarantee World Cup-quality surface.
    Ski patrol presence is elevated given the venue's competition status,
    and the terrain is not recommended for beginner or intermediate
    skiers outside race-course sightseeing runs.

