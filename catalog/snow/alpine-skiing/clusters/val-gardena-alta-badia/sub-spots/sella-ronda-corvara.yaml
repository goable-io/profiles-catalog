tier_rationale:
  en: |
    The Sella Ronda is the world's iconic multi-valley ski circuit,
    circumnavigating the Sella massif via a continuous chain of lifts
    and connecting red pistes through Corvara and the Alta Badia sector.
    Runs are predominantly red-marked, wide, well-groomed cruising pistes
    linking four valleys (Gardena, Badia, Fassa, Livinallongo) with
    snowmaking coverage on the lower connecting sections. The circuit can
    be skied clockwise or counter-clockwise in a full day, served by
    gondolas and high-speed chairlifts with mid-mountain rifugi at every
    pass, and ski patrol coverage standard across the network. Terrain is
    intermediate-friendly, though queues at connecting lifts can build in
    peak season.

