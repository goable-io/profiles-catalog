tier_rationale:
  en: |
    Piz La Ila (2077 m) is the La Villa/San Cassiano side of the Alta
    Badia ski area, reached by gondola from the valley floor. Pistes are
    predominantly red-marked cruising runs across broad, sunny mid-
    mountain terrain, with full snowmaking coverage securing consistent
    surface quality through the season. The sector includes a dedicated
    terrain park with jumps and rail features, and is lift-connected
    toward the wider Alta Badia and Sella Ronda network. Grooming is
    daily and thorough, ski patrol coverage is standard gondola-network
    access, and the moderate gradient makes the sector suitable for
    confident intermediate skiers and families.

