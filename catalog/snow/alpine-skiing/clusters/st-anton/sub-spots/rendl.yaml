tier_rationale:
  en: |
    The Rendl sector (2645 m) sits across the valley from Galzig, reached
    by its own gondola from St. Anton village. Pistes are predominantly
    red-marked cruising runs across quieter, less-crowded terrain than
    the main Galzig-Valluga side, with dramatic panoramic views across
    the Arlberg massif. Grooming is daily, snowmaking coverage secures
    the mid-mountain pistes, and ski patrol coverage is standard gondola-
    network access. The sector is popular with intermediate skiers
    seeking a quieter alternative and also has a reputation for good
    off-piste-adjacent terrain in favorable conditions.

