tier_rationale:
  en: |
    The Valluga (2811 m) summit sector, reached via the two-stage
    Vallugabahn cable cars, is St. Anton's advanced flagship zone.
    In-bounds terrain includes sustained black pistes with steep,
    exposed pitches, while the Valluga Nord side requires a guided
    hike-to descent onto unpatrolled, avalanche-terrain-adjacent slopes
    accessible only with a qualified mountain guide. Snow conditions
    at this altitude are highly wind-affected, and the summit cable car
    is among the first lifts to close in high wind. Ski patrol coverage
    on the marked black pistes is standard, but the Valluga Nord
    descent sits outside normal resort safety infrastructure and is
    reserved for advanced, guided skiers with avalanche equipment.

