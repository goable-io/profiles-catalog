tier_rationale:
  en: |
    The Galzig sector (2185 m), reached via the Galzigbahn gondola from
    St. Anton village, is the main Arlberg intermediate red-piste hub.
    Pistes are predominantly red-marked, broad cruising runs across
    varied mid-mountain terrain, lift-connected onward to Rendl and St.
    Christoph, giving skiers a long circuit within the Ski Arlberg
    network. Grooming is daily and thorough, snowmaking coverage
    supplements the lower connecting pistes, and ski patrol coverage is
    standard across the gondola-and-chairlift network. The sector
    includes mid-mountain restaurants and forms the natural hub for
    ski-school groups and intermediate skiers.

