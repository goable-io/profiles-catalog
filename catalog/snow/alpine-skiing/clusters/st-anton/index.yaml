description:
  en: |
    St. Anton am Arlberg (Tyrol, Austria) is the historic birthplace of
    modern alpine ski technique and forms the core of the Ski Arlberg
    network, the largest interconnected ski area in Austria at over 300
    km of pistes linking St. Anton, St. Christoph, Stuben, Lech, and
    Zürs. The resort's terrain runs from the village at 1304 m up to the
    Valluga summit at 2811 m, with the Galzig and Rendl sectors forming
    the core intermediate red-piste hubs on either side of the valley.
    St. Anton has a reputation as one of the most demanding lift-served
    ski areas in the Alps, with a strong off-piste and freeride-adjacent
    culture around the Valluga in addition to extensive groomed cruising.
    Snowmaking covers the lower and mid-mountain pistes, and the resort
    is directly rail-connected via ÖBB. Operator: Ski Arlberg / Bergbahnen
    Sankt Anton am Arlberg.

