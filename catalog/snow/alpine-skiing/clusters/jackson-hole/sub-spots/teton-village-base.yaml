tier_rationale:
  en: |
    The Teton Village base area plus the Sweetwater gondola blue-piste
    sectors provide beginner-and-family kids-zone terrain at the foot
    of Rendezvous Mountain, with gentle green and blue-piste runs
    served by low-speed chairs and a magic carpet for first-timers.
    Snowmaking secures base-elevation coverage against variable early-
    and late-season snow conditions, and grooming is comprehensive
    daily. Ski school facilities, lodge access, and ski patrol first-
    response stations concentrate at this base sector, making it the
    resort's lowest-risk, most family-oriented zone.

