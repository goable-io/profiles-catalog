tier_rationale:
  en: |
    The Après Vous mountain sector, served by the Après Vous high-speed
    quad chairlift on the resort's south-western quadrant, delivers
    intermediate red-piste cruising across a broad, groomed run network
    distinct from the steep terrain further up-mountain. Piste marking
    is predominantly red with some blue-piste sections lower down,
    grooming coverage is comprehensive, and the wide, moderate-gradient
    runs give this sector low collision risk relative to the resort's
    steeper zones. Ski patrol maintains standard coverage across the
    marked network, and the sector's extended vertical makes it a
    family-friendly cruising option for skiers not yet ready for
    Rendezvous Mountain's advanced terrain.

