tier_rationale:
  en: |
    Rendezvous Peak (3185 m), reached by the Aerial Tram, is the iconic
    Jackson Hole flagship and the American in-bounds steep-skiing
    reference. The sector includes the Rendezvous Bowl advanced piste
    plus access to the mandatory-drop Corbet's Couloir entry variant, a
    3-5 m cliff drop into a 40° couloir a short walk from the tram exit.
    Piste marking is black and double-black throughout, with ski patrol
    conducting avalanche-control operations on the upper bowls before
    the tram opens each morning. There is no terrain park at this
    altitude and no snowmaking; the sector relies entirely on natural
    Teton snowpack. Wind exposure on the open summit ridge is
    significant, and the tram itself closes at high-wind thresholds;
    this sector is reserved for advanced-to-expert skiers.

