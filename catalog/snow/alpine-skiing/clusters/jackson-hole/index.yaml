description:
  en: |
    Jackson Hole Mountain Resort (Teton Range, Wyoming) is the American
    steep-skiing benchmark, combining lift-served in-bounds extreme
    terrain with over 4,000 vertical feet of continuous descent from the
    3185 m Rendezvous Mountain summit to the Teton Village base at
    1924 m. The resort spans roughly 2,500 acres of marked piste across
    more than 130 named runs, served by the Aerial Tram, Bridger Gondola,
    and a network of high-speed quads including the Après Vous chair on
    the resort's south-western quadrant. Piste marking runs the full
    range from green beginner terrain at Teton Village through red-piste
    cruising on Après Vous mountain to black and double-black pistes off
    Rendezvous, including the mandatory-entry Corbet's Couloir variant.
    Snowmaking covers the lower-mountain base terrain; ski patrol
    maintains avalanche-control operations on the upper bowls each
    morning. Primary operator is Jackson Hole Mountain Resort
    (independently owned). Continental Teton climate delivers cold, dry
    powder with frequent arctic-outflow days.

