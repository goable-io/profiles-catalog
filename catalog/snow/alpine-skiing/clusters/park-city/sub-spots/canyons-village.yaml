tier_rationale:
  en: |
    Canyons Village is the larger of Park City Mountain's two sides
    following the 2015 merger, with extensive intermediate red-piste
    cruising served by a network of high-speed quads and the Orange
    Bubble Express gondola. Piste marking is predominantly red with
    blue-piste beginner terrain around the base village and select
    black pistes on the sector's steeper northern aspects. Grooming
    coverage is comprehensive daily across the cruising network, and
    terrain-park features are present near the base area. Snowmaking
    secures base-elevation runs; ski patrol maintains standard coverage
    across the extensive marked trail network, which spans multiple
    connected peaks.

