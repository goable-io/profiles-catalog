tier_rationale:
  en: |
    Park City Village is the historic original side of the resort,
    offering red and blue-piste cruising close to Park City's downtown
    Main Street, served by a network of high-speed chairs including
    the Silverlode and Payday lifts. Piste marking runs predominantly
    blue-and-red with select black terrain on the upper mountain, and
    grooming coverage is comprehensive daily. A terrain park is present
    near the base area, and snowmaking secures the lower-mountain runs.
    Ski patrol and lodge services concentrate at this historic base,
    making it a well-supported intermediate cruising zone with
    convenient town access.

