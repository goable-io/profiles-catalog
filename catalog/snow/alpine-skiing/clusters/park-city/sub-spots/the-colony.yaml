tier_rationale:
  en: |
    The Colony sector, on the Canyons side of Park City Mountain,
    combines hike-to steeper terrain with gladed and bowl skiing in an
    in-bounds black and advanced-terrain zone. Piste marking is black
    throughout, with some sections accessed only by short hike from
    lift-served boundaries; grooming is minimal given the gladed and
    bowl character of the terrain. There is no snowmaking or terrain
    park in this sector. Ski patrol manages avalanche-control
    operations on the open bowl terrain before opening on storm
    mornings, and the combination of hike-to access and ungroomed
    glade/bowl skiing makes this sector advanced-and-expert-focused.

