description:
  en: |
    Park City Mountain (Wasatch Range, Utah) is the largest ski resort
    in the United States by skiable acreage, formed by the 2015 merger
    of the historic Park City side with the neighbouring Canyons
    Village. Combined the resort covers over 7,300 acres across more
    than 330 marked trails and 40+ lifts, connected by the Quicksilver
    gondola linking the two former base areas. Altitude ranges from the
    2072 m Park City Village base to the 3049 m summit near Jupiter
    Peak. Piste marking spans wide blue and red cruising terrain across
    the bulk of both sides, with black and hike-to advanced terrain
    concentrated in The Colony sector on the Canyons side. Utah's
    famously light, dry "Greatest Snow on Earth" powder benefits from
    the Wasatch's lake-effect-enhanced storm cycles. Snowmaking covers
    base and mid-mountain runs; terrain parks are concentrated at
    Canyons Village and Park City Village base areas. Primary operator
    is Vail Resorts. Park City hosted alpine and other events for the
    2002 Winter Olympics and will again for 2034.

