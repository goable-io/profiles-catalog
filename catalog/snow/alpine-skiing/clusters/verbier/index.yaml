gates:
  - metric: wind_speed_kn
    condition: gt
    value: 50
    reason_code: LIFT_CLOSURE_WIND_ALPINE
    description: Sustained wind above 50 knots closes the Mont Fort cable car and other upper Verbier cable cars during Foehn events; on-piste exposure on ridge-adjacent runs becomes unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.3
    reason_code: WHITEOUT_RISK
    description: Visibility below 300 m on the Mont Fort glacier sector makes piste navigation and lift retrieval unsafe.

  - metric: apparent_temp_c
    condition: lt
    value: -25
    reason_code: FROSTBITE_RISK_ALPINE
    description: Apparent temperature below -25°C on the glaciated Mont Fort summit sector creates immediate frostbite risk on lift-served descents.

  - metric: snow_visibility_m
    condition: lt
    value: 150
    reason_code: BLOWING_SNOW_WHITEOUT
    description: Wind-driven snow (spindrift or ground blizzard) reducing visibility below ~150 m causes whiteout and loss of horizon even when the air is otherwise clear, making route-finding and terrain reading unsafe.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Verbier's piste network is operated by Téléverbier SA under the
    Seilbahnen Schweiz coordinated environmental protocol shared with
    the wider Quatre Vallées consortium. Snowmaking is standard below
    2200 m; the Mont Fort glacier summit sector operates on Swiss-grid
    electricity with significant hydro share. Peak-week crowding on
    the Attelas/Ruinettes lift line is a recognised carrying-capacity
    pressure point.

