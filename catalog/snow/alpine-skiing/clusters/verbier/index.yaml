description:
  en: |
    Verbier (Valais, Swiss Alps) is the resort-skiing hub of the
    Quatre Vallées, one of the largest interconnected lift systems in
    the world at over 400 km of marked piste and roughly 90 lifts
    across the linked valleys. The Verbier sector itself spans from
    the mid-mountain Attelas/Ruinettes intermediate bowls up to the
    Mont Fort glacier summit at 3330 m, with snowmaking covering the
    lower runs below 2200 m and full ski-patrol coverage across the
    marked network. Piste colours run the full range from blue
    beginner runs at Savoleyres and Les Ruinettes to red cruisers
    dominating the mid-mountain and black pistes plus patrolled
    hike-to freeride variants off Mont Fort. Verbier is also the home
    of the Freeride World Tour finale on the adjacent Bec des Rosses,
    giving the resort an international reputation for steep terrain
    alongside its groomed piste offering. Primary lift operator is
    Téléverbier SA. Season typically runs late November to early May
    on Mont Fort's glaciated upper sector.

