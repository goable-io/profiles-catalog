tier_rationale:
  en: |
    Mont Fort's 3330 m summit sector is reached via the Jumbo cable
    car and delivers Verbier's highest lift-served skiing, with
    in-bounds patrolled black pistes plus hike-to freeride variants
    accessible directly from the cable-car station. Piste marking is
    black on the direct descents with red-piste links back toward
    Gentianes and Tortin, and the glaciated upper bowl requires ski
    patrol avalanche-control operations before opening most mornings.
    Terrain-park presence is minimal at this altitude; the sector's
    defining feature is patrolled off-piste access alongside the
    marked black pistes, reserved for confident advanced skiers.

