tier_rationale:
  en: |
    Savoleyres sits on a north-facing slope across the valley from
    the main Attelas side, offering sun-shaded red-piste cruising
    that holds snow quality longer into spring. Access is via
    gondola and chairlift with a mix of blue beginner runs near the
    mid-station and red intermediate pistes on the upper mountain,
    all groomed and patrolled to the same standard as the rest of
    the Verbier network. Crowd density here is consistently lower
    than the Attelas/Ruinettes side, making it a favoured local
    sector on busy weekends and holiday weeks.

