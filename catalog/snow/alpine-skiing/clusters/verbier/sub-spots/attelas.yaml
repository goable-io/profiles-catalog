tier_rationale:
  en: |
    The Attelas gondola and Ruinettes chair sector is Verbier's main
    intermediate cruising ground, spanning roughly 1900-2200 m with
    red pistes dominating the marked network and a handful of easier
    blue links back toward the village. Access is gondola- and
    chairlift-served with full grooming and ski-patrol coverage, and
    snowmaking supplements the lower approach runs in thin-cover
    years. Wide, well-groomed red pistes and moderate gradient make
    this the standard entry-level sector for visiting intermediates,
    with mountain restaurants at both the Attelas and Ruinettes
    stations.

