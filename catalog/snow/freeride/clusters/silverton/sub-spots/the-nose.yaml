tier_rationale:
  en: |
    The Nose is Silverton Mountain's benchmark spine-and-couloir
    sector, offering some of the most sustained, committing
    in-bounds terrain in North America despite being nominally
    lift-served. Multiple narrow spine lines and rock-walled
    couloirs drop off a prominent ridge feature with no easy bail
    option once committed, demanding precise line selection and
    confident steep-skiing technique throughout. The San Juan
    Mountains' faceted, persistent-weak-layer snowpack keeps
    avalanche hazard elevated even within the resort's
    avalanche-control perimeter. Reserved for expert freeriders
    with full avalanche safety kit and steep-skiing competence.

