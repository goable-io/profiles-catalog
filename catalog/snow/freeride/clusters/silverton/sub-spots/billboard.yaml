tier_rationale:
  en: |
    Billboard is Silverton Mountain's iconic hike-to steep-couloir
    sector, reached by a ridgeline bootpack above the top of the
    chairlift into sustained 40-45° chutes with rock-bound entries.
    The zone exemplifies Silverton's small-resort concept — a single
    avalanche-controlled lift feeding genuinely committing terrain
    normally found only in backcountry settings, available either
    on guided days or during the limited unguided-with-beacon window.
    Persistent weak layers in the continental San Juan snowpack make
    this a hazard-sensitive zone even after avalanche-control work.
    Reserved for expert freeriders with full avalanche safety kit.

