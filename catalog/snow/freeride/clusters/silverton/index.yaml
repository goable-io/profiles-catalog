gates:
  # Feasibility floor (auto): no natural snowpack -> physically
  # impossible at any skill level. Hard PREREQUISITE (Gate.kind='feasibility').
  - metric: swe_mm
    condition: lt
    value: 20
    kind: feasibility
    reason_code: NO_SNOWPACK
    description: Below ~20 mm snow water equivalent there is no natural snowpack to ride, so freeride is not feasible regardless of the other conditions.
  - metric: visibility_km
    condition: lt
    value: 0.4
    reason_code: ROCKIES_WHITEOUT
    description: Visibility below 400m in Silverton's steep couloir terrain makes entry-point identification and fall-line judgment unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 42
    reason_code: HIGH_WIND_RIDGE
    description: Sustained wind above 42 knots on the Silverton ridgeline accelerates wind-slab formation on the lee aspects of Billboard and The Nose.

  - metric: apparent_temp_c
    condition: lt
    value: -32
    reason_code: ROCKIES_DEEP_COLD
    description: Apparent temperature below -32°C is common during San Juan arctic-air intrusions at Silverton's 3450m+ base elevation — kit-failure rates rise sharply.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_SNOWFALL_AVALANCHE_LOADING
    description: Heavy active snowfall loads slopes acutely onto the San Juans' persistent weak layers; consult CAIC San Juan zone daily.

sustainability:
  carbon_neutral: false
  equipment_dependency: high
  typical_season_weeks: 14
  carrying_capacity_sensitivity: high
  notes: |
    Silverton runs a single fixed-grip chairlift plus avalanche-control
    infrastructure (howitzer and hand-charge work) — a low-throughput
    operation by design, capped at roughly 475 skier visits/day, which
    keeps per-visitor terrain pressure low compared to conventional
    resorts despite the concentrated expert-only clientele. Equipment
    footprint is high (freeride skis/board, boots, full avalanche
    safety kit including transceiver/probe/shovel, often airbag packs
    given the hazard profile). Remote San Juan location drives a
    significant per-trip travel footprint for the mountain's largely
    fly-in clientele.

