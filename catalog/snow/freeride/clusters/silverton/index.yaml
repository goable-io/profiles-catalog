description:
  en: |
    Silverton Mountain (San Juan Mountains, Colorado) is a
    single-chairlift, avalanche-controlled "small resort" concept
    built entirely around expert hike-to and lift-served steep
    terrain — no beginner or intermediate runs exist on the
    mountain. Guided days run through most of the season; a limited
    unguided-with-beacon window (typically January-early February)
    opens the terrain to qualified self-guided experts. Billboard
    and The Nose are two of the mountain's signature steep-couloir
    and spine sectors, both sustained 40°+ terrain with committing
    fall lines. Continental San Juan snowpack is notoriously
    faceted and persistent-weak-layer prone; avalanche risk consult
    the Colorado Avalanche Information Center (CAIC) San Juan zone
    daily — this is one of the most hazard-sensitive snowpacks in
    North America.

