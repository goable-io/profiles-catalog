description:
  en: |
    Iquique (Tarapacá, northern Chile) is one of the world's most
    consistent paragliding destinations — a coastal escarpment
    launch dropping directly to the Pacific, with sustained
    thermal-and-sea-breeze S-flow that delivers flyable conditions
    on the large majority of days year-round, unlike almost anywhere
    else on the planet. The Alto Hospicio launch atop the desert
    cliff feeds soaring and thermic flights straight down to the
    Playa Brava landing beach; further south, the Palo Buque zone
    is the departure point for advanced XC runs down the Atacama
    coast, with 200+ km flights recorded on peak days. The
    hyper-arid Atacama climate means precipitation gates are almost
    never a factor here — wind and gust management dominate the
    decision.

