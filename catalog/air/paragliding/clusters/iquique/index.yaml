gates:
  - metric: wind_speed_kn
    condition: gt
    value: 28
    reason_code: ANDES_HIGH_WIND
    description: Sustained wind above 28 knots on the Alto Hospicio escarpment compromises launch control and forces early landing at Playa Brava.

  - metric: wind_gust_factor
    condition: gt
    value: 1.9
    reason_code: ANDES_TURBULENT_AIR
    description: Gust factor above 1.9x in the Iquique coastal-cliff rotor zone risks asymmetric collapse near the escarpment edge.

  - metric: visibility_km
    condition: lt
    value: 3
    reason_code: ANDES_LOW_VISIBILITY
    description: Iquique XC flying down the Atacama coast requires visibility above 3 km — the Palo Buque departure route traverses long open coastline with sparse landing options.

  - metric: precipitation_mm_h
    condition: gt
    value: 1.0
    reason_code: ACTIVE_PRECIPITATION
    description: Active precipitation is rare in the hyper-arid Atacama but indicates an anomalous coastal weather system; immediate land-out required.

  - metric: sun_altitude_deg
    condition: lt
    value: 0
    reason_code: NO_DAYLIGHT
    description: Iquique operations require daylight; pilots respect strict end-of-day cycles on the desert-cliff launch.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 45
  carrying_capacity_sensitivity: low
  notes: |
    Iquique paragliding is free-flight with zero direct emissions per
    session and one of the longest flyable seasons in the catalog
    given the desert's near-daily thermal-driven S-flow. Carrying
    capacity is low — pilots disperse along the coastal escarpment
    and the Palo Buque XC corridor. Playa Brava LZ traffic is
    moderate during peak tourist and tandem season; the Atacama's
    hyper-arid ecology has minimal vegetation sensitivity compared
    to alpine or tropical sites.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Federación Aérea de Chile (FEDACH) paragliding site standards"
    - "Iquique paragliding operators consolidated daily-window practice"
    - "FAI Paragliding Commission (CIVL) operational guidelines"
  notes: |
    Cluster aggregates the Iquique launch, standard LZ, and advanced
    XC departure zone. Dimensions/gates copied verbatim from
    paragliding-andes region variant, which explicitly covers Iquique
    in its description. typical_season_weeks raised to 45 (vs the
    16-week Andes regional default) to reflect Iquique's near-year-
    round flyable coastal-desert regime.
