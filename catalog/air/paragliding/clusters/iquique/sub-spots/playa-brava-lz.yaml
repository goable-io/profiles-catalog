tier_rationale:
  en: |
    Playa Brava is Iquique's official landing beach, a wide flat
    sand strip directly below the Alto Hospicio launch with an open
    approach from the escarpment and no obstacles on final glide.
    The beach easily absorbs the high daily volume of tandem and
    solo traffic typical of one of the world's most consistently
    flyable coastal sites, and the flat sand surface removes
    landing-technique risk for low-time pilots. This is the
    designated target for virtually all Iquique flights that are
    not on extended XC tasks, making it the site's beginner-friendly
    baseline landing zone.

