tier_rationale:
  en: |
    The Alto Hospicio launch sits atop the desert escarpment at
    roughly 550 m directly above Iquique city and the Pacific,
    Iquique's iconic desert-cliff-to-sea launch site. The site is
    driven by a sustained thermal-and-sea-breeze S-flow of typically
    15-25 knots, delivering soaring conditions on most days of the
    year, but the cliff-edge exposure and near-daily moderate wind
    demand solid launch technique and active piloting beyond a
    beginner skill level. Tandem and solo intermediate traffic share
    the ramp with rotation managed by local operators. A standard
    intermediate XC-departure and soaring platform rather than a
    beginner training hill.

