tier_rationale:
  en: |
    Palo Buque marks the departure area for Iquique's advanced XC
    route running south along the Atacama coastal escarpment,
    where pilots chain the sustained S-flow thermal-and-ridge lift
    band into flights of 200+ km on peak days — among the longest
    routinely achievable XC distances in world paragliding. The
    route traverses long stretches of remote, sparsely-populated
    desert coastline with limited retrieve access and few
    intermediate landing options, demanding strong cross-country
    decision-making and self-sufficiency. Wind and thermal reading
    over changing coastal terrain features (headlands, escarpment
    breaks) require advanced XC competence well beyond local
    soaring. Reserved for experienced XC pilots with retrieve
    logistics planned in advance.

