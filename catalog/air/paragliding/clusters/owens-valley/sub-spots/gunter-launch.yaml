tier_rationale:
  en: |
    Gunter launch, near Bishop on the Sierra Nevada side of the
    Owens Valley, is the valley's standard intermediate XC-departure
    platform, offering more moderate access and launch conditions
    than the higher, more committing Walt's Point. Pilots typically
    launch into organized valley thermals that build predictably
    through the morning, feeding into the same north-south XC
    corridor used by the valley's classic long-distance tasks. The
    site sees routine daily traffic from local and visiting
    intermediate pilots working up to the valley's bigger XC days.
    A solid intermediate step into Owens Valley cross-country flying
    rather than a beginner training hill.

