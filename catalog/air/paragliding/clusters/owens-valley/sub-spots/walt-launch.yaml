tier_rationale:
  en: |
    Walt's Point launch, at roughly 2450 m in the Sierra Nevada
    foothills above Lone Pine near Bishop, is one of the most
    storied cross-country paragliding launches in the world and the
    departure point for multiple US and world XC distance records.
    The high-altitude launch demands 4WD/high-clearance road access
    and confident mountain-launch technique into strong, sometimes
    aggressive thermal cycles that build rapidly through the day.
    Pilots flying from Walt's routinely commit to long, remote
    valley crossings with limited bail-out landing options along
    portions of the route, requiring serious XC decision-making and
    retrieve planning. Reserved for experienced XC pilots.

