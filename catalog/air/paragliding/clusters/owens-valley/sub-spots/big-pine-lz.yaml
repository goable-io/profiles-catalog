tier_rationale:
  en: |
    Big Pine is the Owens Valley's standard open-desert landing
    zone, a wide flat stretch of valley floor with no obstacles and
    generous margin for approach from any direction. The site
    routinely serves as the target for both local sled-ride flights
    and as an intermediate or final landing point along the valley's
    classic north-south XC tasks launched from Walt's Point or
    Gunter. Flat, obstacle-free desert terrain removes
    landing-technique risk for low-time pilots, and the valley's
    wide-open geometry means overshoot or undershoot rarely
    encounters any hazard. A low-risk, high-capacity baseline LZ for
    the whole valley.

