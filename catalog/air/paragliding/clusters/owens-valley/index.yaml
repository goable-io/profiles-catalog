  notes: |
    Cluster aggregates the valley's two classic XC-departure launches
    and its standard desert LZ. Extends the base `paragliding`
    profile directly (no Rockies-region paragliding variant exists
    yet in the catalog); dimensions/gates copied verbatim from the
    base profile. typical_season_weeks set to 28 reflecting the
    April-October Sierra/Owens flying window.
