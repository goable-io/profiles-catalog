gates:
  - metric: wind_speed_kn
    condition: gt
    value: 28
    reason_code: HIGH_WIND
    description: Sustained wind above 28 knots at Owens Valley launches makes paraglider control unsafe; canopy collapse risk rises sharply.

  - metric: wind_gust_factor
    condition: gt
    value: 2.0
    reason_code: GUSTY_TURBULENT_AIR
    description: Gust factor above 2.0x in the Owens Valley's strong desert thermal cycles indicates turbulent air with severe canopy collapse risk.

  - metric: visibility_km
    condition: lt
    value: 2
    reason_code: LOW_VISIBILITY
    description: Visibility below 2km violates VFR flight requirements and creates terrain collision risk against the Sierra Nevada or White-Inyo escarpments.

  - metric: precipitation_mm_h
    condition: gt
    value: 0.5
    reason_code: ACTIVE_PRECIPITATION
    description: Active precipitation degrades canopy fabric and dramatically increases stall risk.

  - metric: sun_altitude_deg
    condition: lt
    value: 0
    reason_code: NO_DAYLIGHT
    description: Paragliding requires daylight; night operations are not standard recreational practice in the Owens Valley.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 28
  carrying_capacity_sensitivity: low
  notes: |
    Owens Valley paragliding is free-flight with zero direct
    emissions per session. Equipment footprint is moderate (canopy,
    harness, reserve, vario/GPS essential for the valley's long XC
    tasks). Carrying capacity is low — pilots disperse widely along
    the north-south valley corridor and land at scattered desert
    LZs. 4WD/high-clearance access to Walt's Point adds out-of-
    session vehicle emissions; retrieve driving along US-395 is the
    dominant per-trip footprint for XC pilots chasing long tasks.

verdict_buckets:
