description:
  en: |
    The Owens Valley, flanked by the Sierra Nevada to the west and
    the White-Inyo Range to the east near Bishop, California, is
    one of the most storied cross-country paragliding and hang
    gliding arenas in the world — the birthplace of many US and
    world XC distance records thanks to its strong, reliable desert
    thermals and long, obstacle-free valley corridor. Walt's Point
    and Gunter are the valley's classic high-altitude XC-departure
    launches, feeding flights that run north-south along the valley
    axis with landing options scattered along its length, including
    the Big Pine desert LZ. Flying season runs roughly April-October,
    with the strongest XC conditions in the summer months when
    surface heating over the Owens dry lakebed and valley floor
    drives powerful, well-organized thermals.

