description:
  en: |
    Pedra Bonita, above São Conrado in Rio de Janeiro, is one of the
    world's most famous urban paragliding sites — an Atlantic-facing
    granite cliff launch with a backdrop of Tijuca rainforest and a
    direct glide to São Conrado beach far below. Year-round tandem
    operations run daily, driven by Rio's tropical thermal-and-sea-
    breeze regime rather than a seasonal window; the flying day
    typically builds through the morning as onshore flow and slope
    thermals couple over the Pedra da Gávea massif. The combination
    of dependable daily flyability, dramatic scenery, and a huge
    urban catchment makes it one of the highest-traffic tandem sites
    on the planet.

