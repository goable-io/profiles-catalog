gates:
  - metric: wind_speed_kn
    condition: gt
    value: 28
    reason_code: HIGH_WIND
    description: Sustained wind above 28 knots on the Pedra Bonita cliff launch makes paraglider control unsafe; canopy collapse risk rises sharply.

  - metric: wind_gust_factor
    condition: gt
    value: 2.0
    reason_code: GUSTY_TURBULENT_AIR
    description: Gust factor above 2.0x over the Pedra da Gávea massif indicates turbulent air with severe canopy collapse risk.

  - metric: visibility_km
    condition: lt
    value: 2
    reason_code: LOW_VISIBILITY
    description: Visibility below 2km violates VFR flight requirements and creates terrain collision risk against the Tijuca massif.

  - metric: precipitation_mm_h
    condition: gt
    value: 0.5
    reason_code: ACTIVE_PRECIPITATION
    description: Active precipitation degrades canopy fabric and dramatically increases stall risk.

  - metric: sun_altitude_deg
    condition: lt
    value: 0
    reason_code: NO_DAYLIGHT
    description: Paragliding requires daylight; night operations are not standard recreational practice at Pedra Bonita.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 48
  carrying_capacity_sensitivity: medium
  notes: |
    Pedra Bonita paragliding is free-flight with zero direct emissions
    per session, flyable nearly year-round given Rio's tropical
    climate. Equipment footprint is moderate (tandem/solo canopy,
    harness, reserve). Carrying capacity is medium given the site's
    very high daily tandem-flight volume feeding a single launch
    ramp and a shared urban beach LZ — operator queue management at
    the ramp is a well-established local practice. The launch sits
    within Tijuca National Park, requiring coordination with park
    authorities on access and vegetation protection.

