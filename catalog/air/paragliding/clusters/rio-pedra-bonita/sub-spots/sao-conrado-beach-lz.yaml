tier_rationale:
  en: |
    São Conrado beach is the standard Rio paragliding landing zone
    in the Barra da Tijuca sector, a wide open sand approach with
    no obstacles on final glide from the Pedra Bonita launch above.
    The beach's generous width easily absorbs the very high daily
    volume of tandem and solo flights typical of one of the world's
    busiest urban paragliding sites. Flat sand and an unobstructed
    approach corridor remove landing-technique risk for low-time
    pilots and tandem passengers, and the site is designated and
    used by essentially all Pedra Bonita flights as the default
    target.

