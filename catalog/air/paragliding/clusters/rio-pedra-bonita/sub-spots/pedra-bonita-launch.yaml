tier_rationale:
  en: |
    The Pedra Bonita launch at roughly 510 m is Rio's iconic
    Atlantic-facing cliff ramp above São Conrado, framed by Tijuca
    rainforest and looking directly out over the ocean. Tandem
    operations run daily year-round, and the site's tropical
    thermal-driven sea-breeze regime delivers consistently flyable
    mid-morning-to-afternoon windows, but the exposed cliff-edge
    launch and coupling of slope thermals with onshore flow over
    the Pedra da Gávea massif demand solid launch technique beyond
    pure beginner level. High daily traffic volume requires pilots
    to manage ramp queueing and mid-air spacing, making this a
    standard intermediate-and-tandem platform rather than an
    isolated training hill.

