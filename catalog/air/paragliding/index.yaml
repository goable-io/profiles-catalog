slug: paragliding
spot_kind: base
version: "0.1.0"
category: air
display_name:
  en: Paragliding
  it: Parapendio
  es: Parapente
  fr: Parapente
  de: Gleitschirmfliegen
description:
  en: |
    Paragliding requires light-to-moderate wind, low gust factor, daylight,
    good visibility, dry conditions, and thermal activity for soaring or
    cross-country flights. Excessive wind, strong gusts, precipitation,
    or low cloud ceilings make flight unsafe. This profile scores the
    baseline weather physics; additional thermal metrics such as thermal
    lift, convective cloud base, and vertical wind shear will refine scoring
    further — paragliding's competitive scoring lives in thermal quality,
    not just wind speed.

dimensions:
  - name: wind_speed
    metric: wind_speed_kn
    weight: 0.18
    curve:
      - { x: 0,  s: 0.40 }
      - { x: 3,  s: 0.85 }
      - { x: 6,  s: 1.00 }
      - { x: 10, s: 1.00 }
      - { x: 14, s: 0.85 }
      - { x: 18, s: 0.55 }
      - { x: 22, s: 0.20 }
      - { x: 28, s: 0.00 }

  - name: gust_factor
    metric: wind_gust_factor
    weight: 0.18
    curve:
      - { x: 1.0, s: 1.00 }
      - { x: 1.2, s: 0.95 }
      - { x: 1.4, s: 0.65 }
      - { x: 1.6, s: 0.30 }
      - { x: 2.0, s: 0.00 }

  - name: sun
    metric: sun_altitude_deg
    weight: 0.13
    curve:
      - { x: 0,  s: 0.00 }
      - { x: 10, s: 0.55 }
      - { x: 25, s: 0.95 }
      - { x: 40, s: 1.00 }
      - { x: 70, s: 1.00 }

  - name: visibility
    metric: visibility_km
    weight: 0.13
    curve:
      - { x: 0,  s: 0.00 }
      - { x: 2,  s: 0.30 }
      - { x: 5,  s: 0.70 }
      - { x: 10, s: 1.00 }

  - name: precipitation
    metric: precipitation_mm_h
    weight: 0.09
    curve:
      - { x: 0,   s: 1.00 }
      - { x: 0.1, s: 0.50 }
      - { x: 0.5, s: 0.10 }
      - { x: 1.0, s: 0.00 }

  - name: temperature
    metric: apparent_temp_c
    weight: 0.09
    curve:
      - { x: -10, s: 0.20 }
      - { x: 0,   s: 0.70 }
      - { x: 12,  s: 1.00 }
      - { x: 25,  s: 1.00 }
      - { x: 35,  s: 0.65 }
      - { x: 42,  s: 0.20 }

  - name: xc_condition
    metric: xc_condition_score
    weight: 0.12
    curve:
      - { x: 0.0, s: 0.00 }
      - { x: 0.2, s: 0.20 }
      - { x: 0.4, s: 0.50 }
      - { x: 0.6, s: 0.75 }
      - { x: 0.8, s: 0.92 }
      - { x: 1.0, s: 1.00 }

  - name: density_altitude
    metric: density_altitude_m
    weight: 0.08
    curve:
      - { x: -500, s: 1.00 }
      - { x: 0,    s: 1.00 }
      - { x: 1000, s: 0.97 }
      - { x: 2000, s: 0.90 }
      - { x: 3500, s: 0.70 }
      - { x: 5000, s: 0.45 }

gates:
  - metric: wind_speed_kn
    condition: gt
    value: 28
    reason_code: HIGH_WIND
    description: Sustained wind above 28 knots makes paraglider control unsafe; canopy collapse risk rises sharply.

  - metric: wind_gust_factor
    condition: gt
    value: 2.0
    reason_code: GUSTY_TURBULENT_AIR
    description: Gust factor above 2.0x indicates turbulent air with severe canopy collapse risk.

  - metric: visibility_km
    condition: lt
    value: 2
    reason_code: LOW_VISIBILITY
    description: Visibility below 2km violates VFR flight requirements and creates terrain collision risk.

  - metric: precipitation_mm_h
    condition: gt
    value: 0.5
    reason_code: ACTIVE_PRECIPITATION
    description: Active precipitation degrades canopy fabric and dramatically increases stall risk.

  - metric: sun_altitude_deg
    condition: lt
    value: 0
    reason_code: NO_DAYLIGHT
    description: Paragliding requires daylight; night operations are not standard recreational practice.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 32
  carrying_capacity_sensitivity: low
  notes: |
    Free-flight paragliding has zero direct emissions per session.
    Equipment footprint is moderate (canopy with multi-year lifespan,
    harness, reserve parachute, helmet, varios/GPS). Carrying capacity
    sensitivity is low — paragliders disperse spatially across thermal
    columns. Local wildlife considerations include raptor nesting sites
    during breeding season (March-July in most EU mountain ranges);
    pilots should respect no-fly zones around known nesting cliffs.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  reviewed_by: []
  sources:
    - "FAI Paragliding Commission (CIVL) operational guidelines"
    - "European paragliding XC league weather criteria (CCC/Coupe Icare standards)"
  maturity: provisional
  notes: |
    The xc_condition dimension (xc_condition_score, weight 0.12) is a scored
    quality signal: a 0..1 cross-country soaring index (thermal lift +
    convective cloud base + low vertical wind shear + moderate cloud cover),
    the composite that distinguishes a "good thermal day" from a merely
    "good wind day" — the heart of paragliding competitive scoring. The
    suitability curve is monotonic-increasing (0.0→0.00, 0.2→0.20, 0.4→0.50,
    0.6→0.75, 0.8→0.92, 1.0→1.00): higher = better cross-country day. Its
    inputs (boundary layer height, shortwave radiation, 900hPa wind,
    dewpoint, cloud cover) are reliably available, so the metric is well
    populated. Weight is meaningful but deliberately not dominant — wind and
    safety (gust, visibility, precipitation) still lead. Adding this
    dimension rebalanced the pre-existing weights proportionally (each scaled
    by 0.88 so the set still sums to 1.0): wind_speed 0.30→0.26, gust_factor
    0.20→0.18, sun 0.15→0.13, visibility 0.15→0.13, precipitation
    0.10→0.09, temperature 0.10→0.09, with xc_condition taking the remaining
    0.12; relative proportions are preserved. Additional thermal metrics
    (thermal lift, convective cloud base, vertical wind shear) remain
    available as finer-grained future dimensions, along with air-quality,
    twilight-band, and evening golden-hour signals for end-of-day soaring
    windows.
