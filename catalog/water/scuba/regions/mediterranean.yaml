slug: scuba-mediterranean
spot_kind: region
version: "0.2.0"
category: water
extends: scuba
region: mediterranean
display_name:
  en: Scuba Diving — Mediterranean
  it: Immersione — Mediterraneo
  es: Buceo — Mediterráneo
  fr: Plongée — Méditerranée
  de: Tauchen — Mittelmeer
description:
  en: |
    Mediterranean diving spans coastal walls, posidonia meadows, wrecks,
    and seamount drift dives across the basin. Underwater clarity is
    the value proposition — 15-30 m typical — but is seasonally variable:
    spring blooms and post-storm sediment can briefly halve it.
    Regional overrides raise the `water_clarity` weight above the base
    (Mediterranean clarity carries scoring weight), shift the
    `water_temp` sweet spot warmer (basin warms to 26-28°C in August),
    and tighten the turbidity + surface-visibility gates. Current is
    generally low in coastal Mediterranean sites; the `current`
    dimension retains a small weight for the drift-diving fringe
    (Bocche di Bonifacio, Strait of Messina, Gibraltar current cone).

# v0.2.0 — restructured on the v2.0.0 base semantics. Placeholder curves +
# weights pending certified-diver review. See scuba/index.yaml meta.notes
# for the full v2.0.0 change rationale (Diano Marina real-diver feedback).

dimensions:
  - name: water_clarity
    metric: water_clarity_index
    weight: 0.30
    curve:
      - { x: 0.0, s: 0.05 }
      - { x: 0.2, s: 0.20 }
      - { x: 0.4, s: 0.55 }
      - { x: 0.6, s: 0.85 }
      - { x: 0.8, s: 0.95 }
      - { x: 1.0, s: 1.00 }

  - name: wave
    metric: wave_height_m
    weight: 0.22
    curve:
      - { x: 0.0, s: 1.00 }
      - { x: 0.3, s: 1.00 }
      - { x: 0.7, s: 0.85 }
      - { x: 1.3, s: 0.50 }
      - { x: 2.0, s: 0.15 }
      - { x: 2.8, s: 0.00 }

  - name: water_temp
    metric: water_temperature_c
    weight: 0.20
    curve:
      - { x: 12, s: 0.10 }
      - { x: 16, s: 0.45 }
      - { x: 20, s: 0.85 }
      - { x: 24, s: 1.00 }
      - { x: 28, s: 1.00 }
      - { x: 30, s: 0.90 }

  - name: current
    metric: tidal_current_speed_kn
    weight: 0.08
    curve:
      - { x: 0.0, s: 1.00 }
      - { x: 0.3, s: 1.00 }
      - { x: 0.7, s: 0.85 }
      - { x: 1.2, s: 0.60 }
      - { x: 1.8, s: 0.30 }
      - { x: 2.5, s: 0.05 }

  - name: wind_speed
    metric: wind_speed_kn
    weight: 0.08
    curve:
      - { x: 0,  s: 1.00 }
      - { x: 8,  s: 1.00 }
      - { x: 14, s: 0.75 }
      - { x: 20, s: 0.40 }
      - { x: 28, s: 0.00 }

  - name: air_temp_comfort
    metric: apparent_temp_c
    weight: 0.05
    curve:
      - { x: 5,  s: 0.20 }
      - { x: 15, s: 0.75 }
      - { x: 22, s: 1.00 }
      - { x: 32, s: 1.00 }
      - { x: 40, s: 0.55 }

  - name: surface_visibility
    metric: visibility_km
    weight: 0.04
    curve:
      - { x: 0.0, s: 0.00 }
      - { x: 0.5, s: 0.20 }
      - { x: 1.0, s: 0.55 }
      - { x: 3.0, s: 0.85 }
      - { x: 5.0, s: 1.00 }

  - name: sun
    metric: sun_altitude_deg
    weight: 0.03
    curve:
      - { x: 0,  s: 0.00 }
      - { x: 10, s: 0.55 }
      - { x: 30, s: 1.00 }

gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave height above 2.3m in Mediterranean coastal sites (Tramontane/Mistral storm events) creates unsafe shore-entry and small-boat access conditions.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_SURFACE_VISIBILITY_MED
    description: Surface visibility below 800m during Mediterranean haze/sirocco events makes site-finding unsafe (surface navigation only — underwater visibility is scored separately via water_clarity + turbidity_proxy).

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy active rain in coastal sites triggers terrestrial runoff that drops underwater visibility from 20m+ to 1-3m at impacted sites within hours.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY_MED
    description: Elevated turbidity (post-storm sediment, river plumes) crashes underwater visibility to sub-2m — dive quality destroyed and buddy separation risk rises sharply. (Previous v0.1.0 used the wrong scale value 25 — corrected to 0.7 on the 0-1 turbidity_proxy scale.)

  - metric: tidal_current_speed_kn
    condition: gt
    value: 2.5
    reason_code: STRONG_CURRENT_UNSAFE_MED
    description: Sustained tidal current above 2.5 knots (rare in Mediterranean coastal sites but real in Bocche di Bonifacio, Strait of Messina, and Gibraltar current cone) exceeds recreational drift-management capacity.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: medium
  notes: |
    Mediterranean dive sites are concentrated in Marine Protected Areas
    (Medes Islands, Lavezzi, Capraia, Ustica, Kornati) where carrying
    capacity is actively managed via permits and daily diver caps.
    Coral and gorgonian degradation from contact + bubble exposure is
    documented; site managers enforce trim and frequency limits. Boat
    transport accounts for the largest per-session footprint in the
    Mediterranean basin (typically 5-30 min RIB transfer).

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "FIPSAS (Italian underwater federation) Mediterranean dive site classification"
    - "Mediterranean Action Plan (UNEP/MAP) MPA carrying capacity guidance"
    - "Lloret et al. 2008, Mediterranean SCUBA diving impact studies"
    - "PADI Mediterranean regional dive condition handbook — TODO diver review"
  notes: |
    v0.2.0 (breaking) — realigned to v2.0.0 base structure. Diano Marina
    real-diver feedback drove the semantics reset. See scuba/index.yaml
    meta.notes for the full changelog.

    Regional overrides vs v2.0.0 base:
    - water_clarity weight raised 0.25 → 0.30 (Mediterranean clarity is
      the value proposition — every degree of clarity loss is felt).
    - water_temp weight raised 0.18 → 0.20 (Mediterranean basin warms
      to 26-28°C August; cold-shoulder-months hit tourist-comfort hard).
    - current weight lowered 0.10 → 0.08 (Mediterranean coastal sites
      are generally low-current outside Bocche di Bonifacio + Messina).
    - surface_visibility weight lowered 0.05 → 0.04.
    - wave gate tightened 2.5 → 2.3 (prevailing shore-entry sites).
    - visibility_km surface gate tightened 0.5 → 0.8 km.
    - precip gate tightened 15 → 12 mm/h.
    - turbidity_proxy gate CORRECTED from 25 (wrong 0-100 scale) to
      0.7 (correct 0-1 scale matching the consumer engine output).

    Placeholder — all numeric values pending diver review.
