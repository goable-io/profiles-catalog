description:
  en: |
    Red Sea diving spans the Gulfs of Aqaba and Suez, the Egyptian
    mainland coast (Sharm-Hurghada-Marsa Alam), the offshore Brothers/
    Daedalus/Elphinstone/Rocky Island seamount chain, and Sudanese +
    Saudi coastlines. The regime is warm-water year-round (22-29°C),
    exceptionally clear (25-40 m routine), fringing-reef + wall
    dominant with sharp thermoclines and pelagic-corridor drift dives
    on the offshore seamounts. Dominant safety variable is wind — the
    prevailing NW Etesian regime creates short-period chop above 20 kn
    that gates safari operations; the seasonal shamal sandstorms drop
    surface visibility to <1 km for 24-48 h. Coral-cover is world-class
    but under active bleaching pressure since the 2015 basin-wide event.

