gates:
  - metric: wave_height_m
    condition: gt
    value: 2.5
    reason_code: RED_SEA_HIGH_SEAS
    description: Wave height above 2.5 m in the Red Sea (Etesian + Khamsin winter storms) makes offshore safari access unsafe; RIB drop-offs on wall sites become dangerous.

  - metric: wind_speed_kn
    condition: gt
    value: 25
    reason_code: ETESIAN_HIGH_WIND
    description: Sustained wind above 25 knots in the Red Sea basin generates short-period chop that shuts safari operations to Brothers / Daedalus / Elphinstone.

  - metric: visibility_km
    condition: lt
    value: 1.0
    reason_code: SHAMAL_LOW_VISIBILITY
    description: Surface visibility below 1 km during shamal sandstorm events makes site-finding and boat navigation unsafe; underwater visibility drops from 30 m+ to <5 m within hours.

  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: FLASH_FLOOD
    description: Heavy rain in the Red Sea coastal plain (rare but severe) triggers wadi flash-flood runoff into coastal sites, killing visibility.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Red Sea coral cover is under bleaching pressure since the 2015 basin
    event; Egyptian Ministry of Environment + HEPCA enforce MPA rules
    at Ras Mohammed, Elphinstone, and the offshore seamount chain.
    Liveaboard operations concentrate boat-transport emissions on 6-7 day
    safaris (Brothers/Daedalus/Elphinstone routing) — this is the
    dominant per-session footprint. Bedouin land-camp diving (Dahab)
    has lower footprint but higher shore-entry MPA-boundary compliance
    burden.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "HEPCA (Hurghada Environmental Protection and Conservation Association) reef and mooring standards"
    - "Egyptian Ministry of Environment Ras Mohammed / Brothers / Daedalus / Elphinstone MPA rules"
    - "PADI Red Sea regional dive condition handbook"
    - "Kleinhaus et al. 2020 Red Sea coral thermal-tolerance research"
  notes: |
    Regional overrides vs global scuba: visibility weight lowered to 0.28
    from 0.30 (Red Sea clarity is dependably high, less discriminating);
    wind weight raised to 0.15 (Etesian gate is the dominant operational
    constraint); water_temp sweet-spot 26-29°C. Added Etesian wind gate
    at 25 kn (5 kn tighter than global). 44-week season with 4 weeks
    of Khamsin storm windows (Mar-May) as the primary shoulder-closure
    risk.
