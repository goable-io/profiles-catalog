description:
  en: |
    Pacific diving spans the Great Barrier Reef and Coral Sea (Australia
    E coast), the Philippine + Indonesian Pacific-side archipelagos,
    Papua New Guinea + Micronesia, French Polynesia (Rangiroa, Fakarava),
    Fiji, Palau, Cocos + Malpelo (Costa Rica / Colombia), Galapagos
    (Ecuador), Hawaii, and Californian channel islands. Warm-tropical
    zones dominate (26-30°C reef sites) but the region also captures
    the Pacific temperate diving fringe (California kelp forests
    12-18°C). Extreme pelagic-encounter sites (Cocos hammerheads,
    Galapagos schooling, Palau blue-hole) draw the technical / liveaboard
    market. Cyclone / typhoon season windows are basin-partitioned
    (Nov-Apr SE Pacific / SW Pacific; Jun-Nov NW Pacific typhoon belt).

