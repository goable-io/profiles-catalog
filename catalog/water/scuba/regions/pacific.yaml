gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: PACIFIC_HIGH_SEAS
    description: Wave height above 3.0 m on Pacific reef and pinnacle sites (typhoon periphery, SW-Pacific cyclone edge) makes drift drop-off and safety-stop hold unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: TROPICAL_CYCLONE_PERIPHERY
    description: Sustained wind above 30 knots signals cyclone or typhoon periphery; all Pacific reef and liveaboard operations stand down.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_PAC
    description: Surface visibility below 800 m during tropical squall or coastal-front passage makes site-finding unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE_PAC
    description: Heavy tropical rain above 20 mm/h correlates with cyclone systems and coastal-runoff visibility crashes on high-island sites.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Pacific reef systems (GBR, Coral Sea, Coral Triangle Pacific fringe)
    are under severe climate-driven bleaching pressure (2016-17, 2020,
    2022 GBR events). Coral Triangle Initiative + GBRMPA (Great Barrier
    Reef Marine Park Authority) enforce zone-based dive-tourism rules.
    Cocos, Galapagos, and Malpelo are strict-access MPAs with liveaboard-
    only itineraries carrying the dominant per-session footprint.
    Californian channel-island temperate diving has its own MPA network
    (Channel Islands NP + State Marine Reserves).

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Great Barrier Reef Marine Park Authority (GBRMPA) diving-tourism guidelines"
    - "Coral Triangle Initiative 2018-2023 site monitoring"
    - "Cocos + Galapagos + Malpelo strict-access liveaboard permit documentation"
    - "PADI Pacific regional dive condition handbook"
    - "NOAA CoralReefWatch Pacific bleaching thermal-stress bulletins"
  notes: |
    Regional overrides vs global scuba: water_temp curve extended into
    temperate range (14°C floor at 0.30) to capture the California +
    Tasman fringe; visibility weight raised to 0.28 (Pacific tropical
    clarity is the value proposition); wind weight 0.12 (typhoon /
    cyclone gate at 30 kn is the dominant safety variable). 40-week
    season with 8-12 weeks of cyclone/typhoon partition. Cross-basin
    variance (GBR tropical vs Cocos pelagic vs California kelp) is
    captured at cluster level.
