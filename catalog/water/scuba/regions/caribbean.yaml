  de: Tauchen — Karibik
description:
  en: |
    Caribbean diving spans the Antilles arc (Cozumel, Bonaire, Roatán,
    Grand Cayman, Turks and Caicos, Dominican Republic), the Belize
    barrier reef system, Cuba, and the Yucatán cenote karst freshwater
    network. Warm-water regime year-round (26-29°C surface), typically
    excellent visibility (25-40 m on healthy reef sites) but with strong
    drift-diving currents on wall sites (Cozumel Palancar, Cayman North
    Wall). Hurricane season (June-Nov, peak Aug-Oct) drives closures
    with 5-7 day warning windows. Cenote diving is a distinct sub-regime:
    freshwater, halocline transitions, cavern/cave overhead environments
    requiring specific training. Reef degradation is severe on
    high-traffic sites — MPA + daily-visitor caps are the norm.

