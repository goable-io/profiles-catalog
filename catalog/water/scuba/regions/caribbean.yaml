gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: CARIBBEAN_HIGH_SEAS
    description: Wave height above 3.0 m in Caribbean coastal sites (usually cold-front or hurricane periphery) makes boat access and drift-dive drop-off unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: HURRICANE_PERIPHERY
    description: Sustained wind above 30 knots signals hurricane periphery or strong cold-front passage; all operations stand down and evacuation protocols may be triggered.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: POOR_VISIBILITY_CARIB
    description: Surface visibility below 500 m during squall passage or heavy tropical rain makes site-finding unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE
    description: Heavy tropical rainfall above 20 mm/h correlates with tropical storm systems; operations pause.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Caribbean reef diving is on the front line of climate-driven coral
    bleaching (2005, 2010, 2017, 2023 basin-wide events documented).
    Cozumel Marine Park + Belize Barrier Reef World Heritage Site
    enforce daily diver caps. Cenote diving in Yucatán has secondary
    impact concerns (aquifer contamination from surface runoff, guide-
    line abrasion on karst formations). Boat transport in liveaboard-
    style itineraries (Belize atolls, Bahamas Exuma) is the largest
    per-session footprint contributor.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "PADI Caribbean regional dive condition handbook"
    - "NOAA CoralReefWatch bleaching thermal-stress bulletins"
    - "Cozumel National Marine Park permit + capacity documentation"
    - "Belize Barrier Reef Reserve System UNESCO management plan"
    - "CENOTES / Sistema Sac Actun Yucatán karst-diving standards (NSS-CDS)"
  notes: |
    Regional overrides vs global scuba: water_temp sweet-spot shifted to
    27-30°C (year-round warm regime); visibility weight raised (Caribbean
    clarity is the value proposition and drift-diving demands long
    sight-lines); hurricane-periphery gate added at 30 kn (2-3 kn tighter
    than global). 44-week season reflects year-round tropical operations
    outside the 8-week hurricane peak (Aug-Oct). Cenote-specific overrides
    (freshwater, halocline, overhead) are handled at cluster level, not
    here.
