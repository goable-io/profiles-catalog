gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: MONSOON_HIGH_SEAS
    description: Wave height above 3.0 m in Indian-Ocean coastal or atoll-outer sites (monsoon exposure) makes RIB access and drift-dive drop-off unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 28
    reason_code: MONSOON_HIGH_WIND
    description: Sustained wind above 28 knots on monsoon side of atoll or coastal site makes surface support and safety-stop hold unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: MONSOON_POOR_VISIBILITY
    description: Surface visibility below 800 m during monsoon squall periods makes site-finding unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: MONSOON_DELUGE
    description: Heavy monsoon rainfall above 20 mm/h correlates with atoll-wide underwater visibility crash (plankton bloom + terrestrial runoff on high-island sites like Tulamben, Komodo, Pemba).

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: medium
  notes: |
    Indian-Ocean reef systems are on active climate-driven bleaching
    watch (1998, 2016, 2023 basin-wide events documented). Maldives
    Marine Research Institute + BOBLME (Bay of Bengal Large Marine
    Ecosystem) enforce site-level dive-tourism guidance. Manta and
    whale-shark encounter sites (Ari Atoll cleaning stations, Hanifaru
    Bay UNESCO Biosphere) have strict swimmer + boat limits. Liveaboard
    routings (Maldives, Komodo) are the dominant per-session footprint
    contributor.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Maldives Marine Research Institute (MRI) tourism-diving standards"
    - "Hanifaru Bay UNESCO Biosphere Reserve management plan"
    - "Indonesian Ministry of Marine Affairs Komodo + Nusa Penida MPA rules"
    - "PADI Indian-Ocean regional dive condition handbook"
    - "Coral Triangle Initiative site-monitoring reports 2018-2023"
  notes: |
    Regional overrides vs global scuba: water_temp sweet-spot 28-30°C
    (year-round warm regime); wind gate raised to 28 kn (monsoon
    tolerance vs Red Sea's tighter 25 kn); added monsoon-deluge gate at
    20 mm/h reflecting plankton-bloom + runoff coupling on high-island
    sites. 40-week season with 8 weeks of monsoon-transition storm
    windows partitioned per basin. Cross-basin variance (Maldives vs
    Indonesian E-fringe vs E-African coast) is captured at cluster
    level, not here.
