description:
  en: |
    Indian Ocean diving spans the Maldive atoll chain, the Seychelles
    inner + outer islands, coastal Tanzania (Pemba + Mafia), Comoros,
    Mozambique, the Chagos archipelago, and the Indonesian E-Indian
    coast (Bali Tulamben + Nusa Penida, Komodo, Raja Ampat Indian
    fringe). The regime is warm-water year-round (26-30°C), atoll +
    pinnacle + wall + drift-dominant, with strong tidal current cycles
    driving the pelagic-encounter windows (manta cleaning stations,
    whale-shark aggregations at Ari South May-Sep). Monsoon regimes
    partition seasons — SW monsoon (May-Oct) drives Maldive W-side
    visibility; NE monsoon (Nov-Apr) drives E-side. Coral-cover under
    bleaching pressure since 1998, 2016, 2023 basin events.

