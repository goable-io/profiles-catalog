gates:
  - metric: wind_speed_kn
    condition: gt
    value: 24
    reason_code: BORA_ROTOR
    description: NE Bora above 24 knots on the Croatian and Italian NE coasts creates rotor turbulence at shore entries and downdrafts on sheltered lee slopes; boat access is unsafe within 2-4 hours of onset.

  - metric: wave_height_m
    condition: gt
    value: 2.2
    reason_code: ADRIATIC_HIGH_SEAS
    description: Wave height above 2.2 m in the Adriatic (Bora + Sirocco events) makes shore entry and small-RIB access to offshore sites unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_ADRIATIC
    description: Surface visibility below 800 m during Sirocco haze events makes site-finding unsafe on the Italian side.

  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN_PO_PLUME
    description: Heavy active rain funnelled through Po + Isonzo river basins triggers plume events that drop underwater visibility from 15-25 m to 1-3 m for 24-72 h.

  - metric: turbidity_proxy
    condition: gt
    value: 22
    reason_code: HIGH_TURBIDITY_BLOOM
    description: Elevated turbidity from spring/summer plankton bloom (April-June typical) destroys diving quality on both coasts.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: medium
  notes: |
    Adriatic dive sites are heavily concentrated in Marine Protected Areas
    (Riserva Marina Tremiti, Parco del Conero, Parco Nazionale Kornati,
    Cape Kamenjak Nature Park). Water clarity is more variable than the
    western Mediterranean due to Po + eastern-Alpine river discharge —
    seasonal plankton blooms materially reduce quality in April-June.
    Bora storms create sharp surface degradation windows that cluster
    site closures. Boat transport dominates per-session footprint.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "FIPSAS Adriatic dive site classification"
    - "Croatian Ministry of Environment Kornati NP diving permit standards"
    - "Riserva Marina Isole Tremiti operational rules (D.M. 14/07/1989)"
    - "Parco del Conero AMP guidance"
  notes: |
    Regional overrides vs global scuba: wave weight raised to 0.24 (Bora + Sirocco
    variability); water_temp sweet-spot 22-26°C (basin warms slower than
    W Mediterranean); added Bora rotor gate at 24 kn; added Po-plume runoff
    gate. Visibility floor slightly relaxed vs Mediterranean (0.5 → 0.5) but
    typical clarity is lower (8-25 m vs 15-30 m). turbidity_proxy gate
    tightened to 22 to catch bloom periods. Site season 22 weeks (May-Sep
    core + shoulder Apr/Oct on bora-free windows).
