slug: scuba-adriatic
spot_kind: region
version: "0.2.0"
category: water
extends: scuba
region: adriatic
display_name:
  en: Scuba Diving — Adriatic
  it: Immersione — Adriatico
  es: Buceo — Adriático
  fr: Plongée — Adriatique
  de: Tauchen — Adria
description:
  en: |
    Adriatic diving spans Italian E coast (Conero, Tremiti), Croatian
    mid-coast (Kornati, Kamenjak, Rovinj), and Slovenian shelf. The
    basin is shallow (avg 173 m, max 1230 m in the Southern Adriatic
    Pit) which produces sharper thermal stratification than the wider
    Mediterranean and distinct summer sirocco / winter bora regimes.
    Underwater clarity is 8-25 m — markedly lower than the western
    Mediterranean because Po + eastern-Alpine river runoff seeds
    spring/summer plankton blooms. Wreck density is exceptional
    (WW1 + WW2 losses on both coasts). The Bora rotor gate is the
    dominant safety variable: NE ≥18 kn shuts shore entry from most
    Croatian sites within 2-4 hours of onset. Current is generally
    low; the current dimension retains a minor weight for tidal-
    channel sites like the Trieste Gulf.

# v0.2.0 — realigned to v2.0.0 base semantics. Placeholder values pending
