gates:
  - metric: wind_speed_kn
    condition: gt
    value: 24
    reason_code: BORA_ROTOR
    description: NE Bora above 24 knots shuts Rovinj + Pula-coast boat access.
  - metric: wave_height_m
    condition: gt
    value: 2.2
    reason_code: ADRIATIC_HIGH_SEAS
    description: Wave above 2.2 m makes Baron Gautsch offshore boat mooring unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_ADRIATIC
    description: Surface visibility below 800 m during Sirocco haze makes site-finding unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN_PO_PLUME
    description: Heavy rain triggers Po + Isonzo plume events; visibility drops for 24-72 h.
  - metric: turbidity_proxy
    condition: gt
    value: 22
    reason_code: HIGH_TURBIDITY_BLOOM
    description: Spring/summer plankton bloom destroys diving quality on the N-Adriatic sector.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: medium
  notes: |
    Baron Gautsch WWI war-grave wreck is protected under Croatian
    Ministry of Culture (Ministarstvo Kulture) — look-only, no
    penetration beyond safe route, no artefact contact. Cape
    Kamenjak Nature Park terrestrial protection extends to adjacent
    coastal waters.

