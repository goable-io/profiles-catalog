description:
  en: |
    The Rovinj (N Istria) + Cape Kamenjak (S Pula peninsula) sector
    of the Croatian Adriatic delivers wreck diving (Baron Gautsch
    passenger ship torpedoed 1914 WWI, one of the Med's most
    important war-grave wrecks at 40 m) plus coastal reef diving on
    the Fraškerić islets. Water 12-25°C. Boat access from Rovinj or
    Pula harbours. Bora + bloom are the dominant quality gates.

