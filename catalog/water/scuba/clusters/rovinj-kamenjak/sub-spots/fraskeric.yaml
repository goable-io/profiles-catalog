tier_rationale:
  en: |
    Le Isole Fraškerić sono un piccolo cluster di isolotti off Cape
    Kamenjak (Rt Kamenjak, S Pula peninsula) with coastal reef +
    wall diving from 8 m to 30 m+ and Adriatic-typical encrusting
    biocoenosis. Standard intermediate reef dive with boat access
    from Premantura or Pula in 10-15 min. Sheltered from Bora on
    lee-side approaches; exposed on outer flank.

