tier_rationale:
  en: |
    Il Baron Gautsch was an Austro-Hungarian passenger steamer sunk
    13 August 1914 by a mine off Rovinj — 240 lives lost. Wreck sits
    upright on sand bottom at 40 m depth, one of the most iconic and
    intact WWI civilian wrecks in the Adriatic. War-grave protection
    under Croatian Ministry of Culture — look-only, no artefact
    contact, guide-led with strict penetration limits. Advanced-
    open-water baseline; wreck-diving certification recommended.

