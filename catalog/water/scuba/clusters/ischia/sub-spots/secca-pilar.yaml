tier_rationale:
  en: |
    La Secca del Pilar is a submerged pinnacle S of Ischia rising
    from a 45 m sand-rock bottom to a top at 18-22 m. Vertical wall
    with dense Paramuricea gorgonian, dense encrusting sponges, and
    frequent pelagic passages (dentex, barracuda schooling). Site is
    exposed to Sirocco + Libeccio and requires calm surface for boat
    mooring on the reduced-footprint plateau top. Advanced-open-water
    rating baseline given depth + exposure profile.

