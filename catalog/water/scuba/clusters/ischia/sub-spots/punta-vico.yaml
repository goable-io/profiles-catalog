tier_rationale:
  en: |
    Punta Vico is a N-Ischia coastal reef between Forio and Casamicciola,
    descending from 8 m to 30 m+ with encrusting biocoenosis and
    resident conger + moray + octopus. Sheltered from Sirocco by island
    geometry, exposed to Libeccio. Boat access from Casamicciola in
    10 min. Standard intermediate coastal reef dive with clear ascent
    profile, no depth commitment beyond 30 m.

