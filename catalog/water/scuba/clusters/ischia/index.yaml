  - scuba-spot-ischia-punta-vico
display_name:
  en: Scuba Diving — Isola d'Ischia
  it: Immersione — Isola d'Ischia
  es: Buceo — Isla de Ischia
  fr: Plongée — Île d'Ischia
  de: Tauchen — Insel Ischia
description:
  en: |
    Isola d'Ischia (Golfo di Napoli, Campania) delivers volcanic-
    origin coastal walls, offshore seamounts (Secca del Pilar), and
    thermal-influenced coastal zones from active fumaroles at
    Sant'Angelo + Cava Grado. Water 16-27°C (thermally warmer than
    Tirreno average). Boat access from Ischia Porto, Casamicciola, or
    Sant'Angelo.

