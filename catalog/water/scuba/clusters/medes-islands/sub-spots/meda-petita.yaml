tier_rationale:
  en: |
    La Meda Petita is the smaller S island of the Medes complex,
    delivering wall + boulder-field diving from 12 m to 35 m+ with
    exceptional grouper density (Epinephelus marginatus reference
    site) and dense Paramuricea clavata gorgonian at 25-35 m. Site
    is guide-led by default; boat mooring at Reserva-managed buoyed
    line. Standard intermediate wall dive with the reserve's
    signature wildlife density.

