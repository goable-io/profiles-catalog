gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m (Tramontane events) makes L'Estartit-Medes boat crossing unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes navigation unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers Ter river + coastal runoff into Medes waters; visibility drops for 24-48 h.
  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Tramontane storm sediment destroys wall dive quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: high
  notes: |
    Reserva Natural Parcial des les Illes Medes (LR 19/1990) enforces
    strict daily-diver caps + zone-based rules. Grouper populations
    at Medes are the reference recovery-benchmark for Mediterranean
    MPA effectiveness. Guide-led diving is the norm.

