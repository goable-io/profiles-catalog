display_name:
  en: Scuba Diving — Islas Medes (Estartit)
  it: Immersione — Islas Medes
  es: Buceo — Islas Medes
  fr: Plongée — Îles Medes
  de: Tauchen — Medes-Inseln
description:
  en: |
    Islas Medes (Reserva Natural Parcial des les Illes Medes, LR
    19/1990) sit 1 km off L'Estartit (Costa Brava, Cataluña) — a
    seven-islet complex reserved since 1990 as one of the earliest
    Iberian MPAs. Coralligenous biocoenosis, dense Paramuricea
    clavata gorgonian, and the highest-recorded Mediterranean
    grouper population density (Epinephelus marginatus). Water
    14-24°C. Boat access from L'Estartit in 10 min.

