tier_rationale:
  en: |
    The Capo Berta parete is the S-facing headland wall between
    Diano Marina and Imperia, descending from 12 m to 38 m+ with
    Paramuricea + Eunicella cavolini gorgonian at 25-35 m and dense
    coralligenous encrustation on the vertical face. Site is exposed
    to Libeccio; on-current drift dives on Libeccio-release days
    reach 0.5-0.8 kn on the outer face. Boat access from Diano
    Marina or Imperia in 10 min. Standard intermediate-recreational
    grade with drift-diving overlay.

