tier_rationale:
  en: |
    Scoglio della Rondinara is the offshore rock reef between Cervo
    and Diano Marina — a shallow-topped seamount (top at 8 m,
    plateau at 20-25 m, drop-off to 35 m+) with Eunicella cavolini
    gorgonian, dense encrusting biocoenosis, and resident dentex,
    conger, moray. Exposed to Libeccio; the site is dive-shop-
    weather-window-selected. Standard intermediate all-round dive
    when W-wind is calm.

