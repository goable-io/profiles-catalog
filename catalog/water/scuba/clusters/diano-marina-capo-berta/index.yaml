description:
  en: |
    Diano Marina and adjacent Capo Berta (Riviera di Ponente, Imperia)
    sit on the Ligurian W coast between Alassio and Sanremo. The
    Capo Berta headland delivers wall + reef diving in the 15-40 m
    range with Paramuricea + Eunicella cavolini gorgonian and a
    documented drift-current pattern on Libeccio-release days. Adjacent
    Scoglio della Rondinara off Cervo is a shallow offshore reef
    accessible from Diano Marina or Cervo harbours. Cluster is not
    inside an AMP but sits within the broader Santuario Pelagos
    cetacean-corridor waters — dolphin + fin whale sightings on
    surface transits are documented on-record from May-October.

