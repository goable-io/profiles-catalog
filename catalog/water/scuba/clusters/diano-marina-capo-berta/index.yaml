gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave height above 2.3m in Mediterranean coastal sites (Tramontane/Mistral storm events) creates unsafe shore-entry and small-boat access conditions.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_SURFACE_VISIBILITY_MED
    description: Surface visibility below 800m during Mediterranean haze/sirocco events makes site-finding unsafe (surface navigation only — underwater visibility is scored separately via water_clarity + turbidity_proxy).

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy active rain in coastal sites triggers terrestrial runoff that drops underwater visibility from 20m+ to 1-3m at impacted sites within hours.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY_MED
    description: Elevated turbidity (post-storm sediment, river plumes) crashes underwater visibility to sub-2m — dive quality destroyed and buddy separation risk rises sharply. (Previous v0.1.0 used the wrong scale value 25 — corrected to 0.7 on the 0-1 turbidity_proxy scale.)

  - metric: tidal_current_speed_kn
    condition: gt
    value: 2.5
    reason_code: STRONG_CURRENT_UNSAFE_MED
    description: Sustained tidal current above 2.5 knots (rare in Mediterranean coastal sites but real in Bocche di Bonifacio, Strait of Messina, and Gibraltar current cone) exceeds recreational drift-management capacity.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 30
  carrying_capacity_sensitivity: low
  notes: |
    Diano Marina / Capo Berta operates outside AMP boundaries but sits
    within the Santuario Pelagos international cetacean protection area
    (Franco-Italian-Monegasque agreement 1999). Cetacean-corridor
    surface-transit guidance applies to boat operators (no approach
    < 100 m, no wake within 500 m). Carrying capacity is materially
    lower than at Portofino / Bergeggi — this sector's diving traffic
    is a fraction of the eastern-Ligurian AMPs.

