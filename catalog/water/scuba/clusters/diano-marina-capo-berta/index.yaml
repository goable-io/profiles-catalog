  notes: |
    Spot overrides vs scuba-mediterranean: matches regional baseline
    for the western Ponente sector. 30-week season (Diano Marina is
    slightly farther south than Portofino and stays workable a few
    weeks longer into autumn). No AMP overlay but Pelagos cetacean-
    corridor briefing applies to boat operators.

    v0.2.0 (breaking) — realigned to the v2.0.0 scuba-mediterranean
    structure. This cluster is the origin of the real-diver feedback
    that drove the v2.0.0 semantics reset: divers reported that the
    old top-weighted `visibility` dimension (visibility_km, a surface
    haze/navigation metric) was being scored as if it represented
    underwater dive-quality visibility at Capo Berta, producing
    verdicts that diverged sharply from what divers actually
    experienced at depth on hazy-but-clear-underwater days (and vice
    versa on clear-surface, sediment-turbid days). v2.0.0 corrects
    this: water_clarity (water_clarity_index) is now the top-weighted
    signal (0.30), current is added as its own dimension (0.08,
    tidal_current_speed_kn), the old `visibility` dimension is renamed
    surface_visibility and demoted to 0.04 (surface-navigation proxy
    only), and the turbidity_proxy gate is corrected from the wrong
    0-100 scale (25) to the correct 0-1 scale (0.7) matching the
    consumer engine's actual output range. See scuba/index.yaml
    meta.notes for the full v2.0.0 changelog.
