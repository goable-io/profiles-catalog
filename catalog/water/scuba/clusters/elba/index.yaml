gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m at Elba makes shore-entry (Pomonte, Enfola) and offshore Formiche di Montecristo boat access unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes offshore Montecristo navigation unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers island-hinterland runoff into coastal sites; underwater visibility drops for 24-48 h.

  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Libeccio storm sediment destroys wall + wreck dive quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 30
  carrying_capacity_sensitivity: medium
  notes: |
    Parco Nazionale Arcipelago Toscano (PNAT, D.M. 22/07/1996)
    enforces zone-based rules on diving in the Elba-Giglio-Giannutri-
    Montecristo-Capraia complex. Montecristo is strict-access nature
    reserve; the offshore Formiche di Montecristo shoal outside the
    island's terrestrial closure remains open to permitted diving.
    Elviscot wreck is protected historic-wreck (post-1976 remains,
    look-only) under Soprintendenza guidance.

