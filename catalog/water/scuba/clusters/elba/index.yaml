display_name:
  en: Scuba Diving — Isola d'Elba
  it: Immersione — Isola d'Elba
  es: Buceo — Isla de Elba
  fr: Plongée — Île d'Elbe
  de: Tauchen — Insel Elba
description:
  en: |
    The Isola d'Elba is the reference Tuscan Archipelago diving
    destination — inside the Parco Nazionale Arcipelago Toscano
    (PNAT, largest marine park in Europe by area). Wreck diving on
    the Elviscot (Italian merchantman sunk 1972 at 8-12 m off Pomonte),
    coralligenous walls at Punta Enfola and Scoglio dell'Ogliera, and
    offshore seamount + reef diving on the Formiche di Montecristo
    plateau at 30-45 m. Water 15-25°C seasonal. Boat access from
    Portoferraio, Marciana Marina, or Pomonte harbours.

