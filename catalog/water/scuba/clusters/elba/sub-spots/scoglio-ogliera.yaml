tier_rationale:
  en: |
    Lo Scoglio dell'Ogliera is a submerged pinnacle just offshore
    Pomonte, close to the Elviscot wreck but distinct as a natural-
    reef site. Pinnacle top at 5-8 m, drop-off to 40 m+ on the outer
    face with dense Eunicella cavolini gorgonian and coralligenous
    encrustation. Sheltered from Libeccio by adjacent coastline,
    exposed on Sirocco. Multi-tier dive well-suited to intermediate
    training and refresher sessions with the Elviscot wreck 5 min away
    by boat as combination-dive option.

