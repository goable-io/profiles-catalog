tier_rationale:
  en: |
    Le Formiche di Montecristo is an offshore seamount + reef complex
    ~40 km S of Elba between Elba and Montecristo island. Plateau top
    at 30 m, drop-off to 60 m+, in open sea outside the strict-access
    Montecristo terrestrial reserve. Pelagic-encounter site — dentex,
    barracuda, occasional tuna and rare grouper. Depth + open-sea
    exposure + full-fetch Libeccio and Sirocco vulnerability make
    weather-window selection tight; boat transit from Elba is 90+ min.
    Advanced-open-water + deep-diver rating baseline. The cluster's
    offshore reference.

