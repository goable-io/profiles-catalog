tier_rationale:
  en: |
    The Elviscot is an Italian merchantman (~63 m LOA) sunk 10 January
    1972 off Pomonte on the S-W Elba coast. Wreck sits upright on
    sandy bottom at 8-12 m — the shallowest recreational wreck in
    Italy's central Tirreno. Depth keeps NDL essentially unlimited;
    the wreck's superstructure is broken but the hull outline + engine
    room + cargo hold are penetration-mapped for open-water divers
    (short-swim, single-exit overheads). Site is sheltered by the
    coastal geometry from Libeccio. Boat access from Pomonte in 5 min
    or shore-entry from the Pomonte pebble beach for stronger
    swimmers.

