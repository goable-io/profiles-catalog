tier_rationale:
  en: |
    Punta Enfola is the promontory west of Portoferraio delivering
    N-facing wall dive from 10 m to 35 m+ with Paramuricea gorgonian
    at 25-30 m and dense coralligenous encrustation. Sheltered from
    Libeccio + Sirocco by the promontory geometry, exposed to
    Tramontane on the N flank. Standard intermediate wall dive with
    short boat access from Portoferraio (5-10 min). Common as the
    first dive of a two-tank day paired with a deeper afternoon site.

