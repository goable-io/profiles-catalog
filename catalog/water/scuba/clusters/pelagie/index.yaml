gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m makes offshore Lampione + Linosa transit unsafe (open Mediterranean fetch on both sides).
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze (with Saharan dust plume overlay) makes navigation unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers island-hinterland runoff; visibility drops for 24 h (rare event in Pelagie desert climate).
  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from storm sediment stirring destroys wall dive quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 34
  carrying_capacity_sensitivity: high
  notes: |
    AMP Isole Pelagie enforces strict zone rules — Zone A around
    Isola dei Conigli beach is a Caretta caretta turtle nesting site
    with seasonal closure (May-August). Linosa is a volcanic islet
    with Chelonia mydas green turtle nesting also under protection.
    Cluster's ecological sensitivity is materially higher than most
    Italian sites.

