description:
  en: |
    AMP Isole Pelagie (D.M. 21/10/2002) protects Lampedusa +
    Lampione + Linosa, southernmost Italian islands (technically on
    the African continental shelf, closer to Tunisia than to Sicily).
    Water is exceptionally clear + warm (17-28°C seasonal), with
    unique bio-geographical mixing of Med and Atlantic-tropical
    species. Sites at Isola dei Conigli (turtle beach, MPA Zone A
    on land) offshore reef + faraglione at Linosa volcanic islet.
    Boat access from Lampedusa Porto or Linosa Porto (ferry from
    Porto Empedocle mainland).

