tier_rationale:
  en: |
    Linosa is a small volcanic island 40 km N of Lampedusa (still on
    African shelf). The Faraglione + Punta Beppe Tuccio outer coast
    delivers reef + wall diving from 10 m to 35 m+ with dense
    encrusting biocoenosis and clear water. Sheltered from Sirocco
    by island geometry on some approaches. Boat access from Linosa
    village or ferry-hop from Lampedusa. Standard intermediate reef
    dive with post-storm turbidity as the main quality-swing variable.

