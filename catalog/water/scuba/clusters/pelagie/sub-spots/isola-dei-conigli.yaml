tier_rationale:
  en: |
    L'Isola dei Conigli is a small islet + tombolo off Lampedusa's
    SW coast, world-famous for turquoise-water beach + Caretta
    caretta turtle nesting. Underwater delivers shallow reef +
    sand-slope from 5 m to 25 m with excellent visibility (20-30 m
    routine) and clear African-shelf water. Turtle-nesting season
    (May-August) sees Zone A closure of the tombolo beach — dive
    activity remains open on adjacent perimeter. Standard
    intermediate reef dive with the cluster's clarity + wildlife
    reference.

