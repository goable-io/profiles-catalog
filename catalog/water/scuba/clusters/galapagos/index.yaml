  notes: |
    Spot overrides vs scuba-pacific: matches regional baseline for
    the E-Pacific upwelling sector. 40-week season; water temperature
    varies sharply between the warm/wet season (Jan-May, 24-27°C)
    and the cool/garúa season (Jun-Dec, 18-22°C, stronger Cromwell
    upwelling at Darwin/Wolf).

