description:
  en: |
    The Galápagos Islands (Ecuador) sit inside the Galápagos Marine
    Reserve (established 1998, ~133,000 km², a UNESCO World Heritage
    Site since 1978 for the archipelago). Cold, nutrient-rich
    upwelling from the Cromwell and Humboldt currents mixes with
    warm equatorial water, producing the world's most concentrated
    pelagic-shark diving. Darwin and Wolf islands are remote, strong-
    current, liveaboard-only sites in the reserve's northern zone;
    Cousins Rock near Santiago/Bartolomé offers calmer central-zone
    diving. Water temperature swings widely (18-27°C) by season and
    site.

