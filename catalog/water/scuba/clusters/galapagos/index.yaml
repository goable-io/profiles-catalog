gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: PACIFIC_HIGH_SEAS
    description: Wave height above 3.0 m on Pacific reef and pinnacle sites (typhoon periphery, SW-Pacific cyclone edge) makes drift drop-off and safety-stop hold unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: TROPICAL_CYCLONE_PERIPHERY
    description: Sustained wind above 30 knots signals cyclone or typhoon periphery; all Pacific reef and liveaboard operations stand down.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_SURFACE_VISIBILITY_PAC
    description: Surface visibility below 800 m during tropical squall or coastal-front passage makes site-finding unsafe (surface navigation only).

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE_PAC
    description: Heavy tropical rain above 20 mm/h correlates with cyclone systems and coastal-runoff visibility crashes on high-island sites.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY_PAC
    description: Elevated turbidity from cyclone or high-island runoff crashes underwater visibility on the coastal Pacific + Coral Triangle sites.

  - metric: tidal_current_speed_kn
    condition: gt
    value: 3.0
    reason_code: STRONG_CURRENT_UNSAFE_PAC
    description: Sustained current above 3.0 knots at Palau Blue Corner / German Channel / Cocos / Galápagos drift sites exceeds standard recreational drift-management; reef-hook + technical certifications recommended.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    The Galápagos Marine Reserve (1998, ~133,000 km²) is one of the
    world's largest and strictest MPAs, enforced by the Galápagos
    National Park Directorate; Darwin and Wolf are liveaboard-permit-
    only with strict vessel and diver caps. The archipelago is a
    UNESCO World Heritage Site (1978) and the marine reserve a
    UNESCO addition (2001). Per-session footprint is dominated by
    liveaboard transit given the remote offshore location.

