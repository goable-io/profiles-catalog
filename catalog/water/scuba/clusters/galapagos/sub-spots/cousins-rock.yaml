tier_rationale:
  en: |
    Cousins Rock, near Bartolomé in the Galápagos central zone, is a
    submerged volcanic pinnacle offering calmer, more sheltered conditions
    than the northern Darwin/Wolf sites — green sea turtles. Galápagos sea
    lions, and eagle rays are the signature encounters in the 5-25 m range
    with generally mild current. Day-boat accessible from Santa Cruz rather
    than liveaboard-only, making it the cluster's intermediate reference
    dive for divers building toward the northern pelagic sites.

