tier_rationale:
  en: |
    Darwin (the above-water arch itself collapsed in May 2021, but the
    submerged pinnacle and dive site retain the name and structure) is
    widely regarded as the world's premier hammerhead- and whale-shark
    encounter site. With schooling scalloped hammerheads and seasonal whale
    sharks (Jun-Nov) passing the offshore pinnacle in strong, unpredictable
    current up to 2-3 kn. The site is liveaboard-only, reached after an
    open-ocean crossing, and demands advanced open-water skill in blue-
    water drift conditions — the cluster's most committing dive.

