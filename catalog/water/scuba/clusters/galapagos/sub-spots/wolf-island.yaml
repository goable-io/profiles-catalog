tier_rationale:
  en: |
    Wolf Island is a remote volcanic pinnacle in the Galápagos Marine
    Reserve's northern zone, reached only by liveaboard. Where schooling
    hammerhead sharks and resident Galápagos sharks patrol current-swept
    walls in the 15-30 m range. Current is frequently strong and can shift
    direction without warning, requiring advanced blue-water drift skill
    and negative-entry technique, placing it alongside Darwin at the
    cluster's top tier.

