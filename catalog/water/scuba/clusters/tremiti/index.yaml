description:
  en: |
    Riserva Marina Isole Tremiti (D.M. 14/07/1989) is the reference
    Adriatic Italian diving cluster — a small archipelago 22 km off
    the Gargano peninsula (Puglia). Features the Cristo di Tremiti
    bronze statue submerged at 15-18 m off San Domino island (1998
    installation), plus offshore Punta Secca reef and coastal Grotta
    del Bue Marino cavern. Water 15-25°C. Boat access from Termoli,
    Peschici, or Rodi Garganico ferries.

