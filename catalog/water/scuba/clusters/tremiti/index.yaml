gates:
  - metric: wind_speed_kn
    condition: gt
    value: 24
    reason_code: BORA_ROTOR
    description: NE Bora above 24 knots at Tremiti creates rotor turbulence and shuts inter-island boat access from Termoli.
  - metric: wave_height_m
    condition: gt
    value: 2.2
    reason_code: ADRIATIC_HIGH_SEAS
    description: Wave above 2.2 m makes offshore reef mooring and island transit from Termoli unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_ADRIATIC
    description: Surface visibility below 800 m during Sirocco haze makes navigation from Termoli unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN_PO_PLUME
    description: Heavy rain triggers Adriatic plume events that drop visibility for 24-72 h.
  - metric: turbidity_proxy
    condition: gt
    value: 22
    reason_code: HIGH_TURBIDITY_BLOOM
    description: Elevated turbidity from spring/summer plankton bloom (April-June) destroys diving quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: medium
  notes: |
    Riserva Marina Tremiti enforces zone-based diving permits + daily
    caps. Ferry-only island access + no summer overcrowding by
    regulation. Boat mooring is permit-managed at Cristo + Grotta
    del Bue Marino.

