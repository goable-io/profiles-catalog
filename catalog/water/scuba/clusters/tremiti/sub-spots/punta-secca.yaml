tier_rationale:
  en: |
    La Secca di Punta Secca is an offshore reef complex NE of San
    Nicola island — plateau top at 12-15 m dropping to 35 m+ with
    encrusting biocoenosis + Paramuricea gorgonian on the outer face.
    Standard intermediate offshore reef dive with clear ascent-line
    profile, boat access from San Nicola or San Domino in 10 min.
    Weather-window-sensitive to Bora due to N-face exposure.

