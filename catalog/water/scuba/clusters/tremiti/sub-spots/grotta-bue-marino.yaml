tier_rationale:
  en: |
    La Grotta del Bue Marino ("monk seal cave") is a coastal sea
    cave on San Domino island — historically named for Mediterranean
    monk seal (Monachus monachus) sightings pre-1970s, now
    Mediterranean-locally-extirpated on this coast but the name
    persists. Cavern-diving grade with guide-led penetration, short
    single-exit route at 6-15 m depth. Depth kept in recreational
    range; boat access from San Domino in 5 min.

