tier_rationale:
  en: |
    Il Cristo di Tremiti (installed 1998) is a bronze Christ statue
    submerged at 15-18 m off San Domino island. Sheltered site with
    sand + posidonia bottom, easy anchor-line descent for training
    and tourist dives — the Adriatic counterpart to Portofino's
    1954 Cristo degli Abissi. Depth keeps NDL long; boat traffic on
    surface at the buoyed entry line is the main hazard. The
    cluster's iconic training-and-tourist reference.

