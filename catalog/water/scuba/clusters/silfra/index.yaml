gates:
  - metric: wave_height_m
    condition: gt
    value: 2.5
    reason_code: HIGH_SEAS
    description: Wave height above 2.5m makes safe entry and exit from the water dangerous.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: POOR_SURFACE_VISIBILITY
    description: Surface visibility below 500m is unsafe for surface navigation to dive sites and for VHF-line-of-sight boat-to-shore signalling.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_RAIN
    description: Heavy rain reduces surface visibility and indicates storm conditions.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY
    description: Elevated turbidity (rainfall-runoff proxy, ocean-colour once wired) crashes underwater visibility to sub-2m — dive quality destroyed and navigation-with-buddy compromised.

  - metric: tidal_current_speed_kn
    condition: gt
    value: 2.5
    reason_code: STRONG_CURRENT_UNSAFE
    description: Sustained current above 2.5 knots exceeds recreational-diver drift-management capacity; ascent-line hold and buddy separation become material risks.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 52
  carrying_capacity_sensitivity: high
  notes: |
    Þingvellir National Park (UNESCO World Heritage Site, 2004)
    enforces a mandatory dive-permit and certified-drysuit-diver
    requirement at Silfra, with guide-led access only and strict
    entry/exit points to protect the fissure's fragile algae mats
    and porous rock structure. Year-round near-freezing temperature
    means equipment dependency (drysuit, thermal undergarment) is
    at its highest across the whole catalog. High visitor volume
    (one of the world's most-dived freshwater sites) is managed via
    timed permit slots.

