  es: Buceo — Fisura de Silfra
  fr: Plongée — Faille de Silfra
  de: Tauchen — Silfra-Spalte
description:
  en: |
    Silfra is a water-filled tectonic fissure in Þingvellir National
    Park (Iceland), a UNESCO World Heritage Site (2004), lying
    directly between the North American and Eurasian tectonic
    plates. The fissure is fed by glacial meltwater filtered through
    porous lava for 30-100 years before emerging, producing
    exceptional clarity (routinely 100 m+) and constant near-
    freezing temperature (2-4°C) year-round regardless of season.
    Drysuit diving is mandatory; access is guide-led only under
    Þingvellir National Park permit. No marine life beyond algae
    and char — the draw is the geology and visibility itself.

