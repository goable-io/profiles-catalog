tier_rationale:
  en: |
    Silfra Cathedral is the deepest chamber of the Silfra fissure system,
    opening to roughly 20 m where the rift walls widen into a dramatic open
    rock amphitheatre. The same near-freezing glacial water (2-4°C) and 100
    m+ visibility apply, with the greater depth and open-chamber geometry
    demanding slightly more buoyancy precision than the main crack section.
    Keeping it at the cluster's intermediate tier alongside Silfra Crack.

