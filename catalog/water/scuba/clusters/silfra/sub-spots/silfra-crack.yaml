tier_rationale:
  en: |
    Silfra Crack is the main fissure dive between the North American and
    Eurasian tectonic plates in Þingvellir National Park. A narrow rift
    dive to about 18 m through glacially filtered water at a constant 2-4°C
    with visibility routinely exceeding 100 m. Drysuit certification and
    guide-led entry under park permit are mandatory; the narrow rift
    geometry and near-freezing water place cold-water skill above
    technical-diving skill, keeping it at the cluster's intermediate tier.

