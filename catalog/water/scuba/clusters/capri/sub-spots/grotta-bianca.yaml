tier_rationale:
  en: |
    La Grotta Bianca is a coastal sea cave on Capri's SE flank —
    partially submerged entry at 8-12 m opening into a chamber with
    calcite-white walls (the source of the name). Cavern-diving grade
    with strict guide-led penetration; short, single-buddy-team,
    single-exit route. Silt-out risk low compared to karst caves but
    line management standard. Depth kept in 12-18 m recreational
    range. The cluster's overhead-environment reference dive.

