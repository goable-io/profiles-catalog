tier_rationale:
  en: |
    The Faraglioni dive circumnavigates the three iconic Capri sea
    stacks (Stella + Faraglione di Mezzo + Scopolo). Wall + boulder-
    field geometry between the stacks descending from 12 m to 35 m+,
    with encrusting biocoenosis and dense fish schooling in the
    plateau between stacks. Site is exposed to Sirocco + surface
    tourist-boat traffic (dedicated diver-buoy zone applies). Standard
    intermediate wall + circumnavigation dive with the cluster's
    iconic scenery reference.

