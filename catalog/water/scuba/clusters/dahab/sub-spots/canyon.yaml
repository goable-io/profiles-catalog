tier_rationale:
  en: |
    Il Canyon is a narrow submerged rock crack near Dahab shore
    dropping vertically from ~20 m at the entry to 54 m at the
    bottom exit. Distinctive geology — a fault-plane cut through
    the reef limestone with dramatic parallel-wall geometry.
    Advanced-open-water baseline given depth + confined descent
    profile; guide-lead by default. Shore-entry from vehicle-
    accessible parking area on the coastal road.

