tier_rationale:
  en: |
    Il Dahab Blue Hole is a 100+ m coastal submarine pit connected to
    open sea via a 56 m submerged Arch. Recreational-depth diving
    (0-30 m on the rim + reef) is straightforward and safe. The
    56 m Arch swim-through requires trimix technical-diving
    qualification — recreational-air attempts have caused ~200+
    documented fatalities historically, making this one of the
    world's most-tracked dive-fatality sites. Shore-entry from the
    Bedouin-café strip on the cliff-side road. Strict guide-lead
    + qualification enforcement post-2010 CDWS policy tightening.

