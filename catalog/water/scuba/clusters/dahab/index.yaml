gates:
  - metric: wave_height_m
    condition: gt
    value: 2.5
    reason_code: RED_SEA_HIGH_SEAS
    description: Wave above 2.5 m at Dahab shore-entry sites (Etesian + N-blow days) makes cliff-edge entry unsafe.
  - metric: wind_speed_kn
    condition: gt
    value: 25
    reason_code: ETESIAN_HIGH_WIND
    description: Sustained wind above 25 knots (N Etesian) shuts Dahab shore-entry cliff descents.
  - metric: visibility_km
    condition: lt
    value: 1.0
    reason_code: SHAMAL_LOW_VISIBILITY
    description: Surface visibility below 1 km during shamal sandstorms shuts Dahab operations.
  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: FLASH_FLOOD
    description: Heavy rain (rare) triggers wadi flash-flood runoff into Dahab coastal sites; visibility crash for 24-48 h.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Dahab Blue Hole is one of the world's most-documented dive fatality
    sites (~200+ recorded fatalities historically, mostly technical-
    diver overhead-arch attempts beyond safe depth). Recreational-
    depth diving at Blue Hole is safe; the 56 m Arch swim-through
    is technical (trimix). Egyptian Chamber of Diving + Watersports
    (CDWS) enforces briefing + qualification requirements.

