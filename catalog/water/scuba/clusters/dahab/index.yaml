gates:
  - metric: wave_height_m
    condition: gt
    value: 2.5
    reason_code: RED_SEA_HIGH_SEAS
    description: Wave height above 2.5 m in the Red Sea (Etesian + Khamsin winter storms) makes offshore safari access unsafe; RIB drop-offs on wall sites become dangerous.

  - metric: wind_speed_kn
    condition: gt
    value: 25
    reason_code: ETESIAN_HIGH_WIND
    description: Sustained wind above 25 knots in the Red Sea basin generates short-period chop that shuts safari operations to Brothers / Daedalus / Elphinstone.

  - metric: visibility_km
    condition: lt
    value: 1.0
    reason_code: SHAMAL_LOW_SURFACE_VISIBILITY
    description: Surface visibility below 1 km during shamal sandstorm events makes site-finding and boat navigation unsafe (underwater visibility crashes separately via turbidity_proxy).

  - metric: precipitation_mm_h
    condition: gt
    value: 5
    reason_code: FLASH_FLOOD
    description: Heavy rain in the Red Sea coastal plain (rare but severe) triggers wadi flash-flood runoff into coastal sites, killing visibility.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY_RED_SEA
    description: Elevated turbidity from post-shamal sediment or rare wadi runoff crashes the normally exceptional Red Sea clarity below 5 m.

  - metric: tidal_current_speed_kn
    condition: gt
    value: 2.5
    reason_code: STRONG_CURRENT_UNSAFE_RED_SEA
    description: Sustained current above 2.5 knots on the offshore seamount chain (Elphinstone plateau, Rocky Island) exceeds standard recreational drift-management.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Dahab Blue Hole is one of the world's most-documented dive fatality
    sites (~200+ recorded fatalities historically, mostly technical-
    diver overhead-arch attempts beyond safe depth). Recreational-
    depth diving at Blue Hole is safe; the 56 m Arch swim-through
    is technical (trimix). Egyptian Chamber of Diving + Watersports
    (CDWS) enforces briefing + qualification requirements.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "Chamber of Diving and Watersports Egypt (CDWS) Dahab site standards"
    - "Dahab Divers South Sinai operator SOP"
    - "PADI Dahab regional dive-condition briefing"
  notes: |
    Spot overrides vs scuba-red-sea: matches regional baseline for
    the Gulf-of-Aqaba shore-entry sector. 44-week season. Blue Hole
    fatality-site status captured at sub-spot level.

    v0.2.0 realigned to v2.0.0 base structure: water_clarity is now the
    top signal (0.30 weight, replacing the old `visibility` top-weighted
    dimension); surface_visibility (surface fog/haze) demoted to 0.05;
    current dimension added (0.08); turbidity_proxy gate scale corrected
    to the 0-1 index range. Dimensions/gates copied verbatim from
    scuba-red-sea v0.2.0.
