  de: Tauchen — Dahab
description:
  en: |
    Dahab (S Sinai peninsula, Egypt) is the Red Sea's shore-entry
    diving capital — Bedouin-town-based coastal-cliff diving with
    the iconic Blue Hole (100+ m submarine pit with 26 m submerged
    Arch to open sea) and Canyon (submerged rock crack from 30 m to
    54 m). Both sites are shore-entry from vehicle-accessible cliff
    edges. Water 22-29°C. Cluster extends existing red-sea coverage
    (Ras Mohammed / Thistlegorm / Brothers cluster) with the
    dedicated Dahab shore-entry sub-region.

