tier_rationale:
  en: |
    The Inland Sea Gozo is a 60 m-diameter shallow salt-water pool on
    Dwejra Point connected to the open sea by an 80 m underwater
    tunnel through the cliff. The tunnel dive descends from the
    pool at ~4 m to ~26 m at mid-tunnel opening into the open sea
    wall on the exit. Cavern-diving grade for the tunnel passage —
    guide-led with tunnel-orientation briefing. Post-tunnel dive
    continues along the outer coast wall. The cluster's tunnel-
    passage reference dive.

