tier_rationale:
  en: |
    Il Blue Hole di Gozo is a 15 m-deep coastal pool connected to the
    open sea via a 26 m natural rock arch/tunnel — historically
    accessed from the Dwejra Point cliff base beside the (now
    collapsed 2017) Azure Window. Post-collapse the site remains
    accessible from a re-routed shore-entry; the underwater arch
    and open-sea exit are unchanged. Cavern-diving grade for the
    tunnel passage with guide-led standard practice. Depth kept in
    15-25 m recreational range on the standard route.

