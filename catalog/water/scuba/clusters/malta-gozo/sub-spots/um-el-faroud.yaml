tier_rationale:
  en: |
    L'Um El Faroud is a 110 m Libyan-flagged tanker deliberately
    scuttled 2 September 1998 off Wied iz-Zurrieq (SW Malta) as a
    reef-and-wreck training + tourism asset. Wreck sits upright on
    sand-rock bottom at 25-36 m depth — recreational-wreck geometry
    with intact hull + superstructure + engine-room penetration mapped
    for wreck-trained divers. In 2005 the wreck split into two
    sections after a severe storm — swim-through geometry now
    includes the mid-ship break. Guide-led by default; shore + boat
    entry both feasible.

