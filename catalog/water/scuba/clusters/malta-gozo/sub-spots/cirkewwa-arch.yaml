tier_rationale:
  en: |
    Il Cirkewwa Arch is a natural rock arch at 12 m depth on the
    Cirkewwa headland (NW Malta), shore-entry from the ferry-port
    area. Site is Malta's most-dived shore-entry — depth kept at
    12-18 m for arch passage + adjacent reef, straightforward
    swim-through geometry, encrusting biocoenosis + resident conger
    + moray. Cluster's beginner-friendly shore-entry reference dive.

