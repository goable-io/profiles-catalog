description:
  en: |
    Malta + Gozo host one of Europe's densest per-km-coast concentrations
    of diveable wrecks, sea caves, and coastal walls. Sites include the
    Um El Faroud tanker (deliberately scuttled 1998 at 35 m as a
    reef-and-wreck training site), Gozo's iconic Blue Hole cavern
    system (unfortunately reduced after the 2017 Azure Window collapse
    but still an iconic dive), Cirkewwa Arch (natural rock arch at 12 m),
    and the Inland Sea Gozo tunnel dive. Water 15-27°C. Excellent
    visibility (20-40 m routine). Boat + shore-entry hybrid operations.

