display_name:
  en: Scuba Diving — Ponza (Isole Pontine)
  it: Immersione — Ponza
  es: Buceo — Ponza
  fr: Plongée — Ponza
  de: Tauchen — Ponza
description:
  en: |
    Ponza — the Pontine archipelago's flagship island (Lazio) —
    delivers wall diving, submerged Roman-era piscinae (fish ponds
    at Grotta di Pilato), and offshore reef diving on Le Formiche
    seamount. The volcanic-caldera coastline creates faraglioni
    stacks with dramatic underwater topology. Water 15-25°C. Boat
    access from Ponza Porto or Formia (mainland) via ferry.

