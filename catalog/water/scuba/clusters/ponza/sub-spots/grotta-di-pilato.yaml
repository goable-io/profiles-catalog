tier_rationale:
  en: |
    La Grotta di Pilato is a Roman-era submerged piscina (fish-farming
    tank) complex on the SE Ponza coast — three interconnected pools
    at 3-6 m depth carved into tuff cliff, connected to the sea by
    submerged channels. Depth keeps NDL essentially unlimited.
    Historically pre-scuba as the "Pilate's grotto" (post-classical
    misattribution) — the site is protected under Soprintendenza
    Archeologica look-only regime. Site is a short shore-entry from
    an adjacent boat mooring; the cluster's training and heritage
    reference dive.

