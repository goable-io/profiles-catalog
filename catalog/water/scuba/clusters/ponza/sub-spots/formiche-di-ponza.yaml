tier_rationale:
  en: |
    Le Formiche di Ponza is an offshore seamount + reef cluster S of
    Ponza with plateau top at 12-15 m and drop-off to 45 m+ on the
    outer face. Dense Paramuricea + Eunicella gorgonian at 25-40 m,
    resident dentex + barracuda + occasional grouper. Exposed to
    Libeccio and Sirocco on full fetch; boat operators from Ponza
    Porto select weather windows tightly. Standard intermediate-to-
    advanced offshore reef dive.

