tier_rationale:
  en: |
    Lo Scoglio della Botte is a submerged pinnacle NW of Ponza rising
    from a sand-rock plateau at 40 m to a top at 15 m. Vertical wall
    with dense gorgonian, red coral (Corallium rubrum) at 40 m+, and
    frequent pelagic passages of dentex + tuna. Depth + off-shore
    exposure + no-obvious-shelter position make advanced-open-water
    rating baseline. Site is dive-shop-guided by default and requires
    calm surface conditions for safe boat mooring on the reduced-
    footprint plateau top.

