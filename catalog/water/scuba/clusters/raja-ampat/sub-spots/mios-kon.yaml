tier_rationale:
  en: |
    Mios Kon is a seamount pinnacle near the Dampier Strait combining
    reef-fish schooling with occasional pelagic passages of tuna and
    reef shark. Current typically runs 0.5-2 kn around the pinnacle,
    moderate enough for intermediate divers with basic drift
    experience, while the mixed pinnacle topography (18-30 m) offers
    more structure than a straight wall without the extreme current
    exposure of Cape Kri, placing it at the cluster's intermediate
    tier.

