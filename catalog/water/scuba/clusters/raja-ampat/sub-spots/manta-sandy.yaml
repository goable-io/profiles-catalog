tier_rationale:
  en: |
    Manta Sandy is a shallow sand-patch cleaning station in the
    Dampier Strait, 5-12 m deep, where reef mantas hold position
    over coral-bommie cleaning stations to be groomed by wrasse.
    Divers settle behind a rope-marked viewing line rather than
    actively swimming the current, making buoyancy control and
    patience the primary skills rather than drift technique. This
    combination of shallow depth and low active-navigation demand
    keeps it at the cluster's intermediate tier.

