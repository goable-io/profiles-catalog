tier_rationale:
  en: |
    Cape Kri holds the Guinness World Record for the most fish
    species recorded on a single dive (374, marine biologist Gerry
    Allen, 2012), a direct result of sitting at the Dampier Strait
    entrance where nutrient-rich currents converge on a sloping reef
    wall. Strong tidal current, frequently exceeding 1.5-2 kn,
    sweeps the point and demands active drift technique and
    current-line awareness, placing it at the cluster's advanced
    tier despite the moderate 5-25 m depth range.

