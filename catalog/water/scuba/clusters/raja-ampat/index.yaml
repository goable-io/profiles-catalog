description:
  en: |
    Raja Ampat (West Papua, Indonesia) sits at the apex of the Coral
    Triangle and holds the highest recorded marine biodiversity on
    Earth. The Raja Ampat Marine Protected Area network (est.
    2007-2010, ~4.6 million hectares) covers the Dampier Strait and
    surrounding archipelago. Sites are current-swept channel walls
    and seamounts with warm water (28-30°C) and routine 15-25 m
    visibility, tidally driven currents up to 2-3 kn. Cape Kri,
    Manta Sandy, and Mios Kon anchor the Dampier Strait dive
    circuit. Boat access from Waisai / liveaboard.

