gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: PACIFIC_HIGH_SEAS
    description: Wave height above 3.0 m on Raja Ampat's exposed channel and seamount sites makes drift drop-off and retrieval unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: TROPICAL_CYCLONE_PERIPHERY
    description: Sustained wind above 30 knots signals monsoon-squall or storm periphery; Raja Ampat liveaboard and day-boat operations stand down.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_PAC
    description: Surface visibility below 800 m during tropical squall makes site-finding across Raja Ampat's dispersed island channels unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE_PAC
    description: Heavy tropical rain above 20 mm/h correlates with squall systems and runoff-driven visibility crashes near high-island channels.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    The Raja Ampat MPA network (established 2007-2010, managed with
    Conservation International and local Misool/Dampier Strait
    communities) enforces a marine park entry fee and zone-based
    tourism rules across ~4.6 million hectares. Cape Kri and Manta
    Sandy carry the highest per-session visitor pressure in the
    archipelago; guide-lead, no-touch protocols are standard.

