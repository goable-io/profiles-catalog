tier_rationale:
  en: |
    L'SS Yongala è a 110 m passenger + cargo steamer sunk 23 March
    1911 by Cyclone Yasi's namesake predecessor storm off Cape
    Bowling Green (Queensland). Wreck sits on sand + rubble bottom at
    15-30 m depth — one of the world's most-praised wreck dives for
    macro + pelagic wildlife density (giant grouper, bull rays,
    olive sea snakes, schooling trevally). Site is exposed to open
    Coral Sea; strong current typical. Advanced-open-water baseline;
    guide-led with strict Queensland Historic Shipwrecks Act look-
    only enforcement.

