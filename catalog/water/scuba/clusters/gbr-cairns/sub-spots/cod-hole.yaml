tier_rationale:
  en: |
    Il Cod Hole (Ribbon Reef #10, N GBR) is one of the reference
    marine-wildlife encounter sites on the GBR — resident population
    of ~10-15 potato cod (Epinephelus tukula, 1-2 m each) that
    interact with divers on the reef pinnacle at 15-25 m depth.
    Guide-lead with strict no-feed protocol post-2020 GBRMPA policy
    update. Intermediate depth + wildlife-focus, liveaboard-day-trip
    from Cairns. Cluster's marine-life reference.

