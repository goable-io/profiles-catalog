  it: Immersione — Grande Barriera Corallina (Cairns)
  es: Buceo — Gran Barrera de Coral (Cairns)
  fr: Plongée — Grande Barrière de Corail (Cairns)
  de: Tauchen — Great Barrier Reef (Cairns)
description:
  en: |
    The Cairns + Ribbon Reefs sector of the Great Barrier Reef (GBR)
    delivers the reference Australian tropical reef diving. Cod Hole
    (Ribbon Reef #10) hosts the world-famous potato-cod (Epinephelus
    tukula) encounter site; SS Yongala (200 km S off Ayr, but
    typically operated from Townsville / Cairns liveaboards) is one
    of the world's greatest wreck dives at 15-30 m. Water 22-30°C
    seasonal. Liveaboard-dominant format. Coral bleaching pressure
    is severe (2016-17, 2020, 2022 mass events documented).

