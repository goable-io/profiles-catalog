gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: PACIFIC_HIGH_SEAS
    description: Wave above 3.0 m on the Coral Sea (cyclone periphery Nov-Apr) makes SS Yongala + Cod Hole boat mooring unsafe.
  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: TROPICAL_CYCLONE_PERIPHERY
    description: Sustained wind above 30 knots signals tropical cyclone periphery; GBR liveaboard operations stand down.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_PAC
    description: Surface visibility below 800 m during tropical squall makes site-finding unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE_PAC
    description: Heavy tropical rain triggers coastal runoff into inshore GBR sector; visibility drops for 24-48 h.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Great Barrier Reef Marine Park Authority (GBRMPA) enforces zone-
    based dive-tourism rules on the entire GBR system. Coral bleaching
    events since 2016 have caused documented 30-50% coral cover loss
    on inshore reefs. SS Yongala is protected historic-wreck under
    Queensland + Australian legislation (look-only, no penetration
    beyond safe-route zone).

