tier_rationale:
  en: |
    Punta dell'Arco is the S-facing headland of Ventotene delivering
    wall + boulder-field diving from 10 m to 35 m+ with dense
    Paramuricea gorgonian at 25-30 m and coralligenous biocoenosis
    on the vertical face. Adjacent Santo Stefano islet forms the
    outer boat-transit landmark for combination-dive day. Exposed to
    Libeccio on outer approaches; standard intermediate wall dive
    with clear ascent-line profile.

