tier_rationale:
  en: |
    The Faraglione Nord (Faraglione di Terra) is a volcanic-tuff sea
    stack on Ventotene's N coast rising from a 25-30 m bottom.
    Circumnavigation delivers wall + boulder-field geometry with
    dense Eunicella cavolini gorgonian and coralligenous encrustation.
    Depth kept in 15-30 m recreational range; sheltered from Sirocco
    by island geometry, exposed on the N face. Boat mooring at
    dedicated buoyed line — the cluster's standard intermediate dive.

