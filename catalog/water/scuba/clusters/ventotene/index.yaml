description:
  en: |
    The AMP Riserva Marina Isole di Ventotene e Santo Stefano (D.M.
    12/12/1997, expanded 2009) covers the volcanic-tuff Ventotene +
    the nearby Santo Stefano islet. Wall + boulder-field + faraglione
    dives with dense Paramuricea + Eunicella cavolini gorgonian and
    coralligenous encrustation. Boat access from Ventotene Porto or
    Formia + Anzio ferries. Water 15-25°C.

