description:
  en: |
    AMP Isole Ciclopi (D.M. 07/12/1989) protects the volcanic-basalt
    Faraglioni islands off Aci Trezza on the Etnean E-Sicilian coast.
    Sites are volcanic-columnar-basalt underwater (geologically
    striking dive setting) with clear central-Ionian water and
    resident coastal biocoenosis. Water 15-25°C. Boat access from
    Aci Trezza in 5 min. Compact cluster (islands + coast form a
    single dive area).

