tier_rationale:
  en: |
    Il Faraglione Grande is the largest of the Ciclopi Faraglioni sea
    stacks, rising from a 25-30 m bottom off Aci Trezza. Underwater
    circumnavigation delivers wall + boulder-field geometry on
    columnar-basalt substrate with encrusting biocoenosis. Sheltered
    from Sirocco on some approaches by Faraglione + adjacent island
    geometry. Standard intermediate wall + circumnavigation dive with
    the cluster's iconic scenery.

