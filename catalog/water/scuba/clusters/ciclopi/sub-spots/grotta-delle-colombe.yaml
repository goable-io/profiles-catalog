tier_rationale:
  en: |
    La Grotta delle Colombe is a coastal cavern on the Ciclopi
    Faraglione Grande — entry at 6-10 m opening into a chamber with
    columnar-basalt walls (a geological signature of the volcanic
    genesis of the site). Cavern-diving grade with guide-led penetration,
    short single-exit route. Depth kept in 10-15 m recreational range.
    Site is exposed to Sirocco on outer approaches.

