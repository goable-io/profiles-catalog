gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: MONSOON_HIGH_SEAS
    description: Wave height above 3.0 m in Indian-Ocean coastal or atoll-outer sites (monsoon exposure) makes RIB access and drift-dive drop-off unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 28
    reason_code: MONSOON_HIGH_WIND
    description: Sustained wind above 28 knots on monsoon side of atoll or coastal site makes surface support and safety-stop hold unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: MONSOON_POOR_SURFACE_VISIBILITY
    description: Surface visibility below 800 m during monsoon squall periods makes site-finding unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: MONSOON_DELUGE
    description: Heavy monsoon rainfall above 20 mm/h correlates with atoll-wide underwater visibility crash (plankton bloom + terrestrial runoff on high-island sites like Tulamben, Komodo, Pemba).

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY_INDIAN
    description: Elevated turbidity from monsoon-band runoff or plankton bloom crashes the Indian-Ocean atoll clarity below 5 m.

  - metric: tidal_current_speed_kn
    condition: gt
    value: 3.0
    reason_code: STRONG_CURRENT_UNSAFE_INDIAN
    description: Sustained current above 3.0 knots on Maldive channel + Komodo tidal-race sites exceeds standard recreational drift-management (advanced-drift certifications recommended).

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Tulamben-Amed coastal region is under Ministry of Marine Affairs
    coordinated tourism-management protocol; USS Liberty wreck is
    Indonesian-registered historic asset (protected). Boat + shore-
    entry hybrid + high visitor density create sustained carrying-
    capacity pressure on the shallow reef and adjacent Coral Garden.

