description:
  en: |
    Tulamben on Bali's NE coast is Indonesia's most-dived shore-entry
    diving destination — the USS Liberty WWII wreck (US Army cargo
    ship torpedoed 11 January 1942, beach-launched by 1963 Mt Agung
    eruption tsunami-shift to current 5-30 m location) is one of the
    world's most-photographed wrecks, walkable-in from the beach.
    Coral Garden + Drop-Off adjacent sites complete the Tulamben
    cluster. Water 26-30°C year-round. Boat + shore-entry hybrid.

