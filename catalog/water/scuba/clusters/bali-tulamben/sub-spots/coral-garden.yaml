tier_rationale:
  en: |
    Coral Garden is a shallow reef site adjacent to the USS Liberty
    wreck — depth 5-15 m, sand + coral-rubble bottom with resident
    reef fish, occasional black-tip reef shark on outer edge, and
    dense hard-coral cover on the shallow reef. Shore-entry from the
    Tulamben beach in 5 min. Beginner-friendly reef dive with
    extended-NDL profile.

