tier_rationale:
  en: |
    Il Drop-Off (Tulamben Wall) is a vertical wall descending from
    10 m to 60 m+ off the S end of Tulamben beach, with dense
    encrusting biocoenosis + soft coral + occasional pelagic passage.
    Depth + wall geometry make advanced-open-water baseline. Shore-
    entry from Tulamben in 5-10 min. The cluster's advanced-grade
    dive without the Liberty wreck's beginner-friendliness.

