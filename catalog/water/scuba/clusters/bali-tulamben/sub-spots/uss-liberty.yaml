tier_rationale:
  en: |
    L'USS Liberty era una cargo ship US Army sunk by Japanese torpedo
    11 January 1942 and beached in Tulamben; the 1963 Mt Agung
    eruption tsunami shifted the wreck into its current 5-30 m
    position parallel to shore. Wreck is walkable-in from the black-
    sand cobble beach — no boat needed. Depth kept in 5-25 m
    recreational range; heavy encrusting biocoenosis after 80+ years
    submersion. Beginner-friendly wreck-training reference dive.

