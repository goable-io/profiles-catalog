gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m at Gallinara (Libeccio) makes W-flank wall dives and offshore amphorae-field boat mooring unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes site-finding unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers Centa river runoff from Albenga; underwater visibility drops for 24-72 h at Gallinara.

  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Libeccio storm sediment stirring destroys wall + amphorae-field diving quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: medium
  notes: |
    Gallinara island is restricted-access nature reserve on land
    (no landing); diving is permit-managed by Comune di Albenga +
    Regione Liguria. Roman-era amphorae field is under archaeological
    protection — no artefact contact or removal. Boat operators from
    Alassio, Albenga, or Laigueglia dominate site logistics.

