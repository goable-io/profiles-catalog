description:
  en: |
    The AMP Isola Gallinara (Riviera di Ponente, Savona, D.M.
    01/06/1989 restricted-access island reserve; diving activity
    permit-managed via Comune di Albenga + Regione Liguria) is a
    tombolo-connected island offshore Albenga. Wall diving down to
    35 m+, dense Paramuricea + Eunicella gorgonian on the outer
    circumnavigation, and the Roman-era Roman-Republic-shipwreck
    amphorae field documented at 30 m offshore. Water 14-24°C.
    Exposed to Libeccio on the W flank; the E flank between the
    island and Albenga mainland provides Libeccio shelter.

