tier_rationale:
  en: |
    Punta Nord of Gallinara is the N-facing wall + boulder-slope
    descending from 15 m to 40 m+, with Paramuricea + Eunicella
    cavolini gorgonian at 25-35 m and moray + conger + occasional
    dentex on the plateau. Site is sheltered from Libeccio by the
    island itself, exposed to Tramontane on the N flank. Standard
    intermediate wall dive with buoyed mooring line and clear
    ascent-line profile. Boat access from Alassio in 10-15 min.

