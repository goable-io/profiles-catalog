tier_rationale:
  en: |
    Punta Sperone is the SE-facing outer point of Gallinara, a
    vertical wall dropping to 45 m+ with dense Paramuricea gorgonian
    fields and the offshore Roman-era amphorae field at 30-35 m in
    the sand-shelf between the point and the mainland (Republican-era
    wine-amphorae cargo scattered pattern, under Soprintendenza
    protection — look-only, no contact). Depth + current + off-shore
    exposure make advanced-open-water rating baseline. Site is
    guide-led by default with amphorae-field briefing mandatory to
    prevent artefact disturbance.

