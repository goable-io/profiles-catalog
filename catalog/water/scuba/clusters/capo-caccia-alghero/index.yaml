description:
  en: |
    AMP Capo Caccia — Isola Piana (D.M. 20/09/2002) protects the
    NW Sardegna promontory including the Grotta di Nereo — the largest
    submerged karst sea cave in the Mediterranean by mapped extent
    (350+ m of passage documented by SSI + Speleo Sub AMP Capo Caccia
    surveys). Also delivers wall diving with Paramuricea + Corallium
    rubrum on the exposed Punta Cristallo face. Water 15-25°C. Boat
    access from Alghero Porto.

