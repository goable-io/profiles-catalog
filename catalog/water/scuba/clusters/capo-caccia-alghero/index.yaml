gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m on Capo Caccia W face (Mistral events) makes Grotta di Nereo + Punta Cristallo boat approach unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes site-finding unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers karst-runoff into Grotta di Nereo entry area; visibility drops in cavern for 24-48 h.
  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Mistral storm sediment destroys wall + cavern-entry visibility.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 30
  carrying_capacity_sensitivity: high
  notes: |
    AMP Capo Caccia enforces zone-based diving permits + strict
    guide-required protocol for Grotta di Nereo penetration (cave-
    diving certification required beyond the entry chamber; cavern-
    grade guided-dive available for cavern-certified divers on
    entry-area only). Karst-cavern silt-out risk demands strict
    dive planning.

