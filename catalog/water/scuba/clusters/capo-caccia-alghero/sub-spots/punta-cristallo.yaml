tier_rationale:
  en: |
    Punta Cristallo is the exposed N face of the Capo Caccia
    promontory, a vertical wall from 12 m to 45 m+ with dense
    Paramuricea gorgonian and Corallium rubrum below 35 m — the
    Sardegna NW reference deep-recreational wall. Exposed to Mistral
    on full fetch; weather-window-selected. Advanced-open-water
    rating baseline given depth + Corallium proximity.

