tier_rationale:
  en: |
    La Grotta di Nereo is the largest submerged karst sea cave in
    the Mediterranean by mapped extent — 350+ m of underwater
    passage development documented by SSI + Speleo Sub AMP Capo
    Caccia surveys, entry at 12-18 m from the Capo Caccia W face.
    Multiple chambers with distinct freshwater-halocline transitions
    from karst freshwater infiltration. Cavern-grade dive available
    to cavern-certified divers on the entry area only; full-cave
    penetration requires cave-diver certification + guide-lead by
    AMP-permitted operators.

