gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: PACIFIC_HIGH_SEAS
    description: Wave above 3.0 m on Sipadan outer wall makes boat mooring + drift drop-off unsafe.
  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: TROPICAL_CYCLONE_PERIPHERY
    description: Sustained wind above 30 knots signals cyclone periphery; operations stand down.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_PAC
    description: Surface visibility below 800 m during squall makes drop-off retrieval unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE_PAC
    description: Heavy tropical rain triggers visibility crash on the shallow reef sections; operations pause.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Sipadan Marine Park (Sabah Wildlife Department) enforces strict
    176 daily-diver cap distributed across licensed operators.
    Post-2004 island-resort removal has restored coral cover +
    green + hawksbill turtle populations. Cluster is one of the
    world's most strictly-managed dive sites.

