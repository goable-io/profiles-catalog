description:
  en: |
    Sipadan (Sabah, E-Malaysia, S Celebes Sea / SW Pacific fringe) is
    one of Asia's iconic diving destinations — a small oceanic pinnacle
    rising 600 m from the seabed with wall + drop-off diving on the
    outer perimeter. Sipadan Marine Park (Sabah Wildlife Department
    permit-managed since 2004) enforces 176 daily-diver cap across
    12 named dive sites. Water 27-30°C year-round. Liveaboard or
    Semporna day-boat operations dominate.

