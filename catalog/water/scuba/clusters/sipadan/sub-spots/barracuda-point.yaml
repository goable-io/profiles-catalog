tier_rationale:
  en: |
    Barracuda Point is Sipadan's signature dive — a wall descending
    from 15 m to 60 m+ on the SW perimeter where large chevron-
    barracuda schools (Sphyraena qenie, 500+ individuals) form
    tornado formations mid-water. Sustained current 1-2 kn on the
    outer wall requires drift-diving discipline. Advanced-open-water
    baseline; guide-lead by default under Sabah Wildlife Department
    permit conditions. Cluster's flagship dive.

