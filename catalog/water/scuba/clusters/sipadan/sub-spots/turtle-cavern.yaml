tier_rationale:
  en: |
    La Turtle Cavern is a submerged sea cave on the SW-Sipadan wall
    at 20 m entry — a chamber system with air-space pockets and
    documented historical turtle skeletal remains from turtles that
    became disoriented and drowned inside. Cavern-diving grade with
    strict guide-lead + no-penetration-beyond-safe-route enforcement.
    Sabah Wildlife Department permit conditions include cave-diving
    experience validation. Cluster's advanced-cavern grade dive.

