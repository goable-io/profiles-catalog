tier_rationale:
  en: |
    Shinkoku Maru is a 152 m Imperial Japanese Navy fleet oiler sunk on 17
    February 1944 during Operation Hailstone, resting upright at 12-40 m
    with the superstructure. Engine room, and operating theatre accessible
    to trained divers and heavy coral overgrowth covering the hull. As a
    designated war grave, penetration is restricted to wreck-certified
    divers, and depths beyond 30 m to reach the engine room require
    advanced training, placing it at the cluster's top tier.

