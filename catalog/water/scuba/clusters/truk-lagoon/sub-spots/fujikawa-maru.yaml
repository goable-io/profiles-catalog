tier_rationale:
  en: |
    Fujikawa Maru is a Japanese aircraft ferry sunk during Operation
    Hailstone in 1944. Resting at 10-35 m with intact Mitsubishi Zero
    fighter fuselages still visible in the forward hold alongside engine-
    room machinery and munitions. Penetration to the aircraft hold and
    engine room requires wreck-certified training under the site's war-
    grave protection rules, and the 35 m maximum depth places it at the
    cluster's advanced tier alongside Shinkoku Maru.

