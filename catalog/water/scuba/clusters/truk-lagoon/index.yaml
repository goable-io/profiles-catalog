description:
  en: |
    Truk (Chuuk) Lagoon, Federated States of Micronesia, is the
    world's premier WWII wreck-diving destination, holding over 50
    Imperial Japanese Navy vessels and aircraft sunk during the
    United States' Operation Hailstone (17-18 February 1944). The
    sheltered lagoon offers calm, current-light diving with warm
    water (28-30°C) and 15-30 m visibility over wrecks lying at
    10-60 m depth, many with cargo, armament, and personal effects
    intact. Wrecks are designated war graves under Chuuk State law.
    Boat access from Weno.

