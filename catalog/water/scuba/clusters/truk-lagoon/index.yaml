  notes: |
    Spot overrides vs scuba-pacific: matches regional baseline for
    the Micronesian sector, with the sheltered lagoon geometry
    supporting a longer 48-week season than open-reef Pacific sites.
    Typhoon season (Jun-Nov) is a reduced-frequency risk given the
    lagoon's partial shelter from Weno island.
