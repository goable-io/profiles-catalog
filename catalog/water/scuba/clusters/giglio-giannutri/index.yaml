description:
  en: |
    The southern Tuscan Archipelago (Giglio + Giannutri islands, PNAT
    zone) offers walls, wrecks, and Roman amphorae fields. Giannutri
    hosts the Nasim II bulk-carrier wreck (sunk 1976 at 55-65 m —
    technical) plus the Le Anfore sub-spot (a scattered late-Republican
    wine-amphorae field at 30 m, look-only Soprintendenza-protected).
    Water 15-25°C. Boat access from Porto Santo Stefano (Argentario)
    or Giglio Porto.

