  typical_season_weeks: 28
  carrying_capacity_sensitivity: medium
  notes: |
    Giannutri is a PNAT marine + terrestrial reserve with strict-
    landing rules; diving is permit-managed. Nasim II wreck is
    Soprintendenza-protected. Le Anfore amphorae field is under
    Soprintendenza look-only regime. Boat access from Porto Santo
    Stefano dominates operator logistics.

