tier_rationale:
  en: |
    The Nasim II is a 65 m Lebanese bulk carrier sunk 6 December 1976
    off Giannutri's E flank. Wreck sits upright on a sand + rock
    bottom at 55-65 m depth — beyond recreational limits, in the
    technical-diving range. Trimix rating baseline; the wreck's
    superstructure + hull outline are intact and swim-through
    penetration is possible for cave/wreck-certified divers with
    appropriate gear. Site is guide-led by default with strict
    briefing on decompression + gas planning; boat transit from
    Porto Santo Stefano is 45-60 min.

