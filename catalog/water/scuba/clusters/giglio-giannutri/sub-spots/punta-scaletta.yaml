tier_rationale:
  en: |
    Punta Scaletta is the W-facing outer point of Isola del Giglio,
    a wall + boulder-slope descending from 12 m to 40 m+ with dense
    Paramuricea + Eunicella cavolini gorgonian in the 25-35 m range.
    Sheltered from Libeccio by island geometry on some approaches,
    exposed on others. Standard intermediate wall dive for the
    cluster with straightforward buoyed descent and clear ascent
    profile. Boat access from Giglio Porto in 10 min.

