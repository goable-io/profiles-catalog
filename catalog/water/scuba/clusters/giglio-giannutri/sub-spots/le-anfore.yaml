tier_rationale:
  en: |
    Le Anfore is a scattered late-Republican Roman wine-amphorae field
    at 28-32 m depth off Giannutri's E flank, adjacent to the Nasim II
    wreck but at recreational depth. Amphorae are dispersed on a
    sand-rock bottom in the wake of a shipwreck cargo release, all
    under Soprintendenza look-only protection (no contact, no removal,
    guide-led dives with pre-briefing on artefact protection). Depth +
    calm sand-bottom + amphorae in-situ make this the cluster's
    archaeological reference dive.

