description:
  en: |
    AMP Isole Egadi (D.M. 27/12/1991, expanded 2018) is Italy's
    largest marine protected area covering Favignana, Marettimo,
    Levanzo, and surrounding seas off the W-Sicily coast. Walls,
    grottos, and Roman-era submerged archaeological sites (Battle of
    the Egadi 241 BCE bronze rostra recoveries between 2005-2020).
    Water 15-26°C. Boat access from Trapani or Favignana.

