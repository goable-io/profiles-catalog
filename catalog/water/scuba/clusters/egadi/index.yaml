gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m makes Marettimo + Punta Troia inter-island transit unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes navigation unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers island-hinterland runoff into coastal caverns; visibility drops for 24 h.
  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Libeccio storm sediment destroys wall dive quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 32
  carrying_capacity_sensitivity: medium
  notes: |
    AMP Isole Egadi enforces zone-based diving permits + daily caps
    per site. Marettimo houses the strictest zoning (Zone A around
    Punta Libeccio + Punta Troia flanks). Soprintendenza del Mare
    (Regione Siciliana) coordinates submerged-archaeology-site access
    for the Battle of the Egadi bronze rostra localities.

