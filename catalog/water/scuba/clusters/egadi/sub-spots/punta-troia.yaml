tier_rationale:
  en: |
    Punta Troia is the northern tip of Marettimo topped by an Aragonese
    fortress. Underwater delivers wall + drop-off from 15 m to 45 m+
    with dense Paramuricea gorgonian and the offshore Battle-of-the-
    Egadi (241 BCE) archaeological zone in adjacent waters. Depth +
    exposure + strict-AMP-zoning make advanced-open-water baseline;
    guided-dive-only with strict Soprintendenza look-only enforcement
    on any archaeological-context passage.

