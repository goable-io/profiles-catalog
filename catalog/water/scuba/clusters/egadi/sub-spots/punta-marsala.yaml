tier_rationale:
  en: |
    Punta Marsala is the SE point of Favignana with wall + reef
    geometry descending from 8 m to 30 m+, dense Paramuricea +
    Eunicella cavolini gorgonian and clear encrusting coralligenous
    biocoenosis. Sheltered from Libeccio on some approaches. Standard
    intermediate wall dive with buoyed mooring line, boat access from
    Favignana Porto in 15 min.

