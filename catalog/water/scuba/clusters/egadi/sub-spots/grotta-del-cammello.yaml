tier_rationale:
  en: |
    La Grotta del Cammello is a submerged sea cave on Marettimo's E
    flank, entry at 5-12 m opening into an air-space chamber and side
    galleries. Cavern-diving grade with guide-led penetration; the
    "cammello" (camel) name derives from a distinctive rock formation
    at the entry silhouette. Site is exposed to prevailing NW flow;
    boat access from Marettimo village in 10-15 min. Marettimo is the
    strictest-access AMP Egadi island — Zone A rules limit visitor
    numbers.

