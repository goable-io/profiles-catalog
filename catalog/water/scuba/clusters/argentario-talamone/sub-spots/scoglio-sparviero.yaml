tier_rationale:
  en: |
    Lo Scoglio dello Sparviero is a coastal offshore rock N of
    Talamone, close to the Parco Regionale della Maremma coastline.
    Reef + wall descending from 10 m to 30 m+ with Paramuricea +
    Eunicella cavolini gorgonian and dense encrusting biocoenosis.
    Boat access from Talamone or Porto Santo Stefano in 20 min.
    Standard intermediate coastal reef dive with clear ascent-line
    profile and no depth commitment beyond 30 m.

