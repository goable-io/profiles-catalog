tier_rationale:
  en: |
    Le Formiche di Grosseto is a three-islet offshore cluster 15 km
    off the Argentario coast, with reef + wall geometry descending
    from 8 m to 40 m+ and dense Paramuricea gorgonian at 25-35 m.
    Sheltered from Libeccio on the SE flank, exposed on Sirocco.
    Standard intermediate offshore reef dive with boat transit of
    30-40 min from Porto Santo Stefano. Post-Libeccio-storm turbidity
    is the dominant quality-swing variable.

