gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m makes offshore Formiche di Grosseto approach unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes offshore navigation unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers Ombrone + Albegna river runoff into the Argentario waters; visibility drops for 24-48 h.
  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Libeccio storm sediment destroys reef diving quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: low
  notes: |
    Parco Regionale della Maremma marine boundary applies to Argentario
    sites; boat traffic coordination with regional authority is standard.
    Ombrone + Albegna river plumes materially reduce visibility on the
    N-facing sites in spring runoff months.

