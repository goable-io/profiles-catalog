description:
  en: |
    The Argentario promontory and adjacent Talamone coast (Tuscan
    mainland, Grosseto province) sit within the Parco Regionale della
    Maremma marine boundary. Offshore reef diving at Formiche di
    Grosseto (an islet cluster with wall + reef geometry) plus the
    coastal Scoglio dello Sparviero rock. Water 15-25°C. Boat access
    from Porto Santo Stefano or Porto Ercole.

