  notes: |
    Spot overrides vs scuba-mediterranean: matches regional baseline
    for the W-Ligurian sector. 28-week season with Nov-March closed
    for shore-entry and Libeccio storm windows. La Spezia gulf
    river-plume runoff is a materially larger visibility-hit factor
    than at Portofino — the runoff gate is the practical difference.
