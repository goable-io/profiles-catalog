gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m at the Cinque Terre exposed cliffs (Libeccio) makes shore + boat entry unsafe; Palmaria sheltered alternates remain workable up to 2.5 m.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes navigation to Palmaria and Scoglio Ferale unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers Magra + Vara river runoff into the La Spezia gulf; underwater visibility drops for 24-72 h.

  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Libeccio storm sediment destroys wall diving on Ferale and Torre Scola sites.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: medium
  notes: |
    AMP Cinque Terre (D.M. 12/12/1997) + AMP Portovenere-Palmaria-Tino-
    Tinetto (Regional Reserve, LR 15/1985) manage daily-cap enforcement
    and mooring permits. Cinque Terre National Park terrestrial
    protection covers shore access via numbered footpaths; boat access
    from Portovenere / La Spezia dominates operator logistics.

