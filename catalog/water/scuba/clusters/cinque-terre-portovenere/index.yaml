description:
  en: |
    The Portovenere + Palmaria + Tino + Cinque Terre AMP complex
    covers the Ligurian coast from La Spezia gulf to Monterosso. Walls,
    caves, and the 16th-century Torre Scola artillery-tower wreck at
    3-15 m. Sheltered on the Portovenere / Palmaria side against
    Libeccio; exposed on the Riomaggiore / Vernazza cliffs. Coral-
    ligenous biocoenosis + Paramuricea gorgonian at 25-40 m. Water
    14-24°C seasonal, visibility 10-25 m. AMP zone-managed with
    permit-only mooring and daily-cap enforcement.

