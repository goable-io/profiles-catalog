tier_rationale:
  en: |
    Scoglio Ferale is the exposed offshore rock SE of Tino, a vertical
    pinnacle plunging from 20 m to 55 m+ with the densest gorgonian
    fields of the AMP Portovenere sector plus black-coral (Antipathes
    subpinnata) colonies documented on the deep face. The site's
    exposure to full-fetch Libeccio and Sirocco makes weather-window
    selection tight; dive shops guide only on flat post-storm windows.
    Depth + current + open-sea exposure make advanced-open-water and
    deep-diver rating baseline; the cluster's technical-diving
    reference.

