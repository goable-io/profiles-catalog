tier_rationale:
  en: |
    Palmaria island's outer W-face delivers wall + boulder-field diving
    from 12 m to 40 m+, with the Grotta Azzurra (Palmaria) cavern dive
    at 15-20 m accessed from the S side. Coralligenous encrustation and
    dense Paramuricea + Eunicella cavolini gorgonian below 25 m. Site
    exposes to Libeccio swell on the W flank; sheltered channel-side
    on the E. Standard intermediate-recreational grade with cavern-
    diving overlay on the Grotta route (requires cave/cavern rating for
    penetration).

