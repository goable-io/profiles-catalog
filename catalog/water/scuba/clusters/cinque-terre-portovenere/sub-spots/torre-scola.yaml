tier_rationale:
  en: |
    The Torre Scola is a 16th-century artillery tower ruin submerged
    at 3-15 m off Palmaria island in the La Spezia gulf. Historically
    documented pre-scuba as a Napoleonic-era gun emplacement. Depth
    keeps NDL essentially unlimited, sheltered from Libeccio, boat
    access from Portovenere in 15 min. The cluster's training-and-
    tourist reference: overhead + swim-through geometry through the
    tower ruins, dense encrusting biocoenosis on masonry, resident
    conger + moray. Boat traffic in the Palmaria channel is the main
    surface hazard.

