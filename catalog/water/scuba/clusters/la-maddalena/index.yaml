gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m makes Bocche di Bonifacio + offshore islet transit unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze makes navigation unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers island-hinterland runoff; visibility drops for 24 h.
  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Mistral storm sediment destroys wall + wreck dive quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 30
  carrying_capacity_sensitivity: medium
  notes: |
    PN Arcipelago di La Maddalena enforces strict zone-based rules
    (Zone A around Cala Coticcio + Punta Coticcio) with landing +
    boat-mooring rotation. Coordination with the French Parc Marin
    des Bouches de Bonifacio (Corsican-side counterpart) on
    trans-boundary environmental protocols.

