description:
  en: |
    Parco Nazionale Arcipelago di La Maddalena (D.M. 04/01/1994)
    covers the granite-island archipelago between NE Sardegna and
    the Bocche di Bonifacio strait. Sites include the SS Washington
    tugboat wreck (sunk 1917 WWI, 45-55 m technical grade) and the
    coastal Punta Coticcio wall on Caprera island. Water 15-25°C.
    Boat access from La Maddalena or Palau.

