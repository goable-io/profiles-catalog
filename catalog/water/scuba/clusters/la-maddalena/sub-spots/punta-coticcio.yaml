tier_rationale:
  en: |
    Punta Coticcio is the SE headland of Caprera island — coastal
    wall + reef diving from 10 m to 30 m+ with clear Bocche di
    Bonifacio water and dense encrusting biocoenosis. Sheltered from
    Mistral on some approaches by island geometry. Standard
    intermediate wall dive with clear ascent-line profile. Adjacent
    Cala Coticcio beach is a Zone A landing-restricted zone.

