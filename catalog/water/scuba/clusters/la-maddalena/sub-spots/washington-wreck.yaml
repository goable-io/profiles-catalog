tier_rationale:
  en: |
    L'SS Washington is a British oceangoing tugboat sunk on 12 December
    1917 during WWI by a torpedo strike near the Bocche di Bonifacio.
    Wreck sits upright at 55-60 m depth — beyond recreational limits,
    in the technical-diving trimix range. Historically documented
    war grave under Italian + British archaeological jurisdiction;
    look-only, no artefact contact. Guide-led by default with strict
    decompression + gas planning. Cluster's technical reference.

