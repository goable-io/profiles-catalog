tier_rationale:
  en: |
    Il Great Blue Hole is a 318 m-diameter × 124 m-deep Pleistocene
    karst-collapse marine sinkhole at Lighthouse Reef atoll.
    Standard recreational dive descends to 40 m at the "stalactite
    shelf" — massive fossil karst formations from the pre-flooding
    period visible on the wall + overhang geometry. Below 40 m the
    hole becomes anoxic (no marine life below ~50 m). Advanced-
    open-water baseline; the dive itself is straightforward but
    depth exposure + Belize offshore-atoll logistics + hydrogen
    sulfide layer below make it technically demanding. Guide-lead
    by default. Cluster's flagship dive.

