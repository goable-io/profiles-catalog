gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: CARIBBEAN_HIGH_SEAS
    description: Wave height above 3.0 m in Caribbean coastal sites (usually cold-front or hurricane periphery) makes boat access and drift-dive drop-off unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: HURRICANE_PERIPHERY
    description: Sustained wind above 30 knots signals hurricane periphery or strong cold-front passage; all operations stand down and evacuation protocols may be triggered.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: POOR_SURFACE_VISIBILITY_CARIB
    description: Surface visibility below 500 m during squall passage or heavy tropical rain makes site-finding unsafe (surface navigation only).

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE
    description: Heavy tropical rainfall above 20 mm/h correlates with tropical storm systems; operations pause.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY_CARIB
    description: Elevated turbidity from runoff or hurricane sediment stir crashes underwater visibility below 5 m and destroys reef-dive quality.

  - metric: tidal_current_speed_kn
    condition: gt
    value: 3.0
    reason_code: STRONG_CURRENT_UNSAFE_CARIB
    description: Sustained tidal current above 3.0 knots on Caribbean drift walls (Cozumel Santa Rosa, Cayman North Wall) exceeds standard recreational drift-management — technical certifications recommended.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Belize Barrier Reef Reserve System (UNESCO World Heritage 1996)
    covers Lighthouse Reef and adjacent atolls. Blue Hole itself is
    a Belize National Monument (protected under Belize Fisheries
    Act). Liveaboard-only access enforces natural low visitor
    density.

