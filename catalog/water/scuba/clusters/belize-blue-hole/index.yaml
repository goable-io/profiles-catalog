  notes: |
    Spot overrides vs scuba-caribbean: matches regional baseline for
    the W-Caribbean atoll sector. 44-week season with 8-week
    hurricane peak (Aug-Oct).

    v0.2.0 realigned to v2.0.0 base structure: water_clarity is now the
    top signal (0.30 weight, replacing the old `visibility` top-weighted
    dimension); surface_visibility (surface fog/haze) demoted to 0.05;
    current dimension added (0.10) — offshore atoll drift is a real
    quality factor at Lighthouse Reef; turbidity_proxy gate scale
    corrected to the 0-1 index range. Dimensions/gates copied verbatim
    from scuba-caribbean v0.2.0.
