description:
  en: |
    The Great Blue Hole (Belize) is a 318 m-diameter, 124 m-deep
    submerged marine sinkhole at the centre of Lighthouse Reef atoll —
    a Pleistocene karst-collapse feature formed during periods of
    lower sea level, now submerged inside the world's second-largest
    barrier reef system (Belize Barrier Reef, UNESCO World Heritage
    1996). Cluster is a single-site cluster (the Blue Hole itself),
    with adjacent Half Moon Caye + Long Caye reefs typically dived
    on the same liveaboard rotation. Water 26-29°C year-round.
    Liveaboard-only access (65 km from Belize mainland).

