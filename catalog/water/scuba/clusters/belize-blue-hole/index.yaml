gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: CARIBBEAN_HIGH_SEAS
    description: Wave above 3.0 m at Lighthouse Reef makes 65 km mainland liveaboard transit and drop-off unsafe.
  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: HURRICANE_PERIPHERY
    description: Sustained wind above 30 knots signals hurricane periphery; Belize offshore atolls stand down + evacuate.
  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: POOR_VISIBILITY_CARIB
    description: Surface visibility below 500 m during tropical squall makes drop-off retrieval unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE
    description: Heavy tropical rain above 20 mm/h correlates with squall passage; operations pause.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Belize Barrier Reef Reserve System (UNESCO World Heritage 1996)
    covers Lighthouse Reef and adjacent atolls. Blue Hole itself is
    a Belize National Monument (protected under Belize Fisheries
    Act). Liveaboard-only access enforces natural low visitor
    density.

