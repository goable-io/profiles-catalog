tier_rationale:
  en: |
    Punta delle Grotte sits on the Noli coast between Capo Noli and
    Spotorno, a shallow (6-25 m) reef and boulder-slope well
    sheltered from Libeccio by the Capo Noli headland. Multiple small
    coastal caverns give the sub-spot its name; overheads are shallow
    (max 8-10 m depth inside) and short (single-buddy-team single-
    exit typical), making the site the cluster's beginner-to-
    intermediate open-water reference — the go-to shore-entry or
    short-boat-hop dive when Bergeggi outer sites are wind-shut.
    Encrusting sponges, moray, octopus on the reef.

