tier_rationale:
  en: |
    The Grotta Marina di Bergeggi is a partially submerged karst sea
    cave on the E-inner flank of Bergeggi island — surveyed by SSI
    speleologists at 100+ m of underwater passage development, entry
    at 4-8 m from the seaward opening, air-space chambers with
    stalactite / stalagmite formations from Quaternary lower sea-
    level periods. Cavern-diving grade with strict guide-led penetration
    under AMP permit conditions; deeper cave-diving beyond the second
    air chamber is reserved for certified cave divers with double-tank
    + guideline gear. Silt-out risk is high (fine karst sediment). Shallow
    outer entry keeps NDL long for the cavern segment.

