tier_rationale:
  en: |
    Punta Predani is the SW-facing exposed point of Bergeggi island,
    a wall + boulder-field descending from 12 m to 40 m+ with
    Paramuricea clavata + Eunicella cavolini gorgonian in the 25-35 m
    range and dense coralligenous encrustation. Site is exposed to
    Libeccio swell and current; on-current dives can reach 0.5-1.0 kn
    on the outer point, requiring drift-diving discipline. Standard
    intermediate wall dive for the cluster with straightforward buoyed
    descent line and clear anchor-line ascent on the sheltered side.

