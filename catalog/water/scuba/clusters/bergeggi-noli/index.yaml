  notes: |
    Spot overrides vs scuba-mediterranean: matches regional baseline
    for the Ponente sector. Cavern-cover overlay is captured at sub-
    spot level (Grotta Marina). Season 28 weeks with Nov-March closed
    for shore-entry and Libeccio storm windows. Bergeggi is materially
    more sheltered from Libeccio than adjacent Noli coast — E flank
    of the island stays workable when Noli cliffs shut.
