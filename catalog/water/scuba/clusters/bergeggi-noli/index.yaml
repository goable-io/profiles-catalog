gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m on the Riviera di Ponente (Libeccio events) shuts Bergeggi and Noli boat access; cavern penetration remains available on E-sheltered side up to 2.5 m.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze events makes navigation to Bergeggi + Punta Predani unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain in the Ligurian hinterland triggers Sciusa + Segno river runoff into Bergeggi coastal sites; visibility drops for 24-48 h.

  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Libeccio storm sediment stirring destroys wall + cavern dive quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: high
  notes: |
    AMP Isola di Bergeggi (D.M. 07/05/2007) enforces zone-based diving
    permits, daily visitor caps, and licensed-operator-only cavern
    penetration at the Grotta Marina. Coastal-cavern silt-out risk is
    the dominant operational-hazard concern — Grotta penetration is
    guide-led with strict buddy-team-size limits and depth caps
    inside the karst passage.

