description:
  en: |
    The AMP Isola di Bergeggi (Riviera di Ponente, Savona, D.M.
    07/05/2007) covers the offshore Bergeggi island plus adjacent
    coastal cliffs including the Grotta Marina di Bergeggi — a
    partially-submerged karst sea cave with 100+ m of underwater
    passage documented as one of the most extended cavern-dive systems
    on the Italian W coast. Cluster combines cavern penetration, wall
    diving with Paramuricea gorgonian at 25-35 m, and coralligenous
    biocoenosis. Sheltered on the E side of the island from prevailing
    Libeccio; the offshore Punta delle Grotte cliffs sit closer to
    the town of Noli and share the same regional exposure profile.
    Boat access from Spotorno, Noli, or Bergeggi harbours.

