tier_rationale:
  en: |
    Peleliu Wall sits off the southern tip of Peleliu island, site
    of the 1944 WW2 Battle of Peleliu, where the reef drops sheer
    into the Philippine Sea. The site sees pelagic passages of
    sharks and occasional oceanic manta, but is defined by strong,
    unpredictable current including occasional downwelling that
    can pull divers off the wall without warning. This exposure
    profile requires advanced drift-diving experience and places
    it at the cluster's top tier alongside Blue Corner.

