tier_rationale:
  en: |
    Blue Corner is Palau's iconic reef-hook drift-wall promontory
    where two current systems converge, producing sustained drift
    of 1-3 kn along a sheer wall dropping past 30 m. Divers clip a
    reef hook to bare rock at 15-20 m and hover in the current
    stream to watch grey reef sharks, bumphead parrotfish schools,
    napoleon wrasse, and passing pelagics. The convergence current
    and hook technique demand advanced buoyancy control and current
    management, placing it firmly at the top tier of the cluster.

