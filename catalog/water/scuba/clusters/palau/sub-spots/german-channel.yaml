tier_rationale:
  en: |
    German Channel is a man-made passage dredged through the reef
    by German phosphate miners in the early 1900s, now Palau's
    most reliable manta-cleaning-station dive. Early-morning tidal
    outflow draws reef mantas to a shallow sand-patch cleaning
    station at 10-15 m where wrasse remove parasites. The dive
    combines a moderate drift through the channel with a stationary
    cleaning-station observation, requiring intermediate current
    awareness but no reef-hook technique.

