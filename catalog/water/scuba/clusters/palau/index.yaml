description:
  en: |
    Palau (Republic of Palau, Micronesia) is the world's pelagic-
    encounter capital, anchored by the Palau National Marine
    Sanctuary (2020, 80% of the EEZ fully protected). Rock Islands
    Southern Lagoon is a UNESCO World Heritage Site (2012). Sites
    are reef-hook drift walls and channels facing the Philippine Sea
    with sustained current 1-3 kn, warm water (28-30°C) year-round,
    and routine 20-30 m+ visibility. Blue Corner, German Channel, and
    Peleliu Wall anchor the reef-hook / manta / WW2-wreck circuit.
    Boat access from Koror.

