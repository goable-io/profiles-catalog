gates:
  - metric: wave_height_m
    condition: gt
    value: 3.0
    reason_code: PACIFIC_HIGH_SEAS
    description: Wave height above 3.0 m on Palau's outer reef-hook and channel sites makes drift drop-off and reef-hook holds unsafe.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: TROPICAL_CYCLONE_PERIPHERY
    description: Sustained wind above 30 knots signals typhoon periphery; Palau boat operations stand down.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_PAC
    description: Surface visibility below 800 m during tropical squall makes site-finding on Palau's outer-reef channels unsafe.

  - metric: precipitation_mm_h
    condition: gt
    value: 20
    reason_code: TROPICAL_DELUGE_PAC
    description: Heavy tropical rain above 20 mm/h correlates with squall or typhoon-fringe systems and coastal-runoff visibility crashes.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Palau National Marine Sanctuary (effective 2020) fully protects
    80% of Palau's EEZ from extractive use; the Rock Islands Southern
    Lagoon UNESCO World Heritage Site (2012) enforces permit-based
    visitor caps at Blue Corner and German Channel. Palau pioneered
    the "Palau Pledge" mandatory eco-passport stamped on arrival
    (2017). Reef-hook use is standard practice to reduce diver
    contact damage on current-swept sites.

