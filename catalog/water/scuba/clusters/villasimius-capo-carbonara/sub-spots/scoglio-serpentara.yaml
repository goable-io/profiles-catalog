tier_rationale:
  en: |
    Lo Scoglio Serpentara is an offshore granite islet + reef E of
    Villasimius with wall + reef geometry descending from 8 m to
    30 m+ and clear Sardegna SE water. Circumnavigation delivers
    dense encrusting biocoenosis + resident dentex + moray. Standard
    intermediate wall + circumnavigation dive with clear ascent-line
    profile, boat access from Villasimius Porto in 15-20 min.

