description:
  en: |
    AMP Capo Carbonara (D.M. 15/09/1998, expanded 2012) protects the
    SE-Sardegna coast around Villasimius including the Serpentara +
    Cavoli islets. Wall + reef diving on offshore islets, Roman-era
    submerged amphorae in the Secca dei Berni area (protected
    Soprintendenza look-only). Water 15-26°C. Boat access from
    Villasimius Porto.

