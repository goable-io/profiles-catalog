tier_rationale:
  en: |
    La Formica di Panarea is an offshore reef E of Panarea with reef
    + wall geometry descending from 12 m to 35 m+ and Eunicella
    cavolini gorgonian fields. Sheltered from Sirocco by adjacent
    Panarea + Stromboli geometry on some approaches. Standard
    intermediate offshore reef dive with clear ascent-line profile,
    boat access from Panarea Porto in 15 min.

