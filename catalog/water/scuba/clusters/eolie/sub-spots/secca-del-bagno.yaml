tier_rationale:
  en: |
    La Secca del Bagno is a submerged pinnacle SW of Filicudi rising
    from a 50 m bottom to a top at 15-18 m. Dense Paramuricea +
    Corallium rubrum below 40 m, frequent pelagic passages of
    barracuda + amberjack + occasional tuna. Depth + open-sea exposure
    + Corallium proximity make advanced-open-water baseline. Boat
    transit from Filicudi in 20-30 min; weather-window-selected.
    Cluster's advanced offshore reference.

