tier_rationale:
  en: |
    Bottaro islet is a rocky outcropping E of Panarea with active
    submarine hydrothermal vents releasing CO2 bubble columns and
    creating locally-warm water zones on the sand-rock bottom at
    10-25 m depth. INGV-monitored geological feature: vent-field
    activity increased notably in 2002 with a documented gas-release
    event. Dive experience combines standard reef geometry with the
    geologically-distinct bubble-column and low-pH microhabitat.
    Shallow depth keeps NDL long; guided by default for hot-vent
    proximity briefing.

