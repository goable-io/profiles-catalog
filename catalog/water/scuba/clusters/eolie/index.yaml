display_name:
  en: Scuba Diving — Eolie (Filicudi + Panarea)
  it: Immersione — Isole Eolie
  es: Buceo — Islas Eolias
  fr: Plongée — Îles Éoliennes
  de: Tauchen — Äolische Inseln
description:
  en: |
    The Aeolian archipelago (Eolie, Sicilia, UNESCO World Heritage
    2000) is a volcanic seven-island chain N of Sicilia. Cluster
    focuses on the Filicudi + Panarea islands with wall + seamount
    diving (Secca del Bagno, Formica di Panarea) plus the geologically
    unique hot vent field at Bottaro islet — active submarine
    fumaroles releasing CO2 bubble columns and creating locally
    warmer water zones. Water 15-27°C. Boat access from Lipari (main
    hub) or direct from Milazzo mainland ferries.

