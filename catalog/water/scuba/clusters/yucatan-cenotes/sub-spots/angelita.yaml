tier_rationale:
  en: |
    Il Cenote Angelita is a 60 m-deep sinkhole S of Tulum with a
    famous 30 m halocline layer — a dense hydrogen-sulfide-rich
    saltwater "cloud" separating freshwater above from saltwater
    below. Descent through the cloud is a visual +
    disorientation event: the diver passes through 1-2 m of near-
    zero-visibility haze before emerging into cold clear saltwater
    below. Advanced-open-water rating baseline; nitrox recommended.
    Guide-lead by default. Cluster's advanced signature dive.

