tier_rationale:
  en: |
    Il Cenote Dos Ojos ("Two Eyes") is one of the most-dived cenote
    systems in Quintana Roo — two adjacent circular pools connected
    by an underwater passage. Cavern-diving grade with well-defined
    daylight-zone routes: "The Barbie Line" (400 m circuit) and
    "The Bat Cave Line" (200 m to an air-space chamber with fossil-
    stalactites). Depth kept in 5-12 m recreational range on the
    cavern route. Guide-lead by default; cavern certification
    required per NSS-CDS standards. Cluster's beginner-friendly
    cenote reference.

