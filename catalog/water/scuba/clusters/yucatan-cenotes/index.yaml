slug: scuba-spot-yucatan-cenotes
spot_kind: cluster
version: "0.2.0"
category: water
extends: scuba-caribbean
region: caribbean
country_code: MX
sub_spots:
  - scuba-spot-yucatan-cenotes-dos-ojos
  - scuba-spot-yucatan-cenotes-angelita
display_name:
  en: Scuba Diving — Yucatán Cenotes
  it: Immersione — Cenotes dello Yucatán
  es: Buceo — Cenotes del Yucatán
  fr: Plongée — Cénotes du Yucatán
  de: Tauchen — Yucatán-Cenoten
description:
  en: |
    The Yucatán Peninsula karst-aquifer network hosts hundreds of
    submerged cenote (sinkhole) systems including the world's largest
    known underwater cave systems — Sistema Sac Actun (365+ km surveyed
    2018) and Sistema Ox Bel Ha (270+ km). Cluster focuses on the two
    most accessible cenote-diving reference sites: Cenote Dos Ojos
    (cavern-diving grade, easy access from Tulum) and Cenote Angelita
    (advanced open-water for the 30 m halocline cloud, freshwater over
    saltwater). Freshwater regime; distinct sub-regime from Caribbean
    reef diving in the same country.

