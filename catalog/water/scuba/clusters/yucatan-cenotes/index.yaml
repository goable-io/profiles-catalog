gates:
  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: HURRICANE_PERIPHERY
    description: Sustained wind above 30 knots signals hurricane periphery on the Yucatán peninsula; cenote road access + operations may be shut.

  - metric: precipitation_mm_h
    condition: gt
    value: 25
    reason_code: TROPICAL_DELUGE_KARST
    description: Heavy rain above 25 mm/h triggers surface runoff into the cenote system with visibility crash within hours — closes cenote-diving operations.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY_CENOTE
    description: Elevated turbidity from surface runoff or halocline disturbance crashes cenote underwater clarity below safe cavern/cave-diving visibility.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 48
  carrying_capacity_sensitivity: high
  notes: |
    Cenote diving operates on private-property or protected-aquifer
    access — Sistema Sac Actun + Sistema Ox Bel Ha are of world-
    scientific importance under NSS-CDS (National Speleological Society
    Cave-Diving Section) coordination with local ejidos + INAH (Mexican
    archaeology authority). Aquifer-contamination concerns from surface
    runoff (agrochemicals, sewage, tourism density) are documented and
    increasing. Cavern + full-cave certification required per depth zone.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "NSS-CDS (National Speleological Society Cave-Diving Section) Yucatán karst standards"
    - "Sistema Sac Actun 2018 survey (365+ km documented)"
    - "INAH Yucatán aquifer archaeology protection protocols"
    - "PADI Cavern + TDI Cave courses Yucatán operator SOP"
  notes: |
    Spot overrides vs scuba-caribbean: visibility weight raised to
    0.35 (cenote clarity is the primary quality dimension);
    water_clarity raised to 0.15; wave dimension down-weighted to
    0.08 (freshwater sinkhole = no surface wave); year-round 48-week
    season (no hurricane season closure for road-accessible cenotes
    outside of periphery). Freshwater sub-regime.

    v0.2.0 realigned to v2.0.0 base structure, with cenote-specific
    deviations preserved deliberately: the old `visibility` dimension
    (weight 0.35) is renamed `surface_visibility` and demoted to 0.05
    (it measures surface fog/haze at the cenote mouth, not underwater
    clarity — the v0.1.0 weighting conflated the two). `water_clarity`
    is promoted to the top signal at 0.40 (higher than the 0.30 used
    in reef-diving region variants) because cenote visibility swings
    dramatically with halocline disturbance and recent-rain turbidity,
    making it an even more dominant quality factor here than on open
    reef. A `current` dimension is added at a deliberately minimal
    0.05 weight with the region-variant curve, reflecting that cenotes
    are enclosed freshwater sinkholes with near-zero ambient current —
    present for schema consistency, not because it discriminates
    quality at these sites. `wave` (0.08) and the freshwater-tuned
    `water_temp` curve (24-28°C sweet spot vs 27°C reef) are unchanged
    cenote-specific overrides. A `turbidity_proxy` gate (>0.7 on the
    0-1 index) is added, replacing the ambiguous 25 mm/h precipitation
    proxy as the underwater-visibility gate; the precipitation gate
    is retained separately as the surface-runoff/access trigger.
    Weights sum to 1.000.
