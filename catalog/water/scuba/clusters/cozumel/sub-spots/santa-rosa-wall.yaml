tier_rationale:
  en: |
    Santa Rosa Wall is a dramatic vertical drop-off on the SW-Cozumel
    reef line, plunging from 15 m to 1000 m+ into the Yucatán
    Channel. Drift-dive format with N-S current 1-2 kn typical.
    Overhangs, swim-throughs, and pelagic passages of turtle +
    grouper + occasional reef shark. Advanced-open-water baseline
    given drift + drop-off geometry. Cluster's reference deep drift-
    wall dive.

