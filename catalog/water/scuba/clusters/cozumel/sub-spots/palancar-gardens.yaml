tier_rationale:
  en: |
    Palancar Gardens is the shallow-reef section of the Palancar reef
    system on the SW Cozumel coast — coral-head pinnacles and
    swim-through channels in the 12-25 m range. Standard drift-dive
    format with boat drop-off + retrieval at the reef terminus.
    Current 0.5-1.5 kn typical. Intermediate drift-dive experience;
    guide-lead by default. Cluster's beginner-to-intermediate reef
    reference.

