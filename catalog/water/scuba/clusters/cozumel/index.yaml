description:
  en: |
    Isla Cozumel (Yucatán, Mexico) is one of the world's top drift-
    diving destinations — Cozumel Marine Park (Parque Nacional
    Arrecifes de Cozumel, D.O.F. 04/07/1996) protects the SW-facing
    reef system. Warm water year-round (25-29°C), exceptional
    visibility (30-40 m routine), consistent N-S current 0.5-2 kn on
    the outer reef. Sites include Palancar Gardens (shallow reef +
    coral heads) and Santa Rosa Wall (dramatic vertical drop-off).
    Boat access from San Miguel Cozumel harbours.

