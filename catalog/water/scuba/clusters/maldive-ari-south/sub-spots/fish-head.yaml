tier_rationale:
  en: |
    Il Fish Head (Fesdu Kandu thila) is a submerged pinnacle in the
    Fesdu Kandu channel on Ari South atoll's E rim — top at 12 m,
    drop-off to 40 m+ with sustained channel-driven current 1-2 kn
    typical. Famous for concentrated grey reef shark (Carcharhinus
    amblyrhynchos) and dogtooth tuna action on the upcurrent side.
    Advanced-open-water baseline given drift-in-channel geometry.
    Guide-lead by default. Cluster's shark-encounter reference.

