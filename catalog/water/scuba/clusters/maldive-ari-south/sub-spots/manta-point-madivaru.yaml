tier_rationale:
  en: |
    Il Manta Point (Madivaru cleaning station) on Ari South is one
    of the most reliable Mobula alfredi (reef manta) cleaning-station
    encounter sites in the Indian Ocean — mantas visit for cleaning
    by wrasse populations on the reef pinnacle at 8-15 m depth.
    Peak encounter windows track SW-monsoon plankton concentration
    (May-Nov). Depth kept shallow for extended NDL manta observation.
    Guide-lead + no-touch + fixed-distance protocols enforced by
    Manta Trust code of conduct. Cluster's manta-encounter reference.

