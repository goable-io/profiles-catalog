description:
  en: |
    Il South Ari (Alifu Dhaalu) atoll is the Maldives' reference manta
    + whale-shark encounter zone — SW monsoon (May-Oct) drives
    plankton concentration into E-side channels where manta cleaning
    stations aggregate and whale sharks feed. Cluster covers the Manta
    Point (Madivaru cleaning station, one of the most reliable manta
    encounters in the Indian Ocean) plus the Fish Head thila (Fesdu
    Kandu) — a submerged pinnacle world-famous for grey reef shark
    action. Water 27-30°C year-round. Liveaboard-dominant format.

