  notes: |
    Spot overrides vs scuba-mediterranean: matches regional baseline
    (Portofino is a canonical W-Mediterranean site). Season 28 weeks
    (April-October core, with Nov-March mostly closed by shore-entry
    storm windows and lower water_temp). Once L1f's rockfall_risk_index
    ships, the San Fruttuoso overhang exit zone gains a physical proxy
    for post-rain runoff hazard on shore-approaches.
