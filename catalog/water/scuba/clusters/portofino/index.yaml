gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave height above 2.3 m at Portofino (Libeccio events) makes boat mooring at Punta Chiappa and San Fruttuoso unsafe.

  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Sirocco haze events makes site-finding unsafe on the Portofino promontory.

  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy active rain triggers runoff from the Portofino hinterland into San Fruttuoso and Camogli sites; drops underwater visibility from 15-20 m to 3-5 m for 24-48 h.

  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Libeccio storm sediment stirring destroys wall-diving quality at Colombara and Punta del Faro.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: high
  notes: |
    AMP Portofino (D.M. 26/04/1999) enforces zone-based daily diver
    caps at Cristo degli Abissi, Punta Chiappa, and Colombara. Boat
    mooring is permit-only and rotated among licensed dive operators.
    Paramuricea clavata gorgonian mortality events (2003, 2018, 2022
    marine heatwave summers) are documented; site managers restrict
    diver contact and enforce trim training. Boat transport from
    Camogli, Portofino harbour, or Rapallo dominates per-session
    footprint.

