description:
  en: |
    The Portofino AMP promontory (Riviera di Levante, Genova) is the
    reference Ligurian diving cluster. Sheltered on the east flank
    from the prevailing SW Libeccio, exposed on the west (Camogli,
    San Fruttuoso) to the same wind on longer fetch. Walls, gorgonian
    fields (Paramuricea clavata endemic red gorgonian), coralligenous
    biocoenosis, and the iconic Cristo degli Abissi bronze statue
    submerged at 15 m off San Fruttuoso since 1954. Water 14-24°C
    seasonal. Site is intensely managed — AMP daily visitor caps and
    permit-required boat mooring at Punta Chiappa. Winter closures
    for storm windows.

