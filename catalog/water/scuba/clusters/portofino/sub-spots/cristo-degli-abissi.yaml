tier_rationale:
  en: |
    The Cristo degli Abissi bronze statue submerged at 15 m in the
    San Fruttuoso bay since 22 August 1954 — a memorial to Dario
    Gonzatti (first Italian scuba diver, died 1947) and to all divers.
    The site is one of the shallowest and best-known dive locations
    in Italy. Bay is well-sheltered from prevailing Libeccio, sand +
    posidonia bottom, easy anchor-line descent for training and
    tourist dives. Depth 15-18 m keeps NDL long. AMP-managed daily
    visitor cap and permit-required boat mooring; boat traffic is the
    main hazard on surface at the buoyed entry line.

