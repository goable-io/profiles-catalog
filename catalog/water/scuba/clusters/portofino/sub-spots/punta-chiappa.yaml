tier_rationale:
  en: |
    Punta Chiappa is the exposed W-facing point of the Portofino
    promontory, delivering multi-tier wall diving from 6 m to 40 m+
    with Paramuricea clavata red gorgonian fields concentrated at
    25-35 m. Sustained current on Libeccio + Mistral days makes drift
    diving standard practice; buoyed mooring lines are AMP-managed.
    The classic Portofino wall route: descent along the point,
    circumnavigate the gorgonian face at 30 m, return via 18-15 m
    safety-stop shelf. Site is exposed to Libeccio swell decay in the
    24-48 h following storms; wall face is best-scored in flat
    post-storm calm.

