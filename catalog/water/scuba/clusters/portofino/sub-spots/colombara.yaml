tier_rationale:
  en: |
    Colombara ("dove-cote wall") is the Portofino promontory's most
    committing recreational dive: a vertical + overhanging wall
    plunging from 20 m to 55 m+ with dense Paramuricea clavata and
    yellow gorgonian (Eunicella cavolini) fields and endemic red
    coral (Corallium rubrum) at 40 m+. Depth + current + wall
    orientation make advanced open-water + deep-diver rating baseline;
    technical divers extend past 55 m. Site is dive-shop-guided by
    default in the AMP; independent operations require documented
    prior familiarity briefing.

