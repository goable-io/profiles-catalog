tier_rationale:
  en: |
    Punta del Faro (Portofino lighthouse tip) is the SE-facing
    exposed extreme of the promontory. Wall + boulder-field with
    dense Paramuricea + Eunicella cavolini gorgonian on the 18-40 m
    range, plus a shallow reef plateau ideal for extended-NDL dives.
    Site is exposed to E-facing swell from Sirocco and to sustained
    current on Libeccio release — dive shops shuffle to sheltered
    Cristo / Cala degli Inglesi in strong SE flow. When conditions
    are favourable, this is the reference "Portofino wall" experience
    without Colombara's depth commitment.

