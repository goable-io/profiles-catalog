gates:
  - metric: wind_speed_kn
    condition: gt
    value: 24
    reason_code: BORA_ROTOR
    description: NE Bora above 24 knots on the Conero coast shuts boat access from Portonovo + Numana.
  - metric: wave_height_m
    condition: gt
    value: 2.2
    reason_code: ADRIATIC_HIGH_SEAS
    description: Wave above 2.2 m makes Trave del Passetto + coastal cavern approach unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_ADRIATIC
    description: Surface visibility below 800 m during Sirocco haze makes site-finding unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN_PO_PLUME
    description: Heavy rain triggers Po + eastern Adriatic river plume; visibility drops materially for 24-72 h.
  - metric: turbidity_proxy
    condition: gt
    value: 22
    reason_code: HIGH_TURBIDITY_BLOOM
    description: Spring/summer plankton bloom (April-June) destroys diving quality on central Adriatic sites.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: low
  notes: |
    Parco Naturale del Conero enforces coastal-protection zoning
    around Portonovo + adjacent Grotta degli Schiavi cavern. Adriatic
    plankton bloom + Po river plume are the dominant quality
    constraints. Boat access limited by seasonal harbour operations.

