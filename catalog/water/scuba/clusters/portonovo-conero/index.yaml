description:
  en: |
    Il Parco Naturale del Conero (Ancona, Marche) marine boundary
    delivers the reference central-Adriatic Italian coastal diving.
    Coastal walls, caverns (Grotta degli Schiavi), and the offshore
    Trave del Passetto rock slab off Ancona. Water 14-24°C. Boat
    access from Portonovo or Numana harbours. Cluster sits on the
    S-Adriatic-mid-shelf zone with distinct bora + sirocco wind
    regime and higher river-plume vulnerability than the western
    Mediterranean.

