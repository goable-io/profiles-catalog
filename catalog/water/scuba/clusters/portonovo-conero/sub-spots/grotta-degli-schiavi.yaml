tier_rationale:
  en: |
    La Grotta degli Schiavi is a coastal sea cave S of Portonovo on
    the Conero cliff coast, entry at 6-12 m opening into a chamber
    accessible by cavern-diving-grade penetration. Short single-exit
    route with typical Conero-limestone geology. Site is exposed to
    Sirocco on outer approaches and vulnerable to Adriatic bloom-
    period visibility crash. Guide-led by default.

