tier_rationale:
  en: |
    Il Trave del Passetto is an offshore rock slab off Ancona's
    Passetto beach — reef + wall geometry from 8 m to 25 m+ with
    encrusting biocoenosis and Adriatic-typical benthic community
    (lower biodiversity than western Mediterranean but distinct
    species mix). Boat access from Ancona harbour in 10 min.
    Adriatic-typical: bora rotor + bloom + Po plume are the dominant
    quality-swing variables.

