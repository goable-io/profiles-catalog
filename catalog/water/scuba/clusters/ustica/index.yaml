description:
  en: |
    AMP Isola di Ustica (D.M. 12/11/1986) is the first marine
    protected area established in Italy — a volcanic island 67 km N
    of Palermo with year-round dive-tourism operations. Deep walls
    with dense Paramuricea + Corallium rubrum, coralligenous
    biocoenosis, and the iconic Scoglio del Medico offshore pinnacle.
    Water 15-26°C. Boat access from Ustica Porto (ferry from Palermo).

