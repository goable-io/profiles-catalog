tier_rationale:
  en: |
    La Grotta dei Gamberi is a submerged cavern on Ustica's NW flank,
    entry at 40 m dropping into a chamber famous for dense colonies of
    Plesionika narval red shrimps (the "gamberi" of the name). Cavern-
    diving grade at depth — the combination of overhead environment
    and 40 m entry depth demands advanced-open-water baseline. Site
    is guide-led by default; buoyed descent line to entry, short
    single-exit chamber illumination, retreat via same route with strict
    gas planning.

