tier_rationale:
  en: |
    Lo Scoglio del Medico is an emergent volcanic rock 500 m off
    Ustica's W coast — circumnavigation delivers wall + boulder-field
    geometry with dense Paramuricea + Eunicella cavolini gorgonian at
    20-35 m plus a resident dentex + barracuda-school signature.
    Boat mooring on AMP-managed buoyed line on the sheltered side.
    Standard intermediate wall + circumnavigation dive, the cluster's
    all-round reference site.

