tier_rationale:
  en: |
    La Secca della Colombara is Ustica's most-known offshore pinnacle
    NNE of the island — top at 12-15 m, drop-off to 55 m+ with dense
    Paramuricea + Corallium rubrum below 40 m and frequent pelagic
    passages (barracuda school + occasional tuna and grouper). Depth
    + open-sea exposure + Corallium rubrum-proximity depth range make
    advanced-open-water + deep-diver rating baseline; the cluster's
    reference deep pinnacle dive.

