tier_rationale:
  en: |
    Punta Coda Cavallo is the mainland promontory S of Tavolara with
    coastal wall + reef diving from 10 m to 30 m+, dense encrusting
    biocoenosis and clear water. Sheltered from Mistral by island +
    coastal geometry. Standard intermediate coastal reef dive with
    boat access from Porto San Paolo in 10 min. Common training +
    warm-up site for the Papa 2 / Secca del Papa deeper afternoon
    dive.

