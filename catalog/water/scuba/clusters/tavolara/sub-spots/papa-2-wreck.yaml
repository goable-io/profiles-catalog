tier_rationale:
  en: |
    Il Papa 2 (originally a WW2-era US minesweeper transferred to
    Marina Militare Italiana) sank 26 May 1961 during a naval training
    exercise off Tavolara. Wreck sits upright on a sand-rock bottom at
    30 m depth — clean recreational-wreck geometry with intact hull +
    superstructure outline + engine-room + cargo-hold penetration
    mapped for open-water divers with wreck training. Site is guide-
    led by default; boat access from Porto San Paolo in 15 min.

