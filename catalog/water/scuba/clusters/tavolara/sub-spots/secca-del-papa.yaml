tier_rationale:
  en: |
    La Secca del Papa is an offshore pinnacle N of Tavolara rising
    from a 50 m sand bottom to a top at 18-22 m. Dense Paramuricea +
    Corallium rubrum below 35 m and frequent pelagic passages
    (barracuda school + amberjack). Advanced-open-water baseline
    given depth + Corallium proximity + open-sea exposure. Cluster's
    reference deep pinnacle dive.

