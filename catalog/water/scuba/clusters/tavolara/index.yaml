description:
  en: |
    AMP Tavolara — Punta Coda Cavallo (D.M. 12/12/1997, expanded 2003)
    covers the NE-Sardegna Tavolara island + Isola Molara + coastal
    promontories. The site combines the shallow Papa 2 minesweeper
    wreck (sunk 1961 at 30 m during naval exercise), the offshore
    Secca del Papa pinnacle with gorgonian + red coral, and the
    coastal Punta Coda Cavallo wall. Water 15-26°C. Boat access from
    Olbia or Porto San Paolo.

