gates:
  - metric: wave_height_m
    condition: gt
    value: 2.3
    reason_code: MED_HIGH_SEAS
    description: Wave above 2.3 m makes offshore Secca del Papa boat mooring unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_MED
    description: Surface visibility below 800 m during Mistral haze makes navigation unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 12
    reason_code: HEAVY_RAIN_RUNOFF
    description: Heavy rain triggers Olbia gulf runoff; visibility drops for 24 h.
  - metric: turbidity_proxy
    condition: gt
    value: 25
    reason_code: HIGH_TURBIDITY_POSTSTORM
    description: Elevated turbidity from Mistral storm sediment destroys wall + wreck dive quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 30
  carrying_capacity_sensitivity: medium
  notes: |
    AMP Tavolara — Punta Coda Cavallo enforces zone-based diving
    permits + daily caps. Papa 2 wreck is a designated historical
    monument (naval exercise loss 1961, look-only, no penetration
    beyond documented safe route). Tavolara island itself is a
    Zone A + B mix with strict landing rules.

