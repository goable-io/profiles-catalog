tier_rationale:
  en: |
    Vervece is a submerged pinnacle off the Marina del Cantone coast
    with the "Madonnina di Vervece" bronze statue at 12 m — a Sorrentine
    memorial + iconic dive site. Pinnacle top at 8 m, drop-off to 40 m+
    on the outer face with Paramuricea gorgonian fields at 25-35 m.
    Boat mooring at AMP-managed buoyed line. Standard intermediate
    pinnacle + statue-visit dive with clear ascent-line profile.

