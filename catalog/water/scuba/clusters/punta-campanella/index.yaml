description:
  en: |
    AMP Punta Campanella (D.M. 12/12/1997) protects the Sorrentine
    peninsula between Positano and Punta Campanella tip, including
    offshore islets (Vervece, Vetara, Isca) and the coastal walls
    between Massa Lubrense and Marina del Cantone. Rich Paramuricea
    + Eunicella cavolini gorgonian fields and coralligenous
    biocoenosis; Vervece hosts the "Madonnina di Vervece" bronze
    statue at 12 m (memorial + iconic Sorrentine dive). Boat access
    from Marina del Cantone, Massa Lubrense, or Sorrento.

