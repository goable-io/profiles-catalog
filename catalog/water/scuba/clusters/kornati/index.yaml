gates:
  - metric: wind_speed_kn
    condition: gt
    value: 24
    reason_code: BORA_ROTOR
    description: NE Bora above 24 knots shuts Kornati island transit within 2-4 hours of onset.
  - metric: wave_height_m
    condition: gt
    value: 2.2
    reason_code: ADRIATIC_HIGH_SEAS
    description: Wave above 2.2 m makes Murter-Kornati crossing and inter-island transit unsafe.
  - metric: visibility_km
    condition: lt
    value: 0.8
    reason_code: POOR_VISIBILITY_ADRIATIC
    description: Surface visibility below 800 m during Sirocco haze makes navigation unsafe.
  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN_PO_PLUME
    description: Heavy rain triggers Adriatic plume + Krka river runoff; visibility drops for 24-72 h.
  - metric: turbidity_proxy
    condition: gt
    value: 22
    reason_code: HIGH_TURBIDITY_BLOOM
    description: Spring/summer plankton bloom destroys diving quality.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 22
  carrying_capacity_sensitivity: high
  notes: |
    Kornati National Park enforces daily-cap diving permits + zone
    rules. Peak-season carrying capacity is high at Piškera + Mana
    with liveaboard operators from Murter dominating operator
    logistics. Bora + bloom coordination is standard practice.

