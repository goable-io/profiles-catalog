  notes: |
    Spot overrides vs scuba-adriatic: matches regional baseline for
    the mid-Adriatic Croatian sector. 22-week season.

    v0.2.0 — realigned to v2.0.0 scuba-adriatic structure: dimensions and
    gates replaced verbatim with the regional variant. water_clarity is
    now the top-weighted signal (0.28), surface_visibility demoted to a
    minor gate-support role (0.04), and a current dimension (0.08,
    tidal_current_speed_kn) was added for tidal-channel sensitivity.
    The turbidity_proxy gate value is corrected from the wrong-scale
    22 to 0.7 on the 0-1 scale matching the consumer engine output.
