description:
  en: |
    Parco Nazionale Kornati (Croatia, Zakon o zaštiti prirode 1980)
    covers 89 islands + islets across the middle Adriatic karst-
    limestone archipelago. Walls, coastal drop-offs, and offshore
    shallow reefs. Water 12-25°C. Boat access from Murter (mainland
    gateway) or Šibenik. Site is subject to strong Bora rotor +
    plankton bloom seasonality; peak diving May-October.

