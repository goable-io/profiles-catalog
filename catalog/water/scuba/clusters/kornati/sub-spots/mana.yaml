tier_rationale:
  en: |
    Mana is the outer-Kornati W-facing island with the "crown of
    Kornati" outer cliff wall dropping vertically from 8 m to 60 m+
    on the open-Adriatic-fetch side. Deep wall with dense encrusting
    biocoenosis and pelagic passage of amberjack + occasional dentex.
    Depth + open-sea exposure + Bora vulnerability make advanced-
    open-water baseline. Cluster's advanced-grade wall dive.

