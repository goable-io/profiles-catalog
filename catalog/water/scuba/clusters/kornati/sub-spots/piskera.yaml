tier_rationale:
  en: |
    Piškera is a central-Kornati island cluster with outer W-face wall
    diving descending from 12 m to 40 m+, dense encrusting biocoenosis
    and typical Adriatic karst-limestone geology. Exposed to Bora on
    NE approaches. Standard intermediate wall dive with boat access
    from Murter in 1-1.5 hours transit; liveaboard-day-trip staple.

