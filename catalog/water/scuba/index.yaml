slug: scuba
spot_kind: base
version: "2.0.0"
category: water
display_name:
  en: Scuba Diving
  it: Immersione subacquea
  es: Buceo
  fr: Plongée sous-marine
  de: Tauchen
description:
  en: |
    Scuba diving quality is primarily driven by underwater clarity (what
    the diver actually sees at depth) and current, not by surface-level
    visibility of the sky. Wave height affects safe entry and exit;
    water temperature determines wetsuit thickness and thermal safety.
    Turbidity spikes from rain-driven runoff or post-storm sediment
    stir-up briefly destroy dive quality even when the sky is clear.
    Current above the recreational threshold makes drift management and
    ascent-line hold unsafe. Wind and atmospheric visibility remain
    relevant to surface navigation to and from the site but are minor
    quality signals for the dive itself.

# ─── DIMENSION SEMANTICS ────────────────────────────────────────────────
#   Earlier versions gave the top weight to `visibility` on metric
#   `visibility_km` — but that metric is atmospheric/sky visibility
#   above the water, NOT what a diver experiences underwater. Diver
#   feedback from Diano Marina (Liguria di Ponente) highlighted the
#   mismatch.
#
#   The top signal is now `water_clarity` on metric
#   `water_clarity_index` (derived from Kd490, turbidity, algal-bloom
#   and depth). `surface_visibility` remains as a minor factor for boat
#   navigation and surface signalling but is weighted only 0.05
#   (down from 0.30).
#
#   A `current` dimension on `tidal_current_speed_kn` and two gates
#   (`turbidity_proxy` for underwater-visibility crashes and
#   `tidal_current_speed_kn` for drift-management safety) complete the
#   diver-relevant physics.
#
#   Weights, curves and gate thresholds here are provisional pending
#   validation by a certified diver reviewer. The structural shape is
#   what changed; the numeric calibration is still to be finalised.
# ────────────────────────────────────────────────────────────────────────

dimensions:
  - name: water_clarity
    metric: water_clarity_index
    weight: 0.25
    curve:
      - { x: 0.0, s: 0.05 }
      - { x: 0.2, s: 0.20 }
      - { x: 0.4, s: 0.55 }
      - { x: 0.6, s: 0.85 }
      - { x: 0.8, s: 0.95 }
      - { x: 1.0, s: 1.00 }

  - name: wave
    metric: wave_height_m
    weight: 0.22
    curve:
      - { x: 0.0, s: 1.00 }
      - { x: 0.3, s: 1.00 }
      - { x: 0.8, s: 0.80 }
      - { x: 1.5, s: 0.40 }
      - { x: 2.5, s: 0.10 }
      - { x: 3.0, s: 0.00 }

  - name: water_temp
    metric: water_temperature_c
    weight: 0.18
    curve:
      - { x: 0, s: 0.00 }
      - { x: 8, s: 0.30 }
      - { x: 15, s: 0.70 }
      - { x: 22, s: 1.00 }
      - { x: 30, s: 0.90 }

  - name: current
    metric: tidal_current_speed_kn
    weight: 0.10
    curve:
      - { x: 0.0, s: 1.00 }
      - { x: 0.3, s: 1.00 }
      - { x: 0.7, s: 0.85 }
      - { x: 1.2, s: 0.60 }
      - { x: 1.8, s: 0.30 }
      - { x: 2.5, s: 0.05 }

  - name: wind_speed
    metric: wind_speed_kn
    weight: 0.08
    curve:
      - { x: 0, s: 1.00 }
      - { x: 8, s: 1.00 }
      - { x: 15, s: 0.70 }
      - { x: 20, s: 0.40 }
      - { x: 25, s: 0.10 }
      - { x: 30, s: 0.00 }

  - name: air_temp_comfort
    metric: apparent_temp_c
    weight: 0.07
    curve:
      - { x: -5, s: 0.00 }
      - { x: 5, s: 0.30 }
      - { x: 15, s: 0.80 }
      - { x: 25, s: 1.00 }
      - { x: 38, s: 0.70 }

  - name: surface_visibility
    metric: visibility_km
    weight: 0.05
    curve:
      - { x: 0.0, s: 0.00 }
      - { x: 0.5, s: 0.20 }
      - { x: 1.0, s: 0.55 }
      - { x: 3.0, s: 0.85 }
      - { x: 5.0, s: 1.00 }

  - name: sun
    metric: sun_altitude_deg
    weight: 0.05
    curve:
      - { x: 0, s: 0.00 }
      - { x: 10, s: 0.60 }
      - { x: 30, s: 1.00 }

gates:
  - metric: wave_height_m
    condition: gt
    value: 2.5
    reason_code: HIGH_SEAS
    description: Wave height above 2.5m makes safe entry and exit from the water dangerous.

  - metric: visibility_km
    condition: lt
    value: 0.5
    reason_code: POOR_SURFACE_VISIBILITY
    description: Surface visibility below 500m is unsafe for surface navigation to dive sites and for VHF-line-of-sight boat-to-shore signalling.

  - metric: precipitation_mm_h
    condition: gt
    value: 15
    reason_code: HEAVY_RAIN
    description: Heavy rain reduces surface visibility and indicates storm conditions.

  - metric: turbidity_proxy
    condition: gt
    value: 0.7
    reason_code: POOR_UNDERWATER_VISIBILITY
    description: Elevated turbidity (rainfall-runoff proxy) crashes underwater visibility to sub-2m — dive quality destroyed and navigation-with-buddy compromised.

  - metric: tidal_current_speed_kn
    condition: gt
    value: 2.5
    reason_code: STRONG_CURRENT_UNSAFE
    description: Sustained current above 2.5 knots exceeds recreational-diver drift-management capacity; ascent-line hold and buddy separation become material risks.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 32
  carrying_capacity_sensitivity: low
  notes: |
    Human-powered activity with zero direct emissions per session (excluding
    boat transport to site). Equipment footprint is high (BCD, tank, regulator,
    wetsuit, fins, mask) but amortised over 10-15 years. Dive sites are fragile
    ecosystems — carrying capacity sensitivity is low per session but cumulative
    stress from high visitor volume is a documented concern (coral bleaching,
    sediment disturbance).

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "PADI Open Water Diver Manual (in-water visibility + current guidance) — TODO diver review"
    - "CMAS + SSI recreational-diving safety thresholds (current, thermal) — TODO diver review"
    - "Rouabah et al. 2022, coastal diving site assessment, Mediterranean"
  notes: |
    The profile scores dive quality primarily on underwater clarity
    (`water_clarity`, the top-weight signal — what the diver actually
    sees at depth, driven by turbidity, algal bloom and depth context),
    wave height for safe entry/exit, and water temperature for thermal
    safety. A `current` dimension penalises strong tidal current, since
    drift management becomes unsafe past ~1.5 kn for recreational
    divers. `surface_visibility` (atmospheric sky visibility) is a minor
    signal, relevant only to surface navigation and signalling. Two
    safety gates back this up: `turbidity_proxy > 0.7`
    (POOR_UNDERWATER_VISIBILITY) and `tidal_current_speed_kn > 2.5`
    (STRONG_CURRENT_UNSAFE).

    Current limitations (not final calibration):
    - `turbidity_proxy` is currently derived from recent (72h) rainfall
      rather than ocean-colour data. It is a legitimate but weak signal;
      a fuller implementation would use satellite ocean-colour
      measurements (Kd490 and suspended particulate matter).
    - `tidal_current_speed_kn` currently reflects tidal current only,
      not wind-driven surface currents.
    - All curves, weights and gate thresholds are provisional pending
      certified-diver validation. They preserve monotonic sensibility;
      the numeric values will move.
    - The same structure is applied across the scuba region variants and
      clusters so scoring at real coordinates (e.g. Diano Marina
      43.9085/8.0825) reflects it consistently.
