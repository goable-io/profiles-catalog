tier_rationale:
  en: |
    Mnemba Atoll's lagoon is shallow, sheltered by the surrounding reef, and reached by a short calm boat ride from Matemwe on Zanzibar's mainland coast, with turtles and reef fish visible close to the surface in low-current conditions. It is a standard first-timer and honeymoon-resort snorkel excursion requiring no special skill or equipment beyond mask and fins. The calm, shallow, guide-light nature of the site places it at tier 1.

