tier_rationale:
  en: |
    Kizimkazi's dolphin snorkel involves boat-tracked open-water swims in
    pursuit of wild, fast-moving bottlenose and humpback dolphins rather
    than a fixed reef. Demanding stronger swim fitness and quick in-water
    positioning under guide direction and strict distance protocols
    designed to limit disturbance to the animals. The open-water, moving-
    target nature of the encounter and the larger operating radius needed
    to track dolphin pods place this above a shallow fixed-reef lagoon, at
    tier 2.

