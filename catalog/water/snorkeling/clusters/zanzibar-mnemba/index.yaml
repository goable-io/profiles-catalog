description:
  en: |
    Mnemba Atoll, a small privately-managed island off Zanzibar's NE coast surrounded by a protected conservation area, offers calm shallow-lagoon snorkeling with green and hawksbill turtles and dense tropical-reef fish. Kizimkazi, on Zanzibar's south coast, is known instead for wild bottlenose and humpback dolphin encounter tours under strict swimmer and boat-distance protocols. Water 26-29C; the Kaskazi monsoon (Dec-Mar) brings the calmest conditions, while the Kusi monsoon (Jun-Sep) is rougher.

