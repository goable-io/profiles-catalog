  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Mnemba Atoll sits inside a designated conservation area with entry fees funding reef patrols and a no-anchor mooring-buoy system. Kizimkazi's dolphin-tourism sector has been the subject of published marine-biology studies (e.g. Stensland & Berggren, dolphin-tourism impact research in Zanzibar) documenting boat-crowding stress on the resident dolphin population, prompting swimmer-number and boat-distance limits that operators are required to follow.

