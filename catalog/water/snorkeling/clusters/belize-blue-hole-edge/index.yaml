sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 36
  carrying_capacity_sensitivity: high
  notes: |
    The Belize Barrier Reef Reserve System (UNESCO World Heritage Site, 1996) governs both sites; Half Moon Caye Natural Monument, managed by the Belize Audubon Society, protects a nesting red-footed booby colony and enforces visitor-trail limits on the cay itself. The Blue Hole's long open-water transfer and mid-day-only, calm-swell operating window naturally cap visitor volume and equipment demands relative to inshore reef sites.

