description:
  en: |
    The Great Blue Hole, part of the Belize Barrier Reef Reserve System (UNESCO World Heritage Site, 1996), is a giant marine sinkhole roughly 318 m across and 124 m deep, made famous by Jacques Cousteau. Snorkeling is confined to the shallow reef rim circling the hole since visibility and marine life drop sharply below the halocline; nearby Half Moon Caye Natural Monument (Belize's first protected area, 1982) adds a barrier-reef wall-top with dense tropical fish. Both sites are remote atoll locations reached by long boat or seaplane transfer from the mainland, requiring calm-swell conditions.

