tier_rationale:
  en: |
    Half Moon Caye's wall-top snorkel sits on the crest of the barrier-reef
    drop-off with dense tropical-fish life. Reached only by the same long
    open-water boat transfer as the Blue Hole cluster and exposed to the
    same remote-atoll swell conditions. Snorkelers swim along a reef edge
    above a substantial wall rather than in a bounded lagoon, which
    requires more open-water comfort than a beach-entry site, placing it at
    tier 2 alongside the Blue Hole rim.

