tier_rationale:
  en: |
    The Blue Hole rim snorkel covers the 0-6 m shallow reef ring encircling
    the 318 m sinkhole, immediately adjacent to a sheer drop into open
    water hundreds of meters deep. Which demands comfort swimming beside an
    abrupt depth change even though the snorkeler never leaves the shallow
    rim itself. Access is boat-only via a multi-hour open-water crossing
    from the mainland or outer atolls, tours run only in the middle of the
    day, and operators require calm-swell conditions before dropping
    snorkelers, all of which push this past a beginner shore site to tier
    2.

