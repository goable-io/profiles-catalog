tier_rationale:
  en: |
    Hastings Reef is a standard Cairns day-boat destination combining snorkeling with shallow scuba, set over sandy-bottom coral bommies reachable from a moored boat rather than a fixed pontoon, which means less shelter from swell than a lagoon site. Snorkelers swim in open water around scattered bommie structures and must track boat position, a step up from a bounded shore lagoon. This combination places it at tier 2.

