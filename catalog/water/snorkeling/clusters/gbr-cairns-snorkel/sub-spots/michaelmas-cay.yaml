tier_rationale:
  en: |
    Michaelmas Cay is a sand-cay lagoon sheltered by the surrounding reef crest, giving a calm 2-6 m swim zone close to the boat mooring with minimal current or swell — a standard first-timer site on Cairns day trips. The lagoon's shallow, protected profile and short swim distance require no drift or current-handling skill, though the seabird-sanctuary status limits the cay's landward beach access seasonally. The sheltered, beginner-suited water places it at tier 1.

