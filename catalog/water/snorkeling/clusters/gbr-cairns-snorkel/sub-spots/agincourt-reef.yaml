tier_rationale:
  en: |
    Agincourt Reef is a true outer ribbon-reef site facing the Coral Sea, reached by a multi-hour day-boat transfer from Port Douglas and entered from a fixed pontoon into 3-8 m of open reef-flat water with more exposure to swell and current than an inshore fringing reef. Snorkelers are briefed on pontoon-tethered swim boundaries and possible surface chop given the outer-reef position. The offshore location and open-water exposure place it at tier 2.

