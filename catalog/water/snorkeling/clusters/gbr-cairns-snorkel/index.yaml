description:
  en: |
    The Cairns / Port Douglas day-boat sector of the Great Barrier Reef offers the most accessible outer-reef snorkeling in Australia, spanning Agincourt Reef's outer ribbon-reef pontoon, Hastings Reef's sandy-bottom coral bommies, and Michaelmas Cay's protected sand-cay lagoon. Water 24-29C with best conditions Jun-Nov (dry season); the region is under Great Barrier Reef Marine Park Authority (GBRMPA) zoning and faces documented climate-driven bleaching pressure. Access is by day-boat from Cairns or Port Douglas.

