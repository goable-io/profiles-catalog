sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    GBRMPA zoning governs visitor access across all three sites; Michaelmas Cay is additionally a gazetted bird sanctuary with seasonal nesting-season access restrictions (roughly Oct-Mar) to protect breeding seabird colonies. The Great Barrier Reef has experienced repeated mass coral-bleaching events (2016, 2017, 2020, 2022), and operators run strict no-touch, no-fin-contact briefings across the cluster.

