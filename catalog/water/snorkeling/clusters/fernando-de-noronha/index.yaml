  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    Fernando de Noronha is jointly managed under a Marine National Park (Parque Nacional Marinho) and an APA (Área de Proteção Ambiental) by ICMBio (Instituto Chico Mendes de Conservação da Biodiversidade), which caps daily visitor numbers island-wide via an environmental preservation tax and additionally limits Atalaia's tide-pool visits to roughly 100 people per day on a guided-tour, no-sunscreen basis to protect a documented turtle-nursery zone.

