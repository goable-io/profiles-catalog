description:
  en: |
    Fernando de Noronha is a Brazilian volcanic archipelago 545 km off the NE coast, inscribed as a UNESCO World Heritage Site (Brazilian Atlantic Islands, 2001) for its marine biodiversity and resident spinner-dolphin population. Baía do Sancho, repeatedly voted among the world's best beaches, offers protected-bay shore-entry snorkeling with turtles and reef fish; Atalaia is a tide-formed natural pool under a strict daily visitor quota; Buraco do Galego is a deeper boat-drop site over a dramatic underwater canyon. Water 26-28C, calm inside the bays, best visibility Aug-Dec.

