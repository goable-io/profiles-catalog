tier_rationale:
  en: |
    Baía do Sancho is a sheltered, cliff-enclosed bay repeatedly ranked among the world's best beaches, with calm shallow water entered directly from the sand and reliable turtle and tropical-fish sightings close to shore. The bay's protected geometry keeps swell and current low even though the approach itself involves a steep access stairway/ladder through a cliff crevice before reaching the beach. Once in the water, the snorkel itself demands no special skill, placing it at tier 1.

