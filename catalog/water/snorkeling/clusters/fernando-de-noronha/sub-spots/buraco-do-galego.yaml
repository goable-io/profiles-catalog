tier_rationale:
  en: |
    Buraco do Galego is a boat-drop site over a dramatic underwater canyon with greater depth exposure and open-water swell than the sheltered bays elsewhere in the cluster, requiring snorkelers to be comfortable swimming over sudden depth changes away from a beach or pool boundary. Access is boat-only rather than shore-entry, and the canyon topography produces more localized current than Sancho or Atalaia. This places it at tier 2.

