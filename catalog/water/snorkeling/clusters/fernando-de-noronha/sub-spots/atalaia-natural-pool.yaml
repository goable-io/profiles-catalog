tier_rationale:
  en: |
    Atalaia is a shallow, tide-formed natural rock pool with calm, clear.
    Ankle-to-chest-deep water — physically among the gentlest snorkel
    environments in the cluster — used as a turtle nursery and closely
    regulated by ICMBio with a roughly 100-visitor daily cap and mandatory
    guided, no-sunscreen access. The shallow, current-free pool requires no
    technical snorkeling skill, so despite the strict permit logistics the
    water environment itself is unambiguously tier 1.

