description:
  en: |
    Silfra is a water-filled tectonic fissure in Þingvellir National Park (UNESCO World Heritage Site, 2004) marking the boundary between the North American and Eurasian tectonic plates. The fissure is fed by glacial meltwater from the Langjökull glacier, filtered through porous underground lava rock for an estimated 30-100 years before emerging, producing near-freezing water (2-4C year-round) with exceptional visibility often exceeding 100 m. All entry is guide-led and drysuit-mandatory under Þingvellir National Park permit; no scuba certification is required for the snorkel tour, but a guide briefing and drysuit fitting are compulsory.

