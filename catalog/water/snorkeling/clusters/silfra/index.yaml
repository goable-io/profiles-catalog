sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 52
  carrying_capacity_sensitivity: high
  notes: |
    Þingvellir National Park (Iceland's first national park, 1930; UNESCO World Heritage Site, 2004) tightly permits and rotates entry points along the fissure to protect the slow-growing trolla-hair algae and the fragile lava-rock geology; touching the rock walls is prohibited and enforced by guides. Access is year-round given the constant glacial-melt water temperature, though surface weather can close operations.

