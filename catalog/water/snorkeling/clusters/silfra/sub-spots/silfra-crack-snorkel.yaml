tier_rationale:
  en: |
    The Silfra Crack itself is the narrow tectonic fissure between the
    North American and Eurasian plates, where snorkelers swim through a
    confined rock channel in 2-4C water year-round — a physically demanding
    cold-water environment that mandates a drysuit. Thermal layers, and a
    certified guide even though no scuba certification is required. The
    near-freezing temperature and enclosed fissure geometry are a
    materially different and more demanding environment than a warm
    tropical reef, but the swim itself follows a fixed, guide-controlled,
    low-current route rather than open ocean drift or wall exposure,
    landing it at tier 2.

