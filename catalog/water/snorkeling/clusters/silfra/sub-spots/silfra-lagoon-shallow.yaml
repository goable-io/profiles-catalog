tier_rationale:
  en: |
    Silfra Lagoon is the wider, calmer basin at the end of the fissure
    route where the crack opens out before the guided exit point, still
    within the same 2-4C glacial meltwater and drysuit-mandatory regime as
    the crack itself. The open lagoon geometry has less confinement than
    the narrow crack, but the extreme water temperature and mandatory
    specialized equipment keep the environment well outside beginner-
    tropical-lagoon territory. Warranting the same tier 2 as the crack
    section.

