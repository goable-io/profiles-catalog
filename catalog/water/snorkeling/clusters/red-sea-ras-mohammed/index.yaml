description:
  en: |
    Ras Mohammed National Park (established 1983, Egypt's first national park) sits at the southern tip of the Sinai Peninsula where the Gulf of Aqaba meets the Gulf of Suez, producing sheer coral walls that rise to within a few meters of the surface — making its shallow rims among the most dramatic snorkeling in the Red Sea. Jackson Reef, in the Straits of Tiran further north, adds a boat-access reef-top with clear water over a steep wall. Water 22-28C, generally calm, minimal current on the shallow reef-top sections.

