sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 48
  carrying_capacity_sensitivity: high
  notes: |
    Ras Mohammed National Park is managed by the Egyptian Nature Conservation Sector (Ministry of Environment) under a formal marine-park protection regime with mooring buoys to prevent anchor damage. Jackson Reef lies within the Straits of Tiran protected zone. Both sites see very high day-boat visitor volume out of Sharm El-Sheikh, concentrating contact pressure on the shallow reef-crest coral.

