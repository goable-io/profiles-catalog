tier_rationale:
  en: |
    Shark Reef's shallow crest sits at 3-8 m directly above one of the Red Sea's most famous vertical walls, so snorkelers swim close above open-water drop-offs and need comfort with depth perception and occasional current pulses funneling around the promontory. Access is boat-only from Sharm El-Sheikh with a guided briefing, and the site sits inside a national park with strict no-touch enforcement. The wall exposure and boat-drop logistics place it at tier 2 rather than a beginner shore-entry site.

