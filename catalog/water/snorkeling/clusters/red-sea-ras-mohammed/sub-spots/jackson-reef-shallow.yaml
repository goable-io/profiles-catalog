tier_rationale:
  en: |
    Jackson Reef's shallow rim in the Straits of Tiran offers clear water and a visible wall drop-off just beneath the surface, but the Straits carry a stronger tidal current than sheltered inshore sites and access is boat-only, well offshore from Sharm El-Sheikh. Snorkelers must hold position near the reef edge under guide supervision while current runs, which is a materially different skill demand than a calm lagoon. This places the site at tier 2.

