tier_rationale:
  en: |
    Coral Garden is a gently sloping shallow reef flat 3-8 m deep directly adjacent to the Tulamben beach, hosting dense resident tropical reef fish (anthias, damselfish, butterflyfish) over healthy coral-head structure without any current or surge exposure. The shallow, sheltered profile and short swim distance from shore make it a standard kids-and-beginners site used by every Tulamben dive shop for snorkel add-ons. No boat or drift-handling skill is required, justifying tier 1.

