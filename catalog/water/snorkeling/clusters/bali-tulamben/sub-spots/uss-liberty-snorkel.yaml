tier_rationale:
  en: |
    The USS Liberty's stern and mid-hull sections sit at 5-10 m and the hull's uppermost ribs are visible from the surface at low tide, so a snorkeler never needs to descend below the beginner-safe shallow band to see the wreck's outline and resident reef fish. Entry is a flat black-sand beach walk-in with no boat, current, or surge hazard under normal conditions, and the site is used routinely for first-time snorkelers and school groups. The combination of a world-famous wreck silhouette, calm shallow water, and zero-skill entry places this firmly at tier 1.

