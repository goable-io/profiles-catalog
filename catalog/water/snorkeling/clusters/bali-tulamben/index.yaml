  notes: |
    Tulamben is under Indonesian Ministry of Marine Affairs coastal tourism-management coordination; the USS Liberty wreck is a protected historic asset. Shore-entry access and high visitor density concentrate snorkeler contact pressure on the shallow Coral Garden reef flat immediately adjacent to the wreck.

