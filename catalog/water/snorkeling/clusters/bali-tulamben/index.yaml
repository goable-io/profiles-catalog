description:
  en: |
    Tulamben on Bali's NE coast pairs Indonesia's most-photographed shore-entry wreck with a resident-fish shallow reef, making it one of the Indian Ocean's most accessible snorkeling clusters. The USS Liberty (US Army cargo ship torpedoed 11 January 1942, beach-shifted to its current position by the 1963 Mt Agung eruption tsunami surge) breaks the surface at low tide and is walkable-in from the beach; Coral Garden sits immediately adjacent as a shallow, kid-friendly reef. Water 26-30C year-round, minimal current, black-volcanic-sand shore entry.

