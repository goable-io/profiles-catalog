tier_rationale:
  en: |
    Manta Point (Madivaru) is a boat-drop reef-manta cleaning station where snorkelers hold position at the surface over 8-15 m of water while mantas circle below, requiring calm-water positioning discipline and adherence to the Manta Trust no-touch, no-flash, keep-distance protocol to avoid disturbing feeding or cleaning behavior. It is not a shore-entry beginner site — access is boat-only with a guide who briefs manta etiquette before every drop, and current can be present depending on tide. These factors place it at tier 2, a step above shore-entry lagoon snorkeling.

