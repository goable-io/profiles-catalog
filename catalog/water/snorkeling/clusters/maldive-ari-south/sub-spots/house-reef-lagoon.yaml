  en: |
    Resort house-reef lagoons in South Ari sit in 2-5 m of calm, shallow, sand-and-coral lagoon water directly off the beach, with no current or boat requirement — guests routinely walk or swim in directly from the shoreline. The shallow depth, warm still water, and abundant reef-fish and coral life make it a standard first-timer and family snorkel site across Maldivian resort islands. This beginner-safe, zero-logistics profile is a clear tier 1.

