sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 40
  carrying_capacity_sensitivity: high
  notes: |
    The Maldives South Ari Marine Protected Area (declared 2020) covers Ari Atoll's manta and whale-shark aggregation zones under Maldivian Environment Ministry regulation. Manta Trust field researchers operate in South Ari and coordinate with resorts on no-touch, no-flash, distance-limited snorkel protocols at Manta Point to reduce cleaning-station disturbance.

