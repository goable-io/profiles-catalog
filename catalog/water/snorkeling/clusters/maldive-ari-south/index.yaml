description:
  en: |
    South Ari Atoll is one of the Maldives' most consistent reef-manta cleaning and feeding grounds, anchored by Manta Point (Madivaru) and complemented by calm resort house-reef lagoons across the atoll's chain of islands. Warm water (27-30C) and typically good visibility hold through most of the year outside the SW-monsoon peak (Jun-Aug), with the manta season strongest May-Nov. Access is boat-based from resort islands throughout the atoll.

