description:
  en: |
    Isla Cozumel (Yucatán, Mexico) pairs a shallow section of its famous Palancar Gardens drift reef with El Cielo, a shallow sand-bottom lagoon protected inside the Cozumel Reefs National Park (Parque Nacional Arrecifes de Cozumel, D.O.F. 04/07/1996) and known worldwide for its starfish sanctuary. Warm water year-round (25-29C) and typically excellent clarity make both sites reliable snorkel destinations, with boat access from San Miguel de Cozumel harbours.

