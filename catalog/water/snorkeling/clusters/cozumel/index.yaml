sustainability:
  carbon_neutral: true
  equipment_dependency: low
  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Parque Nacional Arrecifes de Cozumel enforces daily-visitor caps and no-anchor mooring-buoy rules at Palancar. El Cielo has a strict no-touch, no-standing policy for its Oreaster reticulatus starfish population, enforced by local boat-guide cooperatives after documented visitor damage; guides now require snorkelers to remain afloat over the sanctuary zone.

