tier_rationale:
  en: |
    Palancar Gardens' shallow section sits at 3-8 m over large coral heads with a steady N-S drift current typical of Cozumel's outer reef (0.5-2 kn), so snorkelers drift with the boat trailing rather than swimming a fixed loop. The drift technique and boat-only access require more water comfort than a sheltered lagoon, though the depth and light current keep it well short of a wall or current-hook site. This combination places it at tier 2.

