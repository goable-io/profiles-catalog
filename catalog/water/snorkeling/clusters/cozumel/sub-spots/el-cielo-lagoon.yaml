tier_rationale:
  en: |
    El Cielo is a shallow, calm, sand-bottom lagoon south of Cozumel with a soft reef edge, reached by a short low-current boat hop and entered by simply floating over the sandbar — no drift technique or depth exposure is involved. It is one of the most-visited beginner and family snorkel stops in the region precisely because of its shallow, sheltered profile, protected under a no-touch starfish-sanctuary rule. This makes it a clear tier 1 site.

