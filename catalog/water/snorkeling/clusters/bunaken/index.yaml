  typical_season_weeks: 44
  carrying_capacity_sensitivity: high
  notes: |
    Bunaken National Marine Park has been under Indonesian government marine-protection management since 1991, one of the earliest MPAs in the Coral Triangle; entry-fee revenue funds ranger patrols against destructive fishing. The near-surface wall ecosystem is highly sensitive to fin-contact damage given how close the reef crest sits to snorkelers at the surface.

