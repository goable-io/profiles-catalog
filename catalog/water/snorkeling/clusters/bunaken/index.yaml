description:
  en: |
    Bunaken National Marine Park (established 1991, one of Indonesia's first marine protected areas) off the north Sulawesi coast is a Coral Triangle biodiversity hotspot where the barrier-reef wall rises to within a few meters of the surface, letting shore-swim and boat-drop snorkelers see the top of the wall directly above extreme drop-offs. Liang Beach gives shore access to the reef edge while Fukui Point is a boat-access drift site renowned for exceptional tropical-fish density. Water 26-29C, generally calm.

