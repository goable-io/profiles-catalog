tier_rationale:
  en: |
    Fukui Point is a boat-drop drift site along the Bunaken wall known for
    exceptionally dense schools of tropical fish. Where snorkelers drift
    with a boat-tracked current along the reef crest rather than swimming a
    fixed shore route. The drift technique and proximity to the sheer wall
    drop-off demand more water comfort and current awareness than Liang
    Beach's sheltered shore entry, placing Fukui Point at tier 2.

