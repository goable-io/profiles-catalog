tier_rationale:
  en: |
    Liang Beach is Bunaken's main shore-entry snorkel point, a short swim from the sand directly onto the top of the barrier-reef wall at 3-6 m, with calm, sheltered water and no boat or current-handling requirement. It is the standard first-visit entry used by island homestays and day-trip operators for guests without dive experience. The simple, shore-based, low-skill access places it at tier 1 despite the wall's dramatic drop-off just beyond the reef crest.

