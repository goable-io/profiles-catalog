gates:
  # Feasibility floor (auto): below this the activity is physically
  # impossible at any skill level — a hard PREREQUISITE, not a weighted
  # dimension. See Gate.kind='feasibility'.
  - metric: wind_speed_kn
    condition: lt
    value: 6
    kind: feasibility
    reason_code: NO_RIDABLE_WIND
    description: Below ~6 knots there is not enough wind to generate power on any kite, so kitesurfing is not feasible regardless of the other conditions.
  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: GALE_FORCE_WIND
    description: Wind above 45 knots is unsafe for kitesurfing.

  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN
    description: Heavy rain reduces visibility and indicates monsoon squall conditions.

  - metric: visibility_km
    condition: lt
    value: 1
    reason_code: LOW_VISIBILITY
    description: Visibility below 1 km is unsafe.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 26
  carrying_capacity_sensitivity: high
  notes: |
    Wind-powered activity with zero direct emissions per session. The
    Paje-Jambiani-Kizimkazi reef flat is a shared artisanal fishing and
    seaweed-farming zone as well as a kite destination; local carrying
    capacity is sensitive to reef-flat crowding at low tide when
    rideable water is confined to narrower channels. International-
    flight transport to Zanzibar dominates per-trip footprint.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "International Kiteboarding Organization (IKO) condition guidelines"
    - "Tanzania Meteorological Authority monsoon wind climatology"
  notes: |
    Cluster aggregates Paje's reef-flat lagoon, Jambiani to the south
    (quieter beach, intermediate freeride), and Kizimkazi further south
    (wave-riding and open-water freeride near the reef edge). Dimensions
    and gates copied verbatim from the base kitesurfing profile (no
    Indian-Ocean region variant exists yet).
