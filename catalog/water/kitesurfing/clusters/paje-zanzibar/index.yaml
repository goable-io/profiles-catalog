description:
  en: |
    Paje, on Zanzibar's southeast coast, anchors East Africa's best-known
    kitesurfing stretch — a long reef-flat lagoon system running south
    through Jambiani to Kizimkazi, protected by a barrier reef roughly
    1-2 km offshore. Two monsoon winds give it two seasons: kaskazi, the
    NE monsoon (December-March), and kusi, the SE monsoon (June-September),
    the stronger and more reliable of the two at 15-25 knots. Zanzibar's
    large tidal range (up to 4 m) is a defining local factor — much of the
    reef flat empties at low tide, so rideable water and wind window shift
    through the day with the tide table. Warm water year-round (26-29°C).

