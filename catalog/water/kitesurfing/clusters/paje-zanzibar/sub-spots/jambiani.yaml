tier_rationale:
  en: |
    Jambiani sits a few kilometres south of Paje on the same barrier- reef-
    protected flat, but with a narrower and less continuously developed
    lagoon, more exposed sections of reef, and considerably fewer kite
    schools. Wind conditions mirror Paje's monsoon regime, but riders here
    get less crowd-support infrastructure and need to be more self-
    sufficient reading the tide and reef exposure. Placing it a step above
    the fully beginner-oriented Paje reef flat.

