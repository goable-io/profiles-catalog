tier_rationale:
  en: |
    Paje's reef-flat lagoon is shielded from open-ocean swell by a
    barrier reef roughly 1-2 km offshore, leaving flat, shallow water
    over sand and seagrass at mid-to-high tide, when most riding happens.
    Both kaskazi (NE monsoon) and kusi (SE monsoon) deliver rideable
    side-shore wind here, with kusi the stronger and more reliable at
    15-25 knots. The lagoon empties substantially at low tide — riders
    must plan sessions around the tide table, a scheduling consideration
    rather than a safety one for this beginner-friendly reef flat, which
    hosts the highest concentration of kite schools on the island.

