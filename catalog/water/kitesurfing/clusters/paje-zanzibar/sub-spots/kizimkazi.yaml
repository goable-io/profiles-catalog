tier_rationale:
  en: |
    Kizimkazi, at the southern tip of Zanzibar's kite coast, sits closer
    to a reef edge open to Indian Ocean swell than the sheltered Paje
    lagoon, producing small wind-swell and wave-riding opportunity
    alongside open-water freeride. The reef here is less continuous and
    the fetch more open, calling for intermediate riding skill (upwind
    ability, wave awareness) and reef-position judgement that the
    fully-protected northern lagoon does not demand. Kaskazi and kusi
    both reach here, though local channel currents near the point add a
    further intermediate-level consideration.

