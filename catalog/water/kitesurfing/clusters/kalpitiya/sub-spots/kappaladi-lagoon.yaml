tier_rationale:
  en: |
    Kappaladi lagoon is shielded from ocean swell by a barrier sandbar and
    the Kalpitiya peninsula itself, leaving a shallow, flat, mud-and-sand
    bottomed lagoon well suited to beginners. Both the SW monsoon
    (May-October, 20-30 knots) and the lighter NE monsoon (December-
    February) deliver rideable wind here, giving the lagoon two distinct
    seasonal windows. Shallow depth over most of the lagoon means a
    fallen rider can usually stand, and the lagoon's enclosed geometry
    limits downwind drift compared with open-ocean beaches.

