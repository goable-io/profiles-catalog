description:
  en: |
    The flat-water training ground of Kalpitiya — a shallow, sandbar-
    protected lagoon with two monsoon wind seasons a year and a dense
    concentration of kite schools along its shore. The default first
    stop for visiting riders before venturing to the offshore islands.

