tier_rationale:
  en: |
    Vella Island's reef and sandbank area sits further offshore than the
    sheltered Kappaladi lagoon, exposed to wind-driven chop and small
    wind-swell rather than fully flat water. Reached by a short boat
    shuttle rather than a beach launch, it demands intermediate riding
    skill (upwind ability, self-rescue, and comfort launching/landing
    from a boat) that beginners in the main lagoon do not yet need.
    Wind is generally stronger and more consistent than in the lagoon,
    reflecting the more open offshore fetch.

