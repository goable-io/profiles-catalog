description:
  en: |
    An offshore reef and sandbank sector reached by boat shuttle from the
    Kalpitiya lagoon shore, offering intermediate chop-and-wave freeride
    away from the school crowds of the main lagoon, with generally
    stronger and more open-fetch monsoon wind.

