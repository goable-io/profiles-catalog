  - kitesurfing-spot-kalpitiya-vella-island
display_name:
  en: Kitesurfing — Kalpitiya (Sri Lanka)
  it: Kitesurf — Kalpitiya (Sri Lanka)
  es: Kitesurf — Kalpitiya (Sri Lanka)
  fr: Kitesurf — Kalpitiya (Sri Lanka)
  de: Kitesurfen — Kalpitiya (Sri Lanka)
description:
  en: |
    Kalpitiya, on Sri Lanka's northwest peninsula, is a lagoon-and-island
    kite destination built around a chain of shallow flat-water lagoons
    sheltered from ocean swell by barrier sandbars and offshore islands.
    Two monsoon-driven wind seasons give it a near year-round window: the
    SW monsoon (May-October) brings the stronger, more consistent 20-30
    knot wind, while the NE monsoon (December-February) brings a lighter
    but still rideable secondary season. Warm water (27-29°C) year-round.
    Access to the outer reef and island sectors is typically by small
    boat shuttle from the lagoon shore.

dimensions:
  - name: wind_speed
    metric: wind_speed_kn
    weight: 0.45
    curve:
      - { x: 0, s: 0.00 }
      - { x: 8, s: 0.20 }
      - { x: 12, s: 0.60 }
      - { x: 15, s: 0.95 }
      - { x: 22, s: 1.00 }
      - { x: 30, s: 0.70 }
      - { x: 35, s: 0.20 }
      - { x: 45, s: 0.00 }
    modifiers:
      gust_factor_penalty:
        threshold: 1.4
        penalty_coefficient: 0.15

  - name: wind_direction
    metric: wind_direction_deg
    weight: 0.15
    modifiers:
      direction_preference:
        - { from: 180, to: 270, multiplier: 1.0 }
        - { from: 90, to: 180, multiplier: 0.7 }
        - { from: 0, to: 90, multiplier: 0.3 }

  - name: wave
    metric: wave_height_m
    weight: 0.10
    curve:
      - { x: 0.0, s: 0.80 }
      - { x: 0.5, s: 1.00 }
      - { x: 1.5, s: 0.85 }
      - { x: 2.5, s: 0.55 }
      - { x: 4.0, s: 0.20 }
      - { x: 6.0, s: 0.00 }

  - name: visibility
    metric: visibility_km
    weight: 0.10
    curve:
      - { x: 0, s: 0.0 }
      - { x: 1, s: 0.0 }
      - { x: 2, s: 0.6 }
      - { x: 5, s: 1.0 }

  - name: air_temp_comfort
    metric: apparent_temp_c
    weight: 0.10
    curve:
      - { x: -5, s: 0.0 }
      - { x: 5, s: 0.4 }
      - { x: 15, s: 0.9 }
      - { x: 25, s: 1.0 }
      - { x: 35, s: 0.7 }
      - { x: 40, s: 0.3 }

  - name: water_temp
    metric: water_temperature_c
    weight: 0.05
    curve:
      - { x: 5, s: 0.0 }
      - { x: 12, s: 0.3 }
      - { x: 18, s: 0.8 }
