tier_rationale:
  en: |
    Swell City is the Gorge's advanced wave-riding sector, where a
    narrower channel section and sustained 30+ knot thermal flow against
    the river current stack up standing waves and chop significantly
    larger and steeper than at the Event Site. Riders here need strong
    upwind ability, comfort in powerful, gusty wind, and confidence
    self-rescuing in cold moving water well away from a developed beach.
    This is intermediate-plus-to-advanced river terrain, not a
    progression spot for newer riders.

