tier_rationale:
  en: |
    The Event Site is the Columbia Gorge's primary kite launch — a
    developed riverside park with a well-defined lift-off and landing
    beach used for competitions and daily sessions alike. The thermal
    westerly wind is strong and consistent (25-35 knots typical
    June-August afternoons) but the river current runs against it,
    producing standing wind-against-current chop that demands solid
    riding technique beyond flat-water basics. Cold glacial-fed water
    and barge/boat traffic in the shipping channel are additional
    intermediate-level considerations absent from typical ocean lagoons.

