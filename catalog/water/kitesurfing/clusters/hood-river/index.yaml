display_name:
  en: Kitesurfing — Hood River (Columbia River Gorge, Oregon)
  it: Kitesurf — Hood River (Columbia River Gorge, Oregon)
  es: Kitesurf — Hood River (Columbia River Gorge, Oregón)
  fr: Kitesurf — Hood River (Columbia River Gorge, Oregon)
  de: Kitesurfen — Hood River (Columbia River Gorge, Oregon)
description:
  en: |
    Hood River, in Oregon's Columbia River Gorge, is North America's
    signature freshwater kite destination — a river channel between
    basalt cliffs where a thermal pressure gradient (a hot inland desert
    low against the cool coastal marine layer) drives a strong,
    sustained westerly upriver wind through the summer months. Wind
    typically builds through the day, peaking 25-35 knots June-August in
    the afternoon, opposed by the river's eastward current, which
    stacks up standing wind-against-current chop and small waves —
    distinct from ocean swell. Cold glacial-fed water even in summer
    (12-18°C) and a strong, gusty thermal regime make this an
    intermediate-to-advanced river venue rather than a beginner destination.

dimensions:
  - name: wind_speed
    metric: wind_speed_kn
    weight: 0.45
    curve:
      - { x: 0, s: 0.00 }
      - { x: 8, s: 0.20 }
      - { x: 12, s: 0.60 }
      - { x: 15, s: 0.95 }
      - { x: 22, s: 1.00 }
      - { x: 30, s: 0.70 }
      - { x: 35, s: 0.20 }
      - { x: 45, s: 0.00 }
    modifiers:
      gust_factor_penalty:
        threshold: 1.4
        penalty_coefficient: 0.15

  - name: wind_direction
    metric: wind_direction_deg
    weight: 0.15
    modifiers:
      direction_preference:
        - { from: 180, to: 270, multiplier: 1.0 }
        - { from: 90, to: 180, multiplier: 0.7 }
        - { from: 0, to: 90, multiplier: 0.3 }

  - name: wave
