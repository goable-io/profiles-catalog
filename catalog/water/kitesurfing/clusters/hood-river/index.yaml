      - { x: 0.5, s: 1.00 }
      - { x: 1.5, s: 0.85 }
      - { x: 2.5, s: 0.55 }
      - { x: 4.0, s: 0.20 }
      - { x: 6.0, s: 0.00 }

  - name: visibility
