gates:
  # Feasibility floor (auto): below this the activity is physically
  # impossible at any skill level — a hard PREREQUISITE, not a weighted
  # dimension. See Gate.kind='feasibility'.
  - metric: wind_speed_kn
    condition: lt
    value: 6
    kind: feasibility
    reason_code: NO_RIDABLE_WIND
    description: Below ~6 knots there is not enough wind to generate power on any kite, so kitesurfing is not feasible regardless of the other conditions.
  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: GALE_FORCE_WIND
    description: Wind above 45 knots is unsafe for kitesurfing.

  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN
    description: Heavy rain reduces visibility and typically accompanies a breakdown of the thermal wind pattern.

  - metric: visibility_km
    condition: lt
    value: 1
    reason_code: LOW_VISIBILITY
    description: Visibility below 1 km is unsafe.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 16
  carrying_capacity_sensitivity: medium
  notes: |
    Wind-powered activity with zero direct emissions per session. The
    Columbia Gorge is a National Scenic Area with managed public
    river-access sites (launch and landing beaches); the thermal wind
    season is short and concentrated (roughly June-September), producing
    high seasonal kite density at the Event Site during peak summer
    afternoons.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "International Kiteboarding Organization (IKO) condition guidelines"
    - "NOAA/National Weather Service Columbia River Gorge thermal wind climatology"
  notes: |
    Cluster aggregates the Event Site (main thermal launch, intermediate-
    plus) and Swell City (advanced wave-riding sector with sustained
    higher wind and standing river chop). Dimensions and gates copied
    verbatim from the base kitesurfing profile (no Rockies/freshwater
    region variant exists yet for kitesurfing). Region tagged `rockies`
    per bbox (lat 32-65, lng -125 to -103); this is a river venue, not an
    ocean one, but no dedicated freshwater region exists in the enum.
