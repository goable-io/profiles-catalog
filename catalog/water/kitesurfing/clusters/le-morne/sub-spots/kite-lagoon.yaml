description:
  en: |
    The flat-water heart of Le Morne — a reef-protected lagoon with warm,
    shallow, turquoise water and textbook side-shore SE trades. The
    launch beach in front of the kite-school cluster is the default entry
    point for the whole bay, with the wave breaks of One Eye and Manawa
    visible on the reef line beyond.

