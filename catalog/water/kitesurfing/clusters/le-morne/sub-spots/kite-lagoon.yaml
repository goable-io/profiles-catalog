tier_rationale:
  en: |
    The main Le Morne lagoon, protected by a barrier reef roughly 1-2 km
    offshore that kills incoming ocean swell and leaves a broad, flat,
    shallow (chest-deep to waist-deep over sand) sheet of water. SE trade
    wind arrives side-shore across the lagoon at a steady 15-25 knots
    with low gust factor, and the reef prevents any current-driven
    downwind hazard from reaching open water. This combination of flat
    water, shallow bailout-friendly depth, and consistent clean wind
    makes it one of the most beginner-friendly lagoons on the planet, and
    it hosts a dense concentration of IKO-affiliated kite schools.

