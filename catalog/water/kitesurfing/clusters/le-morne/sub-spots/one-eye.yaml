tier_rationale:
  en: |
    One Eye is Le Morne's iconic outer-reef break — a fast, hollow,
    left-hand wave that peels off shallow live coral, exposed at low
    tide and only rideable by experienced wave-riders who can read the
    reef and manage a kite in breaking surf simultaneously. It is a
    long-standing PKRA/GKA world-tour wave-riding venue. A lost kite or a
    fall on the inside section puts a rider directly over coral in
    shallow water, and the channel used to reach the break requires
    crossing active swell lines — this is advanced-only terrain with
    real reef-cut and impact-injury risk.

