description:
  en: |
    The reef break that put Le Morne on the world wave-riding map — a
    fast, hollow left visible from the lagoon beach and used for
    international kite-wave competition. Shallow live coral, strong
    localism among the wave-riding crowd, and swell/tide dependence make
    this a spot for confident, experienced wave riders only.

