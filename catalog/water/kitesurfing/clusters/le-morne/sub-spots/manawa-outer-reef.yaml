tier_rationale:
  en: |
    Manawa sits on the outer reef between the flat lagoon and the
    hollow One Eye break, offering wind-swell chop and smaller,
    softer-shouldered waves than One Eye. It suits intermediate riders
    stepping up from flat water into their first swell-riding and
    downwind sessions. Reef is present but deeper and less exposed than
    at One Eye, and the channel access is more forgiving, though riders
    still need solid upwind riding and self-rescue skills before
    venturing this far from the beach.

