description:
  en: |
    The middle ground of Le Morne bay — a chop-and-small-wave freeride
    sector on the outer reef between the flat lagoon and the world-class
    One Eye break. A natural progression zone for lagoon-trained riders
    building confidence in swell before attempting One Eye.

