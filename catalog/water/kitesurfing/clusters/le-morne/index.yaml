gates:
  # Feasibility floor (auto): below this the activity is physically
  # impossible at any skill level — a hard PREREQUISITE, not a weighted
  # dimension. See Gate.kind='feasibility'.
  - metric: wind_speed_kn
    condition: lt
    value: 6
    kind: feasibility
    reason_code: NO_RIDABLE_WIND
    description: Below ~6 knots there is not enough wind to generate power on any kite, so kitesurfing is not feasible regardless of the other conditions.
  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: GALE_FORCE_WIND
    description: Wind above 45 knots is unsafe for kitesurfing.

  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN
    description: Heavy rain reduces visibility and indicates storm or cyclone-adjacent conditions.

  - metric: visibility_km
    condition: lt
    value: 1
    reason_code: LOW_VISIBILITY
    description: Visibility below 1 km is unsafe.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 28
  carrying_capacity_sensitivity: high
  notes: |
    Wind-powered activity with zero direct emissions per session. Le Morne
    sits within a designated public beach access corridor and a marine
    area adjacent to coral reef habitat; the reef-protected lagoon has
    finite safe kite density and the outer-reef wave zones (One Eye,
    Manawa) are shared with surfers under a long-standing local
    right-of-way etiquette. International-flight transport to Mauritius
    dominates per-trip footprint.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
  maturity: provisional
  reviewed_by: []
  sources:
    - "International Kiteboarding Organization (IKO) condition guidelines"
    - "Mauritius Meteorological Services SE trade-wind climatology"
  notes: |
    Cluster aggregates the Le Morne lagoon (flat-water school zone), One
    Eye (outer-reef left-hand wave break, PKRA/GKA tour venue), and the
    Manawa outer-reef sector between them. Dimensions and gates copied
    verbatim from the base kitesurfing profile (no Indian-Ocean region
    variant exists yet).
