  de: Kitesurfen — Le Morne (Mauritius)
description:
  en: |
    Le Morne, at the southwest tip of Mauritius beneath the UNESCO-listed
    Le Morne Brabant peak, is one of the world's most complete kitesurfing
    venues — a single bay offering flat-water lagoon, mid-reef chop, and
    a world-class outer-reef wave break within a few hundred metres of
    each other. The Indian Ocean SE trade winds blow reliably 15-25 knots
    from May through November (Austral winter), side-shore across the
    lagoon. The barrier reef 1-2 km offshore creates the flat inner lagoon
    while channelling ocean swell onto the outer reef at One Eye and
    Manawa, producing a rare freeride-to-wave-riding progression in one
    bay. Water is warm year-round (24-28°C).

