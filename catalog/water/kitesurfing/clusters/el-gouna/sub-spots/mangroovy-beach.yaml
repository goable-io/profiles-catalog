tier_rationale:
  en: |
    Mangroovy Beach is El Gouna's main kite lagoon — a shallow, reef-
    fringed bay shielded from open Red Sea swell, with the northerly
    Etesian-driven wind arriving cross-shore at a steady 15-25 knots
    through the summer season. The lagoon bottom is mostly sand with
    scattered shallow reef patches marked and avoided by the resident
    kite schools, and the enclosed bay geometry limits downwind drift.
    High kite-school density and dedicated beginner zones make this the
    default first-timer destination on this stretch of coast.

