tier_rationale:
  en: |
    Ray's Reef sits adjacent to the shallow lagoons but is more exposed
    to wind-driven chop and small wind-swell where the reef breaks the
    otherwise-flat bay geometry. This requires intermediate riding
    skill — upwind ability, comfort in choppier water, reef awareness
    beyond what beginners need in the sheltered lagoons. Wind here
    runs 20-30 knots in season, generally a touch stronger and
    gustier than the fully enclosed lagoon sectors due to greater
    exposure to open water.

