gates:
  # Feasibility floor (auto): below this the activity is physically
  # impossible at any skill level — a hard PREREQUISITE, not a weighted
  # dimension. See Gate.kind='feasibility'.
  - metric: wind_speed_kn
    condition: lt
    value: 6
    kind: feasibility
    reason_code: NO_RIDABLE_WIND
    description: Below ~6 knots there is not enough wind to generate power on any kite, so kitesurfing is not feasible regardless of the other conditions.
  - metric: wind_speed_kn
    condition: gt
    value: 45
    reason_code: GALE_FORCE_WIND
    description: Wind above 45 knots is unsafe for kitesurfing.

  - metric: precipitation_mm_h
    condition: gt
    value: 10
    reason_code: HEAVY_RAIN
    description: Heavy rain is rare on the Red Sea coast but reduces visibility and indicates unstable conditions when it occurs.

  - metric: visibility_km
    condition: lt
    value: 1
    reason_code: LOW_VISIBILITY
    description: Visibility below 1 km is unsafe.

sustainability:
  carbon_neutral: true
  equipment_dependency: high
  typical_season_weeks: 30
  carrying_capacity_sensitivity: high
  notes: |
    Wind-powered activity with zero direct emissions per session. El
    Gouna's lagoons sit within a planned resort development adjacent to
    live coral reef; reef proximity and high kite-school density make
    carrying capacity a real constraint, and lagoon access is managed
    through resort and school zoning. International-flight transport
    (typically via Hurghada HRG) drives most of the per-trip footprint.

verdict_buckets:
  unsafe: 0
  poor: [1, 30]
  marginal: [31, 50]
  fair: [51, 70]
  favorable: [71, 85]
  excellent: [86, 100]

meta:
