description:
  en: |
    El Gouna, on Egypt's Red Sea coast north of Hurghada, is a lagoon
    resort town built around shallow, reef-protected flat-water bays
    interspersed with reef-and-chop sectors — a compact, accessible
    version of the classic Red Sea kite geography. The dominant summer
    wind is the northerly Etesian-driven flow that channels down the Red
    Sea trough, typically 15-25 knots and highly consistent April through
    October, with a shoulder season either side. Warm water (24-28°C in
    season), high sun, and shallow reef flats close to shore make it a
    popular flat-water and progression destination.

