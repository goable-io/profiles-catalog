tier_rationale:
  en: |
    El Hombre is the outer, most exposed section of the Chicama point
    system, the first part of the wave to activate on a rising swell and
    the section that must connect for a rider to link all the way
    through to the main point. It shares the same moderate, sloped wave
    shape as the rest of Chicama but sits furthest from shore and
    shelter, meaning wind and swell direction changes are felt first and
    most strongly here. Intermediate riders use it primarily on bigger
    swell days when the whole point is working, since on smaller days it
    may not break cleanly enough to be worth the extra paddle out from
    the village.

