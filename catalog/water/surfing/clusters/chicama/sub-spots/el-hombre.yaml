description:
  en: |
    The outermost section of the Chicama point system, the first part of
    the wave to catch a building swell and the connector that lets
    riders link all the way through to the main point on the biggest
    days. More exposed to wind and swell-direction shifts than the
    inner sections, and best surfed when the whole point is firing.

