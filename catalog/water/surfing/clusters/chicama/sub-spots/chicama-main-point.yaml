tier_rationale:
  en: |
    The main point at Chicama is the core of the Guinness-record wave, a
    long, moderately-sloped left that peels along a boulder-and-sand
    point for the better part of a kilometre on typical days and up to
    2 km when the whole system connects on the biggest swells. The wave
    face is broad and forgiving rather than steep or hollow, well suited
    to longboarding and cruising shortboard turns, and the point's
    length means a fall rarely ends a ride entirely — paddlers can
    re-enter downstream sections. It remains open-ocean exposed and the
    paddle back up the point after a long ride is a genuine physical
    test, keeping it out of true beginner territory.

