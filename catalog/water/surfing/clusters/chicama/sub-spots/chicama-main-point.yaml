description:
  en: |
    The heart of the world's longest ridable wave — a left-hand point
    break running along a boulder-and-sand point for up to 2 km on peak
    days. Moderate, forgiving wave shape favours longboarders and
    cruising shortboarders over barrel hunters. Small fishing-village
    lodges line the point, and the paddle back up after a long ride is
    part of the Chicama experience.

