gates:
  # Feasibility floor (auto): below this the activity is physically
  # impossible at any skill level — a hard PREREQUISITE, not a weighted
  # dimension. See Gate.kind='feasibility'.
  - metric: wave_height_m
    condition: lt
    value: 0.3
    kind: feasibility
    reason_code: FLAT_NO_SURF
    description: Below ~0.3 m the sea is flat with no rideable waves, so surfing is not feasible regardless of the other conditions.
  - metric: wave_height_m
    condition: gt
    value: 6
    reason_code: EXTREME_SURF
    description: Wave height above 6m is unsafe for recreational surfing.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: HIGH_WIND
    description: Strong onshore wind above 30 knots creates disorganised, dangerous conditions.

  - metric: visibility_km
    condition: lt
    value: 1
    reason_code: LOW_VISIBILITY
    description: Visibility below 1 km is unsafe.

  - metric: rip_current_proxy
    condition: gt
    value: 0.75
    reason_code: RIP_CURRENT_HAZARD
    description: A rip-current proxy above 0.75 indicates strong channelised offshore flow from oblique groundswell over a sand or mixed bottom, a drowning hazard when entering or exiting the water.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 44
  carrying_capacity_sensitivity: medium
  notes: |
    Chicama's fishing village economy has partially shifted toward surf
    tourism, with lodges and board rentals concentrated near the main
    point. The wave's exceptional length spreads surfers out across
    nearly 2 km of point rather than concentrating them in a single
    peak, reducing crowd pressure per linear metre of wave compared to
    reef or beach-break clusters of similar fame. International-flight
    transport dominates the per-trip footprint for most visiting
    surfers.

