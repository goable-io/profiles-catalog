description:
  en: |
    Chicama (La Libertad, Peru) is home to the longest ridable wave on
    Earth, a Guinness World Record left-hand point break that can run
    for nearly 2 km on the best days. A rare combination of a straight,
    shallow, boulder-and-sand-covered coastline and consistent Pacific
    groundswell lets a single wave hold its shape across four connected
    sections — Malpaso, Keys, El Point, and the Main Point — with El
    Hombre marking the outer section that links up with the main point
    at bigger swell. The wave is long but forgiving in steepness,
    favoured by longboarders and cruising shortboarders rather than
    barrel hunters. Season is year-round with the most consistent
    groundswell March-November.

