description:
  en: |
    The point break at the south end of Zicatela beach, where a rocky
    headland shapes incoming groundswell into a long, organised left.
    Cleaner and more forgiving than the Zicatela peak, La Punta is the
    intermediate hub of Puerto Escondido, popular with longboarders and
    progressing shortboarders, with surf schools and rental shacks
    concentrated along the point.

