tier_rationale:
  en: |
    La Punta is the left-hand point break at the southern end of the
    Zicatela beach system, where a rocky headland refracts and organises
    the same Pacific groundswell into a longer, more predictable wave
    than the sand-bottom beach break to the north. Wave faces are
    typically cleaner and less abrupt, with a defined take-off zone and
    walled-up shoulder that gives intermediate surfers time to set up
    manoeuvres. It is still exposed to open-ocean swell and can build to
    a size that overwhelms less experienced riders on bigger days, but
    the point-break shape makes it the natural step up from a beginner
    beach and the step down from Zicatela's main peak.

