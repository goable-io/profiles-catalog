tier_rationale:
  en: |
    Known as the "Mexican Pipeline," Zicatela is a steep beach break
    where the continental shelf drops away sharply just offshore,
    letting deep-water groundswell arrive with almost no dissipation
    before slamming into a shifting sand bottom. Spring-summer swells
    routinely deliver 3-8 m barrels with extreme power and a violent,
    close-out shorebreak that has caused serious spinal and head
    injuries even to experienced surfers. It is the venue for the WSL
    Puerto Escondido Challenge big-wave event, and strong rip currents
    running parallel to the beach make paddling out and getting back to
    shore a significant hazard independent of wave size.

