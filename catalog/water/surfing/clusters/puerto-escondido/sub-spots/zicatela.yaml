description:
  en: |
    Playa Zicatela's main peak, the "Mexican Pipeline" and one of the
    most powerful beach breaks in the world. Deep-water groundswell hits
    a steep sand shelf with minimal refraction, producing thick, hollow
    barrels from 3-8 m during the May-September Pacific groundswell
    season. Hosts the WSL Puerto Escondido Challenge big-wave tour stop.
    Strictly for advanced/expert surfers; the shorebreak alone injures
    beginners who wander too close.

