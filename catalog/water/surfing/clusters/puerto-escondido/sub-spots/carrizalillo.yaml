description:
  en: |
    A sheltered cove beach a short drive west of Zicatela, protected by
    headlands from the full force of the Oaxaca groundswell. Small, soft
    sand-bottom waves make Carrizalillo the beginner and family hub of
    Puerto Escondido, with numerous surf schools operating from the
    beach and calm swimming water outside the small lineup.

