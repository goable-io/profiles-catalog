tier_rationale:
  en: |
    Playa Carrizalillo occupies a small horseshoe-shaped cove reached by
    a stairway down a cliff, and the headlands enclosing the bay block
    most of the open-ocean swell energy that makes Zicatela dangerous.
    Waves arrive small and soft, breaking over a sand bottom with a
    gentle beach gradient, and the enclosed shape limits current and rip
    formation compared to the exposed beaches nearby. This is the venue
    of choice for Puerto Escondido's surf schools and family lessons,
    with lifeguard presence during peak tourist hours.

