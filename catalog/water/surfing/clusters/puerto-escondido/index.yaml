description:
  en: |
    Puerto Escondido (Oaxaca, Mexico) sits on a steep-shelving stretch of
    Pacific coastline where deep-water groundswell arrives almost
    unrefracted, producing some of the heaviest beach-break barrels on
    Earth at Playa Zicatela — the "Mexican Pipeline." The same swell
    energy is tamed by geography at La Punta (a point break south of
    Zicatela) and almost fully blocked at the sheltered cove of
    Carrizalillo, giving the cluster a full spread from expert-only
    big-wave venue to a protected beginner bay within a few kilometres
    of coastline. Prime season is the Pacific hurricane/groundswell
    window, May-September, when Zicatela regularly runs 3-8 m.

