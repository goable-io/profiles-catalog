gates:
  # Feasibility floor (auto): below this the activity is physically
  # impossible at any skill level — a hard PREREQUISITE, not a weighted
  # dimension. See Gate.kind='feasibility'.
  - metric: wave_height_m
    condition: lt
    value: 0.3
    kind: feasibility
    reason_code: FLAT_NO_SURF
    description: Below ~0.3 m the sea is flat with no rideable waves, so surfing is not feasible regardless of the other conditions.
  - metric: wave_height_m
    condition: gt
    value: 10
    reason_code: EXTREME_PACIFIC_SURF
    description: Wave height above 10m is unsafe for recreational surfing; Zicatela's biggest days are tow-in / elite-paddle only.

  - metric: wind_speed_kn
    condition: gt
    value: 35
    reason_code: HIGH_WIND
    description: Strong wind above 35 knots destroys wave shape and creates dangerous conditions.

  - metric: visibility_km
    condition: lt
    value: 1
    reason_code: LOW_VISIBILITY
    description: Visibility below 1 km is unsafe.

  - metric: rip_current_proxy
    condition: gt
    value: 0.75
    reason_code: RIP_CURRENT_HAZARD
    description: A rip-current proxy above 0.75 indicates strong channelised offshore flow from oblique groundswell over a sand or mixed bottom, a drowning hazard when entering or exiting the water.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 38
  carrying_capacity_sensitivity: high
  notes: |
    Puerto Escondido's surf economy is the dominant driver of local
    tourism, with international arrivals concentrated May-September
    around the Zicatela groundswell window. Zicatela's beach-break
    power and heavy shorebreak make it one of the most consequential
    breaks a recreational surfer can paddle out at; Carrizalillo's
    cove is a low-impact beginner alternative that draws crowd pressure
    away from Zicatela during lessons.

