description:
  en: |
    Jeffreys Bay (Eastern Cape, South Africa) is one of the most famous
    right-hand point breaks in the world, where Southern Ocean
    groundswell wraps around a rocky, cobblestone-covered point to
    produce a long, fast, mechanically consistent wave. The point runs
    through several named sections — Kitchen Windows, Supertubes, and
    Boneyards among them — each with a distinct character as the wave
    walls up, speeds up, and hollows out along its length. Supertubes is
    the WSL Championship Tour venue and the most famous section;
    Boneyards is the heaviest outer take-off; Kitchen Windows is the
    gentler southern section favoured by intermediates. Prime season
    is the Southern Ocean groundswell window, April-September (austral
    autumn-winter).

