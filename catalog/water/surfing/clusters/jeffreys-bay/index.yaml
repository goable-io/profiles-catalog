gates:
  # Feasibility floor (auto): below this the activity is physically
  # impossible at any skill level — a hard PREREQUISITE, not a weighted
  # dimension. See Gate.kind='feasibility'.
  - metric: wave_height_m
    condition: lt
    value: 0.3
    kind: feasibility
    reason_code: FLAT_NO_SURF
    description: Below ~0.3 m the sea is flat with no rideable waves, so surfing is not feasible regardless of the other conditions.
  - metric: wave_height_m
    condition: gt
    value: 6
    reason_code: EXTREME_SURF
    description: Wave height above 6m is unsafe for recreational surfing.

  - metric: wind_speed_kn
    condition: gt
    value: 30
    reason_code: HIGH_WIND
    description: Strong onshore wind above 30 knots creates disorganised, dangerous conditions.

  - metric: visibility_km
    condition: lt
    value: 1
    reason_code: LOW_VISIBILITY
    description: Visibility below 1 km is unsafe.

sustainability:
  carbon_neutral: true
  equipment_dependency: medium
  typical_season_weeks: 26
  carrying_capacity_sensitivity: high
  notes: |
    Jeffreys Bay is one of the most crowded point breaks in the world
    during peak swell season, with Supertubes drawing surfers from
    across South Africa and internationally for the WSL Championship
    Tour event and the winter groundswell window. The town's economy is
    heavily surf-tourism dependent; local surf-ski etiquette and
    informal zoning by section (Kitchen Windows to Boneyards) manage
    crowd pressure along the point. International-flight transport
    dominates the per-trip footprint for overseas visitors.

