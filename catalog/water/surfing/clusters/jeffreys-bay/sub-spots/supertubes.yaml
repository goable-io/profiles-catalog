tier_rationale:
  en: |
    Supertubes is the signature section of the Jeffreys Bay point, a
    fast, hollow right-hander that peels over a cobblestone-and-rock
    bottom at a speed that demands committed positioning and high-level
    turning ability to stay in the pocket. Southern Ocean groundswell
    delivers walls that section rapidly, so a mistimed take-off leaves a
    surfer exposed to a shallow, rocky reef with limited room for error.
    It is the WSL Championship Tour's Jeffreys Bay venue and one of the
    most competitive lineups in world surfing, with local and visiting
    experts converging whenever the point is firing.

