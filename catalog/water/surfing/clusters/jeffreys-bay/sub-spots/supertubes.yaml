    The most famous section of the Jeffreys Bay point, a fast, hollow
    right-hander over a rocky cobblestone bottom, and the WSL
    Championship Tour venue. Southern Ocean groundswell produces long,
    speed-walled rides that demand advanced positioning and turning
    ability. Prime season April-September (austral autumn-winter).

