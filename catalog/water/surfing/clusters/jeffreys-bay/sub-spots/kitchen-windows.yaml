tier_rationale:
  en: |
    Kitchen Windows is the southernmost, most sheltered section of the
    Jeffreys Bay point system, where the same Southern Ocean groundswell
    has lost some energy after wrapping past the outer sections and
    breaks with a softer, more rounded shape over a mixed sand-and-rock
    bottom. The gentler wall gives intermediate surfers more time to
    read the wave and set up turns than the fast Supertubes section
    upstream, while still offering the long, point-break ride quality
    that defines the bay. It remains open to Southern Ocean swell and
    cold water, so full wetsuit protection is required year-round.

