description:
  en: |
    The southernmost, more sheltered section of the Jeffreys Bay point,
    where the swell has softened after wrapping past the outer sections.
    Gentler wave shape than Supertubes makes this the intermediate
    section of the bay, still delivering the long, walling point-break
    rides the destination is famous for.

