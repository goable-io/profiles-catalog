tier_rationale:
  en: |
    Boneyards is the outermost, heaviest take-off zone of the Jeffreys
    Bay point, the first section to catch a rising Southern Ocean
    groundswell and the section with the most exposed reef-and-rock
    bottom. Its name reflects the shallow, jagged bottom structure that
    a fall at size exposes a surfer to, and the wave here breaks with
    more raw power and less predictable shape than the groomed
    Supertubes section downstream. It is used almost exclusively by
    advanced and expert surfers looking to link the outer section into
    the rest of the point on the biggest swells.

