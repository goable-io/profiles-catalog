description:
  en: |
    The outer, heaviest take-off section of the Jeffreys Bay point,
    named for its shallow, jagged reef-and-rock bottom. First section to
    activate on a building swell and the entry point for advanced
    surfers linking rides all the way through Supertubes on the biggest
    days.

