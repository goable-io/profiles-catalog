tier_rationale:
  en: |
    The middle section links the outer sandbar's swell entry to the
    inner point, sustaining barrel sections along the sand-spit's curve
    over a long, physically demanding stretch of the ride. Surfers who
    connect through from the outer bar must maintain speed and tube
    positioning through this section without a rest, and any fall here
    still leaves a long, current-affected swim back to a take-off zone
    with no channel and no support boat or lifeguard. The wave's speed
    and sustained hollow shape place it firmly in expert-only territory
    even relative to the rest of the bay.

