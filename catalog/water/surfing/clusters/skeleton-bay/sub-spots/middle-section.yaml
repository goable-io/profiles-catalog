description:
  en: |
    The sustained middle stretch of the Skeleton Bay sandbar, linking
    the outer swell-entry section to the inner point take-off zone with
    continuous barrel sections. Requires sustained speed and tube
    positioning over a long, physically demanding ride with no resting
    channel.

