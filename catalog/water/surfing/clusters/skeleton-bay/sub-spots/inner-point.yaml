description:
  en: |
    The final section of the Skeleton Bay point, near the corner of the
    bay where the wave closes out. Shorter than a full-length ride from
    the outer sandbar but still a fast, hollow sand-bottom barrel, set
    in a remote wilderness with no lifeguards, no cell coverage at the
    break, and hours of desert track to the nearest town.

