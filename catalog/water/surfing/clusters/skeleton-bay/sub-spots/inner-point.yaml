tier_rationale:
  en: |
    The inner point is the final take-off zone of the Skeleton Bay
    system, closest to the bay's corner where the sand spit curves in on
    itself and the wave eventually closes out. It offers a shorter,
    steeper entry than the outer sections for surfers not attempting the
    full-length ride, but remains a heavy, fast sand-bottom barrel in an
    entirely unsupported wilderness setting — no lifeguards, no phone
    signal at the break, and hours of desert track between the wave and
    the nearest town. The remoteness itself is a primary hazard
    multiplier independent of wave size.

