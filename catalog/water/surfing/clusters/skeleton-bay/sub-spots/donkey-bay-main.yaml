description:
  en: |
    The outer sandbar entry point of Skeleton Bay's famous left,
    considered the longest and most perfect sand-bottom barrel in the
    world. South Atlantic groundswell wraps around the sand spit to
    deliver rides up to 2 km on the biggest days. Remote desert access,
    cold Benguela-current water, and no rescue infrastructure make this
    an advanced/expert-only wave.

