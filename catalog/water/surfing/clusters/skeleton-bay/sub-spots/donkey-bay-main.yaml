tier_rationale:
  en: |
    The main sandbar at Donkey Bay is the outer entry point of Skeleton
    Bay's sand-bottom left, where South Atlantic groundswell wraps
    around the sand spit onto a shifting but consistently steep bank to
    produce rides that can run up to 2 km on peak swells. The wave
    breaks with barrel sections from the takeoff, demanding a surfer
    commit deep into the tube repeatedly across a very long ride with no
    resting channel and no lifeguard or rescue infrastructure anywhere
    nearby. Water and air conditions are cold South Atlantic (Benguela
    current) year-round, and the desert setting means any injury
    requires hours of overland evacuation.

