description:
  en: |
    Cloudbreak is a left-hand reef pass off Tavarua Island in Fiji's
    Mamanuca group, widely rated one of the best waves in the world for
    its combination of size, power, and mechanical perfection. South
    Pacific groundswell wraps onto a shallow coral reef pass to produce
    long, hollow, rifling lefts from 1 m fun-size to 6 m+ tow-in
    conditions, hosting the WSL Championship Tour's Fiji stop. The
    adjacent reef of Restaurants offers a shorter, more forgiving right
    and left at the same swells, giving the cluster an intermediate
    reef-break alternative alongside the world-class main event. The
    main South Pacific groundswell season runs March-October.

