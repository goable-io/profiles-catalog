description:
  en: |
    The world-class left-hand reef break off Tavarua Island, ranked
    among the best waves on the planet. South Pacific groundswell wraps
    onto a shallow coral pass to produce long, hollow, mechanically
    perfect barrels 3-6 m on clean days, hosting the WSL Championship
    Tour's Fiji stop. Boat access only, from Tavarua or Namotu resorts.

