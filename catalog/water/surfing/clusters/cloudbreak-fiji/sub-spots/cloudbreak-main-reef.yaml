tier_rationale:
  en: |
    Cloudbreak's main reef pass sits over shallow, sharp coral several
    hundred metres offshore, where South Pacific groundswell wraps and
    focuses into a long, powerful left-hand barrel reaching 3-6 m on
    clean swells and considerably larger on tow-in days. The takeoff
    zone is exposed to open ocean with no channel to rest in during
    sets, and a wipeout at size means being driven across live coral in
    shallow water with a long paddle back against current. It is a WSL
    Championship Tour venue reserved for the world's best surfers on
    contest days, reflecting the wave's combination of size, power, and
    consequence.

