tier_rationale:
  en: |
    Restaurants sits on the reef system adjacent to Cloudbreak, closer
    to Tavarua Island, where the same South Pacific groundswell arrives
    with less exposure and breaks over a reef shelf that produces a
    shorter, cleaner-shaped wave than the main Cloudbreak peak. It
    offers both left and right options and a defined channel for
    paddling out, giving intermediate reef surfers a manageable
    introduction to Fijian reef breaks at swell sizes where Cloudbreak
    itself would be overwhelming. Coral bottom hazards remain present at
    low tide, so it is not a true beginner wave.

