description:
  en: |
    A reef break adjacent to Cloudbreak, closer to Tavarua Island,
    offering shorter and cleaner left and right options at swell sizes
    where the main Cloudbreak peak is too heavy for all but experts. A
    defined paddle-out channel and more moderate power make it the
    intermediate reef-break stop in the cluster.

